<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gari Terminal · 3 Directions</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; font-family: -apple-system, system-ui, sans-serif; }
  #root { height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Frame({ src }) {
  return <iframe src={src} style={{ width: '100%', height: '100%', border: 'none', background: '#fff' }} />;
}

const App = () => (
  <DesignCanvas title="Gari Terminal — 3 Directions">
    <DCSection id="opts" title="Three visual directions for the swing-trade terminal">
      <DCArtboard id="v2" label="A · Plex Terminal (current)" width={1480} height={1100}>
        <Frame src="Terminal-v2.html" />
      </DCArtboard>
      <DCArtboard id="ed" label="B · Editorial — paper, serif, FT-ish" width={1480} height={1700}>
        <Frame src="Terminal-Editorial.html" />
      </DCArtboard>
      <DCArtboard id="br" label="C · Brutalist — high-contrast, oversized" width={1480} height={1300}>
        <Frame src="Terminal-Brutalist.html" />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
