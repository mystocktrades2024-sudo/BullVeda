<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Swing Trading — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-2: #2a2a2a;
    --paper: #f6f3ec;
    --rule: #1a1a1a;
    --muted: #8a857a;
    --accent: #d97a3c;
    --green: #4a8a3a;
    --red: #c0432a;
    --blue: #2c5d8a;
  }
  body { margin: 0; background: #efeae0; font-family: 'Kalam', sans-serif; color: var(--ink); }
  .wf-art { background: var(--paper); color: var(--ink); padding: 18px; box-sizing: border-box; font-family: 'Kalam', sans-serif; font-size: 14px; line-height: 1.3; position: relative; overflow: hidden; }
  .wf-art::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0, transparent 40%), radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0, transparent 40%);
  }
  h1, h2, h3 { font-family: 'Caveat', cursive; margin: 0; font-weight: 700; }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.02em; }
  .sketch { border: 1.5px solid var(--ink); border-radius: 4px; position: relative; }
  .sketch--dashed { border-style: dashed; }
  .sketch--thin { border-width: 1px; }
  .sketch--thick { border-width: 2.5px; }
  .scribble { background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(0,0,0,0.08) 4px 5px); }
  .pill { display: inline-block; padding: 1px 8px; border: 1.5px solid var(--ink); border-radius: 999px; font-size: 11px; font-family: 'Kalam', sans-serif; background: var(--paper); }
  .tag-amber { background: #f5c97a; }
  .tag-green { background: #b5d4a3; }
  .tag-red { background: #e6a596; }
  .tag-blue { background: #a8c2dd; }
  .tag-grey { background: #d4cfc4; }
  .label { font-family: 'Caveat', cursive; font-size: 18px; color: var(--accent); transform: rotate(-1deg); display: inline-block; }
  .annot { font-family: 'Caveat', cursive; color: var(--accent); font-size: 17px; font-weight: 600; }
  .annot-arrow { font-family: 'Caveat', cursive; color: var(--accent); font-size: 16px; position: absolute; }

  /* hand-drawn-ish chart */
  .spark {
    height: 18px; width: 100%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 18' preserveAspectRatio='none'><polyline fill='none' stroke='%231a1a1a' stroke-width='1.2' stroke-linecap='round' points='0,12 5,11 10,13 15,9 20,10 25,7 30,8 35,5 40,6 45,4 50,3 55,5 60,2 65,4 70,2 75,1 80,2'/></svg>");
    background-repeat: no-repeat; background-size: 100% 100%;
  }
  .spark--down {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 18' preserveAspectRatio='none'><polyline fill='none' stroke='%231a1a1a' stroke-width='1.2' stroke-linecap='round' points='0,4 5,5 10,4 15,7 20,6 25,9 30,8 35,11 40,10 45,12 50,13 55,11 60,14 65,13 70,15 75,16 80,15'/></svg>");
  }

  .candle-mini { display: inline-flex; gap: 1px; align-items: end; height: 22px; }
  .candle-mini i { display: block; width: 3px; background: var(--ink); }

  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 10px; }

  table.wf { width: 100%; border-collapse: collapse; font-family: 'Kalam', sans-serif; font-size: 12.5px; }
  table.wf th, table.wf td { border-bottom: 1px solid #c8c2b6; padding: 5px 8px; text-align: left; }
  table.wf th { font-family: 'Caveat', cursive; font-weight: 700; font-size: 14px; color: var(--ink); border-bottom: 1.5px solid var(--ink); }

  .placeholder { color: var(--muted); font-style: italic; }

  /* gauges, hand drawn */
  .gauge {
    width: 64px; height: 64px; border-radius: 50%;
    background: conic-gradient(from 220deg, var(--accent) 0deg var(--g, 200deg), #e8e1d2 var(--g, 200deg) 280deg, transparent 280deg);
    -webkit-mask: radial-gradient(circle, transparent 24px, #000 25px);
            mask: radial-gradient(circle, transparent 24px, #000 25px);
    position: relative;
  }
  .gauge-wrap { position: relative; width: 64px; height: 64px; display: inline-block; }
  .gauge-num { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700; }

  .ruler { display: flex; height: 20px; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; position: relative; background: #f0e9d8; }
  .ruler i { display: block; height: 100%; }
  .ruler-stop { background: repeating-linear-gradient(45deg, #e6a596 0 4px, #d99a8a 4px 8px); }
  .ruler-entry { background: #b5d4a3; }
  .ruler-target { background: #e8e1d2; }
  .ruler-dot { position: absolute; top: -4px; width: 2px; height: 28px; background: var(--ink); }
  .ruler-dot::after { content: '●'; position: absolute; top: -8px; left: -5px; font-size: 14px; }

  /* heatmap blobs */
  .heat { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; height: 130px; }
  .heat > div { border: 1.5px solid var(--ink); border-radius: 3px; padding: 6px; font-size: 11px; font-family: 'Kalam', sans-serif; }

  .header-strip { display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px dashed var(--ink); padding-bottom: 8px; margin-bottom: 12px; }

  .title-strip { font-family: 'Caveat', cursive; font-size: 28px; font-weight: 700; }

  .arrow {
    position: absolute; font-family: 'Caveat', cursive; color: var(--accent); font-size: 16px; font-weight: 600;
    pointer-events: none;
  }
  .arrow svg { display: block; }

  .pill-row { display: flex; gap: 5px; flex-wrap: wrap; }

  .corner-fold { position: absolute; top: 0; right: 0; width: 18px; height: 18px;
    background: linear-gradient(225deg, transparent 50%, rgba(0,0,0,0.15) 50%);
    border-bottom-left-radius: 3px;
  }

  /* tab control row */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; align-items: end; border-bottom: 1.5px solid var(--ink); padding-bottom: 4px; }
  .tabs span { padding: 3px 10px; border: 1.5px solid var(--ink); border-bottom: none; border-radius: 4px 4px 0 0; font-family: 'Caveat', cursive; font-size: 16px; background: var(--paper); position: relative; bottom: -1.5px; }
  .tabs span.on { background: var(--ink); color: var(--paper); }

  /* note panels */
  .note { font-family: 'Caveat', cursive; font-size: 16px; color: var(--accent); padding: 4px 8px; border: 1.5px dashed var(--accent); border-radius: 4px; background: rgba(217,122,60,0.06); display: inline-block; transform: rotate(-0.5deg); }

  /* DC overrides for sketchy feel */
  .dc-section-title { font-family: 'Caveat', cursive !important; font-weight: 700 !important; }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframes-content.jsx"></script>

</body>
</html>
