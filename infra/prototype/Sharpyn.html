}
.hs { display: flex; flex-direction: column; gap: 1px; align-items: flex-end; padding: 4px 6px; }
.hs-label { font-size: 9px; }
.hs-value { font-size: 14px; font-weight: 500; }
.hs-delta { font-size: 11px; letter-spacing: 0.04em; }

/* Home grids */
.home-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}
.home-grid-2 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.home-side { display: flex; flex-direction: column; gap: 16px; }
.home-map-wrap {
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-3);
  overflow: hidden;
  backdrop-filter: var(--glass-blur);
}
.home-map-wrap .mm-wrap {
  border: none !important;
  border-radius: 0 !important;
  background: transparent !important;
}

/* Home card */
.hc {
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-3);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
  backdrop-filter: var(--glass-blur);
  min-width: 0;
}
.hc-hdr { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.hc-title {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
}
.hc-sub { font-size: 10.5px; margin-top: 2px; }
.hc-cta {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.10em;
  color: var(--copper);
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
}
.hc-cta:hover { text-decoration: underline; }
.hc-body { display: flex; flex-direction: column; gap: 6px; }

/* HomeTopList */
.htl { display: flex; flex-direction: column; gap: 3px; }
.htl-row {
  display: grid;
  grid-template-columns: 22px 50px 1fr 56px 28px;
  gap: 10px;
  align-items: baseline;
  padding: 7px 10px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--r-2);
  text-align: left;
  cursor: pointer;
  color: inherit;
  transition: all 0.10s;
}
.htl-row:hover {
  background: var(--glass-bg-2);
  border-color: var(--glass-line);
}
.htl-rank { font-family: var(--mono); font-size: 9.5px; }
.htl-sym { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.htl-name { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.htl-chg { font-family: var(--mono); font-size: 11px; text-align: right; }
.htl-score { font-family: var(--mono); font-size: 11px; text-align: right; }

.macro-foot {

/* Movers grid */
.hm-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.hm-cell {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 11px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  cursor: pointer;
  color: inherit;
  text-align: left;
  transition: all 0.12s;

.hm-cell:hover {
  background: var(--glass-bg-2);
  border-color: var(--glass-line-2);
}
.hm-sym { font-size: 12px; }
.hm-chg { font-size: 14px; font-weight: 500; }
.hm-sector { font-size: 9.5px; letter-spacing: 0.06em; }

/* Calendar list */
.cal-list { display: flex; flex-direction: column; gap: 4px; }
.cl-row {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 7px 10px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-left: 3px solid var(--ink-3);

}
.cl-copper { border-left-color: var(--copper); }
.cl-gn     { border-left-color: var(--gn); }
.cl-amb    { border-left-color: var(--amb); }
.cl-rd     { border-left-color: var(--rd); }
.cl-when { font-size: 10.5px; color: var(--ink-2); }
.cl-evt  { font-size: 11px; }

/* Book block */
.hb { display: flex; flex-direction: column; gap: 10px; }
.hb-top {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

   ============================================================ */
/* Tweaks slide-over (no React host — self-contained) */
.tk-fab {
  position: fixed; right: 18px; bottom: 18px; z-index: 60;
  width: 40px; height: 40px; border-radius: var(--r-pill);
  display: flex; align-items: center; justify-content: center;
  background: var(--glass-bg-2); border: 1px solid var(--glass-line);
  color: var(--ink-1); cursor: pointer; backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow-2);
}
.tk-fab:hover { color: var(--copper); border-color: color-mix(in oklab, var(--copper) 40%, transparent); }
.tk-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,0.4); display: none; }
.tk-overlay.is-open { display: block; }
.tk-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 80;
  width: 320px; max-width: 90vw; transform: translateX(102%);
  transition: transform 0.22s cubic-bezier(0.2,0,0,1);
  background: var(--glass-bg-1); backdrop-filter: var(--glass-blur);
  border-left: 1px solid var(--glass-line); box-shadow: var(--shadow-2);
  display: flex; flex-direction: column; overflow-y: auto;
}

  display: flex; align-items: center; justify-content: space-between;

}

.tk-close { background: transparent; border: none; color: var(--ink-2); cursor: pointer; font-size: 16px; }

.tk-body { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 6px; }

.tk-radio-btn {

  border: 1px solid var(--glass-line); border-radius: var(--r-pill); color: var(--ink-2); cursor: pointer;

.tk-switch.is-on { background: color-mix(in oklab, var(--copper) 30%, transparent); }

  display: flex; align-items: center; gap: 10px; padding: 9px 12px;

async function boot() {
  let critical = null, tickersRaw = null, live = true;
  try {
    let r = await fetch("/v2/data.critical.json", { cache:"no-store", credentials:"same-origin" });
    if (!r.ok) r = await fetch("/v2/data.json", { cache:"no-store", credentials:"same-origin" });
    if (r.ok) critical = await r.json();
  } catch (e) { live = false; }
  try {
    let r = await fetch("/v2/tickers_lite.json", { cache:"no-store", credentials:"same-origin" });
    if (!r.ok) r = await fetch("/v2/tickers.json", { cache:"no-store", credentials:"same-origin" });
    if (r.ok) tickersRaw = await r.json();
  } catch (e) { live = false; }

  if (critical && tickersRaw) {
    DATA.state = "live";
    DATA.critical = critical;
    const list = Array.isArray(tickersRaw) ? tickersRaw : Object.values(tickersRaw);
    DATA.tickers = list.map(normTicker).filter(t => t.sym && t.sym !== "—");
  } else {
    DATA.state = "scaffold";
    DATA.critical = MOCK_CRITICAL;
    DATA.tickers = MOCK_TICKERS.map(normTicker);
  }
  DATA.bySymbol = {};
  for (const t of DATA.tickers) DATA.bySymbol[t.sym] = t;
  document.documentElement.setAttribute("data-theme", T.theme);
  render();
}

function pill(tone, text, opts={}) {

}
function freshnessPill(state, age) {
  if (state === "stale")   return pill("rd","STALE "+(age||""),{small:true});
  if (state === "loading") return pill("ink","· · ·",{small:true});
  if (state === "scaffold")return pill("amb","SCAFFOLD",{small:true});
  if (state === "empty")   return pill("ink","NO DATA",{small:true});
  return pill("gn","LIVE"+(age?" · "+age:""),{small:true,dot:true});
}
function wilsonPill(n, wr, lb) {
  const low = (n||0) < 30;
  return `<span class="wilson ${low?"wilson--low":""}">
    <span class="wilson-block"><span class="wilson-k">n</span><span class="wilson-v mono">${n!=null?n:"—"}</span></span>
    <span class="wilson-block"><span class="wilson-k">wr</span><span class="wilson-v mono">${wr!=null?(wr*100).toFixed(0)+"%":"—"}</span></span>

    ${low?'<span class="wilson-warn">n&lt;30 · ACT WITH CAUTION</span>':""}

}

// ---- SVG viz ----
function sparkline(data, color="currentColor", h=22, w=84, fill=true) {
  if (!data || data.length < 2) return "";
  const min = Math.min(...data), max = Math.max(...data), range = (max-min)||1, step = w/(data.length-1);
  const pts = data.map((v,i)=>[i*step, h-((v-min)/range)*h]);
  const d = "M " + pts.map(p=>p.join(" ")).join(" L ");
  const area = d + ` L ${w} ${h} L 0 ${h} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">${fill?`<path d="${area}" fill="${color}" opacity="0.12"/>`:""}<path d="${d}" stroke="${color}" fill="none" stroke-width="1.25"/></svg>`;
}
function gauge(value, max=100, label="", size=150) {
  const cx=size/2, cy=size*0.72, r=size*0.42, sa=Math.PI, ea=2*Math.PI;
  const p=clamp(value/max,0,1), ang=sa+(ea-sa)*p;
  const x1=cx+r*Math.cos(sa), y1=cy+r*Math.sin(sa), x2=cx+r*Math.cos(ang), y2=cy+r*Math.sin(ang), xE=cx+r*Math.cos(ea), yE=cy+r*Math.sin(ea);
  const large=p>0.5?1:0, tone=value>=70?"var(--gn)":value>=50?"var(--amb)":"var(--rd)";
  return `<svg width="${size}" height="${size*0.86}" viewBox="0 0 ${size} ${size*0.86}">
    <path d="M ${x1} ${y1} A ${r} ${r} 0 1 1 ${xE} ${yE}" stroke="var(--line)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" stroke="${tone}" stroke-width="10" fill="none" stroke-linecap="round"/>
    <text x="${cx}" y="${cy-6}" text-anchor="middle" class="mono" font-size="${size*0.28}" font-weight="500" fill="var(--ink)">${value!=null?value:"—"}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" class="mono" font-size="9" letter-spacing="0.14em" fill="var(--ink-3)">${esc(label)}</text>
  </svg>`;
}
function radar(pillars, size=200) {
  const keys=["technical","fundamental","catalyst","risk","edge"], labels=["TECH","FUND","CAT","RISK","EDGE"];
  const cx=size/2, cy=size/2, r=size*0.36;
  const pAt=(i,f)=>{ const a=-Math.PI/2+(i*2*Math.PI)/keys.length; return [cx+r*f*Math.cos(a), cy+r*f*Math.sin(a)]; };
  const poly = keys.map((k,i)=>pAt(i,(pillars[k]||0)/100).join(",")).join(" ");
  const rings = [0.25,0.5,0.75,1].map(f=>`<polygon points="${keys.map((_,i)=>pAt(i,f).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="${f===1?1:0.5}"/>`).join("");
  const axes = keys.map((_,i)=>{ const p=pAt(i,1); return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)" stroke-width="0.5"/>`; }).join("");
  const dots = keys.map((k,i)=>{ const p=pAt(i,(pillars[k]||0)/100); return `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--copper)"/>`; }).join("");
  const labs = keys.map((_,i)=>{ const p=pAt(i,1.18); return `<text x="${p[0]}" y="${p[1]+3}" text-anchor="middle" class="mono" font-size="9" letter-spacing="0.14em" fill="var(--ink-3)">${labels[i]}</text>`; }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}${axes}<polygon points="${poly}" fill="var(--copper-bg)" stroke="var(--copper)" stroke-width="1.5"/>${dots}${labs}</svg>`;
}
function cone(lo,mid,hi,w=280,h=110) {
  const pad=14, innerW=w-pad*2, innerH=h-pad*2, yMid=pad+innerH/2;
  const span=Math.max(Math.abs(lo),Math.abs(hi))*1.25||1, yFor=v=>yMid-(v/span)*(innerH/2);
  const path=v=>`M ${pad} ${yMid} Q ${pad+innerW*0.4} ${yFor(v)}, ${w-pad} ${yFor(v)}`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
    <line x1="${pad}" y1="${yMid}" x2="${w-pad}" y2="${yMid}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <path d="${path(hi)}" stroke="var(--gn)" stroke-opacity="0.4" stroke-width="1.25" fill="none"/>
    <path d="${path(mid)}" stroke="var(--gn)" stroke-width="1.5" fill="none"/>
    <path d="${path(lo)}" stroke="var(--rd)" stroke-opacity="0.6" stroke-width="1.25" fill="none"/>

// derive 5-pillar proxies from real signals (labelled "derived" wherever shown)
function derivePillars(t) {
  return {
    technical: clamp(Math.round((t.rs!=null?t.rs*0.5:40) + (t.rvol!=null?(t.rvol-1)*12:0) + (t.rsi!=null?(t.rsi-50)*0.3:0)+20), 15, 98),
    fundamental: clamp(Math.round(t.analystUpside!=null?50+t.analystUpside*0.6:55), 15, 95),
    catalyst: clamp(Math.round({1:82,2:62,3:46}[t.catTier]||50), 15, 95),
    risk: clamp(Math.round(72-(t.beta!=null?(t.beta-1)*22:0)), 15, 95),
    edge: clamp(Math.round(t.score!=null?t.score:55), 15, 99),
  };
}

// ============================================================
//  MARKET MAP (treemap)
// ============================================================
function layoutTreemap(items, w, h) {
  const rects=[]; let remaining=[...items].sort((a,b)=>b.value-a.value); let y=0, remH=h, remW=w;
  while (remaining.length) {
    const rowH=Math.max(40, Math.min(remH, remH*0.42));
    const rowItems=[]; let rowVal=0; const remTotal=remaining.reduce((s,i)=>s+i.value,0);
    const rowTargetArea=(rowH/remH)*remTotal;
    while (remaining.length && rowVal<rowTargetArea) { const nx=remaining.shift(); rowItems.push(nx); rowVal+=nx.value; }
    let x=0;
    for (const it of rowItems) { const wPx=(it.value/rowVal)*remW; rects.push({...it,x,y,w:wPx,h:rowH}); x+=wPx; }
    y+=rowH; remH-=rowH; if (remH<24) break;
  }
  return rects;
}
function pctColor(p) {
  if (p>=3)  return {bg:"rgba(74,222,128,0.42)",fg:"#dffce6"};
  if (p>=1)  return {bg:"rgba(74,222,128,0.26)",fg:"#cfeed8"};
  if (p>=0)  return {bg:"rgba(74,222,128,0.12)",fg:"#b8d8c1"};
  if (p>=-1) return {bg:"rgba(248,113,113,0.14)",fg:"#e8c4c4"};
  if (p>=-3) return {bg:"rgba(248,113,113,0.28)",fg:"#f1c8c8"};
  return {bg:"rgba(248,113,113,0.46)",fg:"#fde4e4"};
}
function marketMap(w=1100, h=460) {
  // top names by mcap, grouped by sector
  const universe = DATA.tickers.filter(t=>t.mcap).sort((a,b)=>b.mcap-a.mcap).slice(0,70);
  const g = {};
  for (const t of universe) { const s=t.sector||"—"; (g[s]=g[s]||{sector:s,items:[],total:0}); g[s].items.push({key:t.sym,value:t.mcap,sym:t.sym,chg:t.chg}); g[s].total+=t.mcap; }
  const order = [...SECTORS_ORDER.filter(s=>g[s]), ...Object.keys(g).filter(s=>!SECTORS_ORDER.includes(s))];
  const bySector = order.map(s=>g[s]).filter(Boolean);
  const sectorRects = layoutTreemap(bySector.map(x=>({key:x.sector,value:x.total,...x})), w, h);
  const cells = sectorRects.map(sec=>{
    const inner = layoutTreemap(sec.items, sec.w-2, sec.h-18);
    const inHtml = inner.map(it=>{
      const c=pctColor(it.chg); const showLabel=it.w>36&&it.h>30; const showPct=it.w>28&&it.h>22;
      return `<g transform="translate(${it.x},${it.y})" class="mm-cell" data-act="ticker" data-sym="${esc(it.sym)}">
        <rect x="0.5" y="0.5" width="${Math.max(1,it.w-1)}" height="${Math.max(1,it.h-1)}" fill="${c.bg}" stroke="var(--line)" stroke-width="0.5"/>
        ${showLabel?`<text x="${it.w/2}" y="${it.h/2-2}" text-anchor="middle" class="mono" font-size="${Math.min(13,Math.max(10,it.w/8))}" font-weight="500" fill="${c.fg}">${esc(it.sym)}</text>`:""}
        ${showPct?`<text x="${it.w/2}" y="${it.h/2+11}" text-anchor="middle" class="mono" font-size="${Math.min(10,Math.max(8,it.w/11))}" fill="${c.fg}" opacity="0.85">${it.chg>=0?"+":""}${it.chg.toFixed(1)}%</text>`:""}
      </g>`;
    }).join("");
    return `<g transform="translate(${sec.x},${sec.y})">
      <rect x="0" y="0" width="${sec.w}" height="18" fill="var(--bg-2)"/>
      <line x1="0" y1="18" x2="${sec.w}" y2="18" stroke="var(--line)"/>
      <text x="6" y="13" class="mono" font-size="10" letter-spacing="0.16em" fill="var(--ink-2)">${esc((sec.sector||"").toUpperCase())}</text>
      <text x="${sec.w-6}" y="13" text-anchor="end" class="mono" font-size="10" fill="var(--ink-3)">$${(sec.total/1e9).toFixed(0)}B</text>
      <g transform="translate(1,18)">${inHtml}</g>
    </g>`;
  }).join("");
  return `<div class="mm-wrap">
    <div class="mm-toolbar">
      <div class="mm-title"><span class="mono label-cap">Market Map</span><span class="mono dim2">· Sized by market cap · Colored by 1D %</span></div>
      <div class="mm-toolbar-right">
        <div class="seg"><button class="seg-btn is-on">1D</button><button class="seg-btn">5D</button><button class="seg-btn">1M</button></div>
        ${freshnessPill(DATA.state==="live"?"live":"scaffold")}
      </div>
    </div>
    <div class="mm-body" style="width:100%"><svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="display:block">${cells}</svg></div>
    <div class="mm-legend">

      <div class="mm-leg-grp"><span class="label-cap">Tickers</span><span class="mono">${universe.length}</span></div>
      <div class="mm-leg-grp"><span class="label-cap">Tip</span><span class="mono dim2">Click any tile for the 14-lens detail</span></div>

function homeBook() {

// ---- Plan lens ----
function modeAdjust(t) {
  const c = {...t};
  if (T.mode==="POSITION") { if(c.stop)c.stop*=0.96; if(c.t1)c.t1*=1.10; if(c.t2)c.t2*=1.18; c.holdMin=20; c.holdMax=45; }
  else if (T.mode==="INVESTMENT") { if(c.stop)c.stop*=0.84; if(c.t1)c.t1*=1.32; if(c.t2)c.t2*=1.58; c.holdMin=90; c.holdMax=180; }
  return c;
}
function lensPlan(t0, sc) {

function orderTicket(t, entry, risk) {

      ${field("$ Risk / sh",`<span class="mono dn">${risk!=null?"$"+risk.toFixed(2):"—"}</span>`)}
      ${field("T1 (½ off)",`<span class="mono up">${t.t1!=null?"$"+t.t1.toFixed(2):"—"} → trail rest</span>`)}

      ${field("Trail","<span class=\"mono\">ATR(14)×2.2 · after T1</span>")}
      ${field("Time stop",`<span class="mono">${t.holdMax!=null?t.holdMax+"d":"—"} · close if &lt; +0.5R</span>`)}
    </div>
    <div class="ticket-rail">
      <div class="ticket-rail-row"><span class="label-cap">P&amp;L profile</span><span class="mono dim2">linear · no options</span></div>
      ${payoffMini(t, entry)}
      <div class="ticket-actions"><button class="btn btn--primary">PLACE BRACKET</button><button class="btn">SAVE PLAN</button><button class="btn">DRY-RUN</button></div>
      <div class="ticket-gates">
        ${gateRow("R:R ≥ 3.0", t.rr!=null&&t.rr>=3, t.rr!=null&&t.rr<3, t.rr!=null?t.rr.toFixed(2):"—")}
        ${gateRow("Wilson LB ≥ 45%", t.wilsonLB!=null&&t.wilsonLB>=0.45, t.wilsonLB!=null&&t.wilsonLB<0.45, t.wilsonLB!=null?(t.wilsonLB*100).toFixed(0)+"%":"—")}
        ${gateRow("Sample n ≥ 30", t.n!=null&&t.n>=30, t.n!=null&&t.n<30, t.n!=null?String(t.n):"—")}
        ${gateRow("ER not in T1 window", !(t.earnDays!=null&&t.earnDays<=7), false, t.earnDays!=null?"ER "+t.earnDays+"d":"—", t.earnDays!=null&&t.earnDays<=7)}
      </div>
    </div>
  </div>`;
}
function gateRow(label, pass, fail, note, warn) {
  const tone = fail?"rd":warn?"amb":pass?"gn":"ink";
  const mark = fail?"✕":warn?"!":pass?"✓":"·";
  return `<div class="gate gate--${tone}"><span class="gate-mark mono">${mark}</span><span class="gate-label mono">${esc(label)}</span>${note?`<span class="gate-note mono dim2">${esc(note)}</span>`:""}</div>`;
}
function payoffMini(t, entry) {
  const stop=t.stop!=null?t.stop:entry*0.94, t1=t.t1!=null?t.t1:entry*1.08, t2=t.t2!=null?t.t2:entry*1.16;
  const w=220,h=60, range=(t2-stop)||1, x=p=>((p-stop)/range)*w;
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="payoff-mini">
    <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--line)"/>
    <line x1="${x(stop)}" y1="0" x2="${x(stop)}" y2="${h}" stroke="var(--rd-dim)" stroke-dasharray="2 2"/>
    <line x1="${x(entry)}" y1="0" x2="${x(entry)}" y2="${h}" stroke="var(--copper)"/>
    <line x1="${x(t1)}" y1="0" x2="${x(t1)}" y2="${h}" stroke="var(--gn-dim)" stroke-dasharray="2 2"/>
    <line x1="${x(stop)}" y1="${h-4}" x2="${x(entry)}" y2="${h/2}" stroke="var(--rd)" stroke-width="1.5"/>
    <line x1="${x(entry)}" y1="${h/2}" x2="${x(t2)}" y2="6" stroke="var(--gn)" stroke-width="1.5"/>
    <text x="${x(stop)}" y="${h-6}" font-size="9" class="mono" fill="var(--rd)">$${stop.toFixed(0)}</text>
    <text x="${x(entry)}" y="12" font-size="9" class="mono" fill="var(--copper)" text-anchor="middle">$${entry.toFixed(0)}</text>
    <text x="${x(t2)-4}" y="12" font-size="9" class="mono" fill="var(--gn)" text-anchor="end">$${t2.toFixed(0)}</text>
  </svg>`;
}
function sizingWaterfall() {
  const steps=[["Raw Kelly",0.84,"(p·b − q)/b"],["× ½ Kelly",0.42,"discipline cap"],["× Regime",0.36,"choppy · 0.86"],["× VIX scalar",0.30,"VIX 17.4 · 0.84"],["× DD throttle",0.28,"DD −2.1% · 0.94"],["× β-net cap",0.25,"book β 0.93"],["× VaR floor",0.23,"VaR −2.1%"],["Final size %",0.068,"of NAV",true]];
  const max=Math.max(...steps.map(s=>s[1]));
  return `<div class="waterfall">${steps.map(([label,v,note,fin])=>`<div class="wf-row ${fin?"wf-final":""}"><span class="wf-label mono">${esc(label)}</span><div class="wf-bar"><div class="wf-fill" style="width:${(v/max*100).toFixed(0)}%"></div></div><span class="wf-v mono">${(v*100).toFixed(fin?2:1)}%</span><span class="wf-note mono dim2">${esc(note)}</span></div>`).join("")}<div class="wf-tail mono dim2">⤷ illustrative — wire to risk engine (kelly_position_size + portfolio_state) at cutover.</div></div>`;
}
function priceLadder(t, entry) {
  const levels=[
    {label:"T2 target",px:t.t2,tone:"gn",note:"take full"},
    {label:"T1 target",px:t.t1,tone:"gn",note:"half off, trail rest"},
    {label:"Current",px:t.price,tone:"copper",note:"last"},
    {label:"Entry stop",px:t.entryHigh||entry,tone:"copper",note:"trigger"},
    {label:"Entry low",px:t.entryLow,tone:"ink",note:"zone floor"},
    {label:"Hard stop",px:t.stop,tone:"rd",note:"invalidate"},
  ].filter(l=>l.px!=null);
  return `<div class="ladder">${levels.map(l=>`<div class="ladder-row ladder-${l.tone}"><span class="ladder-label mono dim2">${esc(l.label)}</span><div class="ladder-bar"><div class="ladder-tick"></div></div><span class="ladder-px mono kpi-tone--${l.tone}">$${l.px.toFixed(2)}</span><span class="ladder-note mono dim">${esc(l.note)}</span></div>`).join("")}</div>`;
}
function invalidationLadder(t) {
  const rows=[
    {trig:"Loses VWAP intraday + closes red",action:"Cut 50%",tone:"amb"},
    {trig:"Close < entry on +1.5σ volume",action:"Cut to 25%",tone:"amb"},
    {trig:`Close < hard stop $${t.stop!=null?t.stop.toFixed(2):"—"}`,action:"Exit balance",tone:"rd"},
    {trig:"Sector ETF < 50-DMA on volume",action:"Reduce 50% · pause new",tone:"amb"},
    {trig:"Time stop: < +0.5R after hold window",action:"Flatten · re-evaluate",tone:"ink"},
  ];
  return `<div class="inv-ladder">${rows.map((r,i)=>`<div class="inv-row inv-${r.tone}"><span class="inv-num mono">${String(i+1).padStart(2,"0")}</span><span class="inv-trig mono">${esc(r.trig)}</span>${pill(r.tone,r.action,{small:true})}</div>`).join("")}</div>`;
}
function reactionPlaybook() {
  const rows=[
    {if_:"Gap +3% at open on news",then:"Skip — wait 30m, re-validate pivot.",tone:"amb"},
    {if_:"Gap −2% on no news",then:"Hold — first 15m candle is the read.",tone:"ink"},
    {if_:"VWAP reclaim by 11:00",then:"Add ¼ on consolidation > VWAP.",tone:"gn"},
    {if_:"Close strong + > +1R",then:"Trail stop to breakeven.",tone:"gn"},
    {if_:"Pre-mortem #1 fires",then:"OCO armed — no manual override.",tone:"rd"},
  ];
  return `<div class="play">${rows.map(r=>`<div class="play-row play-${r.tone}"><span class="play-tag mono">IF</span><span class="play-if">${esc(r.if_)}</span><span class="play-arrow mono">→</span><span class="play-tag mono">THEN</span><span class="play-then">${esc(r.then)}</span></div>`).join("")}</div>`;
}
function postFillChecklist(t) {
  const items=[
    {label:"OCO bracket sent (stop + T1 + T2)",done:true},
    {label:"Position added to portfolio_state",done:true},
    {label:"Correlation-to-book ≤ 0.55 after fill",done:true,note:"0.34"},
    {label:`Sleep-test: max-down today within risk`,done:true},
    {label:t.earnDays!=null?`Alert: ER reminder (ER in ${t.earnDays}d)`:"Alert: ER reminder",done:t.earnDays!=null},
    {label:"Journal entry written (1-paragraph thesis)",done:false},
  ];
  return `<div class="checklist">${items.map(it=>`<div class="check-row ${it.done?"is-done":""}"><span class="check-box">${it.done?"✓":""}</span><span class="check-label">${esc(it.label)}</span>${it.note?`<span class="check-note mono dim2">${esc(it.note)}</span>`:""}</div>`).join("")}</div>`;
}

// ============================================================
//  TWEAKS PANEL
// ============================================================
function tweaksPanel() {
  const radio=(label,val,opts,act)=>`<div class="tk-row"><span class="label-cap">${esc(label)}</span></div><div class="tk-radio">${opts.map(o=>`<button class="tk-radio-btn ${val===o?"is-on":""}" data-act="${act}" data-val="${o}">${o}</button>`).join("")}</div>`;
  return `<div class="tk-panel-hdr"><span class="label-cap">Tweaks</span><button class="tk-close" data-act="tweaks-close">✕</button></div>
  <div class="tk-body">
    <div class="tk-sec">Theme palette</div>
    <div class="tk-themes">${THEMES.map(th=>`<button class="tk-theme ${T.theme===th.id?"is-on":""}" data-act="theme" data-val="${th.id}"><span class="tk-theme-sw">${th.chips.map(c=>`<span class="tk-theme-chip" style="background:${c}"></span>`).join("")}</span><span class="tk-theme-name">${esc(th.name)}</span></button>`).join("")}</div>
    <div class="tk-sec">Layout</div>
    ${radio("Scan column", T.scanWidth, ["S","M","L","XL"], "scanwidth")}
    <div class="tk-row"><span class="label-cap">Focus mode</span><button class="tk-switch ${T.focus?"is-on":""}" data-act="focus"></button></div>
    <div class="tk-sec">Trade horizon</div>
    ${radio("Mode", T.mode, ["SWING","POSITION","INVESTMENT"], "mode")}
    <div class="tk-sec">Verdict hero</div>
    ${radio("Treatment", T.heroStyle, ["radar","gauge","cone"], "herostyle")}
    <div class="tk-sec">Section grammar</div>
    ${radio("Header", T.headerStyle, ["copper","minimal","sticky-rail"], "headerstyle")}
    ${radio("KPI tile", T.kpiStyle, ["bare","sparkline","delta"], "kpistyle")}
  </div>`;
}

// ============================================================
//  RENDER + EVENTS
// ============================================================
function render() {
  const root = document.getElementById("root");
  if (DATA.state === "loading") { root.innerHTML = `<div class="dp-loading mono">Booting Sharpyn…</div>`; return; }
  root.innerHTML = `<div class="app ${T.focus?"app--focus":""}">
    ${iconRail()}
    ${scanColumn()}
    <main class="main">
      ${commandBar()}
      ${S.ticker ? detailPanel() : homeView()}
    </main>
  </div>`;
  document.getElementById("tkPanel").innerHTML = tweaksPanel();
}

function openTicker(sym) {
  const t = DATA.bySymbol[sym];
  if (!t) return;
  S.ticker = t;
  render();
  const body = document.querySelector(".dpanel-body"); if (body) body.scrollTop = 0;
}
function goHome() { S.ticker = null; render(); }
function setTweak(k,v) { T[k]=v; saveTweaks(); if(k==="theme") document.documentElement.setAttribute("data-theme",v); render(); }

document.addEventListener("click", (e) => {
  const fab = e.target.closest("#tkFab"); if (fab) { openTweaks(); return; }
  const ov = e.target.closest("#tkOverlay"); if (ov) { closeTweaks(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case "surface": {
      const id = el.dataset.id; S.surface = id;
      if (["market-map","buy","watchlist","elite"].includes(id)) { /* scan surface — stay/return home */ if (id==="market-map") S.ticker=null; }
      else { S.ticker=null; } // non-scan admin/tools surfaces → home (stub) for now
      render(); break;
    }
    case "ticker": openTicker(el.dataset.sym); break;
    case "lens": S.lensId = el.dataset.id; render(); { const b=document.querySelector(".dpanel-body"); if(b)b.scrollTop=0; } break;
    case "home": goHome(); break;
    case "mode": setTweak("mode", el.dataset.val); break;
    case "scanwidth": setTweak("scanWidth", el.dataset.val); break;
    case "focus": setTweak("focus", !T.focus); break;
    case "theme": setTweak("theme", el.dataset.val); break;
    case "herostyle": setTweak("heroStyle", el.dataset.val); break;
    case "headerstyle": setTweak("headerStyle", el.dataset.val); break;
    case "kpistyle": setTweak("kpiStyle", el.dataset.val); break;
    case "focus-search": { const i=document.getElementById("cmdSearch"); if(i)i.focus(); break; }
    case "tweaks-close": closeTweaks(); break;
    case "state-toggle": { sectionState[el.dataset.name]=el.dataset.val; render(); break; }
  }
});

function openTweaks() { document.getElementById("tkPanel").classList.add("is-open"); document.getElementById("tkOverlay").classList.add("is-open"); }
function closeTweaks() { document.getElementById("tkPanel").classList.remove("is-open"); document.getElementById("tkOverlay").classList.remove("is-open"); }

// command-bar search → open ticker on Enter
document.addEventListener("keydown", (e) => {
  if (e.target && e.target.id === "cmdSearch") {
    if (e.key === "Enter") { const v=(e.target.value||"").trim().toUpperCase(); if (DATA.bySymbol[v]) openTicker(v); }
    return;
  }
  if (["INPUT","TEXTAREA"].includes((e.target.tagName||""))) return;
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  const map = {"1":"overview","2":"plan","3":"chart","t":"technicals","4":"patterns","5":"smc","v":"investment","r":"risk","e":"earnings","o":"options","p":"portfolio","i":"tape","7":"track","m":"mledge"};
  const k = e.key.toLowerCase();
  if (map[k] && S.ticker) { e.preventDefault(); S.lensId = map[k]; render(); const b=document.querySelector(".dpanel-body"); if(b)b.scrollTop=0; }
  else if (k==="f") { setTweak("focus", !T.focus); }
  else if (e.key==="Escape") { if (document.getElementById("tkPanel").classList.contains("is-open")) closeTweaks(); else goHome(); }
});

let _rzT; window.addEventListener("resize", () => { clearTimeout(_rzT); _rzT=setTimeout(()=>{ if(S.ticker) render(); }, 150); });

boot();
</script>
