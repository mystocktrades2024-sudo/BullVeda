/* ============================================================
   Aurora Glass design system — inlined verbatim from
   design_handoff_swingtrade_v2 (tokens · components · shell ·
   lenses · lens-extras · aurora · visual-rich), then Sharpyn
   vanilla-port additions below.
   ============================================================ */
/* ===== tokens.css ===== */
/* SwingTrade V2 — design tokens */
:root,
[data-theme="obsidian-gold"],
[data-theme="dark"] {
  /* surfaces */
  --bg:    #0a0d0c;
  --bg-0:  #0a0d0c;
  --bg-1:  #11151a;
  --bg-2:  #161a1e;
  --bg-3:  #1c2125;
  --bg-4:  #20262b;

  /* lines */
  --line:    #262b2d;
  --line-2:  #353a3c;

  /* ink */
  --ink:   #ecefe9;
  --ink-1: #b8bcb6;
  --ink-2: #8b8f8b;
  --ink-3: #686c68;
  --ink-4: #4a4e4a;

  /* brand */
  --copper:     #d97757;
  --copper-dim: #a55a40;
  --copper-bg:  rgba(217,119,87,0.10);

  /* sentiment */
  --gn:     #4ade80;
  --gn-dim: #2f7a4a;
  --gn-bg:  rgba(74,222,128,0.10);
  --rd:     #f87171;
  --rd-dim: #8a3f3f;
  --rd-bg:  rgba(248,113,113,0.10);
  --amb:    #fbbf24;
  --amb-dim:#8a6a18;
  --amb-bg: rgba(251,191,36,0.10);

  /* categorical lens accents */
  --cy:      #60d5d5;
  --cy-bg:   rgba(96,213,213,0.10);
  --violet:  #a78bfa;
  --violet-bg: rgba(167,139,250,0.10);
  --blue:    #5b9bf2;
  --blue-bg: rgba(91,155,242,0.10);

  /* shadow + glass */
  --shadow-1: 0 1px 0 rgba(255,255,255,0.02) inset, 0 0 0 1px var(--line);
  --shadow-2: 0 12px 32px -8px rgba(0,0,0,0.6);

  /* type */
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

  /* radii */
  --r-1: 3px;
  --r-2: 5px;
  --r-3: 8px;
  --r-4: 12px;

  color-scheme: dark;
}

/* ============================================================ */
/* Themes — curated palettes (8 total: 6 dark, 2 light)         */
/* ============================================================ */

/* MIDNIGHT CYAN — cool dark, cyan accent, slate ink */
[data-theme="midnight-cyan"] {
  --bg:    #0a0e14;

  --bg-2:  #141a23;
  --bg-3:  #1a2230;

  --ink:   #e7ecf2;
  --ink-1: #b4bccb;
  --ink-2: #8590a3;
  --ink-3: #5e6a7e;
  --ink-4: #424b5c;

  --copper:     #5dd6d6;
  --copper-dim: #2f8c8c;
  --copper-bg:  rgba(93,214,214,0.10);

  --cy:    #5dd6d6;
  --cy-bg: rgba(93,214,214,0.10);

  color-scheme: dark;
}

/* ARCTIC LIGHT — cool light, blue accent */
[data-theme="arctic-light"] {
  --bg:    #f4f6fa;
  --bg-0:  #f4f6fa;
  --bg-1:  #ffffff;
  --bg-2:  #f9fbfd;

  --line:    #d9e0ea;

/* IVORY EDITORIAL — warm ivory cream, copper accent — readable/editorial */
[data-theme="ivory-editorial"],
[data-theme="light"] {
  --bg:    #f6f5f1;
  --bg-0:  #f6f5f1;
  --bg-1:  #ffffff;

  --ink-1: #393d36;
  --ink-2: #5d6058;
  --ink-3: #82857c;
  --ink-4: #a8aaa1;

  --copper:     #b85d3e;
  --copper-dim: #7a3d28;

  --gn-dim: #0f5a30;

  --rd-dim: #7a221a;
  --rd-bg:  rgba(192,57,43,0.12);

  --amb-bg: rgba(184,136,26,0.12);

  --cy-bg:   rgba(31,138,138,0.12);
  --violet:  #6a4ad9;

  --blue:    #2563c8;
  --blue-bg: rgba(37,99,200,0.12);

  --shadow-2: 0 8px 24px -10px rgba(0,0,0,0.18);

/* ============================================================ */
/* base                                                          */
/* ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}
body { overflow: hidden; }

/* scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

.mono { font-family: var(--mono); font-feature-settings: "tnum","zero"; }
.tabular { font-variant-numeric: tabular-nums; }
.up   { color: var(--gn); }
.dn   { color: var(--rd); }
.warn { color: var(--amb); }
.dim  { color: var(--ink-3); }
.dim2 { color: var(--ink-2); }
.copper { color: var(--copper); }
.cy { color: var(--cy); }
.violet { color: var(--violet); }

.label-cap {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* keyboard hint chips */
.kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  padding: 1px 5px;
  font-family: var(--mono);
  font-size: 10px;
  border: 1px solid var(--line-2);
  border-radius: 3px;
  color: var(--ink-2);
  background: var(--bg-2);
}

/* selection */
::selection { background: var(--copper-bg); color: var(--ink); }


/* ===== components.css ===== */
/* SwingTrade V2 — component styles */

/* ============================================================ */
/* Pill                                                          */
/* ============================================================ */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 999px;
  white-space: nowrap;
  line-height: 1.4;
  border: 1px solid transparent;
}
.pill--sm { padding: 1px 6px; font-size: 9.5px; }
.pill-dot {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
}
.pill--gn  { background: var(--gn-bg);  color: var(--gn);  border-color: var(--gn-dim); }
.pill--rd  { background: var(--rd-bg);  color: var(--rd);  border-color: var(--rd-dim); }
.pill--amb { background: var(--amb-bg); color: var(--amb); border-color: var(--amb-dim); }
.pill--cy  { background: var(--cy-bg);  color: var(--cy);  border-color: var(--cy); }
.pill--violet { background: var(--violet-bg); color: var(--violet); border-color: var(--violet); }
.pill--blue { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
.pill--copper { background: var(--copper-bg); color: var(--copper); border-color: var(--copper-dim); }
.pill--ink { background: var(--bg-3); color: var(--ink-2); border-color: var(--line-2); }
.pill--outline { background: transparent; }

/* ============================================================ */
/* Section header                                                */
/* ============================================================ */
.sec-hdr {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-1);
}
.sec-hdr-num {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--copper);
  letter-spacing: 0.04em;
  min-width: 28px;
}
.sec-hdr-text { flex: 1; min-width: 0; }
.sec-hdr-title {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
  font-weight: 500;
}
.sec-hdr-sub {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-3);
  margin-top: 2px;
  letter-spacing: 0.04em;
}
.sec-hdr-right { display: flex; align-items: center; gap: 8px; }

.sec-hdr--min {
  padding: 10px 16px 10px 0;
  background: transparent;
  border-bottom: 1px solid var(--line);
  margin-left: 16px;
}
.sec-hdr--min .sec-hdr-title { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-1); }

.sec-hdr--rail {
  padding: 10px 16px 10px 0;
  background: transparent;
  border-bottom: 1px solid var(--line);
  margin-left: 16px;
  position: relative;
}
.sec-hdr--rail::before {
  content: "";
  position: absolute;
  left: -16px; top: 0; bottom: 0;
  width: 3px;
  background: var(--copper);
}
.sec-hdr-rail-num {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  color: var(--copper);
}

/* ============================================================ */
/* KPI tile                                                      */
/* ============================================================ */
.kpi {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.kpi-label { display: block; }
.kpi-value {
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin-top: 2px;
}
.kpi-unit { font-size: 12px; color: var(--ink-3); margin-left: 3px; font-weight: 400; }
.kpi-sub { font-size: 9.5px; margin-top: 1px; }
.kpi-spark { margin-top: 4px; opacity: 0.85; }
.kpi-delta { font-size: 11px; margin-top: 1px; letter-spacing: 0.03em; }

.kpi-tone--gn  { color: var(--gn); }
.kpi-tone--rd  { color: var(--rd); }
.kpi-tone--amb { color: var(--amb); }
.kpi-tone--copper { color: var(--copper); }
.kpi-tone--cy { color: var(--cy); }
.kpi-tone--violet { color: var(--violet); }
.kpi-tone--blue { color: var(--blue); }
.kpi-tone--ink { color: var(--ink); }

.kpi--sparkline { padding-bottom: 8px; }
.kpi--delta .kpi-value { font-size: 20px; }

/* ============================================================ */
/* Cross-Lens strip                                              */
/* ============================================================ */
.xlens {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  overflow: hidden;
  background: var(--bg-1);
}
.xlens-cell {
  padding: 12px 12px 10px;
  border-right: 1px solid var(--line);
  border-top: 2px solid transparent;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.xlens-cell:last-child { border-right: none; }
.xlens-lead { background: var(--bg-2); }
.xlens-verdict {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.04em;
}
.xlens-note {
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.3;
  letter-spacing: 0.02em;
}

/* ============================================================ */
/* Wilson pill (sample-size honesty)                             */
/* ============================================================ */
.wilson {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 5px 10px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  font-family: var(--mono);
  font-size: 11px;
}
.wilson--low { border-color: var(--rd-dim); background: var(--rd-bg); }
.wilson-block { display: inline-flex; gap: 5px; align-items: baseline; }
.wilson-k {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
}
.wilson-v { color: var(--ink); font-feature-settings: "tnum"; }
.wilson-warn {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--rd); font-weight: 600;
  border-left: 1px solid var(--rd-dim);
  padding-left: 10px;
}

/* ============================================================ */
/* States                                                        */
/* ============================================================ */
.state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 8px; }
.state--loading .state-spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--line);
  border-top-color: var(--copper);
  border-radius: 50%;
  animation: st-spin 0.8s linear infinite;
}
@keyframes st-spin { to { transform: rotate(360deg); } }
.state-msg { font-size: 11px; color: var(--ink-3); }
.state-msg-em { font-size: 12px; color: var(--ink-2); font-style: italic; }

.state--scaffold .state-banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  margin: 0 16px 12px;
  background: var(--amb-bg);
  border: 1px solid var(--amb-dim);
  border-radius: var(--r-2);
  color: var(--amb);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.02em;
}
.state--scaffold .state-banner b { color: var(--amb); font-weight: 600; }
.state--scaffold .state-banner-icon { font-size: 14px; line-height: 1; padding-top: 1px; }
.state--scaffold .state-scaffold-body { opacity: 0.55; pointer-events: none; }

/* ============================================================ */
/* Buttons / segmented                                           */
/* ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--bg-2);
  color: var(--ink-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  cursor: pointer;
  transition: all 0.12s ease;
}
.btn:hover { background: var(--bg-3); color: var(--ink); border-color: var(--line-2); }
.btn--primary { background: var(--copper-bg); border-color: var(--copper-dim); color: var(--copper); }
.btn--primary:hover { background: var(--copper); color: var(--bg); border-color: var(--copper); }
.btn--gn { background: var(--gn-bg); border-color: var(--gn-dim); color: var(--gn); }
.btn--rd { background: var(--rd-bg); border-color: var(--rd-dim); color: var(--rd); }
.btn--sm { padding: 4px 8px; font-size: 10px; }

.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  overflow: hidden;
  background: var(--bg-2);
}
.seg-btn {
  padding: 5px 10px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  background: transparent;
  color: var(--ink-2);
  border: none;
  border-right: 1px solid var(--line);
  cursor: pointer;
  transition: all 0.12s ease;
}
.seg-btn:last-child { border-right: none; }
.seg-btn:hover { color: var(--ink); }
.seg-btn.is-on {
  background: var(--copper-bg);
  color: var(--copper);
}


/* ===== shell.css ===== */
/* SwingTrade V2 — shell + scan column + icon rail */

#root { height: 100vh; }

.app {
  display: grid;
  grid-template-columns: 56px auto 1fr;
  height: 100vh;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
}

/* ============================================================ */
/* Icon rail                                                     */
/* ============================================================ */
.ir {
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 8px 0;
  gap: 4px;
  color: var(--ink-2);
  z-index: 4;
}
.ir-brand {
  display: flex; align-items: center; justify-content: center;
  width: 56px; height: 44px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}
.ir-search {
  display: flex; align-items: center; justify-content: center;
  width: 56px; height: 36px;
  color: var(--ink-3);
  cursor: pointer;
  transition: color 0.12s;
}
.ir-search:hover { color: var(--ink); }
.ir-group { display: flex; flex-direction: column; gap: 2px; padding: 0 6px; }
.ir-sep {
  height: 1px; background: var(--line);
  margin: 6px 0;
}
.ir-item {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 36px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--r-2);
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.12s ease;
  margin: 0 auto;
}
.ir-item:hover {
  background: var(--bg-3);
  color: var(--ink);
}
.ir-item.is-active {
  background: var(--copper-bg);
  color: var(--copper);
  border-color: var(--copper-dim);
}
.ir-icon { display: flex; align-items: center; justify-content: center; }
.ir-icon svg {
  width: 18px; height: 18px;
  stroke: currentColor;
  stroke-width: 1.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ir-count {
  position: absolute;
  top: 2px; right: 0;
  font-family: var(--mono); font-size: 8.5px; font-weight: 500;
  padding: 1px 4px;
  background: var(--bg-3);
  color: var(--ink-1);
  border-radius: 8px;
  letter-spacing: 0.04em;
  min-width: 16px; text-align: center;
}
.ir-count--gn { background: var(--gn-bg); color: var(--gn); }
.ir-count--rd { background: var(--rd-bg); color: var(--rd); }
.ir-count--amb { background: var(--amb-bg); color: var(--amb); }
.ir-dot {
  position: absolute;
  top: 4px; right: 4px;
  width: 5px; height: 5px;
  background: var(--gn);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--gn);
}
.ir-tip {
  position: absolute;
  left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  padding: 4px 8px;
  font-size: 10.5px;
  letter-spacing: 0.04em;
  border-radius: var(--r-2);
  white-space: nowrap;
  color: var(--ink);
  z-index: 100;
  pointer-events: none;
  box-shadow: var(--shadow-2);
}

.ir-foot {
  margin-top: auto;
  display: flex; justify-content: center;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}
.ir-foot-pulse {
  width: 12px; height: 12px;
  display: flex; align-items: center; justify-content: center;
}
.ir-foot-dot {
  width: 6px; height: 6px;
  background: var(--gn);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--gn);
  animation: ir-pulse 2s ease-in-out infinite;
}
@keyframes ir-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ============================================================ */
/* Scan column                                                   */
/* ============================================================ */
.sc {
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  transition: width 0.2s cubic-bezier(0.2, 0, 0, 1);
  min-width: 0;
  overflow: hidden;
}
.sc-hdr {
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-1);
}
.sc-surf-tabs {
  display: flex;
  gap: 4px;
}
.sc-surf {
  flex: 1;
  padding: 5px 7px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.10em;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-3);
  border-radius: var(--r-2);
  cursor: pointer;
  transition: all 0.12s;
}
.sc-surf:hover { color: var(--ink); border-color: var(--line-2); }
.sc-surf.is-on {
  background: var(--copper-bg);
  color: var(--copper);
  border-color: var(--copper-dim);
}
.sc-surf--gn.is-on { background: var(--gn-bg); color: var(--gn); border-color: var(--gn-dim); }
.sc-surf--violet.is-on { background: var(--violet-bg); color: var(--violet); border-color: var(--violet); }
.sc-surf--ink.is-on { background: var(--bg-3); color: var(--ink); border-color: var(--line-2); }

.sc-presets {
  display: flex; gap: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  align-self: flex-start;
}
.sc-preset {
  padding: 2px 7px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.10em;
  background: transparent;
  border: none;
  border-right: 1px solid var(--line);
  color: var(--ink-3);
  cursor: pointer;
}
.sc-preset:last-child { border-right: none; }
.sc-preset:hover { color: var(--ink); }
.sc-preset.is-on { background: var(--copper-bg); color: var(--copper); }

.sc-list {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  padding: 4px 0;
}
.sc-row {
  display: flex; flex-direction: column;
  gap: 3px;
  padding: 7px 10px;
  background: transparent;
  border: none;
  border-left: 2px solid transparent;
  border-bottom: 1px solid var(--bg-2);
  text-align: left;
  cursor: pointer;
  transition: all 0.10s ease;
  width: 100%;
  color: inherit;
}
.sc-row:hover { background: var(--bg-2); }
.sc-row.is-active {
  background: var(--copper-bg);
  border-left-color: var(--copper);
}
.sc-row-head {
  display: flex; align-items: baseline; gap: 8px;
}
.sc-row-rank { font-size: 9.5px; opacity: 0.7; min-width: 18px; }
.sc-row-sym { font-size: 12px; min-width: 50px; }
.sc-row-chg { font-size: 10px; margin-left: auto; }
.sc-row-score { font-size: 11px; min-width: 22px; text-align: right; }
.sc-row-meta { display: flex; align-items: baseline; gap: 6px; }
.sc-row-name { font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-row-px { font-size: 10px; }
.sc-row-foot { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.sc-row-setup { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-row-spark { margin-top: 4px; opacity: 0.7; }

.sc-row--mini {
  padding: 6px 6px;
  align-items: center;
  flex-direction: column;
  gap: 1px;
}
.sc-row--mini .sc-row-sym { font-size: 10.5px; }
.sc-row--mini .sc-row-chg { font-size: 9px; margin-left: 0; }

.sc-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  border-top: 1px solid var(--line);
  background: var(--bg-1);
}
.sc-foot .mono { font-size: 9.5px; }
.sc-empty {
  padding: 32px 16px;
  text-align: center;
  display: flex; flex-direction: column; gap: 6px;
}

/* ============================================================ */
/* Main area                                                     */
/* ============================================================ */
.main {
  display: flex; flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background: var(--bg);
}

/* Command bar */
.cmd {
  display: flex; align-items: center; gap: 16px;
  padding: 8px 16px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  height: 44px;
  flex-shrink: 0;
}
.cmd-left { display: flex; align-items: center; gap: 10px; }
.cmd-breadcrumb {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px;
  letter-spacing: 0.06em;
}
.cmd-breadcrumb b { font-weight: 600; }
.cmd-center { flex: 1; display: flex; justify-content: center; }
.cmd-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 4px 10px;
  width: 100%;
  max-width: 480px;
}
.cmd-search:focus-within {
  border-color: var(--copper-dim);
  background: var(--bg-3);
}
.cmd-search svg { color: var(--ink-3); flex-shrink: 0; }
.cmd-search input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 12px;
}
.cmd-search input::placeholder { color: var(--ink-3); }

.cmd-right { display: flex; align-items: center; gap: 12px; }
.cmd-mode .seg-btn { padding: 4px 9px; font-size: 10px; }
.cmd-acct {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 11px;
}
.cmd-acct .label-cap { font-size: 9px; }

/* Map (above detail) */
.main-map {
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  flex-shrink: 0;
  max-height: 50vh;
  overflow: hidden;
}

/* ============================================================ */
/* Market Map styles                                             */
/* ============================================================ */
.mm-wrap {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-3);
  overflow: hidden;
}
.mm-toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-1);
  flex-wrap: wrap;
}
.mm-title { display: flex; gap: 8px; align-items: baseline; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-title .label-cap { font-size: 11px; flex-shrink: 0; }
.mm-title > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.mm-toolbar-right { display: flex; gap: 10px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
.mm-body { background: var(--bg-2); }
.mm-cell { cursor: pointer; transition: filter 0.10s; }
.mm-cell:hover { filter: brightness(1.18); }
.mm-legend {
  display: flex; gap: 24px; align-items: center;
  padding: 6px 12px;
  background: var(--bg-1);
  border-top: 1px solid var(--line);
  font-size: 10.5px;
}
.mm-leg-grp { display: flex; align-items: center; gap: 8px; }
.mm-leg-grp .label-cap { font-size: 9.5px; }
.mm-leg-bar {
  display: inline-flex;
  gap: 1px;
  height: 8px;
  width: 100px;
  border: 1px solid var(--line);
}
.mm-leg-bar > div { flex: 1; }

/* ============================================================ */
/* Detail panel                                                  */
/* ============================================================ */
.dpanel {
  flex: 1;
  display: flex; flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.dp-hdr {
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px 8px;
  flex-shrink: 0;
}
.dp-hdr-row {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}
.dp-hdr-id { display: flex; align-items: baseline; gap: 12px; flex: 1; min-width: 0; flex-wrap: wrap; }
.dp-hdr-sym { font-size: 16px; letter-spacing: 0.04em; flex-shrink: 0; }
.dp-hdr-meta { display: flex; gap: 6px; font-size: 11px; flex-wrap: wrap; min-width: 0; }
.dp-hdr-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
.dp-hdr-mode { font-size: 10.5px; letter-spacing: 0.10em; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--bg-2); white-space: nowrap; }

.dp-hdr-quote { margin-top: 6px; }
.dp-quote-price { font-size: 22px; flex-shrink: 0; }
.dp-quote-chg { font-size: 12px; flex-shrink: 0; }
.dp-quote-extra { display: flex; gap: 6px; font-size: 11px; flex-wrap: wrap; }
.dp-quote-extra b { color: var(--ink-1); }
.dp-hdr-spacer { flex: 1; min-width: 0; }

/* Tabs */
.dp-tabs {
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.dp-tabs-scroll {
  display: flex; gap: 0;
  overflow-x: auto;
  scrollbar-width: thin;
}
.dp-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  background: transparent;
  border: none;
  border-right: 1px solid var(--line);
  border-bottom: 2px solid transparent;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.10s;
  flex-shrink: 0;
}
.dp-tab:hover { color: var(--ink); background: var(--bg-2); }
.dp-tab.is-on {
  color: var(--copper);
  border-bottom-color: var(--copper);
  background: var(--bg-2);
}
.dp-tab-num { font-size: 9px; opacity: 0.7; }
.dp-tab-label { text-transform: uppercase; letter-spacing: 0.08em; }
.dp-tab-kbd { font-size: 9px; }

.dpanel-body {
  flex: 1;
  overflow-y: auto;
  background: var(--bg);
}

/* small-panel reflows */
.dpanel--S .dp-tab-num { display: none; }
.dpanel--S .dp-tab-kbd { display: none; }
.dpanel--S .dp-tab-label { font-size: 10px; }
.dpanel--S .dp-hdr-meta { display: none; }

/* ============================================================ */
/* Lens section common                                           */
/* ============================================================ */
.lens { padding-bottom: 24px; }
.lens-section { border-bottom: 1px solid var(--line); }
.lens-pad { padding: 14px 16px; }
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}

.lens-call {
  display: flex; gap: 16px; align-items: baseline;
  padding: 16px;
  background: linear-gradient(to right, var(--copper-bg), transparent 60%);
  border-top: 2px solid var(--copper-dim);
  border-bottom: 1px solid var(--line);
}
.lens-call .label-cap { color: var(--copper); }
.lens-call .mono { font-size: 12px; }

/* State toggle */
.state-toggle {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  overflow: hidden;
}
.st-btn {
  padding: 2px 6px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  background: transparent;
  border: none;
  border-right: 1px solid var(--line);
  color: var(--ink-3);
  cursor: pointer;
}
.st-btn:last-child { border-right: none; }
.st-btn:hover { color: var(--ink); }
.st-btn.is-on { color: var(--ink); background: var(--bg-3); }
.st-btn.is-on.st-gn  { background: var(--gn-bg);  color: var(--gn); }
.st-btn.is-on.st-amb { background: var(--amb-bg); color: var(--amb); }
.st-btn.is-on.st-ink { background: var(--bg-3); color: var(--ink-2); }

/* Hero common */
.hero {
  display: flex;
  gap: 24px;
  padding: 16px 20px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
}
.hero-left { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.hero-right { display: flex; align-items: center; justify-content: center; flex-shrink: 0; min-width: 180px; }
.hero-verdict { display: flex; align-items: baseline; gap: 14px; margin-top: 4px; }
.hero-verdict-tag {
  display: inline-flex; align-items: center;
  padding: 4px 12px;
  background: var(--gn-bg); color: var(--gn);
  border: 1.5px solid var(--gn);
  border-radius: var(--r-2);
  font-family: var(--mono);
  font-size: 16px; font-weight: 500;
  letter-spacing: 0.10em;
}
.hero-verdict-score { font-family: var(--mono); font-size: 30px; font-weight: 500; }
.hero-score-unit { font-size: 14px; color: var(--ink-3); margin-left: 4px; font-weight: 400; }
.hero-verdict-line { font-size: 11px; }
.hero-pillars { display: flex; flex-direction: column; gap: 5px; max-width: 340px; }
.hero-pill-row {
  display: grid;
  grid-template-columns: 60px 1fr 36px;
  align-items: center;
  gap: 10px;
  font-size: 10.5px;
}
.hero-pill-row .label-cap { font-size: 9.5px; }
.hero-pill-bar {
  height: 5px;
  background: var(--bg-3);
  border-radius: 3px;
  overflow: hidden;
}
.hero-pill-fill {
  height: 100%;
  transition: width 0.35s cubic-bezier(0.2, 0, 0, 1);
  border-radius: 3px;
}
.hero-cone-wrap { display: flex; flex-direction: column; align-items: center; }

/* ============================================================ */
/* Focus mode (direction C)                                      */
/* ============================================================ */
.app--focus .ir { /* nothing changes — narrow rail is already minimal */ }
.app--focus .sc {
  background: var(--bg-0);
}

/* ============================================================ */
/* Data table                                                    */
/* ============================================================ */
.dtable {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 11px;
}
.dtable thead th {
  text-align: left;
  font-weight: 500;
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-1);
  position: sticky; top: 0;
}
.dtable th.r, .dtable td.r { text-align: right; }
.dtable td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--bg-2);
  font-variant-numeric: tabular-nums;
}
.dtable-row { cursor: pointer; }
.dtable-row:hover td { background: var(--bg-2); }
.dtable tr.is-current td {
  background: var(--copper-bg);
  border-bottom-color: var(--copper-dim);
}

/* ============================================================ */
/* Tweaks panel theme picker                                     */
/* ============================================================ */
.tk-themes {
  display: flex; flex-direction: column;
  gap: 4px;
  padding: 4px 0;
}
.tk-theme {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 7px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
  color: inherit;
  width: 100%;
  font: inherit;
}
.tk-theme:hover { background: rgba(0,0,0,0.04); }
.tk-theme.is-on {
  border-color: #d97757;
  background: rgba(217, 119, 87, 0.08);
}
.tk-theme-sw {
  display: inline-flex; gap: 3px;
  padding: 3px;
  border-radius: 4px;
  background: rgba(0,0,0,0.18);
}
.tk-theme-chip {
  display: inline-block;
  width: 12px; height: 12px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.06);
}
.tk-theme-name {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.02em;
  flex: 1;
}


/* ===== lenses.css ===== */
/* SwingTrade V2 — lens content styles */

/* ============================================================ */
/* Plan hero strip                                               */
/* ============================================================ */
.plan-hero { padding: 0; flex-direction: column; gap: 0; }
.plan-hero-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  width: 100%;
}
.plan-hero-cell {
  padding: 12px 16px;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 3px;
  background: var(--bg-1);
}
.plan-hero-cell:last-child { border-right: none; }
.plan-hero-cell--rd { background: var(--rd-bg); }
.plan-hero-cell--gn { background: var(--gn-bg); }
.plan-hero-value {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.dpanel--S .plan-hero-strip,
.dpanel--M .plan-hero-strip { grid-template-columns: repeat(3, 1fr); }
.dpanel--S .plan-hero-cell,
.dpanel--M .plan-hero-cell { border-bottom: 1px solid var(--line); }
.dpanel--S .plan-hero-cell:nth-last-child(-n+3),
.dpanel--M .plan-hero-cell:nth-last-child(-n+3) { border-bottom: none; }
.dpanel--S .plan-hero-cell:nth-child(3n),
.dpanel--M .plan-hero-cell:nth-child(3n) { border-right: none; }

/* ============================================================ */
/* Order ticket                                                  */
/* ============================================================ */
.ticket {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
}
.dpanel--S .ticket, .dpanel--M .ticket { grid-template-columns: 1fr; }
.ticket-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  overflow: hidden;
}
.field {
  background: var(--bg-1);
  padding: 8px 12px;
  display: flex; flex-direction: column; gap: 2px;
}
.field-label { font-size: 9.5px; }
.field-value { font-size: 12px; }

.ticket-rail {
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
}
.ticket-rail-row { display: flex; align-items: baseline; justify-content: space-between; }
.ticket-rail-row .label-cap { font-size: 9.5px; }
.payoff-mini { background: var(--bg-2); border-radius: var(--r-2); border: 1px solid var(--line); }
.ticket-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ticket-actions .btn { flex: 1; justify-content: center; min-width: 80px; }
.ticket-gates { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.gate {
  display: flex; align-items: baseline; gap: 8px;
  padding: 4px 8px;
  border-radius: var(--r-2);
  background: var(--bg-2);
  font-size: 11px;
}
.gate-mark { font-weight: 600; min-width: 12px; }
.gate-label { flex: 1; font-size: 10.5px; }
.gate-note { font-size: 10px; }
.gate--gn .gate-mark { color: var(--gn); }
.gate--amb .gate-mark { color: var(--amb); }
.gate--rd .gate-mark { color: var(--rd); }

/* ============================================================ */
/* Sizing waterfall                                              */
/* ============================================================ */
.waterfall {
  display: flex; flex-direction: column; gap: 5px;
  font-size: 11px;
}
.wf-row {
  display: grid;
  grid-template-columns: 130px 1fr 56px 1.5fr;
  align-items: center;
  gap: 12px;
  padding: 4px 0;
}
.wf-label { font-size: 10.5px; color: var(--ink-1); }
.wf-bar {
  height: 6px;
  background: var(--bg-3);
  border-radius: 3px;
  overflow: hidden;
}
.wf-fill {
  height: 100%;
  background: var(--copper);
  opacity: 0.85;
  border-radius: 3px;
  transition: width 0.4s cubic-bezier(0.2,0,0,1);
}
.wf-v { font-size: 11px; text-align: right; color: var(--ink-1); }
.wf-note { font-size: 10px; }
.wf-final .wf-label, .wf-final .wf-v { color: var(--copper); font-weight: 500; }
.wf-final .wf-fill { background: var(--copper); opacity: 1; }
.wf-final { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.wf-tail { font-size: 11px; padding-top: 4px; }

/* ============================================================ */
/* Price ladder                                                  */
/* ============================================================ */
.ladder { display: flex; flex-direction: column; gap: 0; }
.ladder-row {
  display: grid;
  grid-template-columns: 130px 1fr 80px 1fr;
  align-items: center;
  gap: 12px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--bg-3);
}
.ladder-row:last-child { border-bottom: none; }
.ladder-label { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; }
.ladder-bar {
  height: 1px;
  background: var(--line);
  position: relative;
}
.ladder-tick {
  position: absolute;
  left: 0; top: -3px; bottom: -3px;
  width: 1px;
  background: var(--ink-3);
}
.ladder-px { font-size: 13px; text-align: right; font-weight: 500; }
.ladder-note { font-size: 10.5px; }
.ladder-copper .ladder-bar { background: var(--copper); }
.ladder-copper .ladder-tick { background: var(--copper); width: 2px; }
.ladder-gn .ladder-bar { background: var(--gn-dim); }
.ladder-rd .ladder-bar { background: var(--rd-dim); }
.ladder-rd .ladder-tick { background: var(--rd); }

/* ============================================================ */
/* Invalidation ladder                                           */
/* ============================================================ */
.inv-ladder { display: flex; flex-direction: column; gap: 6px; }
.inv-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line-2);
  border-radius: var(--r-2);
}
.inv-num { font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; }
.inv-trig { font-size: 11px; }
.inv-amb { border-left-color: var(--amb-dim); }
.inv-rd  { border-left-color: var(--rd); }
.inv-ink { border-left-color: var(--ink-3); }

/* ============================================================ */
/* Time anatomy ribbon                                           */
/* ============================================================ */
.time-anatomy {
  padding: 8px 0;
}
.ta-meta { font-size: 10px; margin-bottom: 18px; }
.ta-ribbon {
  position: relative;
  padding: 80px 12px 36px;
  margin: 0 8px;
}
.ta-track {
  position: relative;
  height: 18px;
  background: var(--bg-2);
  border-radius: 9px;
  border: 1px solid var(--line);
}
.ta-phase {
  position: absolute; top: 0; bottom: 0;
  border-radius: 9px 0 0 9px;
}
.ta-phase--pre { background: rgba(120,120,120,0.15); border-radius: 9px 0 0 9px; }
.ta-phase--hold { background: var(--copper-bg); }
.ta-tick {
  position: absolute;
  top: 4px; bottom: 4px;
  width: 1px;
  background: var(--line-2);
}
.ta-tick-major {
  top: -4px; bottom: -4px;
  background: var(--copper);
  width: 2px;
}
.ta-event {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
}
.ta-event-stem {
  position: absolute;
  top: -64px;
  width: 1px; height: 60px;
  background: var(--line-2);
}
.ta-event--copper .ta-event-stem,
.ta-event--gn .ta-event-stem { background: var(--gn-dim); }
.ta-event--copper .ta-event-stem { background: var(--copper); }
.ta-event--rd .ta-event-stem { background: var(--rd-dim); }
.ta-event--amb .ta-event-stem { background: var(--amb-dim); }
.ta-event-dot {
  width: 10px; height: 10px;
  background: var(--ink);
  border-radius: 50%;
  border: 2px solid var(--bg);
}
.ta-event.is-big .ta-event-dot {
  width: 14px; height: 14px;
  background: var(--copper);
  box-shadow: 0 0 12px var(--copper);
}
.ta-event--gn .ta-event-dot { background: var(--gn); }
.ta-event--rd .ta-event-dot { background: var(--rd); }
.ta-event--amb .ta-event-dot { background: var(--amb); }
.ta-event--copper .ta-event-dot { background: var(--copper); }
.ta-event--ink .ta-event-dot { background: var(--ink-2); }
.ta-event-label {
  position: absolute;
  font-size: 10px;
  letter-spacing: 0.02em;
  white-space: nowrap;
  padding: 3px 7px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 3px;
  max-width: 140px;
}
.ta-event-label.ta-up { top: -86px; }
.ta-event-label.ta-dn { top: 28px; }
.ta-axis {
  position: relative;
  height: 16px;
  margin-top: 4px;
}
.ta-axis span {
  position: absolute;
  transform: translateX(-50%);
  font-size: 9.5px;
  letter-spacing: 0.10em;
  color: var(--ink-3);
}
.ta-legend {
  display: flex; gap: 18px;
  padding: 12px 12px 0;
  font-size: 10px;
  color: var(--ink-2);
}
.ta-legend > span { display: inline-flex; align-items: center; gap: 5px; }
.ta-leg-sw {
  display: inline-block;
  width: 14px; height: 6px;
  border-radius: 3px;
}
.ta-leg--pre  { background: rgba(120,120,120,0.3); }
.ta-leg--hold { background: var(--copper); opacity: 0.4; }
.ta-leg--er   { background: var(--amb); opacity: 0.5; }

/* ============================================================ */
/* Reaction playbook                                             */
/* ============================================================ */
.play { display: flex; flex-direction: column; gap: 4px; }
.play-row {
  display: grid;
  grid-template-columns: 28px 1fr 18px 36px 1fr;
  align-items: baseline;
  gap: 8px;
  padding: 7px 10px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  font-size: 11px;
  border-left: 3px solid var(--line-2);
}
.play-gn  { border-left-color: var(--gn); }
.play-rd  { border-left-color: var(--rd); }
.play-amb { border-left-color: var(--amb); }
.play-ink { border-left-color: var(--ink-3); }
.play-tag { font-size: 9px; letter-spacing: 0.12em; color: var(--ink-3); }
.play-if, .play-then { font-size: 11px; }
.play-arrow { color: var(--ink-3); }

/* ============================================================ */
/* Post-fill checklist                                           */
/* ============================================================ */
.checklist { display: flex; flex-direction: column; gap: 4px; }
.check-row {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px;
  border-radius: var(--r-2);
  border: 1px solid var(--line);
  background: var(--bg-1);
  font-size: 11.5px;
}
.check-row.is-done { background: var(--gn-bg); border-color: var(--gn-dim); }
.check-box {
  width: 16px; height: 16px;
  border: 1px solid var(--line-2);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--gn);
}
.check-row.is-done .check-box { background: var(--gn); color: var(--bg); border-color: var(--gn); }
.check-label { flex: 1; }
.check-note { font-size: 10.5px; }

/* ============================================================ */
/* Pre-mortem rows                                               */
/* ============================================================ */
.premortem { display: flex; flex-direction: column; gap: 4px; }
.premortem-row {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  align-items: baseline;
  gap: 12px;
  padding: 8px 12px;
  background: var(--bg-1);
  border-left: 3px solid var(--amb-dim);
  border-radius: 0 var(--r-2) var(--r-2) 0;
  font-size: 11.5px;
}
.pm-num { color: var(--amb); font-size: 11px; }

/* ============================================================ */
/* Tech: indicator dashboard                                     */
/* ============================================================ */
.ind-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 6px;
}
.ind-cell {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 2px;
}
.ind-gn { border-left: 3px solid var(--gn); }
.ind-rd { border-left: 3px solid var(--rd); }
.ind-amb { border-left: 3px solid var(--amb); }
.ind-name { font-size: 10px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }
.ind-v { font-size: 16px; font-weight: 500; }
.ind-state { font-size: 10px; color: var(--ink-1); letter-spacing: 0.06em; }
.ind-note { font-size: 9.5px; }

/* MA stack */
.ma-stack { display: flex; flex-direction: column; gap: 8px; }
.ma-stack-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
}
.ma-row {
  display: grid;
  grid-template-columns: 60px 1fr 50px;
  gap: 8px;
  align-items: baseline;
  padding: 6px 10px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  font-size: 11px;
}
.ma-label { font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; }
.ma-v { font-weight: 500; }
.ma-delta { font-size: 10px; text-align: right; }
.ma-summary { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r-2); }
.ma-summary .mono { font-size: 11px; }

/* Pattern matrix */
.pat-tbl {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1.6fr;
  gap: 0;
  font-family: var(--mono);
  font-size: 11px;
}
.pat-row {
  display: contents;
}
.pat-row > * {
  padding: 7px 12px;
  border-bottom: 1px solid var(--line);
}
.pat-row--hdr > * { background: var(--bg-1); }
.pat-row--hdr .label-cap { font-size: 10px; }
.pat-conf { display: inline-flex; align-items: center; gap: 6px; }
.pat-conf-bar {
  display: inline-block;
  width: 36px; height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
}
.pat-conf-bar > span {
  display: block; height: 100%;
  background: var(--copper);
}

/* S/R ladder */
.sr-ladder { display: flex; flex-direction: column; }
.sr-row {
  display: grid;
  grid-template-columns: 80px 1fr 1fr;
  gap: 12px;
  align-items: center;
  padding: 6px 10px;
  border-bottom: 1px dashed var(--bg-3);
  font-size: 11px;
}
.sr-current { background: var(--copper-bg); border-bottom: 1px solid var(--copper-dim); }
.sr-stop    { background: var(--rd-bg); }
.sr-strong .sr-px { font-weight: 600; }
.sr-px { font-size: 12px; text-align: left; font-weight: 500; }
.sr-lbl { font-size: 11px; color: var(--ink-1); }
.sr-sources { display: flex; gap: 4px; flex-wrap: wrap; }
.sr-src {
  font-size: 9px;
  padding: 1px 6px;
  background: var(--bg-3);
  border-radius: 8px;
  color: var(--ink-2);
  letter-spacing: 0.04em;
}

/* Volume analytics */
.vol-block { display: flex; flex-direction: column; gap: 14px; }
.vol-bars {
  display: flex; gap: 1px;
  height: 80px;
  align-items: flex-end;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 8px;
}
.vol-bar {
  flex: 1;
  border-radius: 1px;
}
.vol-bar.up { background: var(--gn); opacity: 0.75; }
.vol-bar.dn { background: var(--rd); opacity: 0.65; }
.vol-bar.is-pivot { box-shadow: inset 0 0 0 1px var(--copper); }
.vol-note { font-size: 10.5px; }

/* Stat backbone */
.stat-block { display: flex; flex-direction: column; gap: 8px; }
.stat-note { font-size: 10px; margin-top: 8px; }

/* Regime grid */
.reg-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 6px;
}
.reg-cell {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
}
.reg-cell.is-current { border-color: var(--copper); background: var(--copper-bg); }
.reg-cell.is-low { border-color: var(--rd-dim); background: var(--rd-bg); opacity: 0.85; }
.reg-name { font-size: 11px; font-weight: 500; }
.reg-pin {
  position: absolute;
  top: 8px; right: 8px;
  font-size: 9px; letter-spacing: 0.14em;
}
.reg-wr { display: flex; flex-direction: column; gap: 2px; }
.reg-wr-v { font-size: 22px; font-weight: 500; }
.reg-pf { font-size: 10px; letter-spacing: 0.08em; }

/* Tech hero */
.tech-hero { gap: 18px; }
.th-left { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.th-score { display: flex; align-items: baseline; gap: 14px; }
.th-score-num { font-family: var(--mono); font-size: 30px; font-weight: 500; }
.th-score-unit { font-size: 14px; color: var(--ink-3); margin-left: 3px; }
.th-pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
.th-right { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mini-chart { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-2); }

/* ============================================================ */
/* Value hero                                                    */
/* ============================================================ */
.value-hero { flex-direction: column; gap: 18px; }
.vh-top { display: flex; }
.vh-verdict { display: flex; align-items: baseline; gap: 14px; margin-top: 4px; }
.vh-tag {
  display: inline-flex; align-items: center;
  padding: 4px 12px;
  background: var(--amb-bg); color: var(--amb);
  border: 1.5px solid var(--amb-dim);
  border-radius: var(--r-2);
  font-family: var(--mono); font-size: 16px;
  letter-spacing: 0.10em;
}
.vh-score { font-family: var(--mono); font-size: 28px; font-weight: 500; }
.vh-line { font-size: 11px; margin-top: 8px; }

.vh-scale { padding: 16px 8px 36px; }
.vh-scale-track {
  position: relative;
  height: 6px;
  background: linear-gradient(to right, var(--rd-dim) 0%, var(--amb-dim) 50%, var(--gn-dim) 100%);
  border-radius: 4px;
}
.vh-scale-marker {
  position: absolute; top: -4px;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.vh-scale-marker::before {
  content: ""; width: 1px; height: 14px;
  background: var(--ink-3);
  position: absolute; top: 0;
}
.vh-scale-marker .vh-scale-px { font-size: 11px; margin-top: 16px; font-family: var(--mono); font-weight: 500; }
.vh-scale-marker .label-cap { font-size: 9px; }
.vh-bear .vh-scale-px { color: var(--rd); }
.vh-bull .vh-scale-px { color: var(--gn); }
.vh-target .vh-scale-px { color: var(--copper); }
.vh-scale-current {
  position: absolute; top: -16px;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center;
  z-index: 2;
}
.vh-scale-current::after {
  content: "";
  width: 14px; height: 14px;
  background: var(--copper);
  border: 3px solid var(--bg);
  border-radius: 50%;
  margin-top: 4px;
  box-shadow: 0 0 12px var(--copper);
}
.vh-cur-px {
  background: var(--copper);
  color: var(--bg);
  padding: 3px 8px;
  border-radius: var(--r-2);
  font-size: 12px;
  font-weight: 600;
}

/* Quality */
.quality { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.qual-cat {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.qual-hdr { display: flex; align-items: baseline; justify-content: space-between; }
.qual-grade { font-size: 22px; font-weight: 500; }
.qual-metric {
  display: flex; justify-content: space-between;
  font-size: 11px;
}

/* Statements */
.statements td.r { font-size: 11px; }

/* Cap alloc */
.cap-alloc { display: flex; flex-direction: column; gap: 12px; }
.cap-bar {
  display: flex; height: 22px;
  border-radius: var(--r-2);
  overflow: hidden;
  border: 1px solid var(--line);
}
.cap-seg { transition: opacity 0.12s; }
.cap-seg:hover { opacity: 0.85; }
.cap-copper { background: var(--copper); }
.cap-gn     { background: var(--gn); }
.cap-amb    { background: var(--amb); }
.cap-violet { background: var(--violet); }
.cap-ink    { background: var(--ink-3); }
.cap-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px; }
.cap-row {
  display: grid;
  grid-template-columns: 14px 1fr auto auto;
  gap: 8px;
  align-items: center;
  font-size: 11px;
}
.cap-sw { width: 12px; height: 12px; border-radius: 2px; }
.cap-use { font-size: 11px; font-weight: 500; }
.cap-amt { font-size: 10px; }
.cap-pct { font-size: 11px; font-weight: 500; }
.cap-note { font-size: 10.5px; }

/* Bull/Bear */
.bullbear {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.dpanel--S .bullbear, .dpanel--M .bullbear { grid-template-columns: 1fr; }
.bb-col {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.bb-col--bull { border-left: 3px solid var(--gn-dim); }
.bb-col--bear { border-left: 3px solid var(--rd-dim); }
.bb-hdr { display: flex; align-items: center; gap: 10px; }
.bb-row {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 8px;
  align-items: baseline;
  font-size: 11.5px;
  line-height: 1.5;
}
.bb-num { color: var(--ink-3); font-size: 10px; }

/* Catalyst calendar */
.catcal { display: flex; flex-direction: column; gap: 4px; }
.cat-row {
  display: grid;
  grid-template-columns: 130px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 8px 12px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  border-left: 3px solid var(--ink-3);
  font-size: 11.5px;
}
.cat-amb { border-left-color: var(--amb); }
.cat-gn  { border-left-color: var(--gn); }
.cat-copper { border-left-color: var(--copper); }
.cat-violet { border-left-color: var(--violet); }
.cat-when { font-size: 11px; color: var(--ink-2); letter-spacing: 0.04em; }

/* Lens stub */
.lens-stub { padding: 32px 24px; display: flex; align-items: center; justify-content: center; min-height: 320px; }
.lens-stub-card {
  max-width: 480px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-3);
  padding: 28px;
}
.lens-stub-card h2 { margin: 4px 0 6px; font-size: 22px; font-weight: 500; letter-spacing: 0.04em; }
.lens-stub-card .dim2 { font-size: 12px; }

/* Surfaces (Watchlist / Elite / BUY / stub) — when main surface mode is used standalone */
.surface { padding: 16px; }
.surf-hdr { display: flex; align-items: center; gap: 14px; padding: 0 4px 10px; }
.surf-title { display: flex; gap: 8px; align-items: baseline; flex: 1; }

/* ============================================================ */


/* ===== aurora.css ===== */
/* SwingTrade V2 — Aurora Glass aesthetic overlay
   Applies on top of tokens.css to give every theme the glass/luminous treatment:
   - Gradient backgrounds with aurora bloom
   - Translucent surfaces with backdrop-blur
   - Soft glows on active states
   - Pill-shaped controls, 14px radii
   - Luminous accent text */

/* ============================================================ */
/* Aurora glass tokens (overrides on top of theme bases)         */
/* ============================================================ */

:root {
  --r-glass: 14px;
  --r-pill:  999px;
  --r-2: 10px;
  --r-3: 14px;
  --r-4: 18px;
  --glass-bg-1: rgba(255, 255, 255, 0.025);
  --glass-bg-2: rgba(255, 255, 255, 0.045);
  --glass-bg-3: rgba(255, 255, 255, 0.065);
  --glass-line: rgba(255, 255, 255, 0.08);
  --glass-line-2: rgba(255, 255, 255, 0.16);
  --glass-blur: blur(22px);
  --bloom: 0 0 18px rgba(255,255,255,0.04);
}

/* Light-theme glass — darker translucency over light bg */
[data-theme="arctic-light"],
[data-theme="ivory-editorial"],
[data-theme="daylight-pearl"],
[data-theme="daylight-sand"] {
  --glass-bg-1: rgba(0, 0, 0, 0.025);
  --glass-bg-2: rgba(0, 0, 0, 0.045);
  --glass-bg-3: rgba(0, 0, 0, 0.085);
  --glass-line: rgba(0, 0, 0, 0.08);
  --glass-line-2: rgba(0, 0, 0, 0.18);
}

/* ============================================================ */
/* App background — aurora gradient bloom                        */
/* ============================================================ */
body {
  background:
    radial-gradient(900px 700px at 85% 5%, color-mix(in oklab, var(--copper) 18%, transparent), transparent 60%),
    radial-gradient(1000px 800px at 5% 95%, color-mix(in oklab, var(--cy, var(--copper)) 14%, transparent), transparent 60%),
    var(--bg) !important;
}

/* Subtle grid overlay (gives the surface depth) */
.app::before {
  content: "";
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.014) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
  z-index: 0;
}
[data-theme="arctic-light"] .app::before,
[data-theme="ivory-editorial"] .app::before,
[data-theme="daylight-pearl"] .app::before,
[data-theme="daylight-sand"] .app::before {
  background-image:
    linear-gradient(rgba(0,0,0,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.018) 1px, transparent 1px);
}

.app { background: transparent !important; position: relative; z-index: 1; }

/* ============================================================ */
/* Icon rail — translucent glass                                 */
/* ============================================================ */
.ir {
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-right: 1px solid var(--glass-line) !important;
}
.ir-brand { border-bottom: 1px solid var(--glass-line) !important; }
.ir-item {
  border-radius: 10px !important;
}
.ir-item:hover { background: var(--glass-bg-2) !important; }
.ir-item.is-active {
  background: color-mix(in oklab, var(--copper) 16%, transparent) !important;
  color: var(--copper) !important;
  border-color: color-mix(in oklab, var(--copper) 40%, transparent) !important;
  box-shadow:
    inset 0 0 0 1px color-mix(in oklab, var(--copper) 30%, transparent),
    0 0 16px color-mix(in oklab, var(--copper) 24%, transparent);
}
.ir-count {
  background: var(--glass-bg-3) !important;
  border: 1px solid var(--glass-line);
  border-radius: var(--r-pill) !important;
}
.ir-sep { background: var(--glass-line) !important; }
.ir-foot { border-top: 1px solid var(--glass-line) !important; }

/* ============================================================ */
/* Scan column — glass                                           */
/* ============================================================ */
.sc {
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-right: 1px solid var(--glass-line) !important;
}
.sc-hdr {
  background: transparent !important;
  border-bottom: 1px solid var(--glass-line) !important;
}
.sc-foot {
  background: transparent !important;
  border-top: 1px solid var(--glass-line) !important;
}
.sc-surf {
  border: 1px solid var(--glass-line) !important;
  border-radius: var(--r-pill) !important;
  background: var(--glass-bg-1) !important;
}
.sc-surf.is-on {
  background: color-mix(in oklab, var(--copper) 18%, transparent) !important;
  color: var(--copper) !important;
  border-color: color-mix(in oklab, var(--copper) 40%, transparent) !important;
  box-shadow: 0 0 14px color-mix(in oklab, var(--copper) 20%, transparent);
}
.sc-surf--gn.is-on {
  background: color-mix(in oklab, var(--gn) 18%, transparent) !important;
  color: var(--gn) !important;
  border-color: color-mix(in oklab, var(--gn) 40%, transparent) !important;
  box-shadow: 0 0 14px color-mix(in oklab, var(--gn) 22%, transparent);
}
.sc-surf--violet.is-on {
  background: color-mix(in oklab, var(--violet) 18%, transparent) !important;
  color: var(--violet) !important;
  border-color: color-mix(in oklab, var(--violet) 40%, transparent) !important;
  box-shadow: 0 0 14px color-mix(in oklab, var(--violet) 22%, transparent);
}
.sc-presets { border: 1px solid var(--glass-line) !important; border-radius: var(--r-pill) !important; padding: 2px; background: var(--glass-bg-1); }
.sc-preset { border-right: none !important; border-radius: var(--r-pill) !important; }
.sc-preset.is-on {
  background: color-mix(in oklab, var(--copper) 16%, transparent) !important;
}
.sc-row {
  border-bottom: 1px solid var(--glass-line) !important;
}
.sc-row:hover { background: var(--glass-bg-1) !important; }
.sc-row.is-active {
  background: linear-gradient(90deg,
    color-mix(in oklab, var(--copper) 14%, transparent),
    transparent 75%) !important;
  border-left-color: var(--copper) !important;
  box-shadow: inset 0 0 0 0.5px color-mix(in oklab, var(--copper) 18%, transparent);
}
.sc-row.is-active .sc-row-sym {
  text-shadow: 0 0 12px color-mix(in oklab, var(--copper) 50%, transparent);
}

/* ============================================================ */
/* Command bar — glass                                           */
/* ============================================================ */
.cmd {
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid var(--glass-line) !important;
}
.cmd-search {
  background: var(--glass-bg-2) !important;
  border: 1px solid var(--glass-line) !important;
  border-radius: var(--r-pill) !important;
  padding: 5px 14px !important;
}
.cmd-mode {
  border-radius: var(--r-pill) !important;
  background: var(--glass-bg-1) !important;
  border: 1px solid var(--glass-line) !important;
  padding: 2px !important;
  overflow: visible !important;
}
.cmd-mode .seg-btn {
  border: none !important;
  border-right: none !important;
  border-radius: var(--r-pill) !important;
  padding: 4px 12px !important;
}
.cmd-mode .seg-btn.is-on {
  background: color-mix(in oklab, var(--copper) 18%, transparent) !important;
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--copper) 30%, transparent);
}

/* ============================================================ */
/* Detail panel — glass                                          */
/* ============================================================ */
.dpanel {
  background: transparent !important;
}
.dp-hdr {
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid var(--glass-line) !important;
}
.dp-hdr-mode {
  background: var(--glass-bg-2) !important;
  border: 1px solid var(--glass-line) !important;
  border-radius: var(--r-pill) !important;
}
.dp-tabs {
  background: transparent !important;
  border-bottom: 1px solid var(--glass-line) !important;
}
.dp-tab {
  background: transparent !important;
  border: none !important;
  border-right: none !important;
  border-radius: var(--r-pill) !important;
  margin: 4px 2px !important;
  padding: 6px 12px !important;
}
.dp-tab:hover {
  background: var(--glass-bg-1) !important;
}
.dp-tab.is-on {
  background: color-mix(in oklab, var(--copper) 14%, transparent) !important;
  border-bottom-color: transparent !important;
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--copper) 30%, transparent),
              0 0 14px color-mix(in oklab, var(--copper) 18%, transparent);
}
.dpanel-body {
  background: transparent !important;
}

/* ============================================================ */
/* Sections — glass cards                                        */
/* ============================================================ */
.lens-section {
  border-bottom: 1px solid var(--glass-line) !important;
}
.sec-hdr {
  background: transparent !important;
  border-bottom: 1px solid var(--glass-line) !important;
}
.sec-hdr-num {
  display: inline-block;
  padding: 3px 11px;
  border-radius: var(--r-pill);
  background: color-mix(in oklab, var(--copper) 14%, transparent);
  border: 1px solid color-mix(in oklab, var(--copper) 28%, transparent);
  color: var(--copper);
}

/* ============================================================ */
/* KPI tile — glass                                              */
/* ============================================================ */
.kpi {
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-line) !important;
  border-radius: var(--r-glass) !important;
  padding: 12px 14px !important;
}
.kpi:hover {
  background: var(--glass-bg-2) !important;
  border-color: var(--glass-line-2) !important;
}
.kpi-tone--copper { text-shadow: 0 0 16px color-mix(in oklab, var(--copper) 50%, transparent); }
.kpi-tone--gn { text-shadow: 0 0 16px color-mix(in oklab, var(--gn) 35%, transparent); }
.kpi-tone--rd { text-shadow: 0 0 16px color-mix(in oklab, var(--rd) 35%, transparent); }

/* ============================================================ */
/* Pills, buttons                                                */
/* ============================================================ */
.pill {
  border-radius: var(--r-pill) !important;
  padding: 2px 9px !important;
}
.btn {
  border-radius: var(--r-pill) !important;
  background: var(--glass-bg-2) !important;
  border: 1px solid var(--glass-line) !important;
}
.btn:hover {
  background: var(--glass-bg-3) !important;
  border-color: var(--glass-line-2) !important;
}
.btn--primary {
  background: color-mix(in oklab, var(--copper) 22%, transparent) !important;
  border-color: color-mix(in oklab, var(--copper) 40%, transparent) !important;
  color: var(--copper) !important;
  box-shadow: 0 0 16px color-mix(in oklab, var(--copper) 24%, transparent);
}
.btn--primary:hover {
  background: color-mix(in oklab, var(--copper) 36%, transparent) !important;
  box-shadow: 0 0 22px color-mix(in oklab, var(--copper) 36%, transparent);
}

.seg {
  border-radius: var(--r-pill) !important;
  background: var(--glass-bg-1) !important;
  border: 1px solid var(--glass-line) !important;
  padding: 2px;
  overflow: visible !important;
}
.seg-btn {
  border: none !important;
  border-right: none !important;
  border-radius: var(--r-pill) !important;
  padding: 4px 11px !important;
}
.seg-btn.is-on {
  background: color-mix(in oklab, var(--copper) 18%, transparent) !important;
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--copper) 30%, transparent);
}

/* ============================================================ */
/* Cross-Lens strip                                              */
/* ============================================================ */
.xlens {
  border: 1px solid var(--glass-line) !important;
  border-radius: var(--r-glass) !important;
  overflow: hidden;
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
.xlens-cell { border-right: 1px solid var(--glass-line) !important; }
.xlens-lead {
  background: var(--glass-bg-2) !important;
  box-shadow: inset 0 0 24px color-mix(in oklab, var(--copper) 8%, transparent);
}

/* ============================================================ */
/* Plan hero — glass strip                                       */
/* ============================================================ */
.plan-hero { padding: 16px !important; gap: 8px; background: transparent !important; border-bottom: 1px solid var(--glass-line) !important; }
.plan-hero-strip {
  gap: 8px;
  border-radius: var(--r-glass);
  overflow: hidden;
}
.plan-hero-cell {
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-line) !important;
  border-right: 1px solid var(--glass-line) !important;
  border-radius: var(--r-glass);
  padding: 14px 16px !important;
}
.plan-hero-cell--rd {
  background: linear-gradient(180deg,
    color-mix(in oklab, var(--rd) 14%, transparent),
    color-mix(in oklab, var(--rd) 4%, transparent)) !important;
  border-color: color-mix(in oklab, var(--rd) 20%, transparent) !important;
}
.plan-hero-cell--gn {
  background: linear-gradient(180deg,
    color-mix(in oklab, var(--gn) 14%, transparent),
    color-mix(in oklab, var(--gn) 4%, transparent)) !important;
  border-color: color-mix(in oklab, var(--gn) 22%, transparent) !important;
}

/* ============================================================ */
/* Hero common                                                   */
/* ============================================================ */
.hero {
  background: transparent !important;
  border-bottom: 1px solid var(--glass-line) !important;
}
.hero-verdict-tag {
  border-radius: var(--r-pill) !important;
  box-shadow: 0 0 18px color-mix(in oklab, var(--gn) 30%, transparent);
}

/* Tickets */
.ticket-grid { background: var(--glass-line) !important; border: 1px solid var(--glass-line) !important; border-radius: var(--r-glass) !important; }
.field { background: var(--glass-bg-1) !important; }
.ticket-rail {
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-line) !important;
  border-radius: var(--r-glass) !important;
}
.payoff-mini { background: var(--glass-bg-2) !important; border: 1px solid var(--glass-line) !important; border-radius: var(--r-2) !important; }
.gate {
  background: var(--glass-bg-1) !important;
  border-radius: var(--r-pill) !important;
}

/* Waterfall bars */
.wf-bar { border-radius: var(--r-pill) !important; background: var(--glass-bg-2) !important; }
.wf-fill {
  border-radius: var(--r-pill) !important;
  background: linear-gradient(90deg, var(--copper), color-mix(in oklab, var(--copper) 70%, var(--violet, var(--copper)))) !important;
  box-shadow: 0 0 10px color-mix(in oklab, var(--copper) 30%, transparent);
}

/* Inv ladder / play / cat-row — soften borders + radii */
.inv-row, .play-row, .cat-row {
  background: var(--glass-bg-1) !important;
  border: 1px solid var(--glass-line) !important;
  border-radius: var(--r-glass) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
.inv-row { border-left-width: 3px !important; }
.play-row { border-left-width: 3px !important; }
.cat-row { border-left-width: 3px !important; }

/* Indicators */
.ind-cell, .ma-row, .ma-summary, .qual-cat, .bb-col, .reg-cell, .elite-card {
  background: var(--glass-bg-1) !important;
  border: 1px solid var(--glass-line) !important;
  border-radius: var(--r-glass) !important;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
.elite-card:hover {
  background: var(--glass-bg-2) !important;
  border-color: color-mix(in oklab, var(--copper) 30%, transparent) !important;
  box-shadow: 0 0 18px color-mix(in oklab, var(--copper) 18%, transparent);
}
.reg-cell.is-current {
  background: color-mix(in oklab, var(--copper) 12%, transparent) !important;
  border-color: color-mix(in oklab, var(--copper) 35%, transparent) !important;
  box-shadow: 0 0 18px color-mix(in oklab, var(--copper) 18%, transparent);
}

/* Tables */
.dtable thead th {
  background: var(--glass-bg-1) !important;
  border-bottom: 1px solid var(--glass-line) !important;
}
.dtable tr.is-current td {
  background: color-mix(in oklab, var(--copper) 14%, transparent) !important;
  border-bottom-color: color-mix(in oklab, var(--copper) 25%, transparent) !important;
}

/* Mini chart */
.mini-chart, .big-chart-wrap svg { background: var(--glass-bg-1) !important; border: 1px solid var(--glass-line) !important; border-radius: var(--r-glass) !important; }

/* State banners */
.state--scaffold .state-banner {
  border-radius: var(--r-glass) !important;
  backdrop-filter: var(--glass-blur);
}

/* "The Call" footer with luminous accent */
.lens-call {
  background: linear-gradient(90deg,
    color-mix(in oklab, var(--copper) 14%, transparent) 0%,
    transparent 70%) !important;
  border-top: 2px solid color-mix(in oklab, var(--copper) 40%, transparent) !important;
  box-shadow: inset 0 12px 24px -12px color-mix(in oklab, var(--copper) 24%, transparent);
}

/* Market map polish */
.mm-wrap {
  border-radius: var(--r-glass) !important;
  border: 1px solid var(--glass-line) !important;
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
}

/* Time anatomy ribbon polish */
.ta-track { border-radius: var(--r-pill) !important; }
.ta-phase--pre, .ta-phase--hold { border-radius: var(--r-pill); }
.ta-event-label { border-radius: var(--r-pill) !important; background: var(--glass-bg-2) !important; border: 1px solid var(--glass-line) !important; backdrop-filter: var(--glass-blur); }
.ta-event.is-big .ta-event-dot {
  background: var(--copper);
  box-shadow: 0 0 18px var(--copper), 0 0 4px var(--copper);
}

/* Value scale */
.vh-cur-px { box-shadow: 0 0 18px color-mix(in oklab, var(--copper) 50%, transparent); }
.vh-scale-current::after { box-shadow: 0 0 18px color-mix(in oklab, var(--copper) 60%, transparent); }

/* Cap allocation bar */
.cap-bar { border-radius: var(--r-pill) !important; border: 1px solid var(--glass-line) !important; }

/* Stub */
.stub-card, .lens-stub-card {
  background: var(--glass-bg-1) !important;
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-line) !important;
  border-radius: var(--r-3) !important;
}
.stub-banner { border-radius: var(--r-glass) !important; backdrop-filter: var(--glass-blur); }


/* ===== visual-rich.css ===== */
/* SwingTrade V2 — visual richness layer
   Rich detail-panel tabs + Home view + home cards. Loaded after aurora.css. */

/* ============================================================ */
/* RICH DETAIL TABS                                              */
/* ============================================================ */
.dp-tabs {
  padding: 0 8px !important;
  background: transparent !important;
}
.dp-tabs-scroll {
  display: flex !important;
  gap: 4px !important;
  padding: 6px 0 !important;
  overflow-x: auto;
  scrollbar-width: thin;
}
.dp-tab {
  display: inline-flex !important;
  align-items: center !important;
  gap: 7px !important;
  padding: 6px 11px 6px 9px !important;
  border-radius: var(--r-pill) !important;
  background: var(--glass-bg-1) !important;
  border: 1px solid var(--glass-line) !important;
  color: var(--ink-2) !important;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  white-space: nowrap;
  flex-shrink: 0;

}

}
.dp-tab-icon svg {
  width: 14px; height: 14px;
}
.dp-tab-num {
  font-size: 9px;
  color: var(--ink-3);
  opacity: 0.7;
  font-weight: 500;
  letter-spacing: 0.04em;
}
.dp-tab-label {
  font-size: 10.5px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
}
.dp-tab-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--ink-3);
  opacity: 0.6;
}
.dp-tab-dot--gn  { background: var(--gn); box-shadow: 0 0 6px color-mix(in oklab, var(--gn) 50%, transparent); }
.dp-tab-dot--amb { background: var(--amb); box-shadow: 0 0 6px color-mix(in oklab, var(--amb) 50%, transparent); }
.dp-tab-dot--rd  { background: var(--rd); box-shadow: 0 0 6px color-mix(in oklab, var(--rd) 50%, transparent); }
.dp-tab-kbd {

  border: 1px solid var(--glass-line) !important;
  color: var(--ink-3) !important;
  font-size: 9px !important;
  padding: 0 5px !important;
}

.dp-tab:hover {
  background: var(--glass-bg-2) !important;
  border-color: var(--glass-line-2) !important;
  color: var(--ink-1) !important;
}
.dp-tab:hover .dp-tab-icon { color: var(--ink-1); }

/* Per-lens accent on active state */
.dp-tab.is-on {
  background: color-mix(in oklab, var(--accent, var(--copper)) 14%, transparent) !important;
  color: var(--accent, var(--copper)) !important;
  border-color: color-mix(in oklab, var(--accent, var(--copper)) 40%, transparent) !important;
  box-shadow:
    inset 0 0 0 1px color-mix(in oklab, var(--accent, var(--copper)) 28%, transparent),
    0 0 18px color-mix(in oklab, var(--accent, var(--copper)) 24%, transparent);
}
.dp-tab.is-on .dp-tab-icon { color: var(--accent, var(--copper)); }
.dp-tab.is-on .dp-tab-num { color: var(--accent, var(--copper)); opacity: 1; }
.dp-tab.is-on .dp-tab-kbd { color: var(--accent, var(--copper)) !important; border-color: color-mix(in oklab, var(--accent, var(--copper)) 30%, transparent) !important; }

.dp-tab--copper { --accent: var(--copper); }
.dp-tab--cy     { --accent: var(--cy); }
.dp-tab--violet { --accent: var(--violet); }
.dp-tab--blue   { --accent: var(--blue); }
.dp-tab--gn     { --accent: var(--gn); }
.dp-tab--amb    { --accent: var(--amb); }
.dp-tab--rd     { --accent: var(--rd); }

/* Hide label at very narrow widths */
.dpanel--S .dp-tab-label { display: none; }

/* ============================================================ */
/* HOME · landing view                                           */
/* ============================================================ */
.main-home {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 24px;
}
.home {
  display: flex; flex-direction: column;
  gap: 16px;
  width: 100%;
}

/* Home hero strip */
.home-hero {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 18px;
  padding: 18px 22px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-3);
  backdrop-filter: var(--glass-blur);
}
.hh-eyebrow {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.hh-title {
  margin: 6px 0 0;
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 0.02em;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: baseline;
}
.hh-title span:first-child {
  color: var(--ink);
  text-shadow: 0 0 18px color-mix(in oklab, var(--copper) 35%, transparent);
}
.hh-sep { color: var(--ink-4); font-weight: 400; }
.hh-line { font-size: 12px; margin-top: 8px; line-height: 1.5; max-width: 80ch; }
.hh-stats {

  grid-template-columns: repeat(3, 1fr);
  gap: 10px 18px;
