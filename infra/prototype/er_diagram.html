<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SwingTrade — Supabase ER Diagram (Restructure Plan)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0b0f17;
    --bg-2: #11161f;
    --bg-3: #161c27;
    --line: #1f2733;
    --line-2: #2a3445;
    --text: #d8dee9;
    --muted: #8a94a6;
    --accent: #5ab0ff;
    --accent-2: #ffb454;
    --green: #7bd88f;
    --red: #ff7a7a;
    --yellow: #ffd866;
    --purple: #c896ff;
    --pink: #ff86c8;
    --cyan: #5be4cf;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; }
  body { min-height: 100vh; }

  header.topbar {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(180deg, #0d121b 0%, #0b0f17 100%);
    border-bottom: 1px solid var(--line);
    padding: 10px 18px; display: flex; align-items: center; gap: 14px;
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .grow { flex: 1; }
  header input.search {
    width: 320px; background: var(--bg-3); border: 1px solid var(--line-2);
    color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none;
  }
  header input.search:focus { border-color: var(--accent); }
  header .stat { color: var(--muted); font-size: 11px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; }
  header .stat b { color: var(--text); font-weight: 600; }

  .layout { display: grid; grid-template-columns: 240px 1fr 320px; min-height: calc(100vh - 49px); }

  aside.sidebar { background: var(--bg-2); border-right: 1px solid var(--line); padding: 12px 0; overflow-y: auto; max-height: calc(100vh - 49px); position: sticky; top: 49px; }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin: 8px 14px 6px; font-weight: 600; }
  aside .domain {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px; cursor: pointer; font-size: 12px;
    border-left: 3px solid transparent;
  }
  aside .domain:hover { background: var(--bg-3); }
  aside .domain.active { background: var(--bg-3); border-left-color: var(--accent); }
  aside .domain .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  aside .domain .name { flex: 1; }
  aside .domain .count { color: var(--muted); font-size: 10px; }

  main.canvas { padding: 16px 18px; overflow-y: auto; max-height: calc(100vh - 49px); }

  .domain-section { margin-bottom: 24px; }
  .domain-section h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .domain-section h2 .dot { width: 10px; height: 10px; border-radius: 50%; }
  .domain-section h2 .blurb { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

  .table-card {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; cursor: pointer; transition: border-color .12s, transform .12s;
    display: flex; flex-direction: column;
  }
  .table-card:hover { border-color: var(--line-2); }
  .table-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .table-card.hit { border-color: var(--yellow); }

  .table-card .head {
    padding: 8px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 6px;
  }
  .table-card .head .domain-dot { width: 6px; height: 6px; border-radius: 50%; }
  .table-card .head .name { font-weight: 600; font-size: 12px; flex: 1; }
  .table-card .head .badge {
    font-size: 9px; padding: 2px 5px; border-radius: 3px; background: var(--bg-3);
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .table-card .head .badge.new { color: var(--green); border: 1px solid rgba(123,216,143,.3); }
  .table-card .head .badge.exist { color: var(--accent); border: 1px solid rgba(90,176,255,.3); }
  .table-card .head .field-count { color: var(--muted); font-size: 10px; margin-left: 4px; }

  .table-card .body { padding: 4px 0; font-size: 11px; }
  .table-card .field {
    padding: 3px 10px; display: flex; align-items: center; gap: 6px;
    border-top: 1px solid transparent;
  }
  .table-card .field:hover { background: var(--bg-3); }
  .table-card .field .key {
    width: 22px; font-size: 9px; color: var(--muted); text-align: left;
  }
  .table-card .field .key.pk { color: var(--accent-2); font-weight: 700; }
  .table-card .field .key.fk { color: var(--accent); font-weight: 700; }
  .table-card .field .key.uq { color: var(--purple); font-weight: 700; }
  .table-card .field .key.idx { color: var(--cyan); font-weight: 600; }
  .table-card .field .name { flex: 1; }
  .table-card .field .type { color: var(--muted); font-size: 10px; font-family: ui-monospace, Menlo, monospace; }
  .table-card .field.hit { background: rgba(255,216,102,.08); }
  .table-card .field.hit .name { color: var(--yellow); }

  .table-card .more {
    padding: 5px 10px; color: var(--muted); font-size: 10px; cursor: pointer;
    border-top: 1px solid var(--line); text-align: center;
  }
  .table-card .more:hover { color: var(--text); background: var(--bg-3); }

  aside.detail {
    background: var(--bg-2); border-left: 1px solid var(--line);
    padding: 14px; overflow-y: auto; max-height: calc(100vh - 49px);
    position: sticky; top: 49px;
  }
  aside.detail .empty { color: var(--muted); font-size: 12px; padding: 8px; text-align: center; }
  aside.detail h3 { margin: 0 0 4px; font-size: 14px; }
  aside.detail .domain-tag {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: var(--bg-3); margin-bottom: 8px;
  }
  aside.detail .blurb { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
  aside.detail .section { margin-bottom: 16px; }
  aside.detail .section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  aside.detail .field-row {
    display: flex; align-items: center; gap: 8px; padding: 3px 0;
    border-bottom: 1px dotted var(--line); font-size: 11px;
  }
  aside.detail .field-row .key { width: 24px; font-size: 9px; }
  aside.detail .field-row .key.pk { color: var(--accent-2); font-weight: 700; }
  aside.detail .field-row .key.fk { color: var(--accent); font-weight: 700; }
  aside.detail .field-row .key.uq { color: var(--purple); font-weight: 700; }
  aside.detail .field-row .key.idx { color: var(--cyan); }
  aside.detail .field-row .name { flex: 1; }
  aside.detail .field-row .type { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
  aside.detail .rel-row {
    display: flex; flex-direction: column; padding: 6px 8px; margin-bottom: 4px;
    border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 11px;
  }
  aside.detail .rel-row:hover { border-color: var(--accent); background: var(--bg-3); }
  aside.detail .rel-row .arrow { color: var(--accent); margin: 0 6px; }
  aside.detail .rel-row .relkind { color: var(--muted); font-size: 10px; }

  aside.detail .source {
    background: var(--bg-3); border-radius: 4px; padding: 6px 8px;
    font-size: 11px; color: var(--muted); margin-bottom: 4px;
  }
  aside.detail .source b { color: var(--text); }

  .modeswitch { display: flex; gap: 4px; }
  .modeswitch button {
    background: var(--bg-3); color: var(--muted); border: 1px solid var(--line);
    padding: 5px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;
  }
  .modeswitch button.active { background: var(--accent); color: #001020; border-color: var(--accent); font-weight: 600; }
  .modeswitch button:hover:not(.active) { color: var(--text); }

  .legend {
    display: flex; gap: 12px; font-size: 10px; color: var(--muted); align-items: center;
  }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend b { font-weight: 700; }

  .hidden { display: none !important; }

  .scroll-pad { height: 100px; }

  .empty-state {
    text-align: center; color: var(--muted); padding: 40px 20px;
    border: 1px dashed var(--line); border-radius: 6px;
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #38445a; }
</style>
</head>
<body>

<header class="topbar">
  <h1>SwingTrade ER · <span class="sub">Supabase restructure plan</span></h1>
  <input class="search" id="searchBox" placeholder="Search tables, fields, sources…" />
  <div class="modeswitch">
    <button id="mode-all" class="active">All</button>
    <button id="mode-new">New only</button>
    <button id="mode-exist">Migrated only</button>
  </div>
  <div class="grow"></div>
  <div class="legend">
    <span><b style="color:var(--accent-2)">PK</b> primary</span>
    <span><b style="color:var(--accent)">FK</b> foreign</span>
    <span><b style="color:var(--purple)">UQ</b> unique</span>
    <span><b style="color:var(--cyan)">IX</b> index</span>
  </div>
  <span class="stat">Tables: <b id="stat-tables">0</b></span>
  <span class="stat">Fields: <b id="stat-fields">0</b></span>
  <span class="stat">FKs: <b id="stat-fks">0</b></span>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h3>Domains</h3>
    <div id="domain-list"></div>
    <h3 style="margin-top:16px">Migration source</h3>
    <div class="domain" data-filter="src:sqlite">
      <span class="dot" style="background:var(--accent)"></span>
      <span class="name">SQLite (existing)</span>
      <span class="count" id="count-sqlite">0</span>
    </div>
    <div class="domain" data-filter="src:json">
      <span class="dot" style="background:var(--yellow)"></span>
      <span class="name">JSON sidecars</span>
      <span class="count" id="count-json">0</span>
    </div>
    <div class="domain" data-filter="src:new">
      <span class="dot" style="background:var(--green)"></span>
      <span class="name">New (restructure)</span>
      <span class="count" id="count-new">0</span>
    </div>
    <div class="domain" data-filter="src:cache">
      <span class="dot" style="background:var(--cyan)"></span>
      <span class="name">Cache file</span>
      <span class="count" id="count-cache">0</span>
    </div>
  </aside>

  <main class="canvas" id="canvas"></main>

  <aside class="detail" id="detail">
    <div class="empty">Click a table to inspect.<br/>Click a field to see relationships.</div>
  </aside>
</div>

<script>
/* ============================================================================
   SwingTrade Supabase ER Schema — embedded as data
   ============================================================================
   Each table:
     { id, domain, label, source, kind, blurb, fields: [{name, type, key, ref, note}], rels: [...] }
   key ∈ pk|fk|uq|idx|null  ; ref = "other_table.column" (for FK)
   source ∈ sqlite|json|cache|new ; kind ∈ existing|new|wide|narrow
   ============================================================================ */

const DOMAINS = [
  { id:'core',          label:'1 · Core (ticker · run)',           color:'#5ab0ff', blurb:'Master entities — everything else hangs off these.' },
  { id:'analysis',      label:'2 · Ticker analysis (per-run snapshot)', color:'#ffb454', blurb:'One row per (run × ticker). Verdict/score/setup, narrow header table.' },
  { id:'tradeplan',     label:'3 · Trade plan',                    color:'#c896ff', blurb:'Canonical entries / stops / targets / zones (K6 single-source-of-truth).' },
  { id:'technicals',    label:'4 · Technicals',                    color:'#5be4cf', blurb:'EMA / momentum / volatility / patterns / volume — decomposed by category.' },
  { id:'smc',           label:'5 · SMC (Smart Money Concepts)',    color:'#ff86c8', blurb:'Order blocks, FVG zones, BoS/CHoCH, liquidity sweeps.' },
  { id:'wave',          label:'6 · Elliott Wave + Theory',         color:'#a3e635', blurb:'Wave classification + Dow/Wyckoff/Gann theory confluence.' },
  { id:'fundamentals',  label:'7 · Fundamentals (slow-changing)',  color:'#7bd88f', blurb:'Per-ticker (NOT per-run). Refreshed daily. Analyst estimates, ratios, growth.' },
  { id:'options',       label:'8 · Options · IV · UOA',            color:'#ffd866', blurb:'IV/skew/PCR/gamma/max-pain + UOA detection (Schwab Trader API).' },
  { id:'smartmoney',    label:'9 · Smart money',                   color:'#f97316', blurb:'Insiders, congressional, institutional ownership, SEC filings.' },
  { id:'sentiment',     label:'10 · Sentiment & news',             color:'#a78bfa', blurb:'News articles, StockTwits, Reddit/WSB, aggregated scores.' },
  { id:'zacks',         label:'11 · Zacks',                        color:'#22d3ee', blurb:'Zacks Rank #1, VGM grades, gmail premium-service mentions.' },
  { id:'risk',          label:'12 · Risk · sizing',                color:'#ef4444', blurb:'Kelly stack, Monte Carlo P(profit), CVaR, drawdown/regime/VIX mults.' },
  { id:'signals',       label:'13 · Tier-1 signals · MTF',         color:'#84cc16', blurb:'NR7, insider clusters, OBV divergence, multi-timeframe alignment.' },
  { id:'earnings',      label:'14 · Earnings',                     color:'#ec4899', blurb:'Calendar → predictions → outcomes. FK chain currently missing.' },
  { id:'ohlcv',         label:'15 · OHLCV · bars',                 color:'#94a3b8', blurb:'Daily/intraday price history. Source-of-truth for backtests.' },
  { id:'decision',      label:'16 · Decision log · audit',         color:'#f59e0b', blurb:'Every verdict for every scanned ticker (incl AVOIDS) — 33MB JSONL today.' },
  { id:'portfolio',     label:'17 · Portfolio · trades',           color:'#10b981', blurb:'Open positions, closed trades, equity curve, Alpaca sync.' },
  { id:'governance',    label:'18 · Governance · RBAC · config',   color:'#64748b', blurb:'Capability registry, roles, config snapshots, open-items registry.' },
];

const TABLES = [
  // ===== 1. CORE =====
  { id:'tickers', domain:'core', label:'tickers', source:'new', kind:'new',
    blurb:'Master ticker registry. One row per symbol. Slow-changing identity.',
    fields:[
      {name:'ticker', type:'text', key:'pk'},
      {name:'name', type:'text'},
      {name:'sector', type:'text', key:'idx'},
      {name:'industry', type:'text', key:'idx'},
      {name:'beta', type:'numeric'},
      {name:'market_cap', type:'numeric'},
      {name:'shares_out', type:'bigint'},
      {name:'is_active', type:'bool', note:'For survivorship-bias-safe historical snapshots'},
      {name:'first_seen', type:'timestamptz'},
      {name:'last_seen', type:'timestamptz', key:'idx'},
      {name:'in_sp500', type:'bool'},
      {name:'in_r1000', type:'bool'},
      {name:'in_r2000', type:'bool'},
      {name:'is_custom', type:'bool'},
    ]
  },
  { id:'runs', domain:'core', label:'runs', source:'sqlite', kind:'existing',
    blurb:'Daily scan execution. One row per swing_trade.py invocation.',
    fields:[
      {name:'id', type:'bigint', key:'pk'},
      {name:'run_date', type:'date', key:'uq'},
      {name:'run_time', type:'timestamptz'},
      {name:'regime', type:'text', note:'bull/neutral/bear (legacy 3-class)'},
      {name:'regime4', type:'text', note:'risk_on_trending/choppy/risk_off/panic'},
      {name:'market_phase', type:'text', note:'Trend/Late Bull/Correction/Bear'},
      {name:'vix', type:'numeric'},
      {name:'breadth_pct_above_50d', type:'numeric'},
      {name:'spy_above_ema50', type:'bool'},
      {name:'total_scanned', type:'int'},
      {name:'total_passed', type:'int'},
      {name:'num_picks', type:'int'},
      {name:'evaluated', type:'int'},
      {name:'config_snapshot_hash', type:'text', key:'fk', ref:'config_snapshots.hash'},
      {name:'git_commit', type:'text'},
      {name:'duration_sec', type:'numeric'},
      {name:'data_health_json', type:'jsonb'},
    ]
  },
  { id:'regime_history', domain:'core', label:'regime_history', source:'cache', kind:'new',
    blurb:'Historical regime classifications. Flip dates with hysteresis state.',
    fields:[
      {name:'id', type:'bigint', key:'pk'},
      {name:'observed_at', type:'timestamptz', key:'idx'},
      {name:'regime3', type:'text', note:'bull/neutral/bear'},
      {name:'regime4', type:'text'},
      {name:'flip_confirmed_date', type:'date'},
      {name:'pending_flip_json', type:'jsonb'},
      {name:'confidence_json', type:'jsonb', note:'regime_confidence dict (10 scores)'},
    ]
  },

  // ===== 2. ANALYSIS (per-run × ticker snapshot) =====
  { id:'ticker_analyses', domain:'analysis', label:'ticker_analyses', source:'new', kind:'wide',
    blurb:'CENTRAL FACT TABLE. One row per (run × ticker). All sub-tables point here.',
    fields:[
      {name:'id', type:'bigint', key:'pk'},
      {name:'run_id', type:'bigint', key:'fk', ref:'runs.id'},
      {name:'ticker', type:'text', key:'fk', ref:'tickers.ticker'},
      {name:'analyzed_at', type:'timestamptz'},
      {name:'verdict', type:'text', note:'BUY/WATCH/SHORT/AVOID — check constraint'},
      {name:'direction', type:'text', note:'long/short/neutral'},
      {name:'price', type:'numeric'},
      {name:'score', type:'int', note:'Normalized 0-100 (post-multiplier)'},
      {name:'score_raw', type:'numeric'},
      {name:'star_rating', type:'int'},
      {name:'setup_family', type:'text', note:'Breakout Expansion / Trend Continuation / Impulse / Special'},
      {name:'setup_type', type:'text', note:'VCP Breakout / Pocket Pivot / EMA21 Pullback…'},
      {name:'catalyst_tier', type:'int', note:'1/2/3'},
      {name:'entry_quality', type:'text', note:'FRESH/PULLBACK/VALID/EXTENDED/MISSED'},
      {name:'entry_subtype', type:'text'},
      {name:'entry_timing', type:'text', note:'Fresh/Late/Missed'},
      {name:'hold_period_guide', type:'text', note:'5-8d / 7-21d / 5-15d'},
      {name:'conviction_tier', type:'text', note:'T1/T2/T3/WATCH'},
      {name:'reject_reason', type:'text'},
      {name:'ticker_source', type:'text', note:'sp500/r1000/r2000/custom/zacks_r1'},
      {name:'sector_pct_rank', type:'numeric'},
      {name:'rs_rank', type:'int'},
      {name:'rs_63d_pct', type:'numeric'},
      {name:'mtf_conflict', type:'bool'},
      {name:'mtf_label', type:'text'},
      {name:'unique_run_ticker', type:'(run_id, ticker)', key:'uq'},
    ],
    rels:[
      {from:'run_id', to:'runs.id', kind:'N:1'},
      {from:'ticker', to:'tickers.ticker', kind:'N:1'},
    ]
  },
  { id:'analysis_pricing', domain:'analysis', label:'analysis_pricing', source:'new', kind:'narrow',
    blurb:'Pricing snapshot at analysis time. 1:1 with ticker_analyses.',
    fields:[
      {name:'analysis_id', type:'bigint', key:'pk', ref:'ticker_analyses.id'},
      {name:'price', type:'numeric'},
      {name:'prev_close', type:'numeric'},
      {name:'day_change_pct', type:'numeric'},
      {name:'volume', type:'bigint'},
      {name:'avg_volume_20d', type:'bigint'},
      {name:'rvol', type:'numeric'},
      {name:'atr', type:'numeric'},
      {name:'atr_pct', type:'numeric'},
      {name:'price_tier', type:'text', note:'$1–$25 / $25–$100 / $100–$250'},
      {name:'quote_age_s', type:'int'},
      {name:'spread_bp', type:'numeric'},
      {name:'post_market_pct', type:'numeric'},
    ]
  },
  { id:'analysis_scoring', domain:'analysis', label:'analysis_scoring', source:'new', kind:'narrow',
    blurb:'5-pillar score breakdown + multipliers + bonuses. 1:1 with ticker_analyses.',
    fields:[
      {name:'analysis_id', type:'bigint', key:'pk', ref:'ticker_analyses.id'},
      {name:'tech_score', type:'numeric', note:'Technicals pillar (max 35)'},
      {name:'cat_score', type:'numeric', note:'Catalyst pillar (max 20)'},
      {name:'rs_score', type:'numeric', note:'RS+Sector pillar (max 20)'},
      {name:'sm_score', type:'numeric', note:'Smart Money pillar (max 15)'},
      {name:'qg_score', type:'numeric', note:'Quality Gate pillar (max 10)'},
      {name:'raw_total', type:'numeric'},
      {name:'wr_multiplier', type:'numeric', note:'Win-rate-based multiplier from picks_history'},
      {name:'bonus_total', type:'numeric'},
      {name:'entry_rr_score', type:'numeric'},
      {name:'final_score', type:'numeric'},
      {name:'raw_score', type:'int'},
      {name:'raw_momentum_score', type:'numeric'},
      {name:'raw_growth_score', type:'numeric'},
      {name:'raw_value_score', type:'numeric'},
      {name:'sizing_multiplier', type:'numeric'},
    ]
  },
  { id:'analysis_verdict', domain:'analysis', label:'analysis_verdict', source:'new', kind:'narrow',
    blurb:'Decision-engine output: verdict, decided_by, audit, hard gates, decision_state.',
    fields:[
      {name:'analysis_id', type:'bigint', key:'pk', ref:'ticker_analyses.id'},
      {name:'verdict', type:'text'},
      {name:'reject_reason', type:'text'},
      {name:'decided_by', type:'text', note:'decision_engine.compute_final_verdict'},
      {name:'hard_gates_passed', type:'bool'},
      {name:'decision_state', type:'text', note:'FRESH/PULLBACK/VALID/EXTENDED/MISSED'},
      {name:'decision_label', type:'text'},
      {name:'in_cloud', type:'bool'},
      {name:'no_edge_zone', type:'bool'},
      {name:'momentum_slowdown', type:'bool'},
      {name:'size_mult_by_zone', type:'numeric'},
      {name:'caveats_json', type:'jsonb'},
    ]
  },
  { id:'analysis_conviction', domain:'analysis', label:'analysis_conviction', source:'new', kind:'narrow',
    blurb:'Conviction tier + size multiplier (T1=full, T2=30-60%, T3=15-30%, WATCH=0).',
    fields:[
      {name:'analysis_id', type:'bigint', key:'pk', ref:'ticker_analyses.id'},
      {name:'tier', type:'int'},
      {name:'label', type:'text', note:'T1/T2/T3/WATCH'},
      {name:'size_mult', type:'numeric'},
      {name:'description', type:'text'},
      {name:'wr_size_adj', type:'text'},
    ]
  },
  { id:'analysis_gates', domain:'analysis', label:'analysis_gates', source:'new', kind:'new',
    blurb:'8-gate cascade results — 1 row per gate per analysis.',
    fields:[

/* ========================================================================
   Build & render
   ======================================================================== */

const SOURCE_COLOR = {
  sqlite: 'var(--accent)',
  json:   'var(--yellow)',
  cache:  'var(--cyan)',
  new:    'var(--green)',
};

const state = {
  activeDomain: null,
  activeSource: null,
  search: '',
  mode: 'all',
  selectedTable: null,
};

function domainById(id) { return DOMAINS.find(d => d.id === id) || { color: '#888', label: id }; }

function fieldsCount() {
  return TABLES.reduce((n, t) => n + t.fields.length, 0);
}
function fksCount() {
  return TABLES.reduce((n, t) => n + t.fields.filter(f => f.key === 'fk').length, 0);
}

function renderSidebar() {
  const list = document.getElementById('domain-list');
  list.innerHTML = '';
  for (const d of DOMAINS) {
    const cnt = TABLES.filter(t => t.domain === d.id).length;
    const div = document.createElement('div');
    div.className = 'domain' + (state.activeDomain === d.id ? ' active' : '');
    div.innerHTML = `<span><span class="dot" style="background:${d.color}"></span><span class="name">${d.label}</span></span><span class="count">${cnt}</span>`;
    div.onclick = () => {
      state.activeDomain = state.activeDomain === d.id ? null : d.id;
      state.activeSource = null;
      renderAll();
    };
    list.appendChild(div);
  }
  // source counts
  document.getElementById('count-sqlite').textContent = TABLES.filter(t => t.source === 'sqlite').length;
  document.getElementById('count-json').textContent   = TABLES.filter(t => t.source === 'json').length;
  document.getElementById('count-cache').textContent  = TABLES.filter(t => t.source === 'cache').length;
  document.getElementById('count-new').textContent    = TABLES.filter(t => t.source === 'new').length;

  // attach source-filter handlers (idempotent)
  document.querySelectorAll('aside.sidebar > .domain[data-filter]').forEach(el => {
    const k = el.dataset.filter.split(':')[1];
    el.classList.toggle('active', state.activeSource === k);
    el.onclick = () => {
      state.activeSource = state.activeSource === k ? null : k;
      state.activeDomain = null;
      renderAll();
    };
  });
}

function matchSearch(t) {
  if (!state.search) return { tableHit: true, fieldHits: [] };
  const q = state.search.toLowerCase();
  const inTable = t.label.toLowerCase().includes(q) || (t.blurb || '').toLowerCase().includes(q);
  const fieldHits = t.fields.filter(f =>
    f.name.toLowerCase().includes(q) ||
    (f.type || '').toLowerCase().includes(q) ||
    (f.note || '').toLowerCase().includes(q)
  ).map(f => f.name);
  return { tableHit: inTable || fieldHits.length > 0, fieldHits };
}

function tableVisible(t) {
  if (state.activeDomain && t.domain !== state.activeDomain) return false;
  if (state.activeSource && t.source !== state.activeSource) return false;
  if (state.mode === 'new' && t.kind === 'existing') return false;
  if (state.mode === 'exist' && t.kind !== 'existing') return false;
  if (state.search && !matchSearch(t).tableHit) return false;
  return true;
}

function renderCanvas() {
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';
  const visibleDomains = DOMAINS.filter(d => TABLES.some(t => t.domain === d.id && tableVisible(t)));
  if (visibleDomains.length === 0) {
    canvas.innerHTML = `<div class="empty-state">No tables match.</div>`;
    return;
  }
  for (const d of visibleDomains) {
    const section = document.createElement('section');
    section.className = 'domain-section';
    section.innerHTML = `
      <h2>
        <span class="dot" style="background:${d.color}"></span>
        <span>${d.label}</span>
        <span class="blurb">${d.blurb}</span>
      </h2>
      <div class="grid" id="grid-${d.id}"></div>
    `;
    canvas.appendChild(section);
    const grid = section.querySelector('.grid');
    for (const t of TABLES.filter(t => t.domain === d.id && tableVisible(t))) {
      grid.appendChild(buildCard(t, d));
    }
  }
  canvas.appendChild(Object.assign(document.createElement('div'), { className: 'scroll-pad' }));
}

function buildCard(t, d) {
  const card = document.createElement('div');
  card.className = 'table-card';
  if (state.selectedTable === t.id) card.classList.add('selected');
  const m = matchSearch(t);
  if (state.search && m.tableHit) card.classList.add('hit');

  const badgeClass = t.kind === 'existing' ? 'exist' : 'new';
  const badgeText = t.source === 'sqlite' ? 'SQLite' :
                    t.source === 'json'   ? 'JSON'  :
                    t.source === 'cache'  ? 'Cache' : 'New';

  card.innerHTML = `
    <div class="head">
      <span class="domain-dot" style="background:${d.color}"></span>
      <span class="name">${t.label}</span>
      <span class="field-count">· ${t.fields.length} fields</span>
      <span class="badge ${badgeClass}">${badgeText}</span>
    </div>
    <div class="body"></div>
  `;
  const body = card.querySelector('.body');
  const fieldsToShow = state.selectedTable === t.id ? t.fields : t.fields.slice(0, 5);
  for (const f of fieldsToShow) {
    const row = document.createElement('div');
    row.className = 'field';
    const keyTxt = f.key ? f.key.toUpperCase() : '';
    const keyClass = f.key ? ` ${f.key}` : '';
    if (state.search && m.fieldHits.includes(f.name)) row.classList.add('hit');
    row.innerHTML = `
      <span class="key${keyClass}">${keyTxt}</span>
      <span class="name">${f.name}</span>
      <span class="type">${f.type || ''}</span>
    `;
    body.appendChild(row);
  }
  if (t.fields.length > fieldsToShow.length) {
    const more = document.createElement('div');
    more.className = 'more';
    more.textContent = `+ ${t.fields.length - fieldsToShow.length} more · click to expand`;
    card.appendChild(more);
  } else if (state.selectedTable === t.id && t.fields.length > 5) {
    const less = document.createElement('div');
    less.className = 'more';
    less.textContent = 'collapse';
    card.appendChild(less);
  }
  card.onclick = () => {
    state.selectedTable = state.selectedTable === t.id ? null : t.id;
    renderAll();
  };
  return card;
}

function renderDetail() {
  const det = document.getElementById('detail');
  if (!state.selectedTable) {
    det.innerHTML = `<div class="empty">Click a table to inspect.<br/>Click a field to see relationships.</div>`;
    return;
  }
  const t = TABLES.find(x => x.id === state.selectedTable);
  if (!t) { det.innerHTML = `<div class="empty">Not found.</div>`; return; }
  const d = domainById(t.domain);
  const badgeText = t.source === 'sqlite' ? 'SQLite (existing)' :
                    t.source === 'json'   ? 'JSON sidecar (existing)' :
                    t.source === 'cache'  ? 'Cache file (existing)' : 'New (restructure)';

  // FKs OUT (this table → others)
  const out = t.fields.filter(f => f.key === 'fk' && f.ref);
  // FKs IN (other tables → this table)
  const inbound = [];
  for (const other of TABLES) {
    for (const f of other.fields) {
      if (f.key === 'fk' && f.ref && f.ref.startsWith(t.id + '.')) {
        inbound.push({ from: other, field: f });
      }
    }
  }

  let html = `
    <h3>${t.label}</h3>
    <div class="domain-tag" style="background:${d.color}22; color:${d.color}">${d.label}</div>
    <div class="blurb">${t.blurb || ''}</div>
    <div class="source"><b>Source:</b> ${badgeText}</div>

    <div class="section">
      <h4>Fields (${t.fields.length})</h4>
      ${t.fields.map(f => `
        <div class="field-row">
          <span class="key ${f.key || ''}">${(f.key || '').toUpperCase()}</span>
          <span class="name" title="${(f.note || '').replace(/"/g,'&quot;')}">${f.name}${f.note ? ` <small style="color:var(--muted)">· ${f.note}</small>` : ''}</span>
          <span class="type">${f.type || ''}</span>
        </div>
      `).join('')}
    </div>
  `;

  if (out.length) {
    html += `<div class="section"><h4>References ↗ (FK OUT)</h4>`;
    for (const f of out) {
      const refTbl = f.ref.split('.')[0];
      html += `<div class="rel-row" data-jump="${refTbl}">
        <div><b>${f.name}</b> <span class="arrow">→</span> ${f.ref}</div>
        <div class="relkind">N:1 ${f.note ? '· ' + f.note : ''}</div>
      </div>`;
    }
    html += `</div>`;
  }
  if (inbound.length) {
    html += `<div class="section"><h4>Referenced by ↙ (FK IN, ${inbound.length})</h4>`;
    for (const r of inbound) {
      html += `<div class="rel-row" data-jump="${r.from.id}">
        <div><b>${r.from.label}</b>.${r.field.name} <span class="arrow">→</span> ${t.label}</div>
        <div class="relkind">1:N ${r.field.note ? '· ' + r.field.note : ''}</div>
      </div>`;
    }
    html += `</div>`;
  }

  det.innerHTML = html;
  det.querySelectorAll('.rel-row[data-jump]').forEach(el => {
    el.onclick = () => {
      state.selectedTable = el.dataset.jump;
      renderAll();
      // scroll the card into view
      setTimeout(() => {
        const card = document.querySelector('.table-card.selected');
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 50);
    };
  });
}

function renderAll() {
  renderSidebar();
  renderCanvas();
  renderDetail();
  document.getElementById('stat-tables').textContent = TABLES.filter(tableVisible).length + ' / ' + TABLES.length;
  document.getElementById('stat-fields').textContent = fieldsCount();
  document.getElementById('stat-fks').textContent = fksCount();
}

document.getElementById('searchBox').addEventListener('input', e => {
  state.search = e.target.value.trim();
  renderAll();
});
['all','new','exist'].forEach(m => {
  document.getElementById('mode-' + m).onclick = () => {
    state.mode = m;
    document.querySelectorAll('.modeswitch button').forEach(b => b.classList.remove('active'));
    document.getElementById('mode-' + m).classList.add('active');
    renderAll();
  };
});

renderAll();
</script>
</body>
</html>
