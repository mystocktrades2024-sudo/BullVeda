function EoOIByStrike() {
  const w = 280, h = 150;
  const strikes = ["−8%", "−6%", "−4%", "−2%", "spot", "+2%", "+4%", "+6%", "+8%"];
  const callOI = [180, 240, 320, 460, 720, 880, 540, 380, 240];
  const putOI = [380, 560, 720, 920, 1100, 580, 360, 240, 160];
  const max = Math.max(...callOI, ...putOI);
  const slotW = w / strikes.length;
  return (
    <svg width="100%" height={h} viewBox={"0 0 " + w + " " + h} preserveAspectRatio="none" style={{ overflow: "visible" }}>
      <line x1="0" y1={h / 2} x2={w} y2={h / 2} stroke="var(--glass-line)" />
      {strikes.map((s, i) => {
        const cx = i * slotW + slotW / 2;
        const cH = (callOI[i] / max) * (h / 2 - 6);
        const pH = (putOI[i] / max) * (h / 2 - 6);
        const isATM = s === "spot";
        return (
          <g key={i}>
            <rect x={cx - slotW * 0.35} y={h / 2 - cH} width={slotW * 0.7} height={cH}
                  fill="var(--gn)" opacity={isATM ? "1" : "0.5"}
                  style={isATM ? { filter: "drop-shadow(0 0 6px var(--gn))" } : null} />
            <rect x={cx - slotW * 0.35} y={h / 2} width={slotW * 0.7} height={pH}
                  fill="var(--rd)" opacity={isATM ? "1" : "0.5"}
                  style={isATM ? { filter: "drop-shadow(0 0 6px var(--rd))" } : null} />
            <text x={cx} y={h - 2} fontSize="8.5" className="mono" textAnchor="middle"
                  fill={isATM ? "var(--copper)" : "var(--ink-3)"}>{s}</text>
          </g>
        );
      })}
      <text x={4} y={12} fontSize="9" className="mono" fill="var(--gn)">← CALL OI</text>
      <text x={w - 4} y={h - 16} fontSize="9" className="mono" textAnchor="end" fill="var(--rd)">PUT OI →</text>
    </svg>
  );
}

function EoGammaProfile() {
  const w = 280, h = 150;
  const xs = [];
  for (let i = 0; i < 60; i++) {
    const p = -1 + i / 30;
    const g = Math.exp(-p * p * 2) * (p > 0 ? -1 : 1);
    xs.push([i * (w / 60), h / 2 - g * (h / 2 - 12)]);
  }
  return (
    <svg width="100%" height={h} viewBox={"0 0 " + w + " " + h} preserveAspectRatio="none" style={{ overflow: "visible" }}>
      <defs>
        <linearGradient id="eo-gp-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--gn)" stopOpacity="0.30" />
          <stop offset="50%" stopColor="transparent" />
          <stop offset="100%" stopColor="var(--rd)" stopOpacity="0.30" />
        </linearGradient>
      </defs>
      <line x1="0" y1={h / 2} x2={w} y2={h / 2} stroke="var(--glass-line)" />
      <line x1={w / 2} y1="0" x2={w / 2} y2={h} stroke="var(--copper)" strokeDasharray="3 3"
            style={{ filter: "drop-shadow(0 0 4px var(--copper))" }} />
      <path d={"M " + xs.map(p => p.join(",")).join(" L ")} stroke="var(--copper)" strokeWidth="2" fill="none"
            style={{ filter: "drop-shadow(0 0 4px var(--copper))" }} />
      <path d={"M " + xs.map(p => p.join(",")).join(" L ") + " L " + w + " " + (h / 2) + " L 0 " + (h / 2) + " Z"} fill="url(#eo-gp-fill)" />
      <text x={4} y={12} fontSize="9" className="mono" fill="var(--gn)">Long (calm)</text>
      <text x={w - 4} y={h - 4} fontSize="9" className="mono" textAnchor="end" fill="var(--rd)">Short (amplify)</text>
      <text x={w / 2 + 4} y={12} fontSize="9" className="mono" fill="var(--copper)">spot</text>
      <text x={4} y={h / 2 - 4} fontSize="9" className="mono" fill="var(--ink-3)">+γ</text>
      <text x={4} y={h / 2 + 12} fontSize="9" className="mono" fill="var(--ink-3)">−γ</text>
    </svg>
  );
}

// ─── §5 Payoff (kept from earnings-options.jsx; used by Options) ─────
function EoPayoffDiagram() {
  const w = 580, h = 200, padT = 22, padB = 32, padL = 24, padR = 60;
  const minPx = 58, maxPx = 80;
  const cost = 2.85, low = 65, high = 75;
  const innerH = h - padT - padB;
  const x = (p) => padL + ((p - minPx) / (maxPx - minPx)) * (w - padL - padR);
  const pnlAt = (px) => (Math.min(high - low, Math.max(0, px - low)) - cost) * 100;
  const samples = [];
  for (let p = minPx; p <= maxPx; p += 0.25) samples.push([p, pnlAt(p)]);
  const pnls = samples.map(s => s[1]);
  const pnlMin = Math.min(...pnls) * 1.2, pnlMax = Math.max(...pnls) * 1.2;
  const y = (pnl) => padT + innerH - ((pnl - pnlMin) / (pnlMax - pnlMin)) * innerH;
  const y0 = y(0);
  const pts = samples.map(([p, pl]) => [x(p), y(pl)]);
  const breakeven = low + cost;
  const maxLossY = y(pnlAt(minPx));
  const maxGainY = y(pnlAt(maxPx));

  return (
    <div className="payoff-block">
      <svg width="100%" height={h} viewBox={"0 0 " + w + " " + h} preserveAspectRatio="xMidYMid meet" style={{ overflow: "visible" }}>
        <defs>
          <linearGradient id="eo-pd-gn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="var(--gn)" stopOpacity="0.40" />
            <stop offset="100%" stopColor="var(--gn)" stopOpacity="0.02" />
          </linearGradient>
          <linearGradient id="eo-pd-rd" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stopColor="var(--rd)" stopOpacity="0.40" />
            <stop offset="100%" stopColor="var(--rd)" stopOpacity="0.02" />
          </linearGradient>
          <clipPath id="eo-pd-clip-gn"><rect x="0" y="0" width={w} height={y0} /></clipPath>
          <clipPath id="eo-pd-clip-rd"><rect x="0" y={y0} width={w} height={h - y0} /></clipPath>
        </defs>

        <line x1={padL} y1={padT} x2={padL} y2={h - padB} stroke="var(--glass-line)" />
        <line x1={padL} y1={h - padB} x2={w - padR} y2={h - padB} stroke="var(--glass-line)" />
        <line x1={padL} y1={y0} x2={w - padR} y2={y0} stroke="var(--ink-3)" strokeDasharray="3 3" opacity="0.5" />

        <g clipPath="url(#eo-pd-clip-gn)">
          <path d={"M " + padL + " " + y0 + " L " + pts.map(p => p.join(",")).join(" L ") + " L " + (w - padR) + " " + y0 + " Z"} fill="url(#eo-pd-gn)" />
        </g>
        <g clipPath="url(#eo-pd-clip-rd)">
          <path d={"M " + padL + " " + y0 + " L " + pts.map(p => p.join(",")).join(" L ") + " L " + (w - padR) + " " + y0 + " Z"} fill="url(#eo-pd-rd)" />
        </g>

        <line x1={x(low)} y1={padT - 4} x2={x(low)} y2={h - padB} stroke="var(--copper)" strokeWidth="1.4" strokeDasharray="3 3"
              style={{ filter: "drop-shadow(0 0 4px var(--copper))" }} />
        <line x1={x(high)} y1={padT - 4} x2={x(high)} y2={h - padB} stroke="var(--gn)" strokeWidth="1.4" strokeDasharray="3 3"
              style={{ filter: "drop-shadow(0 0 4px var(--gn))" }} />
        <line x1={x(breakeven)} y1={padT - 4} x2={x(breakeven)} y2={h - padB} stroke="var(--ink-3)" strokeWidth="0.8" strokeDasharray="2 4" />

        <polyline points={pts.map(p => p.join(",")).join(" ")} stroke="var(--ink)" strokeWidth="2.2" fill="none" strokeLinejoin="round"
                  style={{ filter: "drop-shadow(0 0 6px color-mix(in oklab, var(--copper) 60%, transparent))" }} />

        <circle cx={x(low)} cy={y(pnlAt(low))} r="4" fill="var(--copper)" style={{ filter: "drop-shadow(0 0 8px var(--copper))" }} />
        <circle cx={x(high)} cy={y(pnlAt(high))} r="4" fill="var(--gn)" style={{ filter: "drop-shadow(0 0 8px var(--gn))" }} />
        <circle cx={x(breakeven)} cy={y0} r="3" fill="var(--ink-2)" />

        <EoPayoffCallout x={x(low)}      y={padT - 4} label="$65 BUY" tone="copper" />

function ptFix(v, d) { return (v === undefined || v === null || isNaN(v)) ? "--" : Number(v).toFixed(d === undefined ? 2 : d); }
function ptNum(v, fallback) { return (v === undefined || v === null || isNaN(v)) ? fallback : Number(v); }

// ── deterministic book-equity walk (no Math.random / Date.now) ──
const PT_BOOK_SERIES = (() => {
  const data = []; let v = 100;
  // fixed pseudo-walk so SVG output is stable across renders
  const steps = [0.42, -0.18, 0.61, 0.33, -0.05, 0.48, 0.71, 0.12, -0.22, 0.55,
                 0.39, 0.64, -0.11, 0.28, 0.51, 0.18, -0.31, 0.46, 0.73, 0.22,
                 0.35, -0.14, 0.58, 0.41, 0.09, 0.62, -0.07, 0.49, 0.31, 0.54];
  for (let i = 0; i < 30; i++) { v += steps[i] + 0.18; data.push(v); }
  return data;
})();

function PtPositionSim({ ticker }) {
  const t = ticker || {};
  // live-bind base share price from ticker; sizing illustrative
  const px = ptNum(t.price, 67.42);
  const stop = ptNum(t.stop, px * 0.94);
  const riskPerShare = Math.max(px - stop, 0.01);
  const base = [
    { mult: "0.5×", sh: 55,  navPct: 3.4, ratio: "0.19% NAV", tone: "gn" },
    { mult: "1.0×", sh: 110, navPct: 6.8, ratio: "0.39% NAV", tone: "copper", on: true },
    { mult: "1.5×", sh: 165, navPct: 10.3, ratio: "0.58% NAV", tone: "amb" },
    { mult: "2.0×", sh: 220, navPct: 13.7, ratio: "0.78% NAV", tone: "rd" },
  ];
  const rows = base.map(r => ({
    ...r,
    notional: Math.round(r.sh * px),
    maxL: Math.round(r.sh * riskPerShare),
  }));
  return (
    <table className="dtable">
      <thead><tr><th>Size mult</th><th className="r">Shares</th><th className="r">Notional</th><th className="r">% NAV</th><th className="r">Max loss</th><th>Risk ratio</th></tr></thead>
      <tbody>
        {rows.map((r, i) => (
          <tr key={i} className={r.on ? "is-current" : ""}>
            <td className="mono"><b>{r.mult}</b></td>
            <td className="r mono tabular">{r.sh}</td>
            <td className="r mono tabular">${r.notional.toLocaleString()}</td>
            <td className={`r mono tabular kpi-tone--${r.tone}`}>{ptFix(r.navPct, 1)}%</td>
            <td className={`r mono tabular kpi-tone--${r.tone}`}>−${r.maxL.toLocaleString()}</td>
            <td className="mono dim">{r.ratio}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function PtSentimentDial() {
  const v = 0.42;
  const angle = -90 + v * 90;
  const tipX = 100 + 64 * Math.cos((angle * Math.PI) / 180);
  const tipY = 110 + 64 * Math.sin((angle * Math.PI) / 180);
  return (
    <svg viewBox="0 0 200 130" width="240" height="156" style={{ overflow: "visible" }}>
      <defs>
        <linearGradient id="pt-sd-arc" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="var(--rd)" stopOpacity="1" />
          <stop offset="50%" stopColor="var(--amb)" stopOpacity="1" />
          <stop offset="100%" stopColor="var(--gn)" stopOpacity="1" />
        </linearGradient>
      </defs>
      <path d="M 30 110 A 70 70 0 0 1 170 110" stroke="var(--line)" strokeWidth="12" fill="none" strokeLinecap="round" />
      <path d="M 30 110 A 70 70 0 0 1 170 110" stroke="url(#pt-sd-arc)" strokeWidth="12" fill="none" strokeLinecap="round"
            style={{ filter: "drop-shadow(0 0 8px color-mix(in oklab, var(--gn) 40%, transparent))" }} />
      {[0, 0.25, 0.5, 0.75, 1].map((tk, i) => {
        const a = -180 + tk * 180;
        const x1 = 100 + 56 * Math.cos((a * Math.PI) / 180);
        const y1 = 110 + 56 * Math.sin((a * Math.PI) / 180);
        const x2 = 100 + 66 * Math.cos((a * Math.PI) / 180);
        const y2 = 110 + 66 * Math.sin((a * Math.PI) / 180);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="var(--bg-1)" strokeWidth="2" />;
      })}
      <line x1="100" y1="110" x2={tipX} y2={tipY} stroke="var(--copper)" strokeWidth="3" strokeLinecap="round"
            style={{ filter: "drop-shadow(0 0 8px var(--copper))" }} />
      <circle cx="100" cy="110" r="7" fill="var(--bg-1)" stroke="var(--copper)" strokeWidth="2.5"
              style={{ filter: "drop-shadow(0 0 8px var(--copper))" }} />
      <circle cx="100" cy="110" r="3" fill="var(--copper)" />
      <text x="100" y="128" textAnchor="middle" className="mono" fontSize="16" fill="var(--gn)" fontWeight="500"
            style={{ filter: "drop-shadow(0 0 8px color-mix(in oklab, var(--gn) 40%, transparent))" }}>+0.42</text>
      <text x="100" y="142" textAnchor="middle" className="mono" fontSize="9" fill="var(--ink-3)" letterSpacing="0.18em">BULLISH</text>
    </svg>
  );
}

  const pf = (ss.pf != null) ? ss.pf.toFixed(2) : "1.84";
  const pfHair = (ss.pf != null) ? (ss.pf - 0.43).toFixed(2) : "1.41";

        </div>
        <div className="th-right">
          <TmlEdgeDecayChart />
        </div>
      </div>

      <div className="lens-section">

          sub="Wilson CI · profit factor · median R · n"
          style={headerStyle} right={<StateToggle name="tr-1" />} />
        <StateWrap state={s1.value} source="setup_stats.json · per-family">
          <div className="lens-pad">
            <div className="kpi-row" style={{ gridTemplateColumns: "repeat(4, 1fr)" }}>
              <KpiTile label="Win rate" value={wrPct + "%"} tone="gn" sub={"n=" + n} />
              <KpiTile label="Wilson 95% LB" value={lbPct + "%"} tone="gn" sub="above 45% gate" />

          style={headerStyle} right={<StateToggle name="tr-2" />} />
        <StateWrap state={s2.value} source="walk-forward · 12-mo holdout">

            <div className="kpi-row" style={{ gridTemplateColumns: "repeat(4, 1fr)" }}>
              <KpiTile label="Median fwd 10d" value="+2.4%" tone="gn" />
              <KpiTile label="P(T1 first)" value="58.5%" tone="gn" />
              <KpiTile label="P(stop first)" value="40.0%" tone="amb" />
              <KpiTile label="Expectancy · R" value="+0.51" tone="gn" sub="per trade" />
            </div>
          </div>
        </StateWrap>
      </div>

      <div className="lens-section">
        <SectionHeader n={3} title="Edge Decay · 12-mo Blocks"

function TmlEdgeDecayChart() {
  const w = 240, h = 90;
  // 12 blocks of WR (illustrative)
  const data = TML_DECAY_SERIES;
  const xStep = (w - 24) / (data.length - 1);
  const y = v => h - 14 - ((v - 0.40) / 0.30) * (h - 24);
  const pts = data.map((v, i) => [12 + i * xStep, y(v)]);
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <line x1="0" y1={y(0.45)} x2={w} y2={y(0.45)} stroke="var(--rd-dim)" strokeDasharray="3 3" />
      <text x="2" y={y(0.45) - 3} fontSize="9" className="mono" fill="var(--rd)">45% gate</text>
      <polyline points={pts.map(p => p.join(",")).join(" ")} stroke="var(--gn)" strokeWidth="1.6" fill="none" />
      {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="2" fill={i === pts.length - 1 ? "var(--copper)" : "var(--gn)"} />)}
      <text x={w - 2} y="12" fontSize="9" className="mono" textAnchor="end" fill="var(--gn)">stable</text>
    </svg>
  );
}

function TmlEdgeDecayPanel() {
  const blocks = TML_DECAY_BLOCKS;
  return (
    <div className="ed-grid">
      {blocks.map((b, i) => (
        <div key={i} className={`ed-cell ${b.current ? "is-current" : ""}`}>
          <div className="ed-period mono dim">{b.period}</div>
          <div className={`ed-wr mono kpi-tone--${b.tone}`}>{(b.wr * 100).toFixed(1)}%</div>
          <div className="ed-meta mono dim2">LB {(b.lb * 100).toFixed(0)}% · n={b.n}</div>
        </div>
      ))}
    </div>
  );
}

function TmlDistributionBars() {
  const buckets = TML_DIST_BUCKETS;
  const max = Math.max(...buckets.map(b => b.p));
  return (
    <div className="dist-block">
      <div className="dist-bars">
        {buckets.map((b, i) => {
          const positive = (b.lo + b.hi) / 2 >= 0;
          return (
            <div key={i} className="dist-bar-col">
              <div className="dist-bar" style={{
                height: `${(b.p / max) * 100}%`,
                background: positive ? "var(--gn)" : "var(--rd)",
                opacity: 0.7,
              }} />
              <div className="dist-bar-lbl mono dim">{b.lo > 0 ? "+" : ""}{b.lo}</div>
            </div>
          );
        })}
      </div>
      <div className="dist-stats">
        <span className="mono">Median <b className="up">+2.4%</b></span>
        <span className="mono">P25 <b>−1.1%</b></span>
        <span className="mono">P75 <b className="up">+5.6%</b></span>
        <span className="mono dim2">2,000 paths · holdout-trained</span>
      </div>
    </div>
  );
}

// ── cumulative equity curve: book area + benchmark line + last marker ──
function QEquity({ book, bench, w = 640, h = 150, tone = "gn" }) {
  const all = [...book, ...(bench || [])];
  const min = Math.min(...all, 0), max = Math.max(...all, 1);
  const pad = (max - min) * 0.08 || 1;
  const lo = min - pad, hi = max + pad;
  const x = i => (i / (book.length - 1)) * w;
  const y = v => h - ((v - lo) / (hi - lo)) * h;
  const line = arr => arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const gid = useMemo(() => `qe-${Math.random().toString(36).slice(2, 7)}`, []);
  const last = book[book.length - 1];
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: "block", overflow: "visible" }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={`var(--${tone})`} stopOpacity="0.28" />
          <stop offset="100%" stopColor={`var(--${tone})`} stopOpacity="0" />
        </linearGradient>
      </defs>
      <line x1="0" y1={y(0)} x2={w} y2={y(0)} stroke="var(--glass-line)" strokeDasharray="2 3" />
      <path d={`M 0 ${y(0)} L ${line(book)} L ${w} ${y(0)} Z`} fill={`url(#${gid})`} />
      {bench && <polyline points={line(bench)} fill="none" stroke="var(--ink-3)" strokeWidth="1.4" strokeDasharray="4 3" opacity="0.8" />}
      <polyline points={line(book)} fill="none" stroke={`var(--${tone})`} strokeWidth="2" style={{ filter: `drop-shadow(0 0 5px var(--${tone}))` }} />
      <circle cx={x(book.length - 1)} cy={y(last)} r="3.4" fill={`var(--${tone})`} style={{ filter: `drop-shadow(0 0 6px var(--${tone}))` }} />
    </svg>
  );
}

// ── underwater drawdown curve (always ≤ 0, red fill downward) ──
function QUnderwater({ dd, w = 640, h = 70 }) {
  const min = Math.min(...dd, -1);
  const x = i => (i / (dd.length - 1)) * w;
  const y = v => (v / min) * (h - 4);
  const gid = useMemo(() => `uw-${Math.random().toString(36).slice(2, 7)}`, []);
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: "block" }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--rd)" stopOpacity="0.05" />
          <stop offset="100%" stopColor="var(--rd)" stopOpacity="0.35" />
        </linearGradient>
      </defs>
      <path d={`M 0 0 L ${dd.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" L ")} L ${w} 0 Z`} fill={`url(#${gid})`} />
      <polyline points={dd.map((v, i) => `${x(i)},${y(v)}`).join(" ")} fill="none" stroke="var(--rd)" strokeWidth="1.3" opacity="0.8" />
    </svg>
  );
}

// ── R-multiple distribution histogram (losers red left, winners green right) ──
function QHist({ bins, w = 320, h = 130 }) {
  const max = Math.max(...bins.map(b => b.count), 1);
  const bw = w / bins.length;
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: "block", overflow: "visible" }}>
      {bins.map((b, i) => {
        const bh = (b.count / max) * (h - 22);
        return (
          <g key={i}>
            <rect x={i * bw + 1.5} y={h - 18 - bh} width={bw - 3} height={bh}
              fill={b.win ? "var(--gn)" : "var(--rd)"} opacity={b.count ? 0.6 : 0.12} rx="1.5" />
            <text x={i * bw + bw / 2} y={h - 6} textAnchor="middle" fontSize="8" className="mono" fill="var(--ink-3)">{b.label}</text>
            {b.count > 0 && <text x={i * bw + bw / 2} y={h - 22 - bh} textAnchor="middle" fontSize="8.5" className="mono" fill="var(--ink-2)">{b.count}</text>}
          </g>
        );
      })}
    </svg>
  );
}

// ── monthly returns strip (colored cells) ──
function QMonths({ months }) {
  const cap = Math.max(...months.map(x => Math.abs(x.r)), 1);
  return (
    <div className="q-months">
      {months.map((x, i) => {
        const t = Math.min(1, Math.abs(x.r) / cap);
        const c = x.r >= 0 ? `color-mix(in oklab, var(--gn) ${10 + t * 55}%, transparent)` : `color-mix(in oklab, var(--rd) ${10 + t * 55}%, transparent)`;
        return (
          <div key={i} className="q-month" style={{ background: c }}>
            <span className="q-month-m mono dim2">{x.m}</span>
            <span className={`q-month-r mono ${x.r >= 0 ? "up" : "dn"}`}>{x.r >= 0 ? "+" : ""}{x.r.toFixed(1)}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── diverging horizontal bar list (attribution etc) ──
function QDiverge({ rows, fmt }) {
  const cap = Math.max(...rows.map(r => Math.abs(r.value)), 1);
  return (
    <div className="q-div">
      {rows.map((r, i) => {
        const pct = Math.min(48, (Math.abs(r.value) / cap) * 48);
        const tone = r.tone || (r.value >= 0 ? "gn" : "rd");
        return (
          <div key={i} className="q-div-row">
            <span className="q-div-l">{r.label}</span>
            <div className="q-div-bar">
              <div className="q-div-ax" />
              <div className="q-div-f" style={{ width: `${pct}%`, marginLeft: r.value >= 0 ? "50%" : `${50 - pct}%`, background: `var(--${tone})` }} />
            </div>
            <span className={`q-div-v mono kpi-tone--${tone}`}>{fmt ? fmt(r.value) : r.value}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── horizontal gauge bar with cap marker (0..1 fill, optional cap) ──
function QGaugeBar({ pct, cap, tone = "gn" }) {
  return (
    <div className="q-gauge">
      <div className="q-gauge-f" style={{ width: `${Math.min(100, pct)}%`, background: `var(--${tone})` }} />
      {cap != null && <div className="q-gauge-cap" style={{ left: `${Math.min(100, cap)}%` }} />}
    </div>
  );
}

// ── tiny inline sparkline for table cells (edge decay etc) ──
function QSpark({ data, tone = "gn", w = 70, h = 20 }) {
  if (!data || !data.length) return null;
  const min = Math.min(...data), max = Math.max(...data), r = max - min || 1;
  const x = i => (i / (data.length - 1)) * w;
  const y = v => h - ((v - min) / r) * (h - 3) - 1.5;
  const down = data[data.length - 1] < data[0];
  const c = down ? "amb" : tone;
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      <polyline points={data.map((v, i) => `${x(i)},${y(v)}`).join(" ")} fill="none" stroke={`var(--${c})`} strokeWidth="1.3" />
      <circle cx={x(data.length - 1)} cy={y(data[data.length - 1])} r="1.8" fill={`var(--${c})`} />
    </svg>
  );
}

Object.assign(window, { QEquity, QUnderwater, QHist, QMonths, QDiverge, QGaugeBar, QSpark });

function ThemeSpark({ data, tone }) {
  const w = 200, h = 44, min = Math.min(...data, 0), max = Math.max(...data, 0.5);
  const x = i => (i / (data.length - 1)) * w, y = v => h - ((v - min) / (max - min || 1)) * (h - 4) - 2;
  const up = data[data.length - 1] >= 0;
  const c = up ? tone : "rd";
  const gid = useMemo(() => `ts-${Math.random().toString(36).slice(2, 7)}`, []);
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: "block" }}>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={`var(--${c})`} stopOpacity="0.25" /><stop offset="100%" stopColor={`var(--${c})`} stopOpacity="0" /></linearGradient></defs>
      <line x1="0" y1={y(0)} x2={w} y2={y(0)} stroke="var(--glass-line)" strokeDasharray="2 3" />
      <path d={`M 0 ${y(0)} L ${data.map((v, i) => `${x(i)},${y(v)}`).join(" L ")} L ${w} ${y(0)} Z`} fill={`url(#${gid})`} />
      <polyline points={data.map((v, i) => `${x(i)},${y(v)}`).join(" ")} fill="none" stroke={`var(--${c})`} strokeWidth="1.6" />
    </svg>
  );
}

   WATCHLIST SURFACE — ported from design src/surface-watchlist.jsx.
   USER-CURATED: the list is whatever the user adds (here or via the ★ in the
   Signal Scanner), persisted to localStorage and synced across surfaces.
   Per-ticker market data is enriched from the live scan universe when present.
   ════════════════════════════════════════════════════════════════ */

// ── persistent user watchlist store (localStorage + cross-surface sync) ──
const WL_KEY = "ss_watchlist";
function wlRead(){ try { return JSON.parse((typeof localStorage!=="undefined"&&localStorage.getItem(WL_KEY))||"[]"); } catch(e){ return []; } }
function wlWrite(arr){
  try { if (typeof localStorage!=="undefined") localStorage.setItem(WL_KEY, JSON.stringify(arr)); } catch(e){}
  try { window.dispatchEvent(new CustomEvent("ss-watchlist-change",{ detail:arr })); } catch(e){}
}
function wlAdd(sym){ sym=(sym||"").trim().toUpperCase(); if(!sym) return; const a=wlRead(); if(!a.includes(sym)) wlWrite([...a,sym]); }
function wlRemove(sym){ sym=(sym||"").trim().toUpperCase(); wlWrite(wlRead().filter(s=>s!==sym)); }
function wlToggle(sym){ sym=(sym||"").trim().toUpperCase(); if(!sym) return; const a=wlRead(); a.includes(sym)?wlWrite(a.filter(s=>s!==sym)):wlWrite([...a,sym]); }
function useWatchlist(){
  const [syms, setSyms] = useState(() => wlRead());
  useEffect(() => {
    const h = () => setSyms(wlRead());
    window.addEventListener("ss-watchlist-change", h);
    window.addEventListener("storage", h);
    return () => { window.removeEventListener("ss-watchlist-change", h); window.removeEventListener("storage", h); };
  }, []);
  return syms;
}
// expose so the Signal Scanner ★ can toggle membership
window.ssWatchlist = { read: wlRead, add: wlAdd, remove: wlRemove, toggle: wlToggle, has: (s)=>wlRead().includes((s||"").trim().toUpperCase()) };

const WL_MODE = [["all","All"],["swing","Swing"],["position","Position"]];
const WL_VERD = [["all","All"],["BUY","Bullish"],["WATCH","Neutral"],["AVOID","Avoid"],["held","★ Held"]];

function wlNum(v, d=0){ const n=parseFloat(v); return isNaN(n)?d:n; }

// one user symbol → enriched row (market data from the scan universe when present)
function wlRowFrom(sym, uni, heldSet){
  const w = uni.find(r => r.sym === sym) || null;
  const code = (sym.charCodeAt(0)||65) + (sym.charCodeAt(1)||65);
  const score = Math.round((w && w.score) || 0);
  return {
    sym, inUniverse: !!w,
    name: (w && w.name) || sym, sector: (w && w.sector) || "—",
    setup: (w && w.setup) || "—", verdict: (w && w.verdict) || "WATCH",
    score, price: (w && w.price) || 0, chg: (w && w.chg) || 0,
    held: heldSet.has(sym),
    tier: (w && w.tier) || (score>=75?"T1":score>=60?"T2":score>=45?"T3":"WATCH"),
    modeTag: code % 2 === 0 ? "swing" : "position",
    rs: (w && w.rs != null) ? w.rs : 0,
    rvol: w ? wlNum(w.rvol, 0) : 0,
    rr: w ? wlNum(w.rr, 0) : 0,
    earn: (w && w.er != null) ? w.er : null,
    tfsn: (w && w.tfsn && w.tfsn.length===4) ? w.tfsn : [0,0,0,0],
    wlb: (w && w.wlb != null) ? w.wlb : null,
    n: (w && w.n != null) ? w.n : null,
    pf: w ? wlNum(w.pf, 0) : 0,
    mech: (w && w.mechanism) || (w ? "—" : "Not in today's scan — add as a manual watch."),
  };
}

function SurfaceWatchlist({ onTicker, universe, held }) {
  const syms = useWatchlist();
  const heldSet = useMemo(() => new Set((held||[]).map(s => (s||"").toUpperCase())), [held]);
  const [mode, setMode] = useState("all");
  const [verd, setVerd] = useState("all");
  const [q, setQ] = useState("");
  const [sort, setSort] = useState({ col: "score", dir: -1 });

  const uni = universe || [];

  const rows = useMemo(() => {

    if (q) r = r.filter(x => (x.sym + x.name).toLowerCase().includes(q.toLowerCase()));
    return [...r].sort((a, b) => {
      const an = parseFloat(a[sort.col]), bn = parseFloat(b[sort.col]);
      if (!isNaN(an) && !isNaN(bn)) return (an - bn) * sort.dir;
      return String(a[sort.col]).localeCompare(String(b[sort.col])) * sort.dir;

                  <td><span className="ss2-tfsn">{t.tfsn.map((v,k)=><span key={k} className={`ss2-tfsn-dot ss2-tfsn--${v===2?"pass":v===1?"neut":"fail"}`} />)}</span></td>

            </tbody>
          </table>
        </div>
        {selRow && <WLDetailPane t={selRow} onTicker={onTicker} />}
      </div>
      )}
    </div>
  );
}

// options.jsx — Unified Options workspace (Flow + Ideas sub-tabs). Ported from design v3.
// Hooks come from globals (useState/useMemo). Local aliases kept from source.

const useOF = useState, useOFm = useMemo;
const useOI = useState, useOIm = useMemo;

const OF_PRINTS = (() => {
  const names = [
    ["NVDA","Tech",118.4], ["ARGN","Tech",213.4], ["CRWV","Tech",62.1], ["GENO","Healthcare",29.4],
    ["ARCM","Materials",67.4], ["DRSH","Energy",56.1], ["MERC","Tech",17.2], ["NVRH","Healthcare",142.1],
    ["XLE","ETF",91.2], ["BIVO","Healthcare",72.6], ["ZOTR","Tech",41.8], ["BORA","Industrials",31.1],
  ];
  const out = [];
  let hh = 13, mm = 52;
  names.forEach(([sym, sector, spot], i) => {
    const reps = 1 + (sym.charCodeAt(0) % 2);
    for (let r = 0; r < reps; r++) {
      const code = sym.charCodeAt(0) + sym.charCodeAt(1) + i * 11 + r * 7;
      const isCall = code % 3 !== 0;
      const dte = [7, 14, 21, 35, 60][code % 5];
      const strikePct = isCall ? 1 + (code % 8) / 100 : 1 - (code % 8) / 100;
      const strike = Math.round(spot * strikePct);
      const size = (2 + (code % 38)) * 100;          // contracts
      const prem = (size * (0.5 + (code % 40) / 10) * 100) / 1e6; // $M
      const oi = 200 + (code % 30) * 80;
      const volOi = size / oi;
      const iv = 28 + (code % 40);
      const aggr = code % 4 === 0 ? "STO" : "BTO";
      const exec = ["SWEEP", "BLOCK", "SPLIT"][code % 3];
      const sentiment = (isCall && aggr === "BTO") || (!isCall && aggr === "STO") ? "bull" : "bear";
      mm -= 3 + (code % 11); if (mm < 0) { mm += 60; hh -= 1; }
      const cats = ["Earnings 8d", "—", "FDA 14d", "M&A rumor", "—", "Analyst day", "—"];
      const catalyst = cats[code % cats.length];
      const zscore = (2.0 + (code % 45) / 10);  // flow imbalance Z
      out.push({
        t: `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`,
        sym, sector, spot, type: isCall ? "C" : "P", strike, dte,
        exp: dte <= 7 ? "Jun 06" : dte <= 14 ? "Jun 13" : dte <= 21 ? "Jun 20" : dte <= 35 ? "Jul 03" : "Jul 18",
        size, prem, oi, volOi, iv, aggr, exec, sentiment, catalyst, zscore,
        unusual: (volOi * (prem) * (exec === "SWEEP" ? 1.4 : 1)).toFixed(1),
      });
    }
  });
  return out.sort((a, b) => b.prem - a.prem);
})();

function SurfaceOptionsFlow({ onTicker }) {
  const [filter, setFilter] = useOF("all");
  const [q, setQ] = useOF("");

  const rows = useOFm(() => {
    let r = OF_PRINTS;
    if (filter === "sweep") r = r.filter(p => p.exec === "SWEEP");
    if (filter === "block") r = r.filter(p => p.exec === "BLOCK");
    if (filter === "bull") r = r.filter(p => p.sentiment === "bull");
    if (filter === "bear") r = r.filter(p => p.sentiment === "bear");
    if (filter === "calls") r = r.filter(p => p.type === "C");
    if (filter === "puts") r = r.filter(p => p.type === "P");
    if (q.trim()) r = r.filter(p => p.sym.toLowerCase().includes(q.toLowerCase()));
    return r;
  }, [filter, q]);

  const callPrem = OF_PRINTS.filter(p => p.type === "C").reduce((s, p) => s + p.prem, 0);
  const putPrem = OF_PRINTS.filter(p => p.type === "P").reduce((s, p) => s + p.prem, 0);
  const netPrem = callPrem - putPrem;
  const cpRatio = (callPrem / putPrem);
  const bull = OF_PRINTS.filter(p => p.sentiment === "bull").length;
  const bearish = OF_PRINTS.length - bull;
  const sweeps = OF_PRINTS.filter(p => p.exec === "SWEEP").length;

  // top tickers by net premium
  const byTicker = useOFm(() => {
    const m = {};
    OF_PRINTS.forEach(p => {
      if (!m[p.sym]) m[p.sym] = { sym: p.sym, call: 0, put: 0, n: 0 };
      m[p.sym][p.type === "C" ? "call" : "put"] += p.prem;
      m[p.sym].n++;
    });
    return Object.values(m).map(x => ({ ...x, net: x.call - x.put }))
      .sort((a, b) => Math.abs(b.net) - Math.abs(a.net)).slice(0, 7);
  }, []);

  return (
    <div className="surface wsx wsx--amb oflow">
      <div className="wsx-hdr">
        <div className="wsx-hdr-l">

        </div>
        <div className="wsx-hdr-r">
          <FreshnessPill state="live" age="3s" />
          <span className="mono dim2">Schwab /options time&amp;sales · {OF_PRINTS.length} prints · today</span>
        </div>
      </div>

      {/* Flow read */}
      <div className="of-read">
        <div className="of-read-net">
          <div className="of-read-num mono" data-tone={netPrem >= 0 ? "gn" : "rd"}>{netPrem >= 0 ? "+" : "−"}${Math.abs(netPrem).toFixed(1)}M</div>
          <div className="of-read-lbl mono dim2">NET PREMIUM · CALL − PUT</div>
        </div>
        <div className="of-read-body mono">
          Tape skews <b className="up">bullish</b> — ${callPrem.toFixed(1)}M call premium vs ${putPrem.toFixed(1)}M put ({cpRatio.toFixed(2)}× C/P), {bull} bullish vs {bearish} bearish prints,
          {" "}{sweeps} sweeps hitting the offer. <b className="warn">Concentration:</b> flow is led by {byTicker[0]?.sym} and {byTicker[1]?.sym} — single-name, not broad. Confirm with spot before fading.
        </div>
        <div className="of-read-skew">
          <div className="of-skew-bar">
            <div className="of-skew-call" style={{ width: `${callPrem/(callPrem+putPrem)*100}%` }}><span className="mono">CALLS ${callPrem.toFixed(0)}M</span></div>
            <div className="of-skew-put" style={{ width: `${putPrem/(callPrem+putPrem)*100}%` }}><span className="mono">PUTS ${putPrem.toFixed(0)}M</span></div>
          </div>
        </div>

      <div className="wsx-kpis">
        <div className="wsx-kpi wsx-kpi--gn"><div className="wsx-kpi-l mono">CALL PREMIUM</div><div className="wsx-kpi-v mono kpi-tone--gn">${callPrem.toFixed(1)}M</div><div className="wsx-kpi-s mono dim2">{OF_PRINTS.filter(p=>p.type==="C").length} prints</div></div>
        <div className="wsx-kpi wsx-kpi--rd"><div className="wsx-kpi-l mono">PUT PREMIUM</div><div className="wsx-kpi-v mono kpi-tone--rd">${putPrem.toFixed(1)}M</div><div className="wsx-kpi-s mono dim2">{OF_PRINTS.filter(p=>p.type==="P").length} prints</div></div>
        <div className="wsx-kpi wsx-kpi--amb"><div className="wsx-kpi-l mono">C/P RATIO</div><div className="wsx-kpi-v mono kpi-tone--amb">{cpRatio.toFixed(2)}×</div><div className="wsx-kpi-s mono dim2">{cpRatio > 1.2 ? "call-skewed" : cpRatio < 0.8 ? "put-skewed" : "balanced"}</div></div>
        <div className="wsx-kpi wsx-kpi--violet"><div className="wsx-kpi-l mono">SWEEPS</div><div className="wsx-kpi-v mono kpi-tone--violet">{sweeps}</div><div className="wsx-kpi-s mono dim2">aggressive · hit offer</div></div>

      <div className="lab-tabs">

function SurfaceOptionsIdeas({ onTicker }) {
  const [filter, setFilter] = useOI("all");
  const [sort, setSort] = useOI("conv");

  const rows = useOIm(() => {
    let r = OI_IDEAS;
    if (filter === "bull") r = r.filter(x => x.dir === "bull");
    if (filter === "bear") r = r.filter(x => x.dir === "bear");
    if (filter === "cheap") r = r.filter(x => x.ivr < 45);
    if (filter === "spread") r = r.filter(x => x.strat.includes("Spread") || x.strat.includes("Calendar"));
    if (filter === "long") r = r.filter(x => x.strat.includes("Long") || x.strat.includes("Debit"));
    r = [...r].sort((a, b) => sort === "conv" ? b.conv - a.conv : sort === "rr" ? parseFloat(b.rr) - parseFloat(a.rr) : b.pop - a.pop);
    return r;
  }, [filter, sort]);

  const best = OI_IDEAS.slice().sort((a, b) => b.conv - a.conv)[0];

  return (
    <div className="surface wsx wsx--gn oidea">

          <div className="oi-best-struct mono">{best.structure} <span className="dim2">· debit <b className="cop">${best.debit.toFixed(2)}</b> ({"$"}{best.maxLoss} max loss) · BE ${best.be}</span></div>

        <div className="oi-best-r">

      <div className="pm-note mono dim2">
        Ideas ranked from scan verdicts × <b>Schwab /markets/options/chains</b> (real bid/ask/IV/Greeks, 6s poll) · structure auto-selected by IV-rank ·
        debit/max-loss/BE/POP Black-Scholes priced · catalyst from EODHD /calendar + /news. Click any row → 14-lens detail + full Options lens.
      </div>
    </div>
  );
}

      { id: "sleeve", label: "Edge by sleeve · net R",   match: "EDGE BY SLEEVE" },
      { id: "behav",  label: "Behavioral · cost of R",   match: "BEHAVIORAL" },
    ]},
    { id: "process", label: "Process & gates", panels: [
      { id: "activation", label: "Sleeve activation matrix", match: "SLEEVE ACTIVATION MATRIX" },
      { id: "gates",      label: "Entry gates",               match: "ENTRY GATES" },
      { id: "sizing",     label: "Sizing & risk policy",      match: "SIZING" },
    ]},
  ],
  themes: [
    { id: "board", label: "Theme board", panels: [
      { id: "tbl",   label: "Theme table",        sel: ".wsx-body" },
      { id: "cons",  label: "Constituents drill-down", match: "CONSTITUENTS" },
    ]},
  ],
  lab: [
    { id: "research", label: "Research", panels: [
      { id: "hypo",  label: "Hypothesis builder",       match: "HYPOTHESIS" },
      { id: "wf",    label: "Walk-forward results",      match: "WALK-FORWARD" },
      { id: "ic",    label: "Information coefficient",   match: "INFORMATION COEFFICIENT" },
    ]},
    { id: "models", label: "Models & regime", panels: [
      { id: "registry",  label: "Model registry",          match: "MODEL REGISTRY" },
      { id: "winrate",   label: "Setup win-rate × regime",  match: "SETUP WIN-RATE" },
      { id: "transition",label: "Regime transition matrix", match: "REGIME TRANSITION" },
      { id: "sandbox",   label: "Scan-tuning sandbox",      match: "SCAN-TUNING" },
    ]},
  ],
  "signal-scanner": [
    { id: "scanner", label: "Scanner", panels: [
      { id: "tabs",   label: "Result tabs",        sel: ".ss2-tabs" },
      { id: "pills",  label: "Quick-filter pills", sel: ".ss2-pills" },
      { id: "table",  label: "Scanner table",      sel: ".ss2-tbl-wrap" },
    ]},
    { id: "evidence", label: "Evidence", panels: [
      { id: "detail", label: "Detail evidence pane (13 sections)", sel: ".sdp" },

};

// Generic structural fallback for workspace surfaces without a bespoke map
// above — these classes are shared across every "wsx" surface, so the labels
// describe what's really on screen (header KPIs, the filter bar, the table).
const SURFACE_SECTIONS_DEFAULT = [
  { id: "layout", label: "Surface layout", panels: [
    { id: "kpis", label: "Header KPI strip", sel: ".wsx-kpis" },
    { id: "tabs", label: "Filter bar",       sel: ".lab-tabs" },
    { id: "body", label: "Main table / feed", sel: ".wsx-body" },
  ]},
];
function surfaceSections(surface) {
  return SURFACE_SECTIONS[surface] || SURFACE_SECTIONS_DEFAULT;
}

// Live section overrides (mutable, edited from Tier Access · Configure)
const SECTION_TIER = {            // "surface:panelId" -> override min tier
  "premarket:gapstats": 4,        // backtested edge → Elite analytics
  "options:gamma": 4,        // dealer gamma → Elite
  "options:expiries": 2,
  "news:senttr": 2,
  "portfolio-srf:stress": 4,
  "performance:decay": 3,
  "premarket:secheat": 2,
};
const SECTION_OFF = {             // "surface:panelId" -> true when disabled
};
function sectionKey(s, p) { return s + ":" + p; }
function sectionTier(surface, panelId) {
  const base = (window.SURFACE_TIER || {})[surface] ?? 0;
  const ov = (window.SECTION_TIER || {})[sectionKey(surface, panelId)];
  return Math.max(base, ov == null ? 0 : ov);
}
function sectionOff(surface, panelId) {
  return !!(window.SECTION_OFF || {})[sectionKey(surface, panelId)];
}

Object.assign(window, {
  SURFACE_SECTIONS, SURFACE_SECTIONS_DEFAULT, surfaceSections,
  SECTION_TIER, SECTION_OFF, sectionKey, sectionTier, sectionOff,
});

/* ════ Tier Access · Configure — TacPills + TierSectionConfig ════ */
// tac.jsx — Tier Access · Configure (section-level gating editor).
// Ported from the Claude Design v3 prototype (src/surface-users.jsx).
// Renders the per-surface section-config accordion: each surface lists its
// panels with a min-tier pill selector + raised/off badges. Reads
// window.SURFACE_TIER / SECTION_TIER / SECTION_OFF / surfaceSections /
// sectionTier / sectionOff; writes overrides back into window.SECTION_TIER /
// window.SECTION_OFF (mutating + forcing a local-state re-render).
// Hooks (useState/useMemo/useRef/useEffect) are GLOBAL in the target.

// Min-tier pill selector. `min` greys out tiers below the surface floor
// (a section can be equal-or-higher than its surface, never lower).
function TacPills({ tiers, value, onChange, min = 0, size }) {
  return (
    <div className={`tac-pills ${size === "sm" ? "tac-pills--sm" : ""}`}>
      {tiers.map(t => {
        const dis = t.id < min;
        return (
          <button key={t.id} disabled={dis}
            className={`tac-pill tac-pill--${t.id} ${value === t.id ? "is-on" : ""} ${dis ? "is-dis" : ""}`}
            onClick={() => !dis && onChange(t.id)}
            title={dis ? `Below surface floor (T${min})` : `${t.name} · ${t.price}`}>T{t.id}</button>
        );
      })}
    </div>
  );
}

// Surface labels for the accordion. Prefer the target's exposed SURFACE_LABEL
// fn / map if present; otherwise fall back to this local copy from the design.
const TAC_SURFACE_LABELS = {
  home:"Home", "signal-scanner":"Signal Scanner", "market-map":"Market Map", watchlist:"Watchlist", buy:"BUY Candidates",
  playbook:"Playbook", alerts:"Alerts", screener:"Screener", premarket:"Pre-Market", "sector-etf":"ETFs",
  "etf-screener":"ETF Screener", options:"Options", news:"News · Sentiment",
  elite:"Elite Picks", strategies:"Strategies", themes:"Themes", momentum:"Momentum", performance:"Performance",
  "ai-predict":"AI Predictions", insider:"Insider Trading", journal:"Trade Journal", social:"Social Sentiment",
  "portfolio-srf":"Portfolio",
};
function tacSurfaceLabel(k) {
  const SL = window.SURFACE_LABEL;
  if (typeof SL === "function") { try { const r = SL(k); if (r) return r; } catch (e) {} }
  else if (SL && SL[k]) return SL[k];
  return TAC_SURFACE_LABELS[k] || k;
}

function TierSectionConfig({ tiers }) {
  const [, force] = useState(0);
  const bump = () => force(x => x + 1);
  const surf = window.SURFACE_TIER || {};
  const ST = window.SECTION_TIER || (window.SECTION_TIER = {});
  const OFF = window.SECTION_OFF || (window.SECTION_OFF = {});
  const key = window.sectionKey;
  const effTier = window.sectionTier;

  const [open, setOpen] = useState(() => ({ premarket: true }));
  const toggleOpen = (k) => setOpen(o => ({ ...o, [k]: !o[k] }));

  const setSurf = (k, v) => { (window.SURFACE_TIER || (window.SURFACE_TIER = {}))[k] = v; bump(); };

  // section override: store only when raised ABOVE the surface floor
  const setSec = (surface, panelId, tier) => {
    const floor = surf[surface] ?? 0;
    const kk = key(surface, panelId);
    if (tier <= floor) delete ST[kk]; else ST[kk] = tier;
    bump();
  };
  const setGroupAll = (surface, panels, tier) => {
    const floor = surf[surface] ?? 0;
    panels.forEach(p => {
      const kk = key(surface, p.id);
      if (tier <= floor) delete ST[kk]; else ST[kk] = tier;
    });
    bump();
  };
  const toggleOff = (surface, panelId) => {
    const kk = key(surface, panelId);
    if (OFF[kk]) delete OFF[kk]; else OFF[kk] = true;
    bump();
  };

  const surfaces = Object.entries(TAC_SURFACE_LABELS).map(([k]) => [k, tacSurfaceLabel(k)]);

  return (
    <div className="tac">
      <div className="tac-legend mono dim2">
        Expand any surface to gate its individual <b>sections</b>. A section's minimum tier can be raised
        above its surface but never dropped below it. Toggle a section off to remove it for everyone.
        Changes apply live — lower-tier users see the section blurred behind an upgrade prompt.
        <span className="tac-key">{tiers.map(t=> <span key={t.id} className={`tac-k tac-k--${t.id}`}>T{t.id} {t.name}</span>)}</span>
      </div>

      {/* ── Surfaces · section accordion ─────────────────────────── */}
      <div className="lab-card">
        <div className="lab-card-h mono tac-acc-h">
          <span>SURFACES · {surfaces.length} · SECTION ACCESS</span>
          <span className="tac-acc-hint mono dim2">click a surface to configure its sections</span>
        </div>
        <div className="tac-acc">
          {surfaces.map(([k, label]) => {
            const floor = surf[k] ?? 0;
            const groups = window.surfaceSections(k);
            const allPanels = groups.flatMap(g => g.panels);
            const nRaised = allPanels.filter(p => (ST[key(k, p.id)] ?? 0) > floor).length;
            const nOff = allPanels.filter(p => OFF[key(k, p.id)]).length;
            const isOpen = !!open[k];
            return (
              <div key={k} className={`tac-srf ${isOpen ? "is-open" : ""}`}>
                <div className="tac-srf-h">
                  <button className="tac-srf-toggle" onClick={() => toggleOpen(k)} title={isOpen ? "Collapse" : "Expand sections"}>
                    <span className={`tac-caret ${isOpen ? "is-open" : ""}`}>▸</span>
                    <span className="tac-srf-name">{label}</span>
                    <span className="tac-srf-meta mono dim2">{allPanels.length} sections</span>
                  </button>
                  <div className="tac-srf-badges">
                    {nRaised > 0 && <span className="tac-badge tac-badge--up mono" title={`${nRaised} section(s) gated above the surface tier`}>↑{nRaised}</span>}
                    {nOff > 0 && <span className="tac-badge tac-badge--off mono" title={`${nOff} section(s) disabled`}>⊘{nOff}</span>}
                    <span className="tac-srf-lbl mono dim2">surface</span>
                    <TacPills tiers={tiers} value={floor} onChange={v => setSurf(k, v)} />
                  </div>
                </div>

                {isOpen && (
                  <div className="tac-srf-body">
                    {groups.map(g => (
                      <div key={g.id} className="tac-grp">
                        <div className="tac-grp-h">
                          <span className="tac-grp-name mono">{g.label}</span>
                          <span className="tac-grp-bulk mono dim2">
                            set all
                            <span className="tac-bulk-pills">
                              {tiers.map(t => (
                                <button key={t.id} disabled={t.id < floor}
                                  className={`tac-bulk-pill tac-bulk-pill--${t.id} ${t.id < floor ? "is-dis" : ""}`}
                                  onClick={() => t.id >= floor && setGroupAll(k, g.panels, t.id)}
                                  title={t.id < floor ? `Below surface floor (T${floor})` : `Set every section in "${g.label}" to T${t.id}`}>T{t.id}</button>
                              ))}
                            </span>
                          </span>
                        </div>
                        <div className="tac-rows">
                          {g.panels.map(p => {
                            const off = !!OFF[key(k, p.id)];
                            const eff = effTier(k, p.id);
                            return (
                              <div key={p.id} className={`tac-row tac-prow ${off ? "is-off" : ""}`}>
                                <button className={`tac-onoff ${off ? "" : "is-on"}`} onClick={() => toggleOff(k, p.id)}
                                  title={off ? "Section disabled — click to enable" : "Section enabled — click to disable"}>
                                  <span className="tac-onoff-dot" />
                                </button>
                                <span className="tac-row-l">
                                  {p.label}
                                  {!p.match && !p.sel && <span className="tac-row-tag mono dim2" title="Configured — live gate maps when the surface ships this panel">cfg</span>}
                                </span>
                                <span className="tac-row-eff mono dim2">{off ? "off" : `≥ T${eff}`}</span>
                                <TacPills tiers={tiers} value={off ? -1 : eff} onChange={v => setSec(k, p.id, v)} min={floor} size="sm" />
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div className="pm-note mono dim2">
        Source of truth: CapStudio RBAC matrix. Edits write the access map that gates the icon-rail, workspace
        routing, the 14-lens tabs, and now every section within a surface. Switch the tier picker (top bar) to
        preview any tier's view — sections above the selected tier blur behind an upgrade prompt.
      </div>
    </div>
  );
}

window.TacPills = TacPills;
window.TierSectionConfig = TierSectionConfig;


/* ════════════════════════════════════════════════════════════════
   APP
   ════════════════════════════════════════════════════════════════ */
function App() {
  const [theme, setTheme] = useState("midnight-cyan");
  const [tier, setTier] = useState(4);
  const [surface, setSurface] = useState("home");
  const [data, setData] = useState(undefined);   // undefined = loading, null mid-fetch handled separately
  const [earnings, setEarnings] = useState(null); // null = loading
  const [misc, setMisc] = useState(null);
  const [screener, setScreener] = useState(null); // null = loading
  const [err, setErr] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [detailSym, setDetailSym] = useState(null);  // active ticker → in-layout 14-lens detail panel
  const [lensId, setLensId] = useState("overview");
  const [mode, setMode] = useState("SWING");          // SWING · POSITION · INVESTMENT
  const [heroStyle, setHeroStyle] = useState("radar"); // radar · gauge · cone
  const [focus, setFocus] = useState(false);           // focus mode collapses the scan column
  const [scanWidth, setScanWidth] = useState("M");     // S · M · L · XL
  const [railOpen, setRailOpen] = useState(false);     // cc-8 — expand the icon rail to a labeled sidebar
  const mainRef = useRef(null);                        // section-gating overlay target

  useEffect(() => { document.documentElement.setAttribute("data-theme", theme); window.__tier = tier; window.__ssToastFn = toast; });

  // Fetch the same payloads kairos.html consumes.
  useEffect(() => {
    const get = (u) => fetch(u, { cache:"no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status));
    get("/v2/data.critical.json").then(setData).catch(() => get("data.critical.json").then(setData).catch(e => setErr(e)));
    get("/v2/data_earnings.json").then(setEarnings).catch(() => get("data_earnings.json").then(setEarnings).catch(() => setEarnings({})));
    get("/v2/data_misc.json").then(setMisc).catch(() => get("data_misc.json").then(setMisc).catch(() => setMisc({})));
    get("/v2/data_screener.json").then(j => setScreener((j && j.screener) || [])).catch(() => get("data_screener.json").then(j => setScreener((j && j.screener) || [])).catch(() => setScreener([])));
  }, []);

  const toast = (msg) => { setToastMsg(msg); clearTimeout(window.__ssToast); window.__ssToast = setTimeout(() => setToastMsg(null), 2600); };
  const onTicker = (sym, lens) => { setLensId(lens || "overview"); setDetailSym(sym); };

  // Keyboard: lens shortcuts (1-9/letters) + f (focus) when a ticker is open;
  // Esc closes the detail panel first, else resets to home.
  useEffect(() => {
    const lensMap = { "1":"overview","2":"plan","3":"chart","4":"patterns","5":"smc","6":"risk","7":"investment","8":"earnings","9":"options",
                      "t":"technicals","T":"technicals","o":"options","O":"options","i":"tape","I":"tape","m":"mledge","M":"mledge" };
    const onKey = (e) => {
      if (["INPUT","TEXTAREA"].includes(e.target.tagName)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "Escape") { if (detailSym) { setDetailSym(null); } else { setSurface("home"); } return; }
      if (!detailSym) return;
      if (e.key === "f" || e.key === "F") { setFocus(v => !v); return; }
      const next = lensMap[e.key];
      if (next) { e.preventDefault(); setLensId(next); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [detailSym]);

  // Rail click switches workspace AND exits any open ticker (prototype behavior).
  const onPick = (id) => { setDetailSym(null); setSurface(id); };
  const goHome = () => { setDetailSym(null); setSurface("home"); };

  // ── Live section gating (v3) ──────────────────────────────────────
  // Blur/lock any workspace-surface panel whose effective min-tier is above
  // the viewer's tier (or that's disabled), via data-* attrs so we never fight
  // React's ownership of className/children. Re-applies on surface/tier change
  // and whenever the surface re-renders (MutationObserver). Tap a locked panel
  // to preview at that tier.
  useEffect(() => {
    const mainEl = mainRef.current;
    if (!mainEl) return;
    let raf = 0;
    const clear = () => mainEl.querySelectorAll("[data-seclock]").forEach(el => {
      el.removeAttribute("data-seclock"); el.removeAttribute("data-secmsg"); el.removeAttribute("data-sectier");
    });
    const apply = () => {
      raf = 0; clear();
      if (detailSym != null || surface === "users") return; // gate workspace surfaces only
      const groups = window.surfaceSections ? window.surfaceSections(surface) : null;
      if (!groups) return;
      const tiers = window.TIER_LIST || [];
      const cards = Array.from(mainEl.querySelectorAll(".lab-card, .hc"));
      const headText = (c) => { const h = c.querySelector(".lab-card-h, .hc-title"); return h ? h.textContent.toUpperCase() : ""; };
      groups.flatMap(g => g.panels).forEach(p => {
        const off = window.sectionOff(surface, p.id);
        const eff = window.sectionTier(surface, p.id);
        if (!off && eff <= tier) return;
        let nodes = [];
        if (p.sel) nodes = Array.from(mainEl.querySelectorAll(p.sel));
        else if (p.match) { const m = p.match.toUpperCase(); nodes = cards.filter(c => headText(c).includes(m)); }
        nodes.forEach(n => {
          if (off) { n.setAttribute("data-seclock","off"); n.setAttribute("data-secmsg","⊘  SECTION DISABLED"); }
          else { const td = tiers.find(x => x.id === eff) || {}; n.setAttribute("data-seclock","locked"); n.setAttribute("data-sectier",String(eff)); n.setAttribute("data-secmsg",`🔒  TIER ${eff} · ${(td.name||"").toUpperCase()} — TAP TO PREVIEW`); }
        });
      });
    };
    const schedule = () => { if (raf) clearTimeout(raf); raf = setTimeout(apply, 16); };
    schedule();
    const obs = new MutationObserver(schedule);
    obs.observe(mainEl, { childList: true, subtree: true });
    const onClick = (e) => {
      const lock = e.target.closest('[data-seclock="locked"]');
      if (lock && mainEl.contains(lock)) { e.preventDefault(); e.stopPropagation(); const tt = parseInt(lock.getAttribute("data-sectier"),10); if (!isNaN(tt)) setTier(tt); }
    };
    mainEl.addEventListener("click", onClick, true);
    window.__applySectionGates = schedule;
    return () => { obs.disconnect(); mainEl.removeEventListener("click", onClick, true); if (raf) clearTimeout(raf); };
  }, [surface, detailSym, tier]);

  const book = useMemo(() => {
    const p = (data && data.portfolio) || {};
    return { equity: p.equity, cash: p.cash, positions: (p.positions||[]).length };
  }, [data]);

  // Symbols held in the paper book — drives the Watchlist HELD flag.
  const heldSyms = useMemo(() => (((data && data.portfolio && data.portfolio.positions) || [])
    .map(p => (p.ticker || p.symbol || p.sym || "").toUpperCase()).filter(Boolean)), [data]);

  // Universe (shared by the scan column + Watchlist) + the active ticker's detail shape.
  const universe = useMemo(() => mapScannerRows(screener, data), [screener, data]);
  const detailTicker = useMemo(() => detailSym ? toDetailTicker(universe.find(r => r.sym === detailSym), detailSym) : null, [detailSym, universe]);

  // Only the Home surface depends on the (multi-MB) data bundle. Every other
  // surface renders immediately from its own feed — never gate them on home data.
  let body;
  const minTier = SURFACE_TIER[surface] ?? 0;
  if (minTier > tier) {
    body = <SurfacePlaceholder surface={surface} locked={true} minTier={minTier} onHome={goHome} onTier={setTier} />;
  } else if (surface === "users") {
    body = <div className="main-home"><SurfaceUsers /></div>;
  } else if (surface === "signal-scanner") {
    body = <div className="main-home"><SurfaceSignalScanner screener={screener} data={data} onTicker={onTicker} /></div>;
  } else if (surface === "watchlist") {
    body = <div className="main-home"><SurfaceWatchlist onTicker={onTicker} universe={universe} held={heldSyms} /></div>;
  } else if (surface === "options" || surface === "options-flow" || surface === "options-ideas") {
    body = <div className="main-home"><SurfaceOptions onTicker={onTicker} /></div>;
  } else if (surface === "performance") {
    body = <div className="main-home"><SurfacePerformance onTicker={onTicker} /></div>;
  } else if (surface === "strategies") {
    body = <div className="main-home"><SurfaceStrategies onTicker={onTicker} /></div>;
  } else if (surface === "alerts") {
    body = <div className="main-home"><SurfaceAlerts onTicker={onTicker} /></div>;
  } else if (surface === "journal") {
    body = <div className="main-home"><SurfaceJournal onTicker={onTicker} /></div>;
  } else if (surface === "playbook") {
    body = <div className="main-home"><SurfacePlaybook onTicker={onTicker} /></div>;
  } else if (surface === "themes") {
    body = <div className="main-home"><SurfaceThemes onTicker={onTicker} /></div>;
  } else if (surface === "social") {
    body = <div className="main-home"><SurfaceSocial onTicker={onTicker} /></div>;
  } else if (surface !== "home") {
    body = <SurfacePlaceholder surface={surface} locked={false} minTier={minTier} onHome={goHome} onTier={setTier} />;
  } else if (err) {
    body = <div className="ss-err">⚠ Couldn't load <b>/v2/data.critical.json</b> (status {String(err)}).<br/><br/>Start the server so the bundle is served:<br/><code>cd SwingTrade &amp;&amp; python3 server.py</code><br/>then open <code>/v2/Stocksmith.html</code>.</div>;
  } else if (data === undefined) {
    body = <div className="ss-boot"><span className="ss-boot-dot" />Loading Stocksmith · fetching /v2/data.critical.json…</div>;
  } else {
    body = <div className="main-home"><HomeView d={data} earnings={earnings} misc={misc} screener={screener} onTicker={onTicker} toast={toast} onScan={(f)=>{ window.__scanFilter=f; setSurface("signal-scanner"); }} /></div>;
  }

  return (
    <div className={`app ${detailSym && focus ? "app--focus" : ""} ${railOpen ? "app--rail-open" : ""}`}>
      <IconRail activeId={surface} onPick={onPick} tier={tier} expanded={railOpen} onToggle={()=>setRailOpen(v=>!v)} />
      {detailSym && (
        <ScanColumn universe={universe} activeTicker={detailSym} onTicker={onTicker}
                    widthCat={scanWidth} onWidthCat={setScanWidth} collapsed={focus} />
      )}
      <main className="main" ref={mainRef}>
        <CommandBar surface={surface} ticker={detailSym} mode={mode} onMode={setMode}
                    focusMode={focus} onToggleFocus={()=>setFocus(v=>!v)}
                    theme={theme} onTheme={setTheme} tier={tier} onTier={setTier} onHome={goHome} book={book} />
        {detailSym
          ? <DetailPanel ticker={detailTicker} lensId={lensId} onLensId={setLensId} mode={mode}
                         heroStyle={heroStyle} onHeroStyle={setHeroStyle} focusMode={focus}
                         onToggleFocus={()=>setFocus(v=>!v)} onBack={()=>setDetailSym(null)} tier={tier} />
          : body}
      </main>
      {toastMsg && <div className="ss-toast">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
