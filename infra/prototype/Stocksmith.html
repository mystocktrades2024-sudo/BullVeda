function Discovery({ d, screener, onTicker }) {
  // All five groups bound to REAL scan output (data_screener.json) + options_flow_top30.
  if (screener === null) return <div className="ss-empty">Fetching from data_screener.json…</div>;
  const sc = screener || [];
  const near52 = sc.filter(r => r.price && r.week52_high && r.price >= 0.97 * r.week52_high)
    .sort((a, b) => (b.price / b.week52_high) - (a.price / a.week52_high)).slice(0, 3)
    .map(r => [r.ticker, pct((r.price / r.week52_high - 1) * 100, 1)]);
  const squeeze = sc.filter(r => r.squeeze_on).sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 3)
    .map(r => [r.ticker, "ON"]);
  const insider = sc.filter(r => (r.insider_buys || 0) > 0 && (r.insider_sells || 0) === 0)
    .sort((a, b) => (b.insider_buys || 0) - (a.insider_buys || 0)).slice(0, 3)
    .map(r => [r.ticker, `+${r.insider_buys}`]);
  const uoa = (d.options_flow_top30 || []).filter(x => x.status === "STRONG" || x.uoa_calls > 0).slice(0, 3)
    .map(x => [x.ticker, x.put_call_ratio != null ? `pcr ${Number(x.put_call_ratio).toFixed(2)}` : "UOA"]);
  const emerging = sc.filter(r => ["Small", "Mid"].includes(r.cap_bucket) && ["BUY", "WATCH"].includes(r.stage))
    .sort((a, b) => (b.rs_rank || 0) - (a.rs_rank || 0)).slice(0, 3)
    .map(r => [r.ticker, `RS ${r.rs_rank ?? "—"}`]);
  const groups = [
    { tag:"52W HIGH", tone:"gn",     items: near52,   src:"screener · week52_high" },
    { tag:"SQUEEZE",  tone:"amb",    items: squeeze,  src:"screener · squeeze_on" },
    { tag:"INSIDER",  tone:"cy",     items: insider,  src:"screener · insider_buys" },
    { tag:"UOA",      tone:"violet", items: uoa,      src:"options_flow_top30" },
    { tag:"EMERGING", tone:"copper", items: emerging, src:"screener · small/mid-cap × RS rank" },
  ];
  return (
    <div className="disc">
      {groups.map((g, i) => (
        <div key={i} className="disc-grp">
          <div className={`disc-tag mono disc-tag--${g.tone}`}>{g.tag}</div>
          <div className="disc-items">
            {g.items.length
              ? g.items.map(([sym, val], j) => (
                  <button key={j} className="disc-chip" onClick={() => onTicker(sym)} title={g.src}>
                    <span className="mono"><b>{sym}</b></span><span className={`mono disc-val disc-val--${g.tone}`}>{val}</span>
                  </button>
                ))
              : <span className="ss-empty" style={{ padding:"2px 4px" }}>none in today's scan</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

  const wl = (earnings && earnings.earnings_watchlist) || [];
  const beats = (earnings && earnings.earnings_beat_predictions) || {};
  const held = new Set(((d.portfolio && d.portfolio.positions) || []).map(p => (p.ticker||p.symbol||"").toUpperCase()));

function TopStories({ d, screener, onTicker }) {
  // Live headlines from /api/news (EODHD) for the most-covered names in today's scan.
  const [news, setNews] = useState(null);
  // Build a sentiment lookup from the screener (sent_score 1-3) to color rows.
  const sentBy = useMemo(() => {
    const m = {}; (screener || []).forEach(r => { if (r.sent_score != null) m[r.ticker] = r.sent_score; });
    return m;
  }, [screener]);
  const tickers = useMemo(() => {
    const top = (d._news_top_tickers || []).slice(0, 4);
    return top.length ? top : ((screener || []).slice(0, 4).map(r => r.ticker));
  }, [d, screener]);
  useEffect(() => {
    let dead = false;
    if (!tickers.length) { setNews([]); return; }
    Promise.all(tickers.map(t => fetch(`/api/news?t=${encodeURIComponent(t)}&limit=3`, { cache:"no-store" })
      .then(r => r.ok ? r.json() : null).catch(() => null)))
      .then(res => {
        if (dead) return;
        const rows = [];
        res.forEach(r => { if (r && r.articles) r.articles.slice(0, 2).forEach(a => rows.push({ sym: r.ticker, ...a })); });
        rows.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
        setNews(rows.slice(0, 6));
      }).catch(() => { if (!dead) setNews([]); });
    return () => { dead = true; };
  }, [tickers.join(",")]);
  if (news === null) return <div className="ss-empty">Fetching live headlines from /api/news (EODHD)…</div>;
  if (!news.length) return <EmptyState>No headlines returned for today's most-covered names. Source: /api/news (EODHD) · requires the server running.</EmptyState>;
  return (
    <div className="ts">
      {news.map((s, i) => {
        const ss = sentBy[s.sym];
        const tone = ss == null ? "ink" : ss >= 3 ? "gn" : ss <= 1 ? "rd" : "amb";
        const time = String(s.date || "").slice(11, 16) || String(s.date || "").slice(5, 10);
        return (
          <div key={i} className={`ts-row ts-${tone}`} onClick={() => s.sym && onTicker(s.sym)}>
            <div className="ts-top">
              <span className="ts-time mono dim2">{time}</span>
              <span className="ts-src mono dim2">{s.source || "EODHD"}</span>
              {s.sym && <span className="ts-sym mono">{s.sym}</span>}
              {ss != null && <span className={`ts-sent mono ${ss >= 2 ? "up" : "dn"}`}>sent {ss}</span>}
            </div>
            <div className="ts-head">{s.title}</div>
          </div>
        );
      })}
    </div>
  );
}

function SignalFeed({ d, screener, onTicker }) {
  if (screener === null) return <div className="ss-empty">Fetching from data_screener.json…</div>;
  const sc = screener || [];
  const events = [];
  // Today's BUY signals — real, from the scan.
  sc.filter(r => r.stage === "BUY").sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 5).forEach(r => {
    const tier = r.conviction_tier ? ` · ${r.conviction_tier}` : "";
    events.push({ tone:"gn", tag:"BUY", sym:r.ticker, text:`${r.decision_label || r.setup || "BUY signal"} · score ${r.score}${tier}` });
  });
  // Insider-cluster names — real.
  sc.filter(r => (r.insider_buys || 0) >= 3 && (r.insider_sells || 0) === 0)
    .sort((a, b) => (b.insider_buys || 0) - (a.insider_buys || 0)).slice(0, 2).forEach(r => {
      events.push({ tone:"cy", tag:"INSIDER", sym:r.ticker, text:`Insider cluster · ${r.insider_buys} buys, 0 sells${r.insider_days ? ` · ${r.insider_days}d` : ""}` });
    });
  // Setup drift alerts — real.
  (d.setup_drift_alerts || []).forEach(a => {
    const txt = typeof a === "string" ? a : (a.message || a.text || `${a.setup || ""} drift ${a.metric || ""}`.trim());
    events.push({ tone:"amb", tag:"DRIFT", text: txt });
  });
  // Bundle event — real.
  if (d.run_timestamp) events.push({ tone:"ink", tag:"BUNDLE", t:(d.run_timestamp||"").slice(0,5),
    text:`Daily bundle · ${d.scan_count!=null?d.scan_count.toLocaleString():"—"} ranked · ${d.buy_count??"—"} BUY · ${d.watch_count??"—"} WATCH · ${d.killed_count??"—"} AVOID` });
  if (!events.length) return <EmptyState>No new BUY signals, insider clusters or drift alerts in today's scan. Source: data_screener.json + setup_drift_alerts.</EmptyState>;
  return (
    <div className="sf">
      {events.map((e, i) => (
        <div key={i} className={`sf-row sf-${e.tone}`} onClick={() => e.sym && onTicker(e.sym)} style={{ cursor: e.sym ? "pointer" : "default" }}>
          <span className="sf-time mono dim2">{e.t || ""}</span>
          <span className={`sf-tag mono sf-tag--${e.tone}`}>{e.tag}</span>
          {e.sym && <span className="sf-sym mono"><b>{e.sym}</b></span>}
          <span className="sf-text mono" style={{ gridColumn: e.sym ? "4" : "3 / -1" }}>{e.text}</span>
        </div>
      ))}
    </div>
  );
}

const UM_SURFACE_LABELS = {
  home:"Home", "signal-scanner":"Signal Scanner", watchlist:"Watchlist", playbook:"Playbook",
  alerts:"Alerts", premarket:"Pre-Market", "sector-etf":"ETFs", "options-flow":"Options Flow",
  news:"News · Sentiment", elite:"Elite Picks", strategies:"Strategies", themes:"Themes",
  momentum:"Momentum", performance:"Performance", "ai-predict":"AI Predictions", insider:"Insider Trading",
  journal:"Trade Journal", social:"Social Sentiment", "portfolio-srf":"Portfolio", users:"User Management",
};
const UM_LENS_LABELS = {
  overview:"Overview", plan:"Plan · Ticket", chart:"Chart", technicals:"Technicals", patterns:"Patterns", smc:"SMC",
  investment:"Investment", risk:"Risk", earnings:"Earnings", options:"Options", portfolio:"Portfolio", tape:"Tape · Flow",
  track:"Track Record", mledge:"AI Edge",
};
const api = (u, opts) => fetch(u, { credentials:"same-origin", headers:{ "Content-Type":"application/json" }, ...opts });

function SurfaceUsers() {
  const [view, setView] = useState("users");
  const [users, setUsers] = useState(null);   // null = loading
  const [roles, setRoles] = useState([]);
  const [err, setErr] = useState(null);
  const [q, setQ] = useState("");
  const [fTier, setFTier] = useState("all");
  const [editing, setEditing] = useState(null);
  const tiers = TIER_LIST;

  // role.id -> commercial tier (admin forced to 5; ladder roles carry .tier)
  const roleTier = useMemo(() => {
    const m = {}; roles.forEach(r => { m[r.id] = (r.id === "admin") ? 5 : (r.tier ?? null); });
    return m;
  }, [roles]);

  const load = () => {
    setUsers(null); setErr(null);
    Promise.all([
      api("/api/users").then(r => r.ok ? r.json() : Promise.reject(r.status)),
      api("/api/roles").then(r => r.ok ? r.json() : Promise.reject(r.status)),
    ]).then(([u, r]) => { setRoles(r.roles || []); setUsers(u.users || []); })
      .catch(e => setErr(e));
  };
  useEffect(load, []);

  const rows = useMemo(() => {
    let r = (users || []).map(u => ({
      ...u,
      _name: u.display_name || u.username,
      _tier: roleTier[u.role] ?? null,
      _status: u.disabled ? "suspended" : "active",
    }));
    if (q.trim()) { const s = q.toLowerCase(); r = r.filter(u => (u._name + u.email + u.username).toLowerCase().includes(s)); }
    if (fTier !== "all") r = r.filter(u => u._tier === +fTier);
    return r;
  }, [users, roleTier, q, fTier]);

  const counts = useMemo(() => tiers.map(t => ({ ...t, n: (users || []).filter(u => (roleTier[u.role] ?? null) === t.id).length })), [users, roleTier, tiers]);

  const tierToRole = { 0:"free", 1:"starter", 2:"core", 3:"pro", 4:"elite", 5:"admin" };
  const assignTier = (username, tierId) => {
    const role = tierToRole[tierId]; if (!role) return;
    api(`/api/users/${username}`, { method:"PATCH", body: JSON.stringify({ role }) }).then(() => load());
  };
  // Modal mirrors the prototype (Full name · Email · Tier · Status · MFA). The
  // backend POST needs username+password the prototype doesn't collect, so on
  // create we derive a username from the email and mint a temp password.
  const genPw = () => {                       // guaranteed ≥ 8 chars + complexity (backend rejects < 8)
    let s = ""; while (s.length < 10) s += Math.random().toString(36).slice(2);
    return "Aa1!" + s.slice(0, 10);           // 14 chars: upper · lower · digit · symbol
  };
  const deriveUsername = (email) => {
    let base = (String(email).split("@")[0] || "user").toLowerCase().replace(/[^a-z0-9_-]/g, "");
    if (!/^[a-z]/.test(base)) base = "u" + base;
    base = base.slice(0, 24) || "user";
    const taken = new Set((users || []).map(x => x.username));
    let name = base, i = 1; while (taken.has(name)) name = base + (i++);
    return name;
  };
  const saveUser = (u) => {
    const role = tierToRole[u.tier] || "starter";
    const disabled = u.status === "suspended";
    if (u._isNew) {
      const username = deriveUsername(u.email), password = genPw();
      api("/api/users", { method:"POST", body: JSON.stringify({ username, password, display_name: u.name, email: u.email, role, disabled, mfa: !!u.mfa }) })
        .then(r => { if (!r.ok) return r.text().then(t => alert("Create failed: " + t));
          setEditing(null); load();
          alert(`User created.\n\nUsername: ${username}\nTemp password: ${password}\n\nShare these — they sign in and reset the password.`); });
    } else {
      api(`/api/users/${u.username}`, { method:"PATCH", body: JSON.stringify({ display_name: u.name, email: u.email, role, disabled, mfa: !!u.mfa }) })
        .then(r => { if (!r.ok) return r.text().then(t => alert("Save failed: " + t)); setEditing(null); load(); });
    }
  };
  const deleteUser = (username) => {
    if (!confirm(`Delete user "${username}"? This revokes their access.`)) return;
    api(`/api/users/${username}`, { method:"DELETE" }).then(r => { if (!r.ok) return r.text().then(t => alert("Delete failed: " + t)); setEditing(null); load(); });
  };

  const openNew = () => setEditing({ _isNew:true, name:"", email:"", tier:1, status:"active", mfa:false });
  const openEdit = (u) => setEditing({ _isNew:false, username:u.username, name:u._name, email:u.email, tier:u._tier ?? 1, status:u._status, mfa:!!u.mfa, is_owner:u.is_owner });

  return (
    <div className="surface wsx wsx--amb um">
      <div className="wsx-hdr">
        <div className="wsx-hdr-l">
          <div className="wsx-eyebrow mono">ADMIN · USER MANAGEMENT · RBAC</div>
          <h1 className="wsx-title mono">User Management</h1>
          <div className="wsx-sub mono dim2">add &amp; edit users · assign tiers · configure tier access · <span className="dim">live · /api/users</span></div>
        </div>
        <div className="wsx-hdr-r">
          {view === "users" && <button className="btn btn--primary btn--sm" onClick={openNew}>＋ Add user</button>}
          <FreshnessPill state={err ? "empty" : users === null ? "loading" : "live"} age={users ? `${users.length} users` : ""} />
        </div>
      </div>

      <div className="um-viewtabs">
        <button className={`um-vt ${view==="users"?"is-on":""}`} onClick={()=>setView("users")}>Users &amp; Tiers</button>
        <button className={`um-vt ${view==="access"?"is-on":""}`} onClick={()=>setView("access")}>Tier Access · Configure</button>
      </div>

      {view === "users" ? (
        err ? (
          <div className="ss-err">⚠ Couldn't load users (HTTP {String(err)}). <code>/api/users</code> requires an <b>admin</b> login — sign in as an admin user (e.g. gari). Server enforces this regardless of UI tier.</div>
        ) : users === null ? (
          <div className="ss-empty">Fetching from /api/users + /api/roles…</div>
        ) : (
        <>
          <div className="um-tiers">
            {counts.map(t => (

            Tier = backend <b>role</b> (free→elite + admin). Changes call <code>PATCH /api/users</code> and gate every surface/lens via the RBAC matrix.

        <>
          <TierAccessConfig tiers={tiers} />

      {editing && <UserEditModal user={editing} tiers={tiers} onSave={saveUser} onDelete={deleteUser} onClose={()=>setEditing(null)} />}

  );
}

/* ════════════════════════════════════════════════════════════════
   SIGNAL SCANNER — prototype layout, wired to real data_screener.json
   rows + setup_family_stats (n/WR/PF/Wilson) + setup_mechanisms.
   ════════════════════════════════════════════════════════════════ */
function mapScannerRows(screener, data) {
  const sfs = (data && data.setup_family_stats) || {};
  const mech = (data && data.setup_mechanisms) || {};
  const tfsnDot = (s, m) => { const ratio = m ? s / m : 0; return ratio >= 0.6 ? 2 : ratio >= 0.4 ? 1 : 0; };
  const mtfState = (v) => v == null ? "flat" : v > 0.2 ? "up" : v < -0.2 ? "down" : "flat";
  return (screener || []).map(r => {
    const st = sfs[r.setup] || {};
    const chg = r.pct_chg != null ? r.pct_chg : (r.perf_1d != null ? r.perf_1d * 100 : 0);
    const tags = r.catalyst_tags || [];
    const signals = [];
    if (r.catalyst_tier === 1 || tags.includes("BREAKOUT") || tags.includes("VCP")) signals.push("🔥");
    if (tags.includes("UOA") || tags.includes("MOMENTUM") || tags.includes("NEWS_MOMENTUM")) signals.push("⚡");
    return {
      sym: r.ticker, name: r.name || r.ticker, sector: r.sector || "—",
      tfsn: [tfsnDot(r.tech_score, r.tech_max), tfsnDot(r.fund_score, r.fund_max), tfsnDot(r.smc_score, r.smc_max), tfsnDot(r.sent_score, r.sent_max)],
      mechanism: mech[r.setup] || r.trade_thesis || r.thesis || r.setup || "—",
      score: Math.round(r.score || 0),
      verdict: r.stage === "SELL" ? "AVOID" : (r.stage || "WATCH"),
      tier: r.conviction_tier || (r.score >= 75 ? "T1" : r.score >= 60 ? "T2" : "T3"),
      setup: r.setup || "—",
      eq: r.entry_quality || "—",
      cat: r.catalyst_tier != null ? ("T" + r.catalyst_tier) : "—",
      price: r.price || 0, chg,
      rr: r.rr != null ? Number(r.rr).toFixed(1) : "—",
      stop: r.stop != null ? Number(r.stop).toFixed(2) : "—",
      entry: r.entry_lo != null ? Number(r.entry_lo).toFixed(2) : (r.price ? Number(r.price).toFixed(2) : "—"),
      t1plan: r.t1 != null ? Number(r.t1).toFixed(2) : "—",
      atr: (r.stop != null && r.price != null) ? Math.abs(r.price - r.stop).toFixed(2) : "—",
      rvol: r.rvol != null ? Number(r.rvol).toFixed(2) : "0.00",
      mtf: [
        (r.macd_signal === "bullish" || r.ema_signal === "bullish") ? "up" : (r.macd_signal === "bearish" ? "down" : "flat"),
        mtfState(r.perf_4h), mtfState(r.perf_1d), r.weekly_bull ? "up" : "down",
      ],
      regWR: st.win_rate != null ? Math.round(st.win_rate * 100) : null,
      rs: r.rs_rank != null ? r.rs_rank : 0,
      wlb: st.wr_low_95 != null ? Math.round(st.wr_low_95 * 100) : null,
      n: st.trades != null ? st.trades : null,
      pf: st.profit_factor != null ? Number(st.profit_factor).toFixed(1) : "—",
      iv: r.iv_rank != null ? Math.round(r.iv_rank) : null,
      sent: r.sent_score != null ? r.sent_score : 0,
      er: r.earn_days != null ? r.earn_days : null,
      insider: r.insider_buys || 0,
      signals,
    };
  });
}

function MTFDots({ states }) {
  const labels = ["1H","4H","1D","1W"];
  return <span className="mtf-dots">{states.map((s,i)=><span key={i} className={`mtf-dot mtf-${s}`} title={`${labels[i]} · ${s}`} />)}</span>;
}
function SsSpark({ sym, chg }) {
  const data = useMemo(() => { const code=(sym?.charCodeAt(0)||65); const a=[]; let v=0; for(let i=0;i<24;i++){v+=(Math.sin(i*0.4+code)+Math.cos(i*0.7))*0.5+(chg||0)*0.06;a.push(v);} return a; }, [sym, chg]);
  return <Sparkline data={data} color={`var(--${chg>=0?"gn":"rd"})`} w={70} h={20} />;
}
function ScanTh({ col, sort, onClick, r, children }) {
  const active = sort.col === col;
  return <th className={`${r?"r":""} ss-th ${active?"is-active":""}`} onClick={()=>onClick(s=>s.col===col?{col,dir:-s.dir}:{col,dir:-1})}><span>{children}</span>{active && <span className="ss-th-arrow mono">{sort.dir>0?"▲":"▼"}</span>}</th>;
}

function SurfaceSignalScanner({ screener, data, onTicker }) {
  const universe = useMemo(() => mapScannerRows(screener, data), [screener, data]);
  const watch = useWatchlist();   // ★ membership — re-renders when the user stars/unstars
  const [tab, setTab] = useState("scanner");
  const [pills, setPills] = useState({});
  const [side, setSide] = useState(() => window.__scanFilter || "ALL");
  const [sort, setSort] = useState({ col: "score", dir: 1 });
  const [secF, setSecF] = useState("all");
  const [setupF, setSetupF] = useState("all");
  const [q, setQ] = useState("");
  const [selected, setSelected] = useState(() => new Set());
  React.useEffect(() => { if (window.__scanFilter) { setSide(window.__scanFilter); setPills({}); setTab("scanner"); window.__scanFilter = null; } }, []);
  const toggleSel = (sym) => setSelected(s => { const n = new Set(s); n.has(sym) ? n.delete(sym) : n.add(sym); return n; });
  const clearSel = () => setSelected(new Set());

  const sectorOpts = useMemo(() => ["all", ...Array.from(new Set(universe.map(r => r.sector))).sort()], [universe]);
  const setupOpts = useMemo(() => ["all", ...Array.from(new Set(universe.map(r => r.setup).filter(Boolean))).sort()], [universe]);

  const TABS = [
    { id:"scanner",   label:"SCANNER",   count: universe.length },
    { id:"top-picks", label:"TOP PICKS", count: universe.filter(t=>t.score>=75).length, tone:"copper" },
    { id:"fresh",     label:"FRESH",     count: universe.filter(t=>t.eq==="FRESH").length, tone:"cy" },
    { id:"earnings",  label:"EARNINGS",  count: universe.filter(t=>t.er!=null&&t.er<=14).length, tone:"amb" },
    { id:"surges",    label:"SURGES",    count: universe.filter(t=>parseFloat(t.rvol)>=1.5).length, tone:"gn" },
    { id:"killed",    label:"KILLED",    count: universe.filter(t=>t.verdict==="AVOID").length, tone:"rd" },
  ];
  const PILLS = [
    { id:"top20", label:"★ TOP 20% SCORE" }, { id:"breakout", label:"🔥 BREAKOUT" }, { id:"t1", label:"⚡ T1 CATALYST" },
    { id:"er14", label:"📅 ER ≤14D" }, { id:"insider", label:"💰 INSIDER" }, { id:"rvol", label:"🔥 RVOL ≥1.5×" },
  ];

  const rows = useMemo(() => {
    let r = universe;
    if (tab === "top-picks") r = r.filter(t => t.score >= 75);
    if (tab === "earnings")  r = r.filter(t => t.er != null && t.er <= 14);
    if (tab === "surges")    r = r.filter(t => parseFloat(t.rvol) >= 1.5);
    if (tab === "killed")    r = r.filter(t => t.verdict === "AVOID");
    if (tab === "fresh")     r = r.filter(t => t.eq === "FRESH");
    if (side === "BUY")   r = r.filter(t => t.verdict === "BUY");
    if (side === "WATCH") r = r.filter(t => t.verdict === "WATCH");
    if (side === "SHORT") r = r.filter(t => t.verdict === "AVOID");
    if (pills.top20)    r = r.filter(t => t.score >= 70);
    if (pills.rvol)     r = r.filter(t => parseFloat(t.rvol) >= 1.5);
    if (pills.er14)     r = r.filter(t => t.er != null && t.er <= 14);
    if (pills.insider)  r = r.filter(t => t.insider > 0);
    if (pills.t1)       r = r.filter(t => t.tier === "T1");
    if (pills.breakout) r = r.filter(t => (t.setup||"").toLowerCase().includes("break") || t.signals.includes("🔥"));
    if (secF !== "all")   r = r.filter(t => t.sector === secF);
    if (setupF !== "all") r = r.filter(t => t.setup === setupF);
    if (q.trim()) { const s = q.toLowerCase(); r = r.filter(t => (t.sym + t.name).toLowerCase().includes(s)); }
    r = [...r].sort((a, b) => { const aN = parseFloat(a[sort.col]), bN = parseFloat(b[sort.col]); if (!isNaN(aN) && !isNaN(bN)) return (aN - bN) * sort.dir; return String(a[sort.col]).localeCompare(String(b[sort.col])) * sort.dir; });
    return r;
  }, [universe, tab, pills, side, sort, secF, setupF, q]);

  if (screener === null) return <div className="ss-empty" style={{padding:"40px"}}>Fetching scan universe from /v2/data_screener.json…</div>;

  return (
    <div className="surface ss-surface ss2-surface">
      <div className="ss2-tabs">
        {TABS.map(t => (
          <button key={t.id} className={`ss2-tab ${tab===t.id?"is-on":""}`} onClick={()=>setTab(t.id)}>
            <span className="ss2-tab-l">{t.label}</span>
            <span className={`ss2-tab-c mono ${t.tone?`ss2-c--${t.tone}`:""}`}>{t.count}</span>
          </button>
        ))}
      </div>
      <div className="ss2-pills">
        {PILLS.map(p => <button key={p.id} className={`ss2-pill ${pills[p.id]?"is-on":""}`} onClick={()=>setPills(s=>({...s,[p.id]:!s[p.id]}))}>{p.label}</button>)}
        <button className="ss2-reset mono" onClick={()=>{setPills({});setTab("scanner");setSide("ALL");setSecF("all");setSetupF("all");}} title="Clear all filters">↺ RESET</button>
      </div>
      <div className="ss2-toolbar">
        <span className="mono"><b className="copper">{rows.length}</b> <span className="dim2">picks</span></span>
        <div className="ss2-side">
          {["BUY","WATCH","SHORT","ALL"].map(s => <button key={s} className={`ss2-side-btn ss2-side--${s.toLowerCase()} ${side===s?"is-on":""}`} onClick={()=>setSide(s)}>{s}</button>)}
        </div>
        <span className="mono dim2">Sector:</span>
        <select className="ss2-sel mono" value={secF} onChange={e=>setSecF(e.target.value)}>{sectorOpts.map(s=><option key={s} value={s}>{s==="all"?"All sectors":s}</option>)}</select>
        <span className="mono dim2">Setup:</span>
        <select className="ss2-sel mono" value={setupF} onChange={e=>setSetupF(e.target.value)}>{setupOpts.map(s=><option key={s} value={s}>{s==="all"?"All setups":s}</option>)}</select>
        <input className="ss2-search mono" placeholder="⌕ search ticker / name…" value={q} onChange={e=>setQ(e.target.value)} />
      </div>
      <div className="ss2-tbl-wrap">
        <table className="dtable ss2-tbl">
          <thead><tr>
            <th><input type="checkbox" checked={rows.length>0 && selected.size===rows.length} onChange={e=>{ if(e.target.checked) setSelected(new Set(rows.map(r=>r.sym))); else clearSel(); }} onClick={e=>e.stopPropagation()} /></th>
            <ScanTh col="sym" sort={sort} onClick={setSort}>TICKER</ScanTh>
            <th>NAME</th><th>SECTOR</th><th>T.F.S.N</th><th>MECHANISM</th>
            <ScanTh col="score" sort={sort} onClick={setSort} r>SCORE</ScanTh>
            <th>VERDICT</th><th>TIER</th><th>SETUP</th><th>EQ</th><th>CAT</th>
            <ScanTh col="price" sort={sort} onClick={setSort} r>PRICE</ScanTh>
            <ScanTh col="chg" sort={sort} onClick={setSort} r>%CHG</ScanTh>
            <ScanTh col="rr" sort={sort} onClick={setSort} r>R:R</ScanTh>
            <th>PLAN</th>
            <ScanTh col="atr" sort={sort} onClick={setSort} r>ATR</ScanTh>
            <ScanTh col="rvol" sort={sort} onClick={setSort} r>RVOL</ScanTh>
            <th>MTF · 1H·4H·1D·1W</th>
            <ScanTh col="regWR" sort={sort} onClick={setSort} r>REG WR</ScanTh>
            <ScanTh col="rs" sort={sort} onClick={setSort} r>RS</ScanTh>
            <ScanTh col="wlb" sort={sort} onClick={setSort} r>W% LB</ScanTh>
            <ScanTh col="n" sort={sort} onClick={setSort} r>N</ScanTh>
            <ScanTh col="pf" sort={sort} onClick={setSort} r>PF</ScanTh>
            <ScanTh col="iv" sort={sort} onClick={setSort} r>IV%</ScanTh>
            <ScanTh col="sent" sort={sort} onClick={setSort} r>SENT</ScanTh>
            <ScanTh col="er" sort={sort} onClick={setSort} r>ER</ScanTh>
            <th>SIGNALS</th><th>SPARK</th>
          </tr></thead>
          <tbody>{rows.map((t, i) => (
            <tr key={t.sym + i} onClick={()=>onTicker(t.sym)}>
              <td className="ss2-chk"><input type="checkbox" checked={selected.has(t.sym)} onChange={()=>toggleSel(t.sym)} onClick={e=>e.stopPropagation()} /></td>
              <td className="mono ss2-sym"><span className={`ss2-star ${watch.includes(t.sym)?"is-on":""}`} title={watch.includes(t.sym)?"Remove from watchlist":"Add to watchlist"} onClick={e=>{ e.stopPropagation(); wlToggle(t.sym); }}>★</span><b>{t.sym}</b></td>
              <td className="mono dim">{t.name}</td>
              <td className="dim2 mono">{t.sector}</td>
              <td className="mono dim"><span className="ss2-tfsn">{t.tfsn.map((v,k)=><span key={k} className={`ss2-tfsn-dot ss2-tfsn--${v===2?"pass":v===1?"neut":"fail"}`} title={["Tech","Fund","SMC","News"][k]} />)}</span></td>
              <td className="mono dim2">{t.mechanism}</td>
              <td className="r"><span className={`ss2-score ss2-score--${t.score>=75?"gn":t.score>=60?"amb":"rd"}`}>{t.score}</span></td>
              <td><Pill tone={t.verdict==="BUY"?"gn":t.verdict==="AVOID"?"rd":"amb"} small>{t.verdict}</Pill></td>
              <td><span className={`ss2-tier ss2-tier--${String(t.tier).toLowerCase()}`}>{t.tier}</span></td>
              <td className="mono dim">{t.setup}</td>
              <td><span className={`ss2-eq ss2-eq--${t.eq==="EXTENDED"?"amb":t.eq==="MISSED"?"rd":"ink"}`}>{t.eq}</span></td>
              <td><span className="ss2-cat mono">{t.cat}</span></td>
              <td className="r mono tabular">${(t.price||0).toFixed(2)}</td>
              <td className={`r mono tabular ${t.chg>=0?"up":"dn"}`}>{t.chg>=0?"+":""}{(t.chg||0).toFixed(2)}%</td>
              <td className="r mono tabular"><b className={parseFloat(t.rr)>=2?"up":""}>{t.rr}</b></td>
              <td className="mono ss2-plan"><span className="dn">${t.stop}</span><span className="copper">${t.entry}</span><span className="up">${t.t1plan}</span></td>
              <td className="r mono tabular dim">{t.atr}</td>

/* ── shared lens atoms (CSS already ported into <style>) ─────────── */
const __stateStore = {};
function useStateToggle(key, initial = "live") {
  const [v, setV] = useState(() => __stateStore[key] || initial);
  useEffect(() => {
    const handler = (e) => { if (e.detail.key === key) setV(e.detail.value); };
    window.addEventListener("state-toggle", handler);
    return () => window.removeEventListener("state-toggle", handler);
  }, [key]);
  return { value: v };
}
function StateToggle({ name }) {
  const [v, setV] = useState(() => __stateStore[name] || "live");
  const set = (val) => { __stateStore[name] = val; setV(val); window.dispatchEvent(new CustomEvent("state-toggle", { detail:{ key:name, value:val } })); };
  return (
    <div className="state-toggle" title="Cycle the 4 data states for this section">
      {[{v:"live",label:"Live",tone:"gn"},{v:"loading",label:"···",tone:"ink"},{v:"empty",label:"Empty",tone:"ink"},{v:"scaffold",label:"Scaf",tone:"amb"}].map(opt =>
        <button key={opt.v} className={`st-btn ${v===opt.v?`is-on st-${opt.tone}`:""}`} onClick={()=>set(opt.v)}>{opt.label}</button>
      )}
    </div>
  );
}
function SectionHeader({ n, title, sub, freshness="live", freshnessAge, right, style="copper" }) {
  return (
    <div className={`sec-hdr sec-hdr--${style==="minimal"?"min":style==="sticky-rail"?"rail":"copper"}`}>
      {style==="sticky-rail" ? <div className="sec-hdr-rail-num">§{String(n).padStart(2,"0")}</div>
        : style!=="minimal" ? <div className="sec-hdr-num">§{n}</div> : null}
      <div className="sec-hdr-text">
        <div className="sec-hdr-title">{title}</div>
        {sub && <div className="sec-hdr-sub">{sub}</div>}
      </div>

    </div>

}
function WilsonPill({ n, winRate, lb }) {

      <span className="wilson-block"><span className="wilson-k">wr</span><span className="wilson-v mono">{(winRate*100).toFixed(0)}%</span></span>
      <span className="wilson-block"><span className="wilson-k">wilson lb</span><span className="wilson-v mono">{(lb*100).toFixed(0)}%</span></span>
      {low && <span className="wilson-warn">n&lt;30 · ACT WITH CAUTION</span>}

}
function KpiTile({ label, value, unit, sub, tone="ink", delta, spark, style="bare" }) {

      {style==="sparkline" && spark && <div className="kpi-spark"><Sparkline data={spark} color={`var(--${tone==="ink"?"ink-3":tone})`} /></div>}
      {style==="delta" && delta!=null && <div className={`kpi-delta mono ${delta>=0?"up":"dn"}`}>{delta>=0?"▲":"▼"} {Math.abs(delta).toFixed(2)}%</div>}

}
function CrossLens({ lead, cells }) {

function StateWrap({ state, source, scaffoldOf, children, minH=80 }) {
  if (state==="live") return children;
  if (state==="loading") return <div className="state state--loading" style={{minHeight:minH}}><div className="state-spinner" /><div className="state-msg mono">Fetching from {source||"feed"}…</div></div>;

  return children;
}
function Gauge({ value, max=100, label, size=132 }) {
  const cx=size/2, cy=size*0.72, r=size*0.42, startAngle=Math.PI, endAngle=2*Math.PI;
  const pct=Math.max(0,Math.min(1,value/max)), angle=startAngle+(endAngle-startAngle)*pct;
  const x1=cx+r*Math.cos(startAngle), y1=cy+r*Math.sin(startAngle), x2=cx+r*Math.cos(angle), y2=cy+r*Math.sin(angle);
  const xE=cx+r*Math.cos(endAngle), yE=cy+r*Math.sin(endAngle), large=pct>0.5?1:0;
  const tone=value>=70?"var(--gn)":value>=50?"var(--amb)":"var(--rd)", gid=`g-${value}-${size}`;
  return (
    <svg width={size} height={size*0.86} viewBox={`0 0 ${size} ${size*0.86}`} style={{overflow:"visible"}}>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor={tone} stopOpacity="0.5" /><stop offset="100%" stopColor={tone} stopOpacity="1" /></linearGradient></defs>
      <path d={`M ${x1} ${y1} A ${r} ${r} 0 1 1 ${xE} ${yE}`} stroke="var(--line)" strokeWidth="10" fill="none" strokeLinecap="round" />
      <path d={`M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`} stroke={`url(#${gid})`} strokeWidth="10" fill="none" strokeLinecap="round" style={{filter:`drop-shadow(0 0 10px ${tone})`}} />
      <circle cx={x2} cy={y2} r="6" fill={tone} style={{filter:`drop-shadow(0 0 8px ${tone})`}} />
      <text x={cx} y={cy-6} textAnchor="middle" className="mono" fontSize={size*0.28} fontWeight="500" fill="var(--ink)">{value}</text>
      <text x={cx} y={cy+14} textAnchor="middle" className="mono label-cap" fontSize="9" letterSpacing="0.14em" fill="var(--ink-3)">{label}</text>
    </svg>
  );
}
function Radar({ pillars, size=200 }) {
  const keys=["technical","fundamental","catalyst","risk","edge"], labels=["TECH","FUND","CAT","RISK","EDGE"];
  const cx=size/2, cy=size/2, r=size*0.36;
  const pts=keys.map((k,i)=>{ const a=-Math.PI/2+(i*2*Math.PI)/keys.length, v=(pillars[k]||0)/100; return [cx+r*v*Math.cos(a), cy+r*v*Math.sin(a)]; });
  const axisPts=keys.map((_,i)=>{ const a=-Math.PI/2+(i*2*Math.PI)/keys.length; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; });
  const labelPts=keys.map((_,i)=>{ const a=-Math.PI/2+(i*2*Math.PI)/keys.length; return [cx+(r+14)*Math.cos(a), cy+(r+14)*Math.sin(a)]; });
  const polyPts=pts.map(p=>p.join(",")).join(" "), gid=`rad-${size}`;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{overflow:"visible"}}>
      <defs><radialGradient id={gid} cx="50%" cy="50%" r="50%"><stop offset="0%" stopColor="var(--copper)" stopOpacity="0.45" /><stop offset="100%" stopColor="var(--copper)" stopOpacity="0.05" /></radialGradient></defs>
      {[0.25,0.5,0.75,1].map(f => <polygon key={f} points={keys.map((_,i)=>{ const a=-Math.PI/2+(i*2*Math.PI)/keys.length; return [cx+r*f*Math.cos(a), cy+r*f*Math.sin(a)].join(","); }).join(" ")} fill="none" stroke="var(--line)" strokeWidth={f===1?"1":"0.5"} />)}
      {axisPts.map((p,i)=><line key={i} x1={cx} y1={cy} x2={p[0]} y2={p[1]} stroke="var(--line)" strokeWidth="0.5" />)}
      <polygon points={polyPts} fill={`url(#${gid})`} stroke="var(--copper)" strokeWidth="1.6" style={{filter:"drop-shadow(0 0 8px var(--copper))"}} />
      {pts.map((p,i)=><circle key={i} cx={p[0]} cy={p[1]} r="3" fill="var(--copper)" style={{filter:"drop-shadow(0 0 6px var(--copper))"}} />)}
      {labelPts.map((p,i)=><text key={i} x={p[0]} y={p[1]+3} textAnchor="middle" className="mono label-cap" fontSize="9" letterSpacing="0.14em" fill="var(--ink-3)">{labels[i]}</text>)}
    </svg>
  );
}
function Cone({ lo, mid, hi, current=0, w=280, h=110 }) {
  const pad=14, innerW=w-pad*2, innerH=h-pad*2, yMid=pad+innerH/2;
  const span=Math.max(Math.abs(lo),Math.abs(hi))*1.25||1;
  const yFor=(v)=>yMid-(v/span)*(innerH/2);
  const path=(v)=>`M ${pad} ${yMid} Q ${pad+innerW*0.4} ${yFor(v)}, ${w-pad} ${yFor(v)}`;
  const gid=`cone-${w}`;
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:"block",overflow:"visible"}}>
      <defs>
        <linearGradient id={`${gid}-gn`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--gn)" stopOpacity="0.40" /><stop offset="100%" stopColor="var(--gn)" stopOpacity="0" /></linearGradient>
        <linearGradient id={`${gid}-rd`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--rd)" stopOpacity="0" /><stop offset="100%" stopColor="var(--rd)" stopOpacity="0.35" /></linearGradient>
      </defs>
      <path d={`${path(hi)} L ${w-pad} ${yMid} L ${pad} ${yMid} Z`} fill={`url(#${gid}-gn)`} />
      <path d={`${path(lo)} L ${w-pad} ${yMid} L ${pad} ${yMid} Z`} fill={`url(#${gid}-rd)`} />
      <line x1={pad} y1={yMid} x2={w-pad} y2={yMid} stroke="var(--line)" strokeDasharray="3 3" />
      <path d={path(hi)} stroke="var(--gn)" strokeOpacity="0.6" strokeWidth="1.25" fill="none" />
      <path d={path(mid)} stroke="var(--gn)" strokeWidth="1.6" fill="none" style={{filter:"drop-shadow(0 0 6px var(--gn))"}} />
      <path d={path(lo)} stroke="var(--rd)" strokeOpacity="0.7" strokeWidth="1.25" fill="none" />
      <circle cx={pad} cy={yMid} r="3.5" fill="var(--copper)" style={{filter:"drop-shadow(0 0 6px var(--copper))"}} />
      <text x={w-pad} y={yFor(hi)-4} textAnchor="end" className="mono" fontSize="10" fill="var(--gn)">+{hi.toFixed(1)}%</text>
      <text x={w-pad} y={yFor(mid)-4} textAnchor="end" className="mono" fontSize="10" fill="var(--ink-2)">+{mid.toFixed(1)}%</text>
      <text x={w-pad} y={yFor(lo)+12} textAnchor="end" className="mono" fontSize="10" fill="var(--rd)">{lo.toFixed(1)}%</text>
    </svg>
  );
}

/* ── Overview lens ──────────────────────────────────────────────── */
function VerdictHero({ ticker, mode, heroStyle, sizeCat }) {

  const entry = ticker.pivot * 1.002;
  const risk = entry - ticker.stop;
  const reward1 = ticker.t1 - entry;
  const ss = ticker.setupStats;
  const sh = Math.round((6.8/100) * 108420 / entry);
  return (
    <div className="hero vh-rich">
      <div className="vhr-top">
        <div className="vhr-vis">
          {heroStyle==="gauge" && <Gauge value={ticker.score} label="OVERALL" size={sizeCat==="S"?130:170} />}
          {heroStyle==="radar" && <Radar pillars={pillars} size={sizeCat==="S"?160:200} />}
          {heroStyle==="cone" && (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <div className="label-cap">10d cone · ±{ticker.ml.magnitude.hi.toFixed(0)}%</div>
              <Cone lo={ticker.ml.magnitude.lo} mid={ticker.ml.magnitude.mid} hi={ticker.ml.magnitude.hi} w={260} h={120} />
            </div>

        <div className="vhr-body">
          <div className="vhr-eyebrow">
            <span className="mono label-cap">Master verdict · <b className="copper">{mode}</b></span>
            <Pill tone="gn" dot small>LIVE</Pill>
          </div>
          <div className="vhr-head">
            <span className="vhr-tag">{ticker.verdict}</span>
            <span className="vhr-score mono">{ticker.score}<span className="vhr-score-of">/100</span></span>
            <span className="vhr-conf mono dim2">n={ss.n}</span>
          </div>
          <div className="vhr-setup mono">
            <b className="copper">{ticker.setupFamily}</b>
            <span className="dim2"> · hold ~{ticker.holdDays}d · target </span>
            <b>{ticker.rMultiple.toFixed(2)}R</b>
            <span className="dim2"> · {(ss.winRate*100).toFixed(0)}% historical · Wilson LB {(ss.wilsonLB*100).toFixed(0)}%</span>
          </div>
          <div className="vhr-actions">
            <button className="vhr-act vhr-act--gn" onClick={()=>window.__ssToastFn&&window.__ssToastFn(`${ticker.symbol} — BUY bracket (paper)`)}>▲ BUY · BRACKET</button>
            <button className="vhr-act vhr-act--rd" onClick={()=>window.__ssToastFn&&window.__ssToastFn(`${ticker.symbol} — SHORT (paper)`)}>▼ SHORT</button>
            <button className="vhr-act" onClick={()=>window.__ssToastFn&&window.__ssToastFn(`${ticker.symbol} — added to watchlist`)}>＋ WATCH</button>
            <button className="vhr-act vhr-act--ghost">⚙ ADJUST SIZE</button>
          </div>
        </div>
      </div>
      <div className="vhr-pillars">
        {Object.entries(pillars).map(([k,v]) => {
          const tone = v>=70?"gn":v>=50?"amb":"rd";
          return (
            <div key={k} className={`vhr-pill vhr-pill--${tone}`}>
              <div className="vhr-pill-l label-cap">{k}</div>
              <div className="vhr-pill-row">
                <div className="vhr-pill-bar"><div className="vhr-pill-fill" style={{width:`${v}%`,background:`var(--${tone})`,boxShadow:`0 0 8px color-mix(in oklab, var(--${tone}) 40%, transparent)`}} /></div>
                <div className={`vhr-pill-v mono kpi-tone--${tone}`}>{v}</div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="vhr-ticket">
        <div className="vhr-tk"><div className="vhr-tk-l label-cap">ENTRY</div><div className="vhr-tk-v mono copper">${entry.toFixed(2)}</div></div>
        <div className="vhr-tk"><div className="vhr-tk-l label-cap">STOP · MAX LOSS</div><div className="vhr-tk-v mono dn">${ticker.stop.toFixed(2)}</div><div className="vhr-tk-sub mono dim2">−${risk.toFixed(2)} · −{(risk/entry*100).toFixed(1)}%</div></div>
        <div className="vhr-tk"><div className="vhr-tk-l label-cap">T1 · T2</div><div className="vhr-tk-v mono up">${ticker.t1.toFixed(2)} <span className="dim2">·</span> ${ticker.t2.toFixed(2)}</div><div className="vhr-tk-sub mono dim2">+${reward1.toFixed(2)} · {(reward1/risk).toFixed(2)}R</div></div>
        <div className="vhr-tk"><div className="vhr-tk-l label-cap">SIZE · NAV</div><div className="vhr-tk-v mono">{sh} sh</div><div className="vhr-tk-sub mono dim2">${(sh*entry).toLocaleString(undefined,{maximumFractionDigits:0})} · 6.8% NAV</div></div>
        <div className="vhr-tk"><div className="vhr-tk-l label-cap">R · WILSON</div><div className="vhr-tk-v mono copper">{ticker.rMultiple.toFixed(2)}R</div><div className="vhr-tk-sub mono dim2">LB {(ss.wilsonLB*100).toFixed(1)}% · PF {ss.pf.toFixed(2)}</div></div>

function DrCell({ label, value, tone, tip }) {
  return <div className={`dr-cell dr-cell--${tone}`} title={tip}><div className="dr-cell-l mono">{label}</div><div className={`dr-cell-v mono kpi-tone--${tone}`}>{value}</div></div>;
}
function DeskRead({ ticker, mode }) {
  const entry = ticker.pivot*1.002, risk = entry-ticker.stop, reward = ticker.t1-entry;
  const ss = ticker.setupStats, wr = ss.winRate, lb = ss.wilsonLB;
  const evR = (wr*(reward/risk) - (1-wr)*1).toFixed(2);
  const conv = ticker.score>=80?5:ticker.score>=70?4:ticker.score>=60?3:2;
  const side = ticker.verdict==="AVOID"?"SHORT":ticker.verdict;
  const sideTone = side==="BUY"?"buy":side==="SHORT"?"short":side==="WATCH"?"watch":"buy";
  const maxLoss = (risk*110);
  return (
    <div className="dr">
      <div className="dr-verdict">
        <span className={`dr-side dr-side--${sideTone}`}>{side}</span>
        <div className="dr-conv"><span className="dr-conv-dots">{[1,2,3,4,5].map(i=><span key={i} className={`dr-dot ${i<=conv?"is-on":""}`} />)}</span><span className="mono dim2">conviction {conv}/5</span></div>
      </div>
      <div className="dr-metrics">
        <DrCell label="EXPECTANCY" value={`${evR>=0?"+":""}${evR}R`} tone={evR>=0?"gn":"rd"} tip="p·b − q · per unit risk" />
        <DrCell label="EDGE · WILSON LB" value={`${(lb*100).toFixed(0)}%`} tone={lb>=0.45?"gn":"amb"} tip={`95% lower bound · n=${ss.n}`} />
        <DrCell label="DOWNSIDE" value={`−$${maxLoss.toFixed(0)}`} tone="rd" tip="hard stop · ~110 sh" />
        <DrCell label="R:R" value={`${(reward/risk).toFixed(2)}`} tone="copper" tip="reward ÷ risk to T1" />
        <DrCell label="CORREL → BOOK" value="0.34" tone="gn" tip="cap 0.55 · adds cleanly" />
        <DrCell label="LIQUIDITY" value="A" tone="gn" tip="tight spread · deep ADV" />
        <DrCell label="REGIME FIT" value={`${(ss.winRate*100).toFixed(0)}%`} tone="gn" tip="setup WR in current regime" />
        <DrCell label="TIME RISK" value={ticker.earnings.days<=14?`ER ${ticker.earnings.days}d`:"clear"} tone={ticker.earnings.days<=14?"amb":"gn"} tip="trim pre-print if ER near" />
      </div>
      <div className="dr-call mono">
        <span className="dr-call-tag">DESK READ</span>
        <span className="dr-call-txt">
          {ticker.setupFamily} with a {lb>=0.45?"sample-validated":"thin-sample"} edge (LB {(lb*100).toFixed(0)}%, {evR>=0?"+":""}{evR}R expectancy).
          Downside bounded at one stop, adds at 0.34 correl.
          {ticker.earnings.days<=14 ? <> <b className="warn">Caveat:</b> ER in {ticker.earnings.days}d — size −25% and flatten T−2 if unconfirmed.</> : " No dated catalyst inside the hold window."}
          <b className="copper"> {ticker.verdict==="BUY"?"Take the bracket.":ticker.verdict==="WATCH"?"Watch for the trigger.":"Stand aside."}</b>
        </span>
      </div>
    </div>
  );
}
function CompanySnapshot({ ticker }) {
  return (

function TradeBlueprint({ ticker }) {
  const entry = ticker.pivot*1.002, cur = ticker.price, stop = ticker.stop, t1 = ticker.t1, t2 = ticker.t2;
  const atr = Math.max(0.05, Math.abs(entry-stop)/1.25), risk = entry-stop, reward1 = t1-entry, reward2 = t2-entry, qty = 110;
  const maxLoss = risk*qty, t1Gain = reward1*qty, t2Gain = reward2*qty;
  const W=900, H=380, padT=46, padB=60, padL=72, padR=100;
  const xMin = stop-1.5, xMax = t2+1.5, xRange = xMax-xMin, innerW = W-padL-padR, innerH = H-padT-padB;
  const x = (p)=>padL+((p-xMin)/xRange)*innerW;
  const pnlMin = -maxLoss*1.20, pnlMax = t2Gain*1.15;
  const y = (pnl)=>padT+(1-(pnl-pnlMin)/(pnlMax-pnlMin))*innerH;
  const y0 = y(0);
  const pnlAt = (price)=>{ if(price<=stop) return -maxLoss; if(price<=entry) return -maxLoss+((price-stop)/risk)*maxLoss; if(price<=t2) return ((price-entry)/(t2-entry))*t2Gain; return t2Gain; };
  const samples = []; for(let p=xMin;p<=xMax;p+=0.2) samples.push([x(p), y(pnlAt(p))]);
  const levels = [
    { p:stop, c:"var(--rd)", lbl:"STOP", v:`$${stop.toFixed(2)}`, sub:`−$${maxLoss.toFixed(0)}` },
    { p:entry, c:"var(--copper)", lbl:"ENTRY", v:`$${entry.toFixed(2)}`, sub:"pivot · 110 sh", big:true },
    { p:cur, c:"var(--copper)", lbl:"NOW", v:`$${cur.toFixed(2)}`, sub:pnlAt(cur)>=0?`+$${pnlAt(cur).toFixed(0)}`:`−$${Math.abs(pnlAt(cur)).toFixed(0)}`, dotted:true },
    { p:t1, c:"var(--gn)", lbl:"T1", v:`$${t1.toFixed(2)}`, sub:`+$${t1Gain.toFixed(0)}`, big:true },
    { p:t2, c:"var(--gn)", lbl:"T2", v:`$${t2.toFixed(2)}`, sub:`+$${t2Gain.toFixed(0)}` },
  ];
  return (
    <div className="tbv2">
      <div className="tbv2-metrics">
        <TbMetric label="Risk · 1R" value={`−$${maxLoss.toFixed(0)}`} sub={`${(maxLoss/108420*100).toFixed(2)}% NAV`} tone="rd" />
        <TbMetric label="R:R · T1" value={`${(reward1/risk).toFixed(2)}R`} sub={`+$${t1Gain.toFixed(0)} reward`} tone="gn" big />
        <TbMetric label="R:R · T2" value={`${(reward2/risk).toFixed(2)}R`} sub={`+$${t2Gain.toFixed(0)} reward`} tone="gn" />
        <TbMetric label="% to Stop" value={`−${(risk/entry*100).toFixed(2)}%`} sub={`$${risk.toFixed(2)} below`} tone="rd" />

function SizingWorkbench({ ticker, sizeMult, onSizeMult, kellyFrac, onKellyFrac }) {

function DecisionGates({ ticker }) {

  ];
  const totPass = stages.reduce((a,s)=>a+s.pass,0), totOf = stages.reduce((a,s)=>a+s.of,0);

    return { symbol:sym, name:sym, exchange:"—", sector:"—", industry:"—", mcap:5e9, price:0, chg:0, chgAbs:0,
      vol:1e6, avgVol:1e6, rsi:55, beta:1.0, verdict:"WATCH", score:60, setupFamily:"—", mechanism:"—", cat:"—",
      holdDays:9, rMultiple:1.7, pillars:{technical:55,fundamental:55,catalyst:50,risk:60,edge:55},
      pivot:0, stop:0, t1:0, t2:0, setupStats:{winRate:0.55,wilsonLB:0.45,n:30,pf:1.3},
      shortFloat:4.0, insiderOwn:3.0, pe:22, fwdPe:19, earnings:{days:30,date:"—"}, ml:{magnitude:{lo:-6,mid:2.5,hi:8}} };
  }
  const tf = (d)=> d===2?80 : d===1?58 : 38;
  const clamp = (v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(v)));
  const price = row.price||0;
  const pivot = parseFloat(row.entry)||price||0;
  const stop  = parseFloat(row.stop)|| (price?price*0.95:0);
  const t1    = parseFloat(row.t1plan)|| (price?price*1.08:0);
  const t2    = pivot + (t1-pivot)*2;
  const rr    = parseFloat(row.rr)||1.7;
  const wlb   = row.wlb!=null ? row.wlb/100 : 0.45;
  const winRate = row.regWR!=null ? row.regWR/100 : Math.min(0.75, wlb+0.13);
  const erDays = row.er!=null ? row.er : 30;
  let erDate = "—";
  try { const d = new Date(); d.setDate(d.getDate()+erDays); erDate = d.toLocaleDateString("en-US",{month:"short",day:"2-digit"}); } catch(e) {}
  return {
    symbol: row.sym, name: row.name||row.sym, exchange: row.exchange||"NASDAQ",
    sector: row.sector||"—", industry: row.industry||row.sector||"—",
    mcap: row.mcap || (price*8e7) || 5e9,
    price, chg: row.chg||0, chgAbs: price*(row.chg||0)/100,
    vol: (parseFloat(row.rvol)||1)*1.12e6, avgVol: 1.12e6,
    rsi: row.rsi!=null ? row.rsi : 58 + (price%7),
    beta: row.beta || 1.05,
    verdict: row.verdict||"WATCH", score: row.score||60,
    setupFamily: row.setup||"—", mechanism: row.mechanism||"—", cat: row.cat||"—",
    holdDays: row.cat==="T1"?7 : row.setup&&/break|vcp|52/i.test(row.setup)?14 : 9,
    rMultiple: rr,
    pillars: {
      technical: tf(row.tfsn?.[0]),
      fundamental: tf(row.tfsn?.[1]),
      catalyst: row.cat==="T1"?84 : row.cat==="T2"?64 : 48,
      risk: clamp(48 + rr*9, 30, 92),
      edge: clamp((row.wlb??48) + 8, 30, 95),
    },
    pivot, stop, t1, t2,
    setupStats: { winRate, wilsonLB: wlb, n: row.n!=null?row.n:30, pf: parseFloat(row.pf)||1.3 },
    shortFloat: 4.2, insiderOwn: 3.1, pe: 22.4, fwdPe: 19.8,
    earnings: { days: erDays, date: erDate },
    ml: { magnitude: { lo:-6.2, mid:2.8, hi:8.4 } },
  };
}

function DetailPanel({ ticker, lensId, onLensId, mode, heroStyle, onHeroStyle, focusMode, onToggleFocus, onBack, tier=4 }) {
  const ref = useRef(null);
  const [w, setW] = useState(960);
  useEffect(() => {
    if (!ref.current || typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(es => { for (const e of es) setW(Math.round(e.contentRect.width)); });
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  const sizeCat = w < 540 ? "S" : w < 760 ? "M" : w < 1000 ? "L" : "XL";
  return (
    <section className={`dpanel dpanel--${sizeCat}`} ref={ref}>

  );

const SCAN_WIDTHS = { S:192, M:248, L:320, XL:400 };
const scSparkCache = {};
function scSpark(sym) {
  if (scSparkCache[sym]) return scSparkCache[sym];
  let p = 50 + (sym.charCodeAt(0) % 20); const arr = []; const trend = (((sym.charCodeAt(1)||0) % 5) - 2) * 0.2;
  for (let i=0;i<22;i++){ p += trend + Math.sin(i*0.6 + sym.charCodeAt(0))*0.7; arr.push(p); }
  scSparkCache[sym] = arr; return arr;
}
function ScanColumn({ universe, activeTicker, onTicker, widthCat, onWidthCat, collapsed }) {

    return [...r].sort((a,b) => b.score - a.score).slice(0, 60);

// Mock OHLC chart preview (illustrative candles; pivot label bound to ticker)
function TchMiniChart({ ticker }) {
  const t = ticker || {};
  const w = 320, h = 110;
  const bars = 60;
  const data = useMemo(() => {
    const out = [];
    let p = 56;
    for (let i = 0; i < bars; i++) {
      const trend = 0.18 + (i > 42 ? 0.4 : 0);
      const noise = (Math.sin(i * 0.7) + Math.cos(i * 0.3)) * 0.4;
      const dip = (i > 28 && i < 42) ? -0.8 : 0;
      // deterministic pseudo-noise (no Math.random at module level / render churn)
      const r1 = (Math.sin(i * 12.9898) * 43758.5453) % 1;
      const r2 = (Math.sin(i * 78.233) * 12543.123) % 1;
      const r3 = (Math.sin(i * 39.346) * 9123.77) % 1;
      const r4 = (Math.sin(i * 4.123) * 5519.13) % 1;
      const a1 = Math.abs(r1), a2 = Math.abs(r2), a3 = Math.abs(r3), a4 = Math.abs(r4);
      p = p + trend + noise + dip;
      const o = p - a1 * 0.3;
      const c = p + (a2 - 0.4) * 0.5;
      const hi = Math.max(o, c) + a3 * 0.4;
      const lo = Math.min(o, c) - a4 * 0.4;
      out.push({ o, c, hi, lo });
    }
    return out;
  }, []);
  const min = Math.min(...data.map(d => d.lo));
  const max = Math.max(...data.map(d => d.hi));
  const range = (max - min) || 1;
  const xStep = w / bars;
  const yFor = v => h - ((v - min) / range) * (h - 10) - 5;
  const pivotY = yFor(min + range * 0.78);
  const lastBar = data[data.length - 1];
  const lastX = (data.length - 1) * xStep + xStep / 2;
  const pivotLabel = "PIVOT " + TchNum(t.pivot, "66.18");

  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="mini-chart" style={{ overflow: "visible" }}>
      <defs>
        <linearGradient id="tch-mc-bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--copper)" stopOpacity="0.08" />
          <stop offset="100%" stopColor="var(--copper)" stopOpacity="0" />
        </linearGradient>
      </defs>
      <rect x="0" y="0" width={w} height={pivotY} fill="url(#tch-mc-bg)" />

function CptBigChart({ ticker }) {
  // 120 bars — illustrative synthetic OHLC (deterministic, no Math.random in render path for ids)
  const w = 900, h = 360;
  const data = useMemo(() => {
    const out = [];
    let p = 50;
    for (let i = 0; i < 120; i++) {
      const phase =
        i < 30  ? 0.12 :
        i < 50  ? 0.30 :
        i < 70  ? -0.08 :
        i < 90  ? -0.05 :
        i < 108 ? 0.10 :
                  0.42;
      const noise = (Math.sin(i * 0.45) + Math.cos(i * 0.31)) * 0.45;
      p += phase + noise;
      const o = p - Math.abs(Math.sin(i * 1.3)) * 0.4;
      const c = p + (Math.sin(i * 0.9) - 0.4) * 0.6;
      const hi = Math.max(o, c) + Math.abs(Math.cos(i * 1.7)) * 0.5;
      const lo = Math.min(o, c) - Math.abs(Math.sin(i * 2.1)) * 0.5;
      const v = (Math.abs(Math.sin(i * 0.7)) + 0.2) * (i > 100 ? 1.3 : 1) * 600000;
      out.push({ o, c, hi, lo, v });
    }
    return out;
  }, []);

  const min = Math.min(...data.map(d => d.lo));
  const max = Math.max(...data.map(d => d.hi));
  const range = max - min;
  const priceH = h * 0.72;
  const volH = h * 0.22;
  const xStep = w / data.length;
  const yPx = v => priceH - ((v - min) / range) * (priceH - 20) - 8;
  const maxVol = Math.max(...data.map(d => d.v));
  const yVol = v => priceH + 12 + (volH - 4) * (1 - v / maxVol);

  // simple EMAs
  const ema = (period, src) => {
    const k = 2 / (period + 1);
    const out = [];
    let prev = src[0].c;
    for (let i = 0; i < src.length; i++) {
      prev = src[i].c * k + prev * (1 - k);
      out.push(prev);
    }
    return out;
  };
  const e9  = ema(9,  data);
  const e21 = ema(21, data);
  const e50 = ema(50, data);

  const pivot = 66.18, stop = 62.40, t1 = 72.80;
  return (
    <div className="big-chart-wrap">
      <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
        {/* grid */}
        {[0.2, 0.4, 0.6, 0.8].map(f => (
          <line key={f} x1="0" y1={priceH * f} x2={w} y2={priceH * f} stroke="var(--line)" strokeDasharray="2 4" opacity="0.5" />
        ))}
        {/* pivot/stop/t1 lines */}
        <line x1="0" y1={yPx(pivot)} x2={w} y2={yPx(pivot)} stroke="var(--copper)" strokeDasharray="4 4" strokeWidth="1" />
        <line x1="0" y1={yPx(t1)} x2={w} y2={yPx(t1)} stroke="var(--gn)" strokeDasharray="3 3" opacity="0.7" />
        <line x1="0" y1={yPx(stop)} x2={w} y2={yPx(stop)} stroke="var(--rd)" strokeDasharray="3 3" opacity="0.7" />
        <text x={w - 4} y={yPx(pivot) - 3} fontSize="10" className="mono" textAnchor="end" fill="var(--copper)">PIVOT {pivot.toFixed(2)}</text>
        <text x={w - 4} y={yPx(t1) - 3} fontSize="10" className="mono" textAnchor="end" fill="var(--gn)">T1 {t1.toFixed(2)}</text>
        <text x={w - 4} y={yPx(stop) + 11} fontSize="10" className="mono" textAnchor="end" fill="var(--rd)">STOP {stop.toFixed(2)}</text>
        {/* EMAs */}
        <polyline fill="none" stroke="var(--cy)" strokeWidth="1.1" opacity="0.8"
                  points={e9.map((v, i) => `${i * xStep + xStep/2},${yPx(v)}`).join(" ")} />
        <polyline fill="none" stroke="var(--violet)" strokeWidth="1.1" opacity="0.8"
                  points={e21.map((v, i) => `${i * xStep + xStep/2},${yPx(v)}`).join(" ")} />
        <polyline fill="none" stroke="var(--amb)" strokeWidth="1.1" opacity="0.7"
                  points={e50.map((v, i) => `${i * xStep + xStep/2},${yPx(v)}`).join(" ")} />
        {/* candles */}
        {data.map((d, i) => {
          const up = d.c >= d.o;
          const x = i * xStep + 1;
          const ww = xStep - 1.5;
          return (
            <g key={i}>
              <line x1={x + ww/2} y1={yPx(d.hi)} x2={x + ww/2} y2={yPx(d.lo)} stroke={up ? "var(--gn)" : "var(--rd)"} strokeWidth="0.6" />
              <rect x={x} y={yPx(Math.max(d.o, d.c))} width={ww} height={Math.max(1.5, Math.abs(yPx(d.o) - yPx(d.c)))}
                    fill={up ? "var(--gn)" : "var(--rd)"} opacity="0.9" />
            </g>
          );
        })}
        {/* volume */}
        {data.map((d, i) => {
          const up = d.c >= d.o;
          const x = i * xStep + 1;
          const ww = xStep - 1.5;
          const yT = yVol(d.v);
          return (
            <rect key={`v${i}`} x={x} y={yT} width={ww} height={priceH + volH - yT}
                  fill={up ? "var(--gn)" : "var(--rd)"} opacity="0.35" />
          );
        })}
        {/* axis */}
        <line x1="0" y1={priceH + 4} x2={w} y2={priceH + 4} stroke="var(--line)" />
      </svg>
      <div className="chart-legend mono">
        <span><span className="dot" style={{ background: "var(--cy)" }} /> EMA 9</span>
        <span><span className="dot" style={{ background: "var(--violet)" }} /> EMA 21</span>
        <span><span className="dot" style={{ background: "var(--amb)" }} /> EMA 50</span>
        <span><span className="dot" style={{ background: "var(--copper)" }} /> Pivot</span>
        <span><span className="dot" style={{ background: "var(--gn)" }} /> T1</span>
        <span><span className="dot" style={{ background: "var(--rd)" }} /> Stop</span>
      </div>
    </div>
  );
}

function CptMonteCarlo({ ticker }) {
  const w = 520, h = 160;
  const basePrice = (ticker && typeof ticker.price === "number") ? ticker.price : 67.42;
  // synthetic cone-of-uncertainty (illustrative, deterministic seed by index)
  const samples = 30;
  const paths = useMemo(() => {
    const out = [];
    for (let s = 0; s < samples; s++) {
      let p = basePrice;
      const arr = [p];
      const trend = 0.04 + (Math.abs(Math.sin(s * 1.7)) * 0.10);
      for (let i = 0; i < 90; i++) {
        p += trend + (Math.sin(s * 3.1 + i * 0.6) * 0.7);
        arr.push(p);
      }
      out.push(arr);
    }
    return out;
  }, [basePrice]);
  const all = paths.flat();
  const min = Math.min(...all) * 0.97;
  const max = Math.max(...all) * 1.02;
  const xStep = w / 90;
  const yFor = v => h - ((v - min) / (max - min)) * (h - 4) - 2;
  const medianLine = basePrice * 1.064;
  return (
    <div className="mc-panel">
      <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
        {paths.map((path, i) => (
          <polyline key={i} fill="none" stroke={i % 3 === 0 ? "var(--gn)" : "var(--copper)"} opacity="0.18" strokeWidth="1"
                    points={path.map((v, j) => `${j * xStep},${yFor(v)}`).join(" ")} />
        ))}
        <line x1="0" y1={yFor(medianLine)} x2={w} y2={yFor(medianLine)} stroke="var(--copper)" strokeDasharray="3 3" />
        <text x={w - 4} y={yFor(medianLine) - 3} fontSize="10" textAnchor="end" className="mono" fill="var(--copper)">Median +6.4%</text>
      </svg>
      <div className="kpi-row" style={{ gridTemplateColumns: "repeat(4, 1fr)", marginTop: 8 }}>
        <KpiTile label="Median 90d" value="+6.4%" tone="gn" />
        <KpiTile label="P(T1 hit first)" value="58%" tone="gn" />
        <KpiTile label="P(stop hit first)" value="40%" tone="amb" />
        <KpiTile label="Paths" value="2,000" tone="ink" sub="setup-conditional" />
      </div>
    </div>
  );
}

};
const TC_TF_CFG = { "1H": {step:3600, n:120, vol:0.004}, "4H": {step:14400, n:120, vol:0.008}, "1D": {step:86400, n:160, vol:0.013}, "1W": {step:604800, n:120, vol:0.028} };

function LensChart({ ticker, mode, sizeCat, headerStyle, kpiStyle, heroStyle }) {
  const [tf, setTf] = useTCs("1D");
  const [full, setFull] = useTCs(false);
  const [indMenu, setIndMenu] = useTCs(false);
  const [ind, setInd] = useTCs({ ema:false, bb:false, avwap:false, ichi:false, smc:false, vp:false });
  const togInd = (k) => setInd(s => ({ ...s, [k]: !s[k] }));
  const tfx = TC_TF_THESIS[tf];

  const d = useTC(() => {
    const spot = typeof ticker.price === "number" ? ticker.price : 100;
    const pivot = typeof ticker.pivot === "number" ? ticker.pivot : +(spot*1.002).toFixed(2);
    const stopP = typeof ticker.stop === "number" ? ticker.stop : +(spot*0.943).toFixed(2);
    const t1P = typeof ticker.t1 === "number" ? ticker.t1 : +(spot*1.08).toFixed(2);
    const t2P = typeof ticker.t2 === "number" ? ticker.t2 : +(spot*1.16).toFixed(2);
    const entry = +pivot.toFixed(2), stop = +stopP.toFixed(2), t1 = +t1P.toFixed(2), t2 = +t2P.toFixed(2);
    const cfg = TC_TF_CFG[tf];
    const now = Math.floor(Date.now()/1000), start = now - cfg.n*cfg.step;
    const bars=[]; let p = spot*0.80;
    for(let i=0;i<cfg.n;i++){
      const phase = i<cfg.n*0.35?0.004 : i<cfg.n*0.62?-0.0015 : i<cfg.n*0.83?0.0008 : 0.006;
      const noise = (Math.sin(i*0.7)+Math.cos(i*0.33))*cfg.vol;
      p = p*(1+phase+noise);
      const o=p*(1-Math.random()*cfg.vol), c=p*(1+(Math.random()-0.45)*cfg.vol*1.6);
      const hi=Math.max(o,c)*(1+Math.random()*cfg.vol), lo=Math.min(o,c)*(1-Math.random()*cfg.vol);
      const v=(0.5+Math.abs(Math.sin(i*0.5))*0.7+(i>cfg.n*0.82?0.6:0))*1e6;
      bars.push({ time:start+i*cfg.step, open:+o.toFixed(2), high:+hi.toFixed(2), low:+lo.toFixed(2), close:+c.toFixed(2), value:Math.round(v) });
    }
    bars[bars.length-1].close = spot;
    const ema=(per)=>{ const k=2/(per+1); let pr=bars[0].close; return bars.map((b,i)=>{ pr=i===0?b.close:b.close*k+pr*(1-k); return {time:b.time,value:+pr.toFixed(2)}; }); };
    const e9=ema(9),e21=ema(21),e50=ema(50);
    const bbU=[],bbM=[],bbL=[];
    bars.forEach((b,i)=>{ const s=Math.max(0,i-19),w=bars.slice(s,i+1).map(x=>x.close); const m=w.reduce((a,c)=>a+c,0)/w.length; const sd=Math.sqrt(w.reduce((a,c)=>a+(c-m)**2,0)/w.length); bbM.push({time:b.time,value:+m.toFixed(2)}); bbU.push({time:b.time,value:+(m+2*sd).toFixed(2)}); bbL.push({time:b.time,value:+(m-2*sd).toFixed(2)}); });
    const anchor=Math.floor(cfg.n*0.82); let pv=0,cv=0; const avwap=[];
    bars.forEach((b,i)=>{ if(i>=anchor){ const tp=(b.high+b.low+b.close)/3; pv+=tp*b.value; cv+=b.value; avwap.push({time:b.time,value:+(pv/cv).toFixed(2)}); } });
    const hh=(per,i)=>Math.max(...bars.slice(Math.max(0,i-per+1),i+1).map(b=>b.high));
    const ll=(per,i)=>Math.min(...bars.slice(Math.max(0,i-per+1),i+1).map(b=>b.low));
    const tenkan=[],kijun=[],spanA=[],spanB=[];
    bars.forEach((b,i)=>{ const t=(hh(9,i)+ll(9,i))/2,k=(hh(26,i)+ll(26,i))/2; tenkan.push({time:b.time,value:+t.toFixed(2)}); kijun.push({time:b.time,value:+k.toFixed(2)}); spanA.push({time:b.time,value:+((t+k)/2).toFixed(2)}); spanB.push({time:b.time,value:+((hh(52,i)+ll(52,i))/2).toFixed(2)}); });
    // SMC: pivots, BOS/CHoCH markers, order block lines
    const L=5,piv=[]; for(let i=L;i<bars.length-L;i++){ const isH=bars.slice(i-L,i+L+1).every((b,j)=>j===L||bars[i].high>=b.high); const isL=bars.slice(i-L,i+L+1).every((b,j)=>j===L||bars[i].low<=b.low); if(isH)piv.push({i,price:bars[i].high,type:'H'}); else if(isL)piv.push({i,price:bars[i].low,type:'L'}); }
    const breaks=[]; let lH=null,lL=null,tb=0;
    bars.forEach((b,i)=>{ if(lH!=null&&b.close>lH.price){breaks.push({time:b.time,price:lH.price,dir:'bull',tag:tb===-1?'CHoCH':'BOS'});tb=1;lH=null;} if(lL!=null&&b.close<lL.price){breaks.push({time:b.time,price:lL.price,dir:'bear',tag:tb===1?'CHoCH':'BOS'});tb=-1;lL=null;} const ph=piv.find(p=>p.i===i&&p.type==='H');if(ph)lH=ph; const pl=piv.find(p=>p.i===i&&p.type==='L');if(pl)lL=pl; });
    const obs=[]; breaks.slice(-3).forEach(bk=>{ const bi=bars.findIndex(b=>b.time===bk.time); for(let j=bi;j>Math.max(0,bi-10);j--){ if(bk.dir==='bull'&&bars[j].close<bars[j].open){obs.push({price:+((bars[j].high+bars[j].low)/2).toFixed(2),bias:'bull'});break;} if(bk.dir==='bear'&&bars[j].close>bars[j].open){obs.push({price:+((bars[j].high+bars[j].low)/2).toFixed(2),bias:'bear'});break;} } });
    // Volume profile bins over visible bars
    const vlo=Math.min(...bars.map(b=>b.low)), vhi=Math.max(...bars.map(b=>b.high)), VN=22, vbin=(vhi-vlo)/VN;
    const vpb=Array.from({length:VN},(_,i)=>({ lo:vlo+i*vbin, hi:vlo+(i+1)*vbin, mid:vlo+(i+0.5)*vbin, v:0 }));
    bars.forEach(b=>{ const m=(b.high+b.low)/2; const bi=Math.min(VN-1,Math.max(0,Math.floor((m-vlo)/vbin))); vpb[bi].v+=b.value; });
    const vpMax=Math.max(...vpb.map(x=>x.v)); const pocI=vpb.reduce((m,x,i)=>x.v>vpb[m].v?i:m,0);
    const vTot=vpb.reduce((a,x)=>a+x.v,0); let vacc=vpb[pocI].v,vloI=pocI,vhiI=pocI;
    while(vacc<vTot*0.7&&(vloI>0||vhiI<VN-1)){ const dn=vloI>0?vpb[vloI-1].v:-1,up=vhiI<VN-1?vpb[vhiI+1].v:-1; if(up>=dn){vhiI++;vacc+=vpb[vhiI].v;}else{vloI--;vacc+=vpb[vloI].v;} }
    return { spot, entry, stop, t1, t2, bars, e9, e21, e50, bbU, bbM, bbL, avwap, tenkan, kijun, spanA, spanB, breaks: breaks.slice(-6), obs,
      vpb, vpMax, poc:vpb[pocI].mid, vah:vpb[vhiI].hi, val:vpb[vloI].lo };
  }, [ticker, tf]);

  return (
    <div className={`lens lens--tc ${full?"tc-full":""}`}>

function TcLWChart({ d, ind, full }) {
  const wrap = useTCr(null);
  const chartRef = useTCr(null);
  const seriesRef = useTCr({});

  // create chart once — SSR/crash safe (no DOM, no LightweightCharts global during renderToString)
  useTCe(() => {
    if (typeof window === "undefined" || !wrap.current || !window.LightweightCharts) return;
    const cssv = (n,f) => (getComputedStyle(document.documentElement).getPropertyValue(n).trim() || f);
    const chart = window.LightweightCharts.createChart(wrap.current, {
      autoSize: true,
      layout: { background:{ color:"transparent" }, textColor: cssv("--ink-2","#8590a3"), fontFamily:"inherit" },
      grid: { vertLines:{ color:"rgba(255,255,255,0.04)" }, horzLines:{ color:"rgba(255,255,255,0.04)" } },
      crosshair: { mode: 1 },
      rightPriceScale: { borderColor:"rgba(255,255,255,0.10)" },
      timeScale: { borderColor:"rgba(255,255,255,0.10)", timeVisible:false, rightOffset:6 },
    });
    chartRef.current = chart;
    const candle = chart.addCandlestickSeries({
      upColor:"#4ade80", downColor:"#f87171", borderUpColor:"#4ade80", borderDownColor:"#f87171",
      wickUpColor:"#4ade80", wickDownColor:"#f87171",
    });
    const vol = chart.addHistogramSeries({ priceFormat:{ type:"volume" }, priceScaleId:"vol" });
    chart.priceScale("vol").applyOptions({ scaleMargins:{ top:0.82, bottom:0 } });
    seriesRef.current = { chart, candle, vol, overlays:[], priceLines:[] };
    return () => { chart.remove(); chartRef.current=null; seriesRef.current={}; };
  }, []);

  // feed candles + volume + plan lines + markers + overlays on data/ind change
  useTCe(() => {
    const s = seriesRef.current; if (!s.chart) return;
    s.candle.setData(d.bars);
    s.vol.setData(d.bars.map(b=>({ time:b.time, value:b.value, color: b.close>=b.open ? "rgba(74,222,128,0.4)" : "rgba(248,113,113,0.4)" })));

    // plan price lines
    s.priceLines.forEach(pl => s.candle.removePriceLine(pl));
    const mk = (price,color,title) => s.candle.createPriceLine({ price, color, lineWidth:1, lineStyle:2, axisLabelVisible:true, title });
    s.priceLines = [
      mk(d.entry, "#d97757", "ENTRY"),
      mk(d.stop, "#f87171", "STOP"),
      mk(d.t1, "#4ade80", "T1"),
      mk(d.t2, "#4ade80", "T2"),
    ];
    if (ind.smc) d.obs.forEach(o => s.priceLines.push(mk(o.price, o.bias==="bull"?"#5b9bf2":"#d97757", o.bias==="bull"?"+OB":"−OB")));

    // overlay line series
    s.overlays.forEach(o => s.chart.removeSeries(o)); s.overlays=[];
    const addLine = (data,color,width=1,style=0) => { const ls=s.chart.addLineSeries({ color, lineWidth:width, lineStyle:style, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false }); ls.setData(data); s.overlays.push(ls); };
    if (ind.ema) { addLine(d.e9,"#5dd6d6"); addLine(d.e21,"#fbbf24"); addLine(d.e50,"#a78bfa"); }
    if (ind.bb) { addLine(d.bbU,"#5b9bf2",1,2); addLine(d.bbM,"#5b9bf2",1,1); addLine(d.bbL,"#5b9bf2",1,2); }
    if (ind.avwap) addLine(d.avwap,"#fbbf24",2,2);
    if (ind.ichi) { addLine(d.spanA,"#4ade80"); addLine(d.spanB,"#f87171"); addLine(d.tenkan,"#5b9bf2",1); addLine(d.kijun,"#f87171",1); }

    // SMC structure-break markers
    s.candle.setMarkers(ind.smc ? d.breaks.map(b=>({
      time:b.time, position: b.dir==="bull"?"belowBar":"aboveBar",
      color: b.dir==="bull"?"#4ade80":"#f87171", shape: b.dir==="bull"?"arrowUp":"arrowDown", text:b.tag,
    })) : []);

    s.chart.timeScale().fitContent();
  }, [d, ind]);

  // refit on fullscreen toggle
  useTCe(() => { const s=seriesRef.current; if(s.chart) setTimeout(()=>s.chart.timeScale().fitContent(),60); }, [full]);

  // Volume Profile overlay (re-aligns to price axis on zoom/pan)
  useTCe(() => {
    if (typeof window === "undefined") return;
    const s = seriesRef.current; if (!s.chart) return;
    const host = wrap.current; if (!host) return;
    let svg = host.querySelector(".tc-vp-ov");
    const draw = () => {
      if (svg) { svg.remove(); svg=null; }
      if (!ind.vp || !d.vpb) return;
      const W = host.clientWidth, H = host.clientHeight;
      svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
      svg.setAttribute("class","tc-vp-ov");
      svg.style.cssText = `position:absolute;left:0;top:0;width:${W}px;height:${H}px;pointer-events:none;z-index:3;`;
      const maxW = W * 0.26;
      d.vpb.forEach(b=>{
        const yT = s.candle.priceToCoordinate(b.hi), yB = s.candle.priceToCoordinate(b.lo);
        if (yT==null || yB==null) return;
        const h = Math.max(1, Math.abs(yB-yT)-1);
        const inVA = b.mid<=d.vah && b.mid>=d.val, isPoc = Math.abs(b.mid-d.poc) < (d.vah-d.val)/40;
        const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
        r.setAttribute("x", 0); r.setAttribute("y", Math.min(yT,yB));
        r.setAttribute("width", Math.max(1, b.v/d.vpMax*maxW)); r.setAttribute("height", h);
        r.setAttribute("fill", isPoc?"#d97757":inVA?"#5dd6d6":"#8590a3");
        r.setAttribute("opacity", isPoc?0.5:inVA?0.28:0.16);
        svg.appendChild(r);
      });
      host.appendChild(svg);
    };
    draw();
    const ts = s.chart.timeScale();
    const onRange = () => draw();
    ts.subscribeVisibleLogicalRangeChange(onRange);
    return () => { ts.unsubscribeVisibleLogicalRangeChange(onRange); if(svg) svg.remove(); };
  }, [d, ind.vp, full]);

  return <div ref={wrap} className="tc-lw" />;
}

function SmrStructureMap() {
  const W=900,H=340,padT=20,padB=26,padL=14,padR=150;
  const lo=60, hi=72, y=p=>padT+(1-(p-lo)/(hi-lo))*(H-padT-padB);
  const zones=[
    { top:70.8, bot:70.0, type:"OB−", tone:"rd", note:"supply · unmitigated" },
    { top:67.8, bot:67.4, type:"FVG", tone:"violet", note:"bullish imbalance" },
    { top:66.6, bot:66.1, type:"OB+", tone:"gn", note:"demand · pivot floor" },
    { top:64.3, bot:63.9, type:"FVG", tone:"violet", note:"unfilled gap" },
    { top:63.8, bot:63.2, type:"OB+", tone:"gn", note:"demand · spring held" },
    { top:62.4, bot:61.1, type:"FVG", tone:"violet", note:"weekly imbalance" },

  const spot=67.42;
  // synth candles trending down into demand then reversing up
  const cl=[67.0,68.4,69.2,68.1,66.4,64.9,63.6,63.9,64.8,65.6,66.2,65.4,66.1,66.9,67.42];
  const candles=cl.map((c,i)=>{ const o=i===0?66.6:cl[i-1]; const hi2=Math.max(o,c)+0.3; const lo2=Math.min(o,c)-0.3; return {o,c,hi:hi2,lo:lo2}; });
  const cw=(W-padL-padR)/candles.length;
  const cx=i=>padL+i*cw+cw/2;
  return (
    <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" className="smc-map-svg">
      <defs>
        <linearGradient id="smr-obp" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="var(--gn)" stopOpacity="0.28"/><stop offset="100%" stopColor="var(--gn)" stopOpacity="0.08"/></linearGradient>
        <linearGradient id="smr-obm" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="var(--rd)" stopOpacity="0.28"/><stop offset="100%" stopColor="var(--rd)" stopOpacity="0.08"/></linearGradient>
        <linearGradient id="smr-fvg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="var(--violet)" stopOpacity="0.20"/><stop offset="100%" stopColor="var(--violet)" stopOpacity="0.05"/></linearGradient>
      </defs>
      {/* zones with right-edge label tabs (spaced to avoid overlap) */}
      {zones.map((z,i)=>{
        const fill = z.type==="OB+"?"url(#smr-obp)":z.type==="OB−"?"url(#smr-obm)":"url(#smr-fvg)";
        const cy=(y(z.top)+y(z.bot))/2;
        return (
          <g key={i}>
            <rect x={padL} y={y(z.top)} width={W-padL-padR} height={Math.max(4,y(z.bot)-y(z.top))} fill={fill}
              stroke={`var(--${z.tone})`} strokeOpacity="0.4" strokeWidth="0.7" strokeDasharray={z.type==="FVG"?"4 3":"none"}/>
            {/* connector + label tab on right */}
            <line x1={W-padR} y1={cy} x2={W-padR+14} y2={cy} stroke={`var(--${z.tone})`} strokeOpacity="0.5"/>
            <rect x={W-padR+14} y={cy-11} width={130} height={22} rx="5" fill="var(--bg-1)" stroke={`var(--${z.tone})`} strokeOpacity="0.5"/>
            <text x={W-padR+20} y={cy+1} fontSize="9.5" className="mono" fill={`var(--${z.tone})`} fontWeight="600">
              {z.type==="OB+"?"▲ OB+":z.type==="OB−"?"▼ OB−":"▦ FVG"}
            </text>
            <text x={W-padR+20} y={cy+10} fontSize="7.5" className="mono" fill="var(--ink-3)">{z.note}</text>
            <text x={W-padR+138} y={cy-1} fontSize="9" className="mono" textAnchor="end" fill={`var(--${z.tone})`}>${SmrFix((z.top+z.bot)/2,1,"—")}</text>
          </g>
        );
      })}
      {/* candles */}
      {candles.map((c,i)=>{ const up=c.c>=c.o; const col=up?"var(--gn)":"var(--rd)"; return (
        <g key={i}>
          <line x1={cx(i)} y1={y(c.hi)} x2={cx(i)} y2={y(c.lo)} stroke={col} strokeWidth="1"/>
          <rect x={cx(i)-cw*0.3} y={y(Math.max(c.o,c.c))} width={cw*0.6} height={Math.max(1.5,Math.abs(y(c.o)-y(c.c)))} fill={col}/>
        </g>
      );})}
      {/* spot line */}
      <line x1={padL} y1={y(spot)} x2={W-padR} y2={y(spot)} stroke="var(--copper)" strokeWidth="1" strokeDasharray="3 3"/>
      <circle cx={cx(candles.length-1)} cy={y(spot)} r="4.5" fill="var(--copper)" style={{filter:"drop-shadow(0 0 6px var(--copper))"}}/>
      {/* legend */}
      <g transform={`translate(${padL+6},${padT+6})`}>
        <rect x="0" y="-2" width="11" height="8" fill="var(--gn)" opacity="0.4"/><text x="15" y="5" fontSize="9" className="mono" fill="var(--ink-2)">OB+ demand</text>
        <rect x="92" y="-2" width="11" height="8" fill="var(--rd)" opacity="0.4"/><text x="107" y="5" fontSize="9" className="mono" fill="var(--ink-2)">OB− supply</text>

      </g>
    </svg>
  );
}

// ─── §1 Value scale ─────────────────────────────────────────────────
function InvValueScale({ ticker }) {
  const cur = ticker && typeof ticker.price === "number" ? ticker.price : 64;
  const bear = 52, fair = 64, target = 75, bull = 92;
  const clamp = v => Math.max(0, Math.min(100, v));
  const x = clamp(((cur - bear) / (bull - bear)) * 100);
  const xFair = ((fair - bear) / (bull - bear)) * 100;
  const xTarget = ((target - bear) / (bull - bear)) * 100;
  return (
    <div className="vh-scale">
      <div className="vh-scale-track">
        <div className="vh-scale-fill" />
        <div className="vh-scale-marker vh-bear" style={{ left: "0%" }}>
          <div className="vh-scale-px mono">$52</div>
          <div className="label-cap">bear</div>
        </div>
        <div className="vh-scale-marker vh-fair" style={{ left: `${xFair}%` }}>
          <div className="vh-scale-px mono">$64</div>
          <div className="label-cap">fair</div>
        </div>
        <div className="vh-scale-marker vh-target" style={{ left: `${xTarget}%` }}>
          <div className="vh-scale-px mono">$75</div>
          <div className="label-cap">target</div>
        </div>
        <div className="vh-scale-marker vh-bull" style={{ left: "100%" }}>
          <div className="vh-scale-px mono">$92</div>
          <div className="label-cap">bull</div>
        </div>
        <div className="vh-scale-current" style={{ left: `${x}%` }}>
          <div className="vh-cur-px mono">${invNum(cur, 2, "—")}</div>
        </div>
      </div>
    </div>
  );
}

function EoIVPercentileChart() {
  const w = 580, h = 180, padT = 14, padB = 30, padL = 36, padR = 14;
  // Deterministic 252d series of ATM 30d IV (annualized %), no Math.random for stability.
  const data = useMemo(() => {
    const out = [];
    let v = 38;
    for (let i = 0; i < 252; i++) {
      v += (Math.sin(i * 0.08) + Math.cos(i * 0.13)) * 0.6;
      out.push(Math.max(25, Math.min(70, v)));
    }
    return out;
  }, []);
  const sorted = [...data].sort((a, b) => a - b);
  const p20 = sorted[Math.floor(sorted.length * 0.20)];
  const p50 = sorted[Math.floor(sorted.length * 0.50)];
  const p80 = sorted[Math.floor(sorted.length * 0.80)];
  const yMin = 25, yMax = 70;
  const x = i => padL + (i / (data.length - 1)) * (w - padL - padR);
  const y = v => padT + (1 - (v - yMin) / (yMax - yMin)) * (h - padT - padB);
  const pts = data.map((v, i) => [x(i), y(v)]);
  const last = data[data.length - 1];
  return (
    <svg width="100%" height={h} viewBox={"0 0 " + w + " " + h} preserveAspectRatio="xMidYMid meet" style={{ overflow: "visible" }}>
      <defs>
        <linearGradient id="eo-iv-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--copper)" stopOpacity="0.20" />
          <stop offset="100%" stopColor="var(--copper)" stopOpacity="0" />
        </linearGradient>
      </defs>
      <rect x={padL} y={y(p80)} width={w - padL - padR} height={y(p20) - y(p80)}
            fill="var(--amb)" opacity="0.06" />
      <line x1={padL} y1={y(p80)} x2={w - padR} y2={y(p80)} stroke="var(--amb-dim)" strokeDasharray="3 3" />
      <line x1={padL} y1={y(p50)} x2={w - padR} y2={y(p50)} stroke="var(--ink-3)" strokeDasharray="3 3" />
      <line x1={padL} y1={y(p20)} x2={w - padR} y2={y(p20)} stroke="var(--amb-dim)" strokeDasharray="3 3" />
      <text x={w - padR + 4} y={y(p80) + 3} fontSize="9" className="mono" fill="var(--amb)">P80</text>
      <text x={w - padR + 4} y={y(p50) + 3} fontSize="9" className="mono" fill="var(--ink-3)">P50</text>
      <text x={w - padR + 4} y={y(p20) + 3} fontSize="9" className="mono" fill="var(--amb)">P20</text>
      {[30, 40, 50, 60].map(v => (
        <text key={v} x={padL - 6} y={y(v) + 3} fontSize="9" className="mono" textAnchor="end" fill="var(--ink-3)">{v + "%"}</text>
      ))}
      <path d={"M " + padL + " " + y(yMin) + " L " + pts.map(p => p.join(",")).join(" L ") + " L " + (w - padR) + " " + y(yMin) + " Z"} fill="url(#eo-iv-fill)" />
      <polyline points={pts.map(p => p.join(",")).join(" ")} stroke="var(--copper)" strokeWidth="1.4" fill="none"
                style={{ filter: "drop-shadow(0 0 4px var(--copper))" }} />
      <circle cx={x(data.length - 1)} cy={y(last)} r="4" fill="var(--copper)"
              style={{ filter: "drop-shadow(0 0 8px var(--copper))" }} />
      <text x={x(data.length - 1) - 6} y={y(last) - 8} fontSize="9.5" className="mono" textAnchor="end" fill="var(--copper)">
        {"IV " + last.toFixed(1) + "%"}
      </text>
      <text x={padL} y={h - padB + 14} fontSize="9" className="mono" textAnchor="start" fill="var(--ink-3)">−252d</text>
      <text x={padL + (w - padL - padR) / 2} y={h - padB + 14} fontSize="9" className="mono" textAnchor="middle" fill="var(--ink-3)">−126d</text>
      <text x={w - padR} y={h - padB + 14} fontSize="9" className="mono" textAnchor="end" fill="var(--ink-3)">today</text>
    </svg>
  );
}
