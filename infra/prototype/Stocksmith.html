.home-sec-label {
  display: flex; align-items: baseline; gap: 12px;
  padding: 6px 4px 0;
  margin-top: 4px;
}
.home-sec-label .mono:first-child {
  font-size: 10.5px; letter-spacing: 0.20em; text-transform: uppercase;
  color: var(--copper);
}
.home-sec-label .dim2 { font-size: 10.5px; }
.home-sec-label::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--glass-line), transparent);
  align-self: center;
}

/* Top setups */
.tset { display: flex; flex-direction: column; gap: 3px; }
.tset-row {
  display: grid;
  grid-template-columns: 22px 50px 32px 1fr auto;
  gap: 10px; align-items: center;
  padding: 8px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  cursor: pointer; text-align: left; color: inherit; font: inherit;
}
.tset-row:hover { background: var(--glass-bg-3); }
.tset-rank { font-size: 9.5px; }
.tset-sym { font-size: 12px; }
.tset-score {
  font-size: 12px; font-weight: 600; text-align: center;
  padding: 2px 0; border-radius: var(--r-2);
}
.tset-score[data-tone="gn"]  { color: var(--bg); background: var(--gn); }
.tset-score[data-tone="amb"] { color: var(--bg); background: var(--amb); }
.tset-score[data-tone="rd"]  { color: var(--bg); background: var(--rd); }
.tset-mid { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tset-name { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tset-stats { font-size: 9.5px; }
.tset-v { font-size: 10.5px; font-weight: 500; }

.home-grid-3 {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1.1fr;
  gap: 12px;
}
@media (max-width: 1100px) { .home-grid-3 { grid-template-columns: 1fr; } }

/* Index strip */
.ix-strip {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 1px;
  background: var(--glass-line);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-3);
  overflow: hidden;
}
@media (max-width: 1100px) { .ix-strip { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 600px)  { .ix-strip { grid-template-columns: repeat(2, 1fr); } }
.ix {
  background: var(--glass-bg-1);
  padding: 9px 11px;
  display: flex; flex-direction: column; gap: 2px;
  border-bottom: 2px solid var(--ink-4);
}
.ix--gn  { border-bottom-color: var(--gn); }
.ix--rd  { border-bottom-color: var(--rd); }
.ix--ink { border-bottom-color: var(--ink-3); }
.ix-s { font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.ix-v { font-size: 14px; font-weight: 500; color: var(--ink); }
.ix-c { font-size: 10.5px; }
.ix svg { margin-top: 2px; }

/* Top stories */
.ts { display: flex; flex-direction: column; gap: 4px; }
.ts-row {
  padding: 8px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-left: 2px solid var(--ink-3);
  border-radius: var(--r-2);
  cursor: pointer;
}
.ts-row:hover { background: var(--glass-bg-3); }
.ts-gn { border-left-color: var(--gn); }
.ts-rd { border-left-color: var(--rd); }
.ts-amb { border-left-color: var(--amb); }
.ts-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
.ts-time { font-size: 9.5px; }
.ts-src { font-size: 9.5px; }
.ts-sym { font-size: 10.5px; color: var(--copper); font-weight: 600; }
.ts-sent { font-size: 10.5px; margin-left: auto; }
.ts-head { font-size: 11.5px; line-height: 1.4; color: var(--ink-1); }

/* Market sentiment */
.ms { display: flex; flex-direction: column; gap: 12px; }
.ms-gauge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ms-label { font-size: 12px; letter-spacing: 0.16em; }
.ms-rows { display: flex; flex-direction: column; gap: 5px; }
.ms-row { display: grid; grid-template-columns: 100px 1fr 48px; gap: 10px; align-items: center; font-size: 10.5px; }
.ms-row-l { font-size: 10.5px; }
.ms-bar { height: 6px; background: var(--bg-3); border-radius: var(--r-pill); overflow: hidden; }
.ms-fill { height: 100%; border-radius: var(--r-pill); }
.ms-fill--gn  { background: var(--gn); box-shadow: 0 0 6px color-mix(in oklab, var(--gn) 30%, transparent); }
.ms-fill--amb { background: var(--amb); }
.ms-fill--rd  { background: var(--rd); }
.ms-row-v { text-align: right; font-size: 11px; font-weight: 500; }

/* Earnings today */
.et { display: flex; flex-direction: column; gap: 4px; }
.et-hdr { font-size: 10px; padding: 2px 2px 4px; }
.et-row {
  display: grid;
  grid-template-columns: 52px 38px 44px 1fr auto auto;
  gap: 8px; align-items: baseline;
  padding: 8px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-left: 2px solid var(--ink-3);
  border-radius: var(--r-2);
  cursor: pointer;
  font-size: 11px;
}
.et-row:hover { background: var(--glass-bg-3); }
.et-row.is-held { border-left-color: var(--gn); background: color-mix(in oklab, var(--gn) 7%, var(--glass-bg-2)); }
.et-sym { font-size: 12px; }
.et-when { font-size: 9.5px; letter-spacing: 0.08em; }
.et-time { font-size: 10px; }
.et-move { font-size: 11px; }
.et-esp { font-size: 10.5px; }
.et-expo { font-size: 9.5px; letter-spacing: 0.08em; }

/* Discovery */
.disc { display: flex; flex-direction: column; gap: 7px; }
.disc-grp { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: center; }
.disc-tag {
  font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 8px; border-radius: var(--r-pill); text-align: center;
  border: 1px solid;
}
.disc-tag--gn     { color: var(--gn); border-color: color-mix(in oklab, var(--gn) 40%, transparent); background: color-mix(in oklab, var(--gn) 12%, transparent); }
.disc-tag--amb    { color: var(--amb); border-color: color-mix(in oklab, var(--amb) 40%, transparent); background: color-mix(in oklab, var(--amb) 12%, transparent); }
.disc-tag--cy     { color: var(--cy); border-color: color-mix(in oklab, var(--cy) 40%, transparent); background: color-mix(in oklab, var(--cy) 12%, transparent); }
.disc-tag--violet { color: var(--violet); border-color: color-mix(in oklab, var(--violet) 40%, transparent); background: color-mix(in oklab, var(--violet) 12%, transparent); }
.disc-tag--copper { color: var(--copper); border-color: color-mix(in oklab, var(--copper) 40%, transparent); background: color-mix(in oklab, var(--copper) 12%, transparent); }
.disc-items { display: flex; gap: 5px; flex-wrap: wrap; }
.disc-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-pill);
  cursor: pointer;
  font-size: 10.5px;
}
.disc-chip:hover { background: var(--glass-bg-3); border-color: var(--glass-line-2); }
.disc-val { font-size: 9.5px; }
.disc-val--gn { color: var(--gn); } .disc-val--amb { color: var(--amb); } .disc-val--cy { color: var(--cy); }
.disc-val--violet { color: var(--violet); } .disc-val--copper { color: var(--copper); }

/* Top movers */
.tm { display: flex; flex-direction: column; gap: 8px; }
.tm-head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 10px; letter-spacing: 0.12em; padding: 0 4px; }
.tm-head span:last-child { text-align: left; }
.tm-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tm-col { display: flex; flex-direction: column; gap: 3px; }
.tm-row {
  display: grid;
  grid-template-columns: 46px 1fr auto;
  grid-template-rows: auto auto;
  gap: 1px 8px;
  align-items: baseline;
  padding: 6px 9px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  cursor: pointer;
}
.tm-row:hover { background: var(--glass-bg-3); }
.tm-sym { font-size: 11px; }
.tm-sector { font-size: 9px; }
.tm-chg { font-size: 11px; text-align: right; grid-column: 3; grid-row: 1; }
.tm-bar { grid-column: 1 / -1; grid-row: 2; height: 4px; background: var(--bg-3); border-radius: var(--r-pill); overflow: hidden; margin-top: 2px; }
.tm-bar i { display: block; height: 100%; border-radius: var(--r-pill); }
.tm-bar i.up { background: var(--gn); }
.tm-bar i.dn { background: var(--rd); }

  --line:#283040; --line-2:#3a4560;
  --ink:#e7ebf2; --ink-1:#b4bccb; --ink-2:#8893a3; --ink-3:#626d80; --ink-4:#454f63;
  --copper:#5b8def; --copper-dim:#2f55a0; --copper-bg:rgba(91,141,239,0.12);
  --gn:#3fa46a; --gn-dim:#2a7049; --gn-bg:rgba(63,164,106,0.14);
  --rd:#d65a52; --rd-dim:#8a3a34; --rd-bg:rgba(214,90,82,0.14);
  --amb:#d99a2b; --amb-dim:#8a6418; --amb-bg:rgba(217,154,43,0.14);
  --cy:#4cc5c5; --violet:#9a86c4; --blue:#5b8def;
  --glass-bg-1:#171c28; --glass-bg-2:#1e2433; --glass-bg-3:#252d3e;
  --glass-line:#283040; --glass-line-2:#3a4560; --glass-blur:none;
  color-scheme:dark;
}
[data-theme="paper-flat"] {
  --bg:#eeeae2; --bg-0:#eeeae2; --bg-1:#f6f3ec; --bg-2:#eae6dd; --bg-3:#e0dbd0; --bg-4:#d4cec1;
  --line:#d6d0c4; --line-2:#bcb5a6;
  --ink:#1f1c16; --ink-1:#3d392f; --ink-2:#5f5a4c; --ink-3:#837d6c; --ink-4:#a8a08c;
  --copper:#9a5a2c; --copper-dim:#6e3f1d; --copper-bg:rgba(154,90,44,0.12);
  --gn:#1e8a4a; --gn-dim:#0f5a30; --gn-bg:rgba(30,138,74,0.14);
  --rd:#bb3b2e; --rd-dim:#7a221a; --rd-bg:rgba(187,59,46,0.14);
  --amb:#9a6a14; --amb-dim:#6a480c; --amb-bg:rgba(154,106,20,0.14);
  --cy:#1f8a8a; --violet:#6a4ad9; --blue:#2563c8;
  --glass-bg-1:#f6f3ec; --glass-bg-2:#eae6dd; --glass-bg-3:#e0dbd0;
  --glass-line:#d6d0c4; --glass-line-2:#bcb5a6; --glass-blur:none;
  color-scheme:light;
}

/* Flat themes: kill the aurora bloom + glow shadows + text-shadows */
[data-theme^="matte-"] body,
[data-theme="paper-flat"] body {
  background: var(--bg) !important;
}
[data-theme^="matte-"] .app::before,
[data-theme="paper-flat"] .app::before { display: none; }

/* Neutralize luminous text-shadows + heavy glows on flat themes */
[data-theme^="matte-"] .hv-stat-v,
[data-theme^="matte-"] .vhr-score,
[data-theme^="matte-"] .vhr-tag,
[data-theme^="matte-"] .regime-tag,
[data-theme^="matte-"] .cs-er-num,
[data-theme^="matte-"] .dr-side--buy,
[data-theme^="matte-"] .hv-regime-on,
[data-theme^="matte-"] .hv-regime-tape,
[data-theme="paper-flat"] .hv-stat-v,
[data-theme="paper-flat"] .vhr-score,
[data-theme="paper-flat"] .vhr-tag,
[data-theme="paper-flat"] .dr-side--buy {
  text-shadow: none !important;
}
[data-theme^="matte-"] .dr::before,
[data-theme^="matte-"] .dr-side--buy,
[data-theme^="matte-"] .hv-stat::before,
[data-theme^="matte-"] .ix,
[data-theme^="matte-"] .ss-stat::before,
[data-theme="paper-flat"] .dr::before,
[data-theme="paper-flat"] .hv-stat::before {
  box-shadow: none !important;
}

/* ===== tier.css ===== */
/* Tier picker + lock badges + upgrade gate */

.tp { position: relative; }
.tp-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-pill);
  color: var(--ink-1);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 10.5px;
}
.tp-btn:hover { background: var(--glass-bg-2); border-color: var(--glass-line-2); }
.tp-badge {
  font-size: 8.5px; letter-spacing: 0.12em;
  padding: 2px 6px; border-radius: var(--r-pill);
  background: color-mix(in oklab, var(--copper) 18%, transparent);
  color: var(--copper);
}
.tp-name { font-size: 11px; color: var(--ink); }
.tp-caret { font-size: 9px; color: var(--ink-3); }

.tp-menu {
  position: fixed; top: 52px; right: 18px;
  width: 280px;
  background-color: #0c1018 !important;
  border: 1px solid var(--line-2);
  border-radius: var(--r-3);
  padding: 10px;
  box-shadow: 0 30px 60px -16px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.06);
  z-index: 9999;
  display: flex; flex-direction: column; gap: 3px;
}
[data-theme="arctic-light"] .tp-menu,
[data-theme="ivory-editorial"] .tp-menu,
[data-theme="paper-flat"] .tp-menu { background-color: #ffffff !important; }
.tp-menu-hdr { padding: 4px 8px 6px; }
.tp-opt {
  display: grid; grid-template-columns: 32px 1fr auto; gap: 10px;
  align-items: center;
  padding: 8px 8px;
  background: transparent; border: 1px solid transparent;
  border-radius: var(--r-2);
  cursor: pointer; text-align: left; color: inherit; font: inherit;
}
.tp-opt:hover { background: var(--glass-bg-2); }
.tp-opt.is-on { border-color: var(--copper); background: color-mix(in oklab, var(--copper) 14%, transparent); }
.tp-opt-badge {
  font-size: 11px; font-weight: 600; text-align: center;
  padding: 3px 0; border-radius: var(--r-2);
  background: var(--glass-bg-2); color: var(--copper);
}
.tp-opt-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tp-opt-name { font-size: 12px; font-weight: 500; color: var(--ink); }
.tp-opt-tag { font-size: 9.5px; }
.tp-opt-price { font-size: 11px; color: var(--ink-1); font-weight: 500; }
.tp-menu-foot { padding: 8px 8px 2px; font-size: 9.5px; border-top: 1px solid var(--glass-line); margin-top: 4px; line-height: 1.5; }

/* Icon-rail lock */
.ir-item.is-locked { opacity: 0.5; }
.ir-item.is-locked:hover { opacity: 0.8; }
.ir-lock {
  position: absolute; top: 2px; right: 2px;
  font-size: 9px; line-height: 1;
  filter: grayscale(1);
}

/* Lens tab lock */
.dp-tab.is-locked { opacity: 0.55; }
.dp-tab.is-locked:hover { opacity: 0.85; }
.dp-tab-tier {
  font-size: 8px; letter-spacing: 0.06em;
  padding: 1px 5px; border-radius: var(--r-pill);
  background: color-mix(in oklab, var(--copper) 16%, transparent);
  color: var(--copper);
}

/* Upgrade gate */
.upgate {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 60px 24px; min-height: 360px;
}
.upgate-card {
  max-width: 440px; text-align: center;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-4);
  padding: 36px 32px;
  backdrop-filter: var(--glass-blur);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.upgate-lock { font-size: 34px; filter: grayscale(0.3); }
.upgate-tier {
  font-size: 10px; letter-spacing: 0.18em;
  padding: 4px 12px; border-radius: var(--r-pill);
  background: color-mix(in oklab, var(--copper) 16%, transparent);
  color: var(--copper);
  border: 1px solid color-mix(in oklab, var(--copper) 30%, transparent);
}
.upgate-title { font-size: 22px; font-weight: 600; letter-spacing: 0.01em; margin-top: 4px; }
.upgate-sub { font-size: 12px; color: var(--ink-2); line-height: 1.55; max-width: 42ch; }
.upgate-sub b { color: var(--ink); }
.upgate-btn {
  margin-top: 8px;
  padding: 10px 20px;
  font-size: 11px; letter-spacing: 0.12em;
  background: linear-gradient(180deg, var(--copper), color-mix(in oklab, var(--copper) 72%, var(--rd)));
  color: var(--bg); border: none; border-radius: var(--r-pill);
  cursor: pointer; font-weight: 600;
  box-shadow: 0 0 20px color-mix(in oklab, var(--copper) 35%, transparent);
}
.upgate-note { font-size: 10px; margin-top: 4px; }

/* ============================================================ */
/* RICH VERDICT HERO (vh-rich)                                   */
/* ============================================================ */
.vh-rich {
  display: flex; flex-direction: column;
  gap: 16px;
  padding: 20px 24px 18px;
  background: transparent;
  border-bottom: 1px solid var(--glass-line);
}
.vhr-top {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  align-items: center;
}
.dpanel--S .vhr-top, .dpanel--M .vhr-top { grid-template-columns: 1fr; }
.vhr-vis {
  display: flex; align-items: center; justify-content: center;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-3);
  padding: 14px;
  min-width: 220px;
}
.vhr-body {
  display: flex; flex-direction: column; gap: 12px;
  min-width: 0;
}
.vhr-eyebrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.vhr-head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.vhr-tag {
  padding: 8px 22px;
  background: color-mix(in oklab, var(--gn) 16%, transparent);
  border: 2px solid var(--gn);
  border-radius: var(--r-pill);
  color: var(--gn);
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.16em;
  box-shadow: 0 0 22px color-mix(in oklab, var(--gn) 30%, transparent);
}
.vhr-score {
  font-family: var(--mono);
  font-size: 56px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1;
  text-shadow: 0 0 18px color-mix(in oklab, var(--copper) 25%, transparent);
}
.vhr-score-of { font-size: 22px; color: var(--ink-3); font-weight: 400; margin-left: 2px; }
.vhr-conf { font-size: 11px; align-self: flex-end; padding-bottom: 6px; }
.vhr-setup {
  font-size: 13px;
  padding: 10px 14px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  letter-spacing: 0.02em;
  line-height: 1.5;
}
.vhr-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.vhr-act {
  padding: 8px 16px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-pill);
  color: var(--ink-1);
  cursor: pointer;
  transition: all 0.12s;
}
.vhr-act:hover { background: var(--glass-bg-2); border-color: var(--glass-line-2); }
.vhr-act--gn {
  background: color-mix(in oklab, var(--gn) 14%, transparent);
  color: var(--gn);
  border-color: color-mix(in oklab, var(--gn) 40%, transparent);
  box-shadow: 0 0 14px color-mix(in oklab, var(--gn) 22%, transparent);
}
.vhr-act--rd {
  background: color-mix(in oklab, var(--rd) 12%, transparent);
  color: var(--rd);
  border-color: color-mix(in oklab, var(--rd) 35%, transparent);
}
.vhr-act--ghost { border-style: dashed; }

/* Pillars row */
.vhr-pillars {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.dpanel--S .vhr-pillars, .dpanel--M .vhr-pillars { grid-template-columns: repeat(2, 1fr); }
.vhr-pill {
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.vhr-pill-l { font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.vhr-pill-row { display: flex; align-items: center; gap: 10px; }
.vhr-pill-bar {
  flex: 1;
  height: 8px;
  background: var(--bg-3);
  border-radius: var(--r-pill);
  overflow: hidden;
}
.vhr-pill-fill {
  height: 100%;
  border-radius: var(--r-pill);
  transition: width 0.4s cubic-bezier(0.2, 0, 0, 1);
}
.vhr-pill-v { font-size: 16px; font-weight: 500; min-width: 28px; text-align: right; }

/* Ticket strip */
.vhr-ticket {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--glass-line);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  overflow: hidden;
}
.dpanel--S .vhr-ticket, .dpanel--M .vhr-ticket { grid-template-columns: repeat(2, 1fr); }
.vhr-tk {
  padding: 12px 14px;
  background: var(--glass-bg-1);
  display: flex; flex-direction: column; gap: 3px;
}
.vhr-tk-l { font-size: 9.5px; }
.vhr-tk-v { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
.vhr-tk-sub { font-size: 10.5px; }

/* ===== workspaces.css ===== */

.wsx { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.wsx-hdr {

.wsx--rd .wsx-eyebrow { color: var(--rd); }

.wsx-kpi-l { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
.wsx-kpi-v { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; margin-top: 1px; }
.wsx-kpi-s { font-size: 9.5px; }

.wsx-body { background: var(--glass-bg-1); border: 1px solid var(--glass-line); border-radius: var(--r-3); overflow: hidden; }
.wsx-tbl { width: 100%; font-size: 12.5px; }

.wsx-tbl tbody tr { cursor: pointer; }
.wsx-tbl tbody tr:hover td { background: var(--glass-bg-2); }
.wsx-th { cursor: pointer; user-select: none; white-space: nowrap; }
.wsx-th:hover { color: var(--ink); }
.wsx-th.is-active { color: var(--copper); }
.wsx-arr { margin-left: 4px; font-size: 9px; }

.wsx-stub-banner {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 16px; background: var(--amb-bg);
  border: 1px solid color-mix(in oklab, var(--amb) 30%, transparent); border-radius: var(--r-2);
  font-family: var(--mono); font-size: 11.5px; color: var(--amb); line-height: 1.5;
}

.lab-stat-l { font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; }
.lab-stat-v { font-size: 16px; font-weight: 500; margin-top: 2px; }
.lab-stat-s { font-size: 9px; }
.lab-verdict { font-size: 11px; padding: 9px 12px; background: color-mix(in oklab, var(--gn) 8%, transparent); border: 1px solid color-mix(in oklab, var(--gn) 22%, transparent); border-radius: var(--r-2); line-height: 1.5; }
.lab-icbar { display: inline-block; width: 80px; height: 6px; background: var(--bg-3); border-radius: 3px; overflow: hidden; }
.lab-icbar span { display: block; height: 100%; border-radius: 3px; }
.lab-mini-btn { padding: 3px 9px; background: var(--glass-bg-2); border: 1px solid var(--glass-line); border-radius: var(--r-pill); color: var(--ink-1); font-size: 9.5px; cursor: pointer; }
.lab-mini-btn:hover { color: var(--ink); border-color: var(--violet); }
.lab-matrix { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
.lab-mx-h { font-size: 9px; text-align: center; color: var(--ink-3); padding: 3px; }
.lab-mx-cell { text-align: center; padding: 10px 4px; font-size: 11px; border-radius: 3px; border: 1px solid var(--glass-line); }
.lab-knobs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.lab-knob { background: var(--glass-bg-2); border: 1px solid var(--glass-line); border-radius: var(--r-2); padding: 9px 11px; border-left: 2px solid var(--violet); }
.lab-knob-k { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; }
.lab-knob-v { font-size: 17px; font-weight: 500; margin: 1px 0; }
.lab-knob-s { font-size: 9px; }
.lab-sandbox-out { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.lab-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ===== surface-news.css ===== */
/* surface-news.css — News & Sentiment hub */

.news2 { display: flex; flex-direction: column; gap: 12px; }

/* Sentiment read banner */
.nw-read {
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center;
  padding: 14px 18px;
  background: linear-gradient(135deg, color-mix(in oklab, var(--violet) 12%, transparent), color-mix(in oklab, var(--cy) 6%, transparent));
  border: 1px solid color-mix(in oklab, var(--violet) 28%, transparent);
  border-radius: var(--r-3); position: relative; overflow: hidden;
}
.nw-read::before { content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px; background: var(--violet); box-shadow: 0 0 16px var(--violet); }
.nw-read-gauge { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-right: 14px; border-right: 1px solid var(--glass-line); }
.nw-read-num { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.nw-read-num[data-tone="gn"] { color: var(--gn); text-shadow: 0 0 16px color-mix(in oklab, var(--gn) 35%, transparent); }
.nw-read-num[data-tone="rd"] { color: var(--rd); }
.nw-read-num[data-tone="amb"] { color: var(--amb); }
.nw-read-lbl { font-size: 8.5px; letter-spacing: 0.14em; }
.nw-read-body { font-size: 12px; line-height: 1.6; color: var(--ink-1); }
.nw-read-bars { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.nw-bar { display: grid; grid-template-columns: 54px 1fr 20px; gap: 8px; align-items: center; font-size: 10px; }
.nw-bar-t { height: 6px; border-radius: var(--r-pill); background: var(--bg-3); overflow: hidden; }
.nw-bar-f { height: 100%; border-radius: var(--r-pill); }
@media (max-width: 1000px) { .nw-read { grid-template-columns: 1fr; } .nw-read-gauge { flex-direction: row; border-right: none; padding-right: 0; gap: 10px; } }

/* search in tab row */
.nw-search { margin-left: auto; padding: 5px 12px; background: var(--glass-bg-1); border: 1px solid var(--glass-line); border-radius: var(--r-pill); color: var(--ink); font-size: 11px; min-width: 220px; }

/* Grid: feed + rail */
.nw-grid { display: grid; grid-template-columns: 1fr 320px; gap: 12px; align-items: start; }
@media (max-width: 1100px) { .nw-grid { grid-template-columns: 1fr; } }

.nw-feed { display: flex; flex-direction: column; gap: 8px; }
.nw-card {
  background: var(--glass-bg-1); border: 1px solid var(--glass-line);
  border-left: 3px solid var(--ink-3); border-radius: var(--r-3); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 7px;
}
.nw-card--gn { border-left-color: var(--gn); }
.nw-card--rd { border-left-color: var(--rd); }
.nw-card--amb { border-left-color: var(--amb); }
.nw-card--ink { border-left-color: var(--ink-3); }
.nw-card-top { display: flex; align-items: center; gap: 10px; }
.nw-time { font-size: 10px; }
.nw-src { font-size: 10px; color: var(--ink-2); letter-spacing: 0.04em; }
.nw-imp { font-size: 8.5px; letter-spacing: 0.12em; color: var(--rd); }
.nw-sym { margin-left: auto; font-size: 10.5px; color: var(--copper); background: color-mix(in oklab, var(--copper) 12%, transparent); border: 1px solid color-mix(in oklab, var(--copper) 30%, transparent); border-radius: var(--r-pill); padding: 2px 9px; cursor: pointer; }
.nw-sym:hover { background: color-mix(in oklab, var(--copper) 22%, transparent); }
.nw-sent { font-size: 11px; font-weight: 600; }
.nw-head { font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.nw-head:hover { color: var(--copper); }
.nw-blurb { font-size: 11px; line-height: 1.5; }
.nw-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.nw-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.nw-tag { font-size: 9px; letter-spacing: 0.08em; padding: 2px 8px; border-radius: var(--r-pill); background: var(--glass-bg-2); border: 1px solid var(--glass-line); color: var(--ink-2); }
.nw-links { display: flex; gap: 12px; }
.nw-links a { font-size: 10px; color: var(--cy); text-decoration: none; letter-spacing: 0.04em; }
.nw-links a:hover { text-decoration: underline; }
.nw-empty { padding: 40px; text-align: center; }

/* Right rail */
.nw-rail { display: flex; flex-direction: column; gap: 12px; }
.nw-trend { display: flex; flex-direction: column; gap: 3px; }
.nw-trend-row { display: grid; grid-template-columns: 50px 1fr 24px 40px; gap: 8px; align-items: center; padding: 5px 8px; background: var(--glass-bg-2); border: 1px solid var(--glass-line); border-radius: var(--r-2); cursor: pointer; }
.nw-trend-row:hover { background: var(--glass-bg-3); }
.nw-trend-sym { font-size: 11px; }
.nw-trend-bar { height: 6px; border-radius: var(--r-pill); background: var(--bg-3); overflow: hidden; }
.nw-trend-bar i { display: block; height: 100%; border-radius: var(--r-pill); }
.nw-trend-n { font-size: 10px; text-align: right; }
.nw-trend-s { font-size: 10px; text-align: right; }

.nw-src-list { display: flex; flex-direction: column; gap: 4px; }
.nw-src-row { display: grid; grid-template-columns: 80px 1fr 20px; gap: 8px; align-items: center; font-size: 10.5px; }
.nw-src-bar { height: 6px; border-radius: var(--r-pill); background: var(--bg-3); overflow: hidden; }
.nw-src-bar i { display: block; height: 100%; background: var(--cy); border-radius: var(--r-pill); }

.nw-macro { display: flex; flex-direction: column; gap: 4px; }
.nw-macro-row { display: flex; align-items: center; gap: 8px; padding: 6px 9px; background: var(--glass-bg-2); border: 1px solid var(--glass-line); border-left: 2px solid var(--ink-3); border-radius: var(--r-2); }
.nw-macro--rd { border-left-color: var(--rd); }
.nw-macro--amb { border-left-color: var(--amb); }
.nw-macro-t { font-size: 10px; min-width: 36px; }
.nw-macro-e { font-size: 11px; flex: 1; }

/* ETFs unified tabs */
.etfs-wrap { display: flex; flex-direction: column; gap: 0; }
.etfs-tabbar { padding: 0 0 12px; }
.etfs-tabs { display: inline-flex; gap: 3px; padding: 3px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r-pill); }
.etfs-tab { display: flex; flex-direction: column; gap: 1px; padding: 7px 18px; background: transparent; border: none; border-radius: var(--r-pill); cursor: pointer; text-align: left; }
.etfs-tab-l { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink); letter-spacing: 0.04em; }
.etfs-tab-s { font-size: 9px; color: var(--ink-3); }
.etfs-tab.is-on { background: color-mix(in oklab, var(--cy) 22%, var(--bg-2)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--cy) 45%, transparent); }
.etfs-tab.is-on .etfs-tab-l { color: var(--cy); }
.etfs-tab:not(.is-on):hover { background: var(--bg-3); }

/* ===== surface-users.css ===== */
/* surface-users.css — Admin User Management */
.um { display:flex; flex-direction:column; gap:12px; }
.um-tiers { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
@media (max-width:900px){ .um-tiers { grid-template-columns:repeat(3,1fr); } }
.um-tier { background:var(--glass-bg-1); border:1px solid var(--glass-line); border-radius:var(--r-3); padding:10px 12px; display:flex; flex-direction:column; gap:2px; cursor:pointer; text-align:left; border-top:3px solid var(--ink-4); }
.um-tier:hover { background:var(--glass-bg-2); }
.um-tier.is-on { box-shadow:inset 0 0 0 1px var(--copper); }
.um-tier--0 { border-top-color:var(--ink-3); } .um-tier--1 { border-top-color:var(--cy); } .um-tier--2 { border-top-color:var(--gn); }
.um-tier--3 { border-top-color:var(--blue); } .um-tier--4 { border-top-color:var(--copper); } .um-tier--5 { border-top-color:var(--violet); }
.um-tier-n { font-size:22px; font-weight:700; }
.um-tier-l { font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-2); }
.um-tier-p { font-size:10px; }
.um-tbl td, .um-tbl th { padding:8px 10px; }
.um-user { display:flex; align-items:center; gap:8px; }
.um-avatar { width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--copper),var(--violet)); color:var(--bg); display:grid; place-items:center; font-size:10px; font-weight:700; }
.um-status { font-size:10px; padding:2px 9px; border-radius:var(--r-pill); letter-spacing:0.06em; text-transform:uppercase; }
.um-status--active { color:var(--gn); background:color-mix(in oklab,var(--gn) 14%,transparent); border:1px solid color-mix(in oklab,var(--gn) 35%,transparent); }
.um-status--trial { color:var(--amb); background:color-mix(in oklab,var(--amb) 14%,transparent); border:1px solid color-mix(in oklab,var(--amb) 35%,transparent); }
.um-status--suspended { color:var(--rd); background:color-mix(in oklab,var(--rd) 14%,transparent); border:1px solid color-mix(in oklab,var(--rd) 35%,transparent); }
.um-sel { background:var(--glass-bg-2); border:1px solid var(--glass-line); border-radius:var(--r-pill); color:var(--ink); font-family:var(--mono); font-size:11px; padding:5px 10px; cursor:pointer; }
.um-sel[data-tier="4"] { border-color:color-mix(in oklab,var(--copper) 45%,transparent); color:var(--copper); }
.um-sel[data-tier="5"] { border-color:color-mix(in oklab,var(--violet) 45%,transparent); color:var(--violet); }

/* View tabs */
.um-viewtabs { display:flex; gap:3px; border-bottom:1px solid var(--glass-line); }
.um-vt { padding:9px 16px; background:transparent; border:none; border-bottom:2px solid transparent; color:var(--ink-3); cursor:pointer; font-size:12px; letter-spacing:0.04em; }
.um-vt:hover { color:var(--ink-1); }
.um-vt.is-on { color:var(--amb); border-bottom-color:var(--amb); }

/* Tier access config */
.tac { display:flex; flex-direction:column; gap:12px; }
.tac-legend { font-size:11px; line-height:1.6; }
.tac-key { display:inline-flex; gap:8px; flex-wrap:wrap; margin-left:10px; }
.tac-k { padding:1px 7px; border-radius:var(--r-pill); font-size:9.5px; }
.tac-k--0 { background:color-mix(in oklab,var(--ink-3) 20%,transparent); color:var(--ink-1); }
.tac-k--1 { background:color-mix(in oklab,var(--cy) 18%,transparent); color:var(--cy); }
.tac-k--2 { background:color-mix(in oklab,var(--gn) 18%,transparent); color:var(--gn); }
.tac-k--3 { background:color-mix(in oklab,var(--blue) 18%,transparent); color:var(--blue); }
.tac-k--4 { background:color-mix(in oklab,var(--copper) 18%,transparent); color:var(--copper); }
.tac-k--5 { background:color-mix(in oklab,var(--violet) 18%,transparent); color:var(--violet); }
.tac-cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
@media (max-width:1000px){ .tac-cols { grid-template-columns:1fr; } }
.tac-rows { display:flex; flex-direction:column; gap:3px; }
.tac-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 8px; background:var(--glass-bg-2); border:1px solid var(--glass-line); border-radius:var(--r-2); }
.tac-row-l { font-size:12px; }
.tac-pills { display:inline-flex; gap:2px; }
.tac-pill { width:26px; height:24px; border:1px solid var(--glass-line); background:var(--glass-bg-1); color:var(--ink-3); border-radius:var(--r-2); cursor:pointer; font-size:10px; font-weight:600; }
.tac-pill:hover { color:var(--ink); }
.tac-pill.is-on.tac-pill--0 { background:var(--ink-3); color:var(--bg); border-color:var(--ink-3); }
.tac-pill.is-on.tac-pill--1 { background:var(--cy); color:var(--bg); border-color:var(--cy); }
.tac-pill.is-on.tac-pill--2 { background:var(--gn); color:var(--bg); border-color:var(--gn); }
.tac-pill.is-on.tac-pill--3 { background:var(--blue); color:var(--bg); border-color:var(--blue); }
.tac-pill.is-on.tac-pill--4 { background:var(--copper); color:var(--bg); border-color:var(--copper); }
.tac-pill.is-on.tac-pill--5 { background:var(--violet); color:var(--bg); border-color:var(--violet); }

/* Edit affordance + modal */
.um-edit { background:transparent; border:1px solid var(--glass-line); color:var(--ink-2); border-radius:var(--r-2); width:26px; height:24px; cursor:pointer; }
.um-edit:hover { color:var(--copper); border-color:color-mix(in oklab,var(--copper) 40%,transparent); }
.um-modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:grid; place-items:center; z-index:10000; }
.um-modal { width:420px; max-width:92vw; background:#0c1018; border:1px solid var(--line-2); border-radius:var(--r-3); box-shadow:0 30px 60px -16px rgba(0,0,0,0.85); display:flex; flex-direction:column; }
[data-theme="arctic-light"] .um-modal, [data-theme="ivory-editorial"] .um-modal, [data-theme="paper-flat"] .um-modal { background:#fff; }
.um-modal-h { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--glass-line); font-size:11px; letter-spacing:0.16em; color:var(--amb); }
.um-modal-x { background:transparent; border:none; color:var(--ink-2); cursor:pointer; font-size:14px; }
.um-modal-body { padding:16px; display:flex; flex-direction:column; gap:12px; }
.um-field { display:flex; flex-direction:column; gap:4px; }
.um-field span { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; }
.um-field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.um-input { background:var(--glass-bg-2); border:1px solid var(--glass-line); border-radius:var(--r-2); color:var(--ink); font-family:var(--sans); font-size:13px; padding:8px 10px; }
.um-toggle { display:flex; align-items:center; gap:8px; font-size:12px; cursor:pointer; }
.um-modal-foot { display:flex; align-items:center; gap:6px; padding:14px 16px; border-top:1px solid var(--glass-line); }
.um-del { color:var(--rd); border-color:color-mix(in oklab,var(--rd) 35%,transparent); }
.btn:disabled { opacity:0.4; cursor:not-allowed; }

/* ===== surface-signal.css ===== */
/* Signal Scanner — full kairos-style table */

.ss2-surface {
  padding: 12px 16px;
  display: flex; flex-direction: column;
  gap: 10px;
  overflow: hidden;
}

/* Tab strip */
.ss2-tabs {
  display: flex;
  gap: 2px;
  padding: 6px 4px;
  border-bottom: 1px solid var(--glass-line);
  overflow-x: auto;
}
.ss2-tab {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  cursor: pointer;
  white-space: nowrap;
}
.ss2-tab:hover { color: var(--ink-1); }
.ss2-tab.is-on {
  color: var(--ink);
  border-bottom-color: var(--copper);
}
.ss2-tab-c {
  font-size: 10px;
  padding: 1px 7px;
  background: var(--glass-bg-2);
  border-radius: var(--r-pill);
  color: var(--ink-2);
}
.ss2-tab.is-on .ss2-tab-c { background: color-mix(in oklab, var(--copper) 18%, transparent); color: var(--copper); }
.ss2-c--copper { color: var(--copper) !important; }
.ss2-c--gn     { color: var(--gn) !important; }
.ss2-c--amb    { color: var(--amb) !important; }
.ss2-c--rd     { color: var(--rd) !important; }
.ss2-c--violet { color: var(--violet) !important; }
.ss2-c--cy     { color: var(--cy) !important; }

/* Filter pills */
.ss2-pills {
  display: flex;
  gap: 6px;
  padding: 6px 0;
  flex-wrap: wrap;
}
.ss2-pill {
  padding: 5px 12px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-pill);
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 11.5px;
  cursor: pointer;
}
.ss2-pill:hover { background: var(--glass-bg-2); color: var(--ink); }
.ss2-pill.is-on {
  background: color-mix(in oklab, var(--copper) 16%, transparent);
  border-color: color-mix(in oklab, var(--copper) 40%, transparent);
  color: var(--copper);
  box-shadow: 0 0 10px color-mix(in oklab, var(--copper) 18%, transparent);
}

/* Toolbar */
.ss2-toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid var(--glass-line);
  flex-wrap: wrap;
}
.ss2-sel {
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  color: var(--ink);
  padding: 4px 8px;
  font-family: var(--mono);
  font-size: 11px;
}
.ss2-side { display: inline-flex; gap: 1px; border-radius: var(--r-2); background: var(--glass-line); padding: 1px; }
.ss2-side-btn {
  padding: 5px 12px;
  background: var(--glass-bg-1);
  border: none;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--ink-2);
  cursor: pointer;
}
.ss2-side-btn.is-on.ss2-side--buy   { background: var(--gn-bg); color: var(--gn); }
.ss2-side-btn.is-on.ss2-side--watch { background: var(--amb-bg); color: var(--amb); }
.ss2-side-btn.is-on.ss2-side--short { background: var(--rd-bg); color: var(--rd); }
.ss2-side-btn.is-on.ss2-side--all   { background: var(--copper-bg); color: var(--copper); }
.ss2-search {
  margin-left: auto;
  padding: 5px 10px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-pill);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  min-width: 200px;
}

/* Table */
.ss2-tbl-wrap {
  overflow: auto;
  flex: 1;
  min-height: 0;
}
.ss2-tbl {
  font-size: 12px;
  width: 100%;
  border-collapse: collapse;
}
.ss2-tbl thead th {
  position: sticky; top: 0;
  font-size: 10.5px;
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  font-size: 9.5px;
  letter-spacing: 0.10em;
  color: var(--ink-3);
  padding: 8px 8px;
  border-bottom: 1px solid var(--glass-line);
  white-space: nowrap;
  font-weight: 500;
}
.ss2-tbl tbody td {
  padding: 7px 8px;
  border-bottom: 1px solid color-mix(in oklab, var(--glass-line) 50%, transparent);
  white-space: nowrap;
}
.ss2-tbl tbody tr { cursor: pointer; }
.ss2-tbl tbody tr:hover td { background: var(--glass-bg-2); }
.ss2-chk { width: 18px; }
.ss2-sym { display: flex; align-items: center; gap: 6px; }
.ss2-clear { background:transparent; border:1px solid var(--glass-line); color:var(--ink-2); border-radius:var(--r-pill); padding:4px 10px; font-size:10px; cursor:pointer; }
.ss2-clear:hover { color:var(--rd); border-color:color-mix(in oklab,var(--rd) 40%,transparent); }
.ss2-star { color: var(--ink-4); }
.ss2-sym:hover .ss2-star { color: var(--copper); }

.ss2-score {
  display: inline-block;

  /* ════ investment ════ */
/* ============================================================ */
/* LensInvestment — Investment · Value                           */
/* component CSS (verbatim from lenses.css)                       */
/* ============================================================ */

.th-score-unit { font-size: 14px; color: var(--ink-3); margin-left: 3px; }
/* Value hero */
.value-hero { flex-direction: column; gap: 18px; }
.vh-top { display: flex; }
.vh-verdict { display: flex; align-items: baseline; gap: 14px; margin-top: 4px; }
.vh-tag {
  display: inline-flex; align-items: center;
  padding: 4px 12px;
  background: var(--amb-bg); color: var(--amb);
  border: 1.5px solid var(--amb-dim);
  border-radius: var(--r-2);
  font-family: var(--mono); font-size: 16px;
  letter-spacing: 0.10em;
}
.vh-score { font-family: var(--mono); font-size: 28px; font-weight: 500; }
.vh-line { font-size: 11px; margin-top: 8px; }
.vh-scale { padding: 16px 8px 36px; }
.vh-scale-track {
  position: relative;
  height: 6px;
  background: linear-gradient(to right, var(--rd-dim) 0%, var(--amb-dim) 50%, var(--gn-dim) 100%);

.vh-bear .vh-scale-px { color: var(--rd); }
.vh-bull .vh-scale-px { color: var(--gn); }
.vh-target .vh-scale-px { color: var(--copper); }
.vh-scale-current {
  position: absolute; top: -16px;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center;
  z-index: 2;
}
/* Quality */
.quality { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.qual-cat {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.qual-hdr { display: flex; align-items: baseline; justify-content: space-between; }
.qual-grade { font-size: 22px; font-weight: 500; }
.qual-metric {
  display: flex; justify-content: space-between;
  font-size: 11px;
}
/* Statements */
.statements td.r { font-size: 11px; }
/* Cap alloc */
.cap-alloc { display: flex; flex-direction: column; gap: 12px; }
.cap-seg { transition: opacity 0.12s; }
.cap-seg:hover { opacity: 0.85; }
.cap-copper { background: var(--copper); }
.cap-gn     { background: var(--gn); }
.cap-amb    { background: var(--amb); }
.cap-violet { background: var(--violet); }
.cap-ink    { background: var(--ink-3); }
.cap-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px; }
.cap-row {
  display: grid;
  grid-template-columns: 14px 1fr auto auto;
  gap: 8px;
  align-items: center;
  font-size: 11px;
}
.cap-sw { width: 12px; height: 12px; border-radius: 2px; }
.cap-use { font-size: 11px; font-weight: 500; }
.cap-amt { font-size: 10px; }
.cap-pct { font-size: 11px; font-weight: 500; }
.cap-note { font-size: 10.5px; }
/* Bull/Bear */

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;

.dpanel--S .bullbear, .dpanel--M .bullbear { grid-template-columns: 1fr; }
.bb-col {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.bb-col--bull { border-left: 3px solid var(--gn-dim); }
.bb-col--bear { border-left: 3px solid var(--rd-dim); }
.bb-hdr { display: flex; align-items: center; gap: 10px; }
.bb-row {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 8px;
  align-items: baseline;
  font-size: 11.5px;
  line-height: 1.5;
}
.bb-num { color: var(--ink-3); font-size: 10px; }
/* Catalyst calendar */
.catcal { display: flex; flex-direction: column; gap: 4px; }
.cat-amb { border-left-color: var(--amb); }
.cat-gn  { border-left-color: var(--gn); }
.cat-copper { border-left-color: var(--copper); }
.cat-violet { border-left-color: var(--violet); }
.cat-when { font-size: 11px; color: var(--ink-2); letter-spacing: 0.04em; }

.lens { padding-bottom: 24px; }

  /* ════ earnings-options ════ */
/* ════════════════════════════════════════════════════════════
   Ported lenses: Earnings + Options (canonical v2)
   Lens-specific rules only. Shared base classes (.lens, .hero,
   .lens-section, .lens-pad, .lens-call, .kpi-row, .dtable,
   .label-cap, .mono, .dim, .dim2, .tabular, .up, .dn, .warn,
   .copper, tr.is-current, kpi-tone--*) live in the target shell.
   ════════════════════════════════════════════════════════════ */

/* ── EARNINGS ─────────────────────────────────────────────── */
.er-hero {
  display: grid !important;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.dpanel--S .er-hero, .dpanel--M .er-hero { grid-template-columns: 1fr; }
.er-hero-left { display: flex; flex-direction: column; gap: 12px; }
.er-countdown {
  display: flex; align-items: baseline; gap: 12px;
}
.er-cd-num {
  font-family: var(--mono);
  font-size: 60px;
  font-weight: 500;
  color: var(--copper);
  letter-spacing: -0.02em;
  line-height: 1;
  text-shadow: 0 0 28px color-mix(in oklab, var(--copper) 40%, transparent);
}
.er-cd-unit { font-size: 16px; color: var(--ink-2); }
.er-cd-date { font-size: 12px; margin-left: auto; }
.er-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.er-hero-right { display: flex; align-items: center; justify-content: center; }
/* ── OPTIONS (canonical v2) ───────────────────────────────── */
/* Hero */
.ohp { display: flex; flex-direction: column; gap: 14px; padding: 16px 20px; }
.ohp-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ohp-id { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; flex: 1; }
.ohp-sym { font-size: 28px; font-weight: 600; color: var(--ink); letter-spacing: 0.02em; }
.ohp-px { font-size: 26px; font-weight: 500; color: var(--ink); text-shadow: 0 0 12px color-mix(in oklab, var(--copper) 35%, transparent); }
.ohp-meta { font-size: 11px; }
.ohp-slogan { font-size: 11px; font-style: italic; }
.ohp-actions { display: flex; gap: 6px; }
.ohp-act {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.10em; text-transform: uppercase;
  padding: 6px 12px;
  border: 1px solid var(--glass-line);
  background: var(--glass-bg-1);
  color: var(--ink-1);
  border-radius: var(--r-pill);
  cursor: pointer;
}
.ohp-act:hover { background: var(--glass-bg-2); }
.ohp-act--gn { color: var(--gn); border-color: color-mix(in oklab, var(--gn) 40%, transparent); background: color-mix(in oklab, var(--gn) 14%, transparent); box-shadow: 0 0 12px color-mix(in oklab, var(--gn) 20%, transparent); }
.ohp-act--rd { color: var(--rd); border-color: color-mix(in oklab, var(--rd) 40%, transparent); background: color-mix(in oklab, var(--rd) 14%, transparent); box-shadow: 0 0 12px color-mix(in oklab, var(--rd) 20%, transparent); }
.ohp-strat {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 14px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  flex-wrap: wrap;
}
.ohp-strat-lbl { font-size: 10.5px; }
.ohp-strat-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.ohp-tag {
  padding: 3px 10px; font-size: 10px;
  border-radius: var(--r-pill);
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  color: var(--ink-1);
  letter-spacing: 0.08em;
}
.ohp-tag--cop { color: var(--copper); border-color: color-mix(in oklab, var(--copper) 40%, transparent); background: color-mix(in oklab, var(--copper) 14%, transparent); }
.ohp-tag--gn  { color: var(--gn); border-color: color-mix(in oklab, var(--gn) 40%, transparent); background: color-mix(in oklab, var(--gn) 14%, transparent); }
.ohp-kpis {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.dpanel--S .ohp-kpis, .dpanel--M .ohp-kpis { grid-template-columns: repeat(2, 1fr); }
.ohp-kpi {
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 3px;
}
.ohp-kpi-l { font-size: 9.5px; }
.ohp-kpi-v { font-size: 20px; font-weight: 500; }
.ohp-kpi-sub { font-size: 10px; }
.ohp-rows { display: flex; flex-direction: column; gap: 4px; }
.ohp-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 14px;
  align-items: baseline;
  padding: 8px 12px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  font-size: 11.5px;
}
.ohp-row-lbl {
  font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-3);
}
/* §0 Session */
.sec-ctx { display: flex; flex-direction: column; gap: 6px; }
.sc-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto;
  gap: 6px;
  align-items: center;
  padding: 6px 10px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-pill);
}
.sc-segment {
  padding: 5px 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-radius: var(--r-pill);
  text-align: center;
  background: transparent;
  color: var(--ink-3);
}
.sc-segment.is-on {
  background: color-mix(in oklab, var(--gn) 14%, transparent);
  color: var(--gn);
  border: 1px solid color-mix(in oklab, var(--gn) 40%, transparent);
  box-shadow: 0 0 12px color-mix(in oklab, var(--gn) 20%, transparent);
}
.sc-spot {
  margin-left: auto;
  font-size: 13px;
  font-weight: 500;
  padding: 4px 12px;
  background: color-mix(in oklab, var(--copper) 16%, transparent);
  border: 1px solid color-mix(in oklab, var(--copper) 40%, transparent);
  color: var(--copper);
  border-radius: var(--r-pill);
}
.sc-axis {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  font-size: 10px;
  padding: 0 14px;
}
.sc-axis span:nth-child(2) { text-align: center; }
.sc-axis span:nth-child(3) { text-align: right; }
/* §1 / §2 */
.vr, .em { display: flex; flex-direction: column; gap: 12px; }
.vr-chart-wrap, .em-chart-wrap {
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.vr-chart-hdr, .em-chart-hdr { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
.em-tbl td { font-size: 11px; }
/* §3 Flow */
.fp { display: flex; flex-direction: column; gap: 12px; }
.fp-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.dpanel--S .fp-2col, .dpanel--M .fp-2col { grid-template-columns: 1fr; }
/* Vol-block (shared by Flow §3 two-col cards) */
.vcp-block {
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  padding: 12px 14px;
  backdrop-filter: var(--glass-blur);
  display: flex; flex-direction: column; gap: 10px;
}
.vcp-block-hdr { display: flex; justify-content: space-between; align-items: baseline; }
/* §3.5 NBBO */
.nbbo { display: flex; flex-direction: column; gap: 10px; }
.nbbo-tbl td, .nbbo-tbl th { font-size: 10.5px; padding: 5px 7px; }
/* §3.7 Full Chain */
.fc-tbl { font-size: 11px; }
.fc-tbl td, .fc-tbl th { padding: 5px 6px; }
.fc-tbl .fc-strike { text-align: center; background: var(--bg-2); }
.fc-tbl .fc-side-c { color: var(--gn); text-align: center; letter-spacing: 0.14em; }
.fc-tbl .fc-side-p { color: var(--rd); text-align: center; letter-spacing: 0.14em; }
/* §4.5 Profit Grid */
.pg { display: flex; flex-direction: column; gap: 10px; }
.pg-hdr {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  padding: 10px 14px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  flex-wrap: wrap;

.pg-hdr-block { display: flex; flex-direction: column; gap: 4px; }
.pg-hdr-kpis { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; align-items: baseline; }
.pg-hdr-kpis .label-cap { font-size: 9px; margin-right: 4px; }
.pg-tbl-wrap { overflow-x: auto; }
.pg-tbl {

  border-collapse: collapse;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.pg-tbl thead th {
  padding: 6px 4px;
  background: var(--glass-bg-1);
  border-bottom: 1px solid var(--glass-line);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  text-align: center;
  font-weight: 500;
}
.pg-tbl thead th:first-child { text-align: left; padding-left: 10px; }
.pg-tbl tbody td { padding: 4px 5px; text-align: center; border-right: 1px solid rgba(0,0,0,0.04); }
.pg-tbl .pg-px {
  text-align: left;
  padding-left: 10px;
  color: var(--ink-1);
  font-weight: 500;
  background: var(--glass-bg-1);
  border-right: 1px solid var(--glass-line);
}
.pg-tbl .pg-pct {
  color: var(--ink-3);
  font-size: 9.5px;
  background: var(--glass-bg-1);
  border-left: 1px solid var(--glass-line);

.pg-tbl .pg-tag { color: var(--copper); font-size: 9px; }
.pg-tbl .pg-row-spot td { border-top: 1.5px solid var(--copper); border-bottom: 1.5px solid var(--copper); }
.pg-tbl .pg-row-spot .pg-px { color: var(--copper); }
.pg-tbl .pg-row-be td { border-top: 1px dashed var(--amb); border-bottom: 1px dashed var(--amb); }
.pg-tbl .pg-row-strike .pg-px { color: var(--copper); font-weight: 600; }
.pg-cell { font-weight: 500; }
/* §5 Payoff */
.payoff-block {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;

  display: flex; gap: 18px; flex-wrap: wrap;
  font-size: 11px;

  /* ════ cc-7 lens-tab variants ════ */
/* lens-tabs.css — DetailTabs presentation variants (cc-7: kill the top scrollbar)
   Loaded after visual-rich.css; overrides its !important rules.
   Variants: wrap (default) · compact (icon-first) · minimal (text underline) · scroll (legacy). */

/* tidy the scrollbar everywhere it still appears (legacy scroll variant) */
.dp-tabs-scroll::-webkit-scrollbar { height: 5px; }
.dp-tabs-scroll::-webkit-scrollbar-thumb { background: var(--glass-line); border-radius: 3px; }
.dp-tabs-scroll::-webkit-scrollbar-track { background: transparent; }

/* ── WRAP · tabs flow onto multiple rows, no horizontal scroll ── */
.dp-tabs--wrap .dp-tabs-scroll {
  flex-wrap: wrap !important;
  overflow-x: visible !important;
  row-gap: 4px !important;
  padding-bottom: 2px;
}

/* ── COMPACT · single non-scrolling row; icon+number chips, active reveals its label ── */
.dp-tabs--compact .dp-tabs-scroll {
  flex-wrap: nowrap !important;
  overflow-x: visible !important;
  gap: 3px !important;
}
.dp-tabs--compact .dp-tab {
  padding: 6px 9px !important;
  flex: 0 1 auto;
  min-width: 0;
}
.dp-tabs--compact .dp-tab-label { display: none !important; }
.dp-tabs--compact .dp-tab-kbd { display: none !important; }
.dp-tabs--compact .dp-tab.is-on .dp-tab-label {
  display: inline !important;
  white-space: nowrap;
}
.dp-tabs--compact .dp-tab.is-on { padding: 6px 13px !important; }

/* ── MINIMAL · text-only tabs with an active underline; wraps, no scroll ── */
.dp-tabs--minimal .dp-tabs-scroll {
  flex-wrap: wrap !important;
  overflow-x: visible !important;
  gap: 2px 4px !important;
}
.dp-tabs--minimal .dp-tab {
  padding: 7px 11px !important;
  border-radius: 0 !important;
  border-bottom: 2px solid transparent !important;
  background: transparent !important;
}
.dp-tabs--minimal .dp-tab-icon,
.dp-tabs--minimal .dp-tab-num,
.dp-tabs--minimal .dp-tab-dot,
.dp-tabs--minimal .dp-tab-kbd { display: none !important; }
.dp-tabs--minimal .dp-tab-label { font-size: 11px !important; }
.dp-tabs--minimal .dp-tab.is-on {
  background: transparent !important;
  border-bottom-color: var(--accent, var(--copper)) !important;
  box-shadow: none !important;
}

/* ── SCROLL · legacy single-row scroller (kept as an option) ── */
.dp-tabs--scroll .dp-tabs-scroll {
  flex-wrap: nowrap !important;
  overflow-x: auto !important;
}

/* icon-rail-expand.css — collapsible nav rail (cc-8)
   Collapsed = 56px icon rail (default). Expanded = labeled 214px sidebar. */

/* toggle + brand row */

}

/* group labels + per-item labels are hidden when collapsed */

.hv-stat:active { transform: translateY(0); }
.hv-stat::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent, var(--copper));
  box-shadow: 0 0 14px var(--accent, var(--copper));
}
.hv-stat--copper { --accent: var(--copper); background: color-mix(in oklab, var(--copper) 6%, var(--glass-bg-1)); }
.hv-stat--gn     { --accent: var(--gn);     background: color-mix(in oklab, var(--gn) 6%, var(--glass-bg-1)); }
.hv-stat--amb    { --accent: var(--amb);    background: color-mix(in oklab, var(--amb) 6%, var(--glass-bg-1)); }
.hv-stat--rd     { --accent: var(--rd);     background: color-mix(in oklab, var(--rd) 7%, var(--glass-bg-1)); }

.hv-stat-l {
  font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-3);
}
.hv-stat-v {
  font-size: 36px;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--accent, var(--ink));
  text-shadow: 0 0 18px color-mix(in oklab, var(--accent, var(--copper)) 35%, transparent);
}
.hv-stat-s { font-size: 10px; }

/* Mood block */
.hh-vitals-mood {
  display: flex; flex-direction: column;
  gap: 10px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  padding: 14px 16px;
}
.hv-regime {
  display: flex; flex-direction: column; gap: 3px;
  padding: 8px 12px;
  background: var(--glass-bg-2);
  border-radius: var(--r-2);
  border-left: 3px solid var(--gn);
}
.hv-regime--gn { border-left-color: var(--gn); }
.hv-regime-l { font-size: 9.5px; letter-spacing: 0.18em; color: var(--ink-3); text-transform: uppercase; }
.hv-regime-v {
  display: block;
  white-space: nowrap;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 0.04em;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hv-regime-on, .hv-regime-tape, .hv-regime-dot { white-space: nowrap; display: inline; }
.hv-regime-dot { margin: 0 8px; }
.hv-regime-on   { color: var(--gn); text-shadow: 0 0 14px color-mix(in oklab, var(--gn) 35%, transparent); }
.hv-regime-tape { color: var(--amb); text-shadow: 0 0 12px color-mix(in oklab, var(--amb) 30%, transparent); }
.hv-regime-dot  { color: var(--ink-4); font-weight: 300; }
.hv-regime-s { font-size: 10.5px; }

.hv-mood-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}
@media (max-width: 900px) {
  .hv-mood-grid { grid-template-columns: repeat(3, 1fr); }
}
.hv-mood-tile {
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 1px;
  border-left: 2px solid var(--ink-3);
}
.hv-mood-tile--gn  { border-left-color: var(--gn); }
.hv-mood-tile--amb { border-left-color: var(--amb); }
.hv-mood-tile--rd  { border-left-color: var(--rd); }
.hv-mt-l {
  font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3);
}
.hv-mt-v { font-size: 16px; font-weight: 500; letter-spacing: 0.01em; }
.hv-mt-s { font-size: 9.5px; }

/* mood-tile meter — normalized position of each metric on its scale */
.hv-mt-meter { height: 4px; border-radius: var(--r-pill); background: var(--glass-line); overflow: hidden; margin: 5px 0 4px; }
.hv-mt-meter-fill { display: block; height: 100%; border-radius: var(--r-pill); background: var(--ink-2); transition: width .4s ease; }
.hv-mt-meter--gn  .hv-mt-meter-fill { background: var(--gn);  box-shadow: 0 0 6px color-mix(in oklab, var(--gn) 55%, transparent); }
.hv-mt-meter--amb .hv-mt-meter-fill { background: var(--amb); box-shadow: 0 0 6px color-mix(in oklab, var(--amb) 55%, transparent); }
.hv-mt-meter--rd  .hv-mt-meter-fill { background: var(--rd);  box-shadow: 0 0 6px color-mix(in oklab, var(--rd) 55%, transparent); }
.hv-mt-meter--ink .hv-mt-meter-fill { background: var(--ink-2); }

/* "What changed vs yesterday" — compact one-line writeup */
.hh-brief {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin-top: 10px; padding: 7px 12px;
  background: var(--glass-bg-1); border: 1px solid var(--glass-line);
  border-radius: var(--r-2); border-left: 2px solid var(--cy);
}
.hh-brief-tag { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cy); white-space: nowrap; flex-shrink: 0; }
.hh-brief-txt { font-size: 11px; line-height: 1.5; color: var(--ink-2); }
.hh-brief-txt b { font-weight: 600; }

.hh-line { font-size: 11.5px; line-height: 1.5; }
.hh-line b { color: var(--ink-1); }

/* Hide the now-unused lower-right macro grid (replaced by mood section above) */
.hh-stats { display: none !important; }
/* Home discovery modules — index strip, stories, sentiment, earnings, discovery, movers */

.home-sec-label {
  display: flex; align-items: baseline; gap: 12px;
  padding: 6px 4px 0;
  margin-top: 4px;
}
.home-sec-label .mono:first-child {
  font-size: 10.5px; letter-spacing: 0.20em; text-transform: uppercase;
  color: var(--copper);
}
.home-sec-label .dim2 { font-size: 10.5px; }
.home-sec-label::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--glass-line), transparent);
  align-self: center;
}

/* Top setups */
.tset { display: flex; flex-direction: column; gap: 3px; }
.tset-row {
  display: grid;
  grid-template-columns: 22px 50px 32px 1fr auto;
  gap: 10px; align-items: center;
  padding: 8px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  cursor: pointer; text-align: left; color: inherit; font: inherit;
}
.tset-row:hover { background: var(--glass-bg-3); }
.tset-rank { font-size: 11px; color: var(--ink-2); }
.tset-sym { font-size: 13px; }
.tset-score {
  font-size: 12px; font-weight: 600; text-align: center;
  padding: 2px 0; border-radius: var(--r-2);
}
.tset-score[data-tone="gn"]  { color: var(--bg); background: var(--gn); }
.tset-score[data-tone="amb"] { color: var(--bg); background: var(--amb); }
.tset-score[data-tone="rd"]  { color: var(--bg); background: var(--rd); }
.tset-mid { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tset-name { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-1); }
.tset-stats { font-size: 11px; color: var(--ink-2); }
.tset-v { font-size: 12px; font-weight: 600; }

.home-grid-3 {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1.1fr;
  gap: 12px;
}
@media (max-width: 1100px) { .home-grid-3 { grid-template-columns: 1fr; } }

/* Index strip */
.ix-strip {
  display: flex;
  flex-wrap: nowrap;
  gap: 1px;
  background: var(--glass-line);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-3);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: thin;
}
.ix-strip::-webkit-scrollbar { height: 8px; }
.ix-strip::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 4px; }
.ix-strip::-webkit-scrollbar-track { background: transparent; }
.ix {
  background: var(--glass-bg-1);
  padding: 8px 11px;
  flex: 1 0 178px;
  display: flex; flex-direction: row; align-items: center; gap: 8px;
  border-bottom: 2px solid var(--ink-4);
}
.ix--gn  { border-bottom-color: var(--gn); }
.ix--rd  { border-bottom-color: var(--rd); }
.ix--ink { border-bottom-color: var(--ink-3); }
.ix-s { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.ix-v { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.ix-c { font-size: 10.5px; white-space: nowrap; }
.ix svg { margin-left: auto; flex-shrink: 0; }

/* Top stories */
.ts { display: flex; flex-direction: column; gap: 4px; }
.ts-row {
  padding: 8px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-left: 2px solid var(--ink-3);
  border-radius: var(--r-2);
  cursor: pointer;
}
.ts-row:hover { background: var(--glass-bg-3); }
.ts-gn { border-left-color: var(--gn); }
.ts-rd { border-left-color: var(--rd); }
.ts-amb { border-left-color: var(--amb); }
.ts-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
.ts-time { font-size: 9.5px; }
.ts-src { font-size: 9.5px; }
.ts-sym { font-size: 10.5px; color: var(--copper); font-weight: 600; }
.ts-sent { font-size: 10.5px; margin-left: auto; }
.ts-head { font-size: 11.5px; line-height: 1.4; color: var(--ink-1); }

/* Market sentiment */
.ms { display: flex; flex-direction: column; gap: 12px; }
.ms-gauge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ms-label { font-size: 12px; letter-spacing: 0.16em; }
.ms-rows { display: flex; flex-direction: column; gap: 5px; }
.ms-row { display: grid; grid-template-columns: 100px 1fr 48px; gap: 10px; align-items: center; font-size: 10.5px; }
.ms-row-l { font-size: 10.5px; }
.ms-bar { height: 6px; background: var(--bg-3); border-radius: var(--r-pill); overflow: hidden; }
.ms-fill { height: 100%; border-radius: var(--r-pill); }
.ms-fill--gn  { background: var(--gn); box-shadow: 0 0 6px color-mix(in oklab, var(--gn) 30%, transparent); }
.ms-fill--amb { background: var(--amb); }
.ms-fill--rd  { background: var(--rd); }
.ms-row-v { text-align: right; font-size: 11px; font-weight: 500; }

/* Earnings today */
.et { display: flex; flex-direction: column; gap: 4px; }
.et-hdr { font-size: 10px; padding: 2px 2px 4px; }
.et-row {
  display: grid;
  grid-template-columns: 52px 38px 44px 1fr auto auto;
  gap: 8px; align-items: baseline;
  padding: 8px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-left: 2px solid var(--ink-3);
  border-radius: var(--r-2);
  cursor: pointer;
  font-size: 11px;
}
.et-row:hover { background: var(--glass-bg-3); }
.et-row.is-held { border-left-color: var(--gn); background: color-mix(in oklab, var(--gn) 7%, var(--glass-bg-2)); }
.et-sym { font-size: 12px; }
.et-when { font-size: 9.5px; letter-spacing: 0.08em; }
.et-time { font-size: 10px; }
.et-move { font-size: 11px; }
.et-esp { font-size: 10.5px; }
.et-expo { font-size: 9.5px; letter-spacing: 0.08em; }

/* Discovery */
.disc { display: flex; flex-direction: column; gap: 7px; }
.disc-grp { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: center; }
.disc-tag {
  font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 8px; border-radius: var(--r-pill); text-align: center;
  border: 1px solid;
}
.disc-tag--gn     { color: var(--gn); border-color: color-mix(in oklab, var(--gn) 40%, transparent); background: color-mix(in oklab, var(--gn) 12%, transparent); }
.disc-tag--amb    { color: var(--amb); border-color: color-mix(in oklab, var(--amb) 40%, transparent); background: color-mix(in oklab, var(--amb) 12%, transparent); }
.disc-tag--cy     { color: var(--cy); border-color: color-mix(in oklab, var(--cy) 40%, transparent); background: color-mix(in oklab, var(--cy) 12%, transparent); }
.disc-tag--violet { color: var(--violet); border-color: color-mix(in oklab, var(--violet) 40%, transparent); background: color-mix(in oklab, var(--violet) 12%, transparent); }
.disc-tag--copper { color: var(--copper); border-color: color-mix(in oklab, var(--copper) 40%, transparent); background: color-mix(in oklab, var(--copper) 12%, transparent); }
.disc-items { display: flex; gap: 5px; flex-wrap: wrap; }
.disc-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-pill);
  cursor: pointer;
  font-size: 10.5px;
}
.disc-chip:hover { background: var(--glass-bg-3); border-color: var(--glass-line-2); }
.disc-val { font-size: 9.5px; }
.disc-val--gn { color: var(--gn); } .disc-val--amb { color: var(--amb); } .disc-val--cy { color: var(--cy); }
.disc-val--violet { color: var(--violet); } .disc-val--copper { color: var(--copper); }

/* Top movers */
.tm { display: flex; flex-direction: column; gap: 8px; }
.tm-head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 10px; letter-spacing: 0.12em; padding: 0 4px; }
.tm-head span:last-child { text-align: left; }
.tm-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tm-col { display: flex; flex-direction: column; gap: 3px; }
.tm-row {
  display: grid;
  grid-template-columns: 46px 1fr auto;
  grid-template-rows: auto auto;
  gap: 1px 8px;
  align-items: baseline;
  padding: 6px 9px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  cursor: pointer;
}
.tm-row:hover { background: var(--glass-bg-3); }
.tm-sym { font-size: 12.5px; }
.tm-sector { font-size: 11px; font-family: var(--sans); color: var(--ink-2); }
.tm-chg { font-size: 12px; text-align: right; grid-column: 3; grid-row: 1; }
.tm-bar { grid-column: 1 / -1; grid-row: 2; height: 4px; background: var(--bg-3); border-radius: var(--r-pill); overflow: hidden; margin-top: 2px; }
.tm-bar i { display: block; height: 100%; border-radius: var(--r-pill); }
.tm-bar i.up { background: var(--gn); }
.tm-bar i.dn { background: var(--rd); }


  /* ════ unified Options surface ════ */
/* options.css — Unified Options surface (Flow + Ideas). Ported from surface-options-flow.css.
   etfs-* tab rules + lab-*/wsx-*/seg-btn/nw-search already exist in target shell; not redefined here.
   pm-note included (used by both sub-tabs, absent from target). */

.oflow { display: flex; flex-direction: column; gap: 12px; }
/* Flow read banner */
.of-read {
  display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
  padding: 14px 18px;
  background: linear-gradient(135deg, color-mix(in oklab, var(--amb) 11%, transparent), color-mix(in oklab, var(--gn) 5%, transparent));
  border: 1px solid color-mix(in oklab, var(--amb) 26%, transparent);
  border-radius: var(--r-3); position: relative; overflow: hidden;
}
.of-read::before { content:""; position:absolute; top:0; left:0; bottom:0; width:3px; background:var(--amb); box-shadow:0 0 16px var(--amb); }
.of-read-net { display:flex; flex-direction:column; align-items:center; gap:2px; padding-right:16px; border-right:1px solid var(--glass-line); }
.of-read-num { font-size:30px; font-weight:600; letter-spacing:-0.02em; line-height:1; }
.of-read-num[data-tone="gn"] { color:var(--gn); text-shadow:0 0 16px color-mix(in oklab,var(--gn) 35%,transparent); }
.of-read-num[data-tone="rd"] { color:var(--rd); }
.of-read-lbl { font-size:8.5px; letter-spacing:0.14em; }
.of-read-body { font-size:12px; line-height:1.6; color:var(--ink-1); }
.of-read-skew { grid-column:1 / -1; }
.of-skew-bar { display:flex; height:24px; border-radius:var(--r-pill); overflow:hidden; border:1px solid var(--glass-line); }
.of-skew-call { background:color-mix(in oklab,var(--gn) 30%,transparent); display:flex; align-items:center; padding:0 12px; }
.of-skew-put { background:color-mix(in oklab,var(--rd) 30%,transparent); display:flex; align-items:center; justify-content:flex-end; padding:0 12px; }
.of-skew-call .mono { font-size:10px; color:var(--gn); font-weight:600; }
.of-skew-put .mono { font-size:10px; color:var(--rd); font-weight:600; }
@media (max-width:1000px){ .of-read { grid-template-columns:1fr; } .of-read-net { flex-direction:row; border-right:none; padding-right:0; gap:10px; } }
/* Grid: tape + rail */
.of-grid { display:grid; grid-template-columns:1fr 320px; gap:12px; align-items:start; }
@media (max-width:1100px){ .of-grid { grid-template-columns:1fr; } }
.of-tape-wrap { overflow-x:auto; }
.of-tbl { font-size:11px; }
.of-tbl td, .of-tbl th { padding:6px 8px; white-space:nowrap; }
.of-tbl tbody tr { cursor:pointer; }
.of-tbl tbody tr:hover td { background:var(--glass-bg-2); }
.of-type { display:inline-block; width:16px; text-align:center; font-weight:700; border-radius:3px; margin-right:5px; }
.of-type--c { color:var(--gn); background:color-mix(in oklab,var(--gn) 16%,transparent); }
.of-type--p { color:var(--rd); background:color-mix(in oklab,var(--rd) 16%,transparent); }
.of-strike { font-weight:600; color:var(--ink); }
.of-exec { font-size:9px; letter-spacing:0.08em; padding:2px 7px; border-radius:var(--r-pill); border:1px solid; }
.of-exec--sweep { color:var(--violet); border-color:color-mix(in oklab,var(--violet) 40%,transparent); background:color-mix(in oklab,var(--violet) 12%,transparent); }
.of-exec--block { color:var(--cy); border-color:color-mix(in oklab,var(--cy) 40%,transparent); background:color-mix(in oklab,var(--cy) 12%,transparent); }
.of-exec--split { color:var(--ink-2); border-color:var(--glass-line); }
.of-bias { font-size:9.5px; font-weight:600; }
.of-bias--bull { color:var(--gn); }
.of-bias--bear { color:var(--rd); }
.of-unusual { font-weight:600; color:var(--amb); }
.of-cat-none { color:var(--violet); font-weight:600; }
/* Options Ideas */
.oidea { display:flex; flex-direction:column; gap:12px; }
.oidea .cop, .oi-best .cop { color: var(--copper); }
.oi-best { display:grid; grid-template-columns:1fr auto; gap:18px; align-items:center; padding:14px 18px; background:linear-gradient(135deg, color-mix(in oklab,var(--gn) 12%,transparent), color-mix(in oklab,var(--cy) 5%,transparent)); border:1px solid color-mix(in oklab,var(--gn) 28%,transparent); border-radius:var(--r-3); position:relative; overflow:hidden; }
.oi-best::before { content:""; position:absolute; top:0; left:0; bottom:0; width:3px; background:var(--gn); box-shadow:0 0 16px var(--gn); }
.oi-best-eyebrow { font-size:9.5px; letter-spacing:0.16em; color:var(--gn); }
.oi-best-row { display:flex; align-items:baseline; gap:12px; margin-top:5px; }
.oi-best-sym { font-size:24px; font-weight:600; color:var(--ink); }
.oi-best-dir { font-size:11px; font-weight:600; padding:2px 9px; border-radius:var(--r-pill); }
.oi-best-dir--bull { color:var(--gn); background:color-mix(in oklab,var(--gn) 14%,transparent); }
.oi-best-dir--bear { color:var(--rd); background:color-mix(in oklab,var(--rd) 14%,transparent); }
.oi-best-strat { font-size:14px; color:var(--cy); font-weight:500; }
.oi-best-struct { font-size:13px; margin-top:6px; }
.oi-best-why { font-size:11.5px; line-height:1.5; margin-top:6px; max-width:90ch; }
.oi-best-r { display:flex; gap:14px; }
.oi-best-kpi { display:flex; flex-direction:column; align-items:center; gap:2px; }
.oi-best-kpi-v { font-size:20px; font-weight:600; }
.oi-tbl { font-size:11px; }
.oi-tbl td, .oi-tbl th { padding:7px 8px; white-space:nowrap; }
.oi-tbl tbody tr { cursor:pointer; }
.oi-tbl tbody tr:hover td { background:var(--glass-bg-2); }
.oi-struct { color:var(--ink); font-weight:500; }
.oi-conv { letter-spacing:1px; color:var(--gn); }
.oi-conv-off { color:var(--ink-4); }
/* Right rail */
.of-rail { display:flex; flex-direction:column; gap:12px; }
.of-byticker { display:flex; flex-direction:column; gap:3px; }
.of-bt-row { display:grid; grid-template-columns:48px 1fr 64px; gap:8px; align-items:center; padding:5px 8px; background:var(--glass-bg-2); border:1px solid var(--glass-line); border-radius:var(--r-2); cursor:pointer; }
.of-bt-row:hover { background:var(--glass-bg-3); }
.of-bt-sym { font-size:11px; }
.of-bt-bar { position:relative; height:8px; background:var(--bg-3); border-radius:var(--r-pill); }
.of-bt-bar i { position:absolute; top:0; height:100%; border-radius:var(--r-pill); }
.of-bt-call { background:var(--gn); }
.of-bt-put { background:var(--rd); }
.of-bt-axis { position:absolute; left:50%; top:-1px; bottom:-1px; width:1px; background:var(--ink-2); }
.of-bt-net { font-size:10.5px; text-align:right; font-weight:600; }

function Pill({ tone="ink", children, small, dot, outline }) {
  const cls = ["pill", `pill--${tone}`, small && "pill--sm", outline && "pill--outline"].filter(Boolean).join(" ");
  return <span className={cls}>{dot && <span className="pill-dot" />}{children}</span>;
}
function Sparkline({ data, color="currentColor", h=18, w=56, fill=true }) {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
  const step = w / (data.length - 1);
  const pts = data.map((v, i) => [i * step, h - ((v - min) / range) * h]);
  const d = "M " + pts.map(p => p.join(" ")).join(" L ");
  const area = d + ` L ${w} ${h} L 0 ${h} Z`;
  const gid = "sp-" + Math.abs(data[0] * 1e6 | 0).toString(36);
  const last = pts[pts.length - 1];
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display:"block", overflow:"visible" }}>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity="0.30" /><stop offset="100%" stopColor={color} stopOpacity="0.02" />
      </linearGradient></defs>
      {fill && <path d={area} fill={`url(#${gid})`} />}
      <path d={d} stroke={color} fill="none" strokeWidth="1.4" strokeLinecap="round" style={{ filter:`drop-shadow(0 0 4px ${color})` }} />
      <circle cx={last[0]} cy={last[1]} r="2.2" fill={color} style={{ filter:`drop-shadow(0 0 5px ${color})` }} />
    </svg>
  );
}
function Scaffold({ children }) {
  return <div className="ss-scaffold"><span>⚠</span><span>{children}</span></div>;
}
function EmptyState({ children }) { return <div className="ss-empty">{children}</div>; }
function FreshnessPill({ state="live", age }) {
  if (state === "stale")    return <Pill tone="rd" small>STALE {age||""}</Pill>;
  if (state === "loading")  return <Pill tone="ink" small>· · ·</Pill>;
  if (state === "empty")    return <Pill tone="ink" small>NO DATA</Pill>;
  return <Pill tone="gn" small dot>LIVE {age ? `· ${age}` : ""}</Pill>;
}

// helpers
const num = (v, d=2) => (v==null || isNaN(v)) ? null : Number(v);
const fmt = (v, d=2) => v==null || isNaN(v) ? "—" : Number(v).toLocaleString("en-US", { minimumFractionDigits:d, maximumFractionDigits:d });
const pct = (v, d=2) => v==null || isNaN(v) ? "—" : (v>=0?"+":"") + Number(v).toFixed(d) + "%";
const sparkSeed = (sym, up) => { const code=(sym.charCodeAt(0)||65)+(sym.charCodeAt(2)||65); const a=[]; let v=0; for(let i=0;i<18;i++){ v+=(Math.sin(i*0.6+code)+(up?0.18:-0.14))*0.5; a.push(v);} return a; };

  const pc = ms.put_call && ms.put_call.equity_pc;
  const counts = [
    { l:"RANKED",      v: d.scan_count,  tone:"copper", s:"universe scored", f:"ALL" },

  ];
  const tiles = [
    { label:"RISK SIGNAL", value:(ms.risk_signal||"—").toUpperCase().replace("_"," "), tone: /greed|risk_on/.test(ms.risk_signal)?"gn":/risk_off|fear/.test(ms.risk_signal)?"rd":"amb", delta:"macro composite" },
    { label:"BREADTH",     value: mb.pct_above_50d!=null?Math.round(mb.pct_above_50d)+"%":"—", tone: mb.pct_above_50d>=55?"gn":mb.pct_above_50d>=40?"amb":"rd", delta: mb.above_50d!=null?`${mb.above_50d}/${mb.total} >50d`:">50d" },
    { label:"PUT/CALL",    value: pc!=null?Number(pc).toFixed(2):"—", tone: pc!=null&&pc<0.7?"gn":pc<1?"amb":"rd", delta:(ms.put_call&&ms.put_call.signal)||"equity" },
    { label:"VIX",         value: vix.vix_current!=null?Number(vix.vix_current).toFixed(1):"—", tone: vix.vix_current<18?"gn":vix.vix_current<28?"amb":"rd", delta:(vix.vol_state||"").toLowerCase() },
    { label:"CREDIT",      value:((ms.credit&&ms.credit.state)||"—").toUpperCase(), tone:(ms.credit&&ms.credit.state)==="healthy"?"gn":"amb", delta:"HY/LQD" },
    { label:"DOLLAR",      value:((ms.dxy&&ms.dxy.trend)||"—").toUpperCase(), tone:"ink", delta: ms.dxy&&ms.dxy.chg20d!=null?`${ms.dxy.chg20d>0?"+":""}${ms.dxy.chg20d}% 20d`:"DXY" },

    return t.tone==="gn"?70:t.tone==="amb"?45:t.tone==="rd"?26:50;

  return (
    <div className="home-hero qhero">
