}
.um-signoff:hover {
  background: var(--rd-bg);
  border-color: var(--rd);
  box-shadow: 0 0 14px color-mix(in oklab, var(--rd) 22%, transparent);
}

/* ===== home-hero.css ===== */
/* Home hero — visual-rich vitals layout */

.home-hero {
  display: flex !important;
  flex-direction: column !important;
  grid-template-columns: none !important;
  gap: 14px !important;
  padding: 20px 22px !important;
}
.hh-eyebrow-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hh-mood-live {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px;
  background: color-mix(in oklab, var(--gn) 14%, transparent);
  border: 1px solid color-mix(in oklab, var(--gn) 40%, transparent);
  border-radius: var(--r-pill);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  color: var(--gn);
  box-shadow: 0 0 12px color-mix(in oklab, var(--gn) 22%, transparent);
  white-space: nowrap;
  flex-shrink: 0;
}
.hh-mood-pulse {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gn);
  box-shadow: 0 0 8px var(--gn);
  animation: cmd-pulse 2s ease-in-out infinite;
}

/* Big vitals row */
.hh-vitals {
  display: grid;
  grid-template-columns: 1.1fr 1.4fr;
  gap: 14px;
  align-items: stretch;
}
@media (max-width: 1100px) {
  .hh-vitals { grid-template-columns: 1fr; }
}

.hh-vitals-counts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.hv-stat {
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: inherit;
  transition: transform 0.10s ease, background 0.12s ease, border-color 0.12s ease;
}
.hv-stat:hover {
  border-color: var(--glass-line-2);
  transform: translateY(-1px);
}
.hv-stat:active { transform: translateY(0); }
.hv-stat::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent, var(--copper));
  box-shadow: 0 0 14px var(--accent, var(--copper));
}
.hv-stat--copper { --accent: var(--copper); background: color-mix(in oklab, var(--copper) 6%, var(--glass-bg-1)); }
.hv-stat--gn     { --accent: var(--gn);     background: color-mix(in oklab, var(--gn) 6%, var(--glass-bg-1)); }
.hv-stat--amb    { --accent: var(--amb);    background: color-mix(in oklab, var(--amb) 6%, var(--glass-bg-1)); }
.hv-stat--rd     { --accent: var(--rd);     background: color-mix(in oklab, var(--rd) 7%, var(--glass-bg-1)); }

.hv-stat-l {
  font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-3);
}
.hv-stat-v {
  font-size: 36px;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--accent, var(--ink));
  text-shadow: 0 0 18px color-mix(in oklab, var(--accent, var(--copper)) 35%, transparent);
}
.hv-stat-s { font-size: 10px; }

/* Mood block */
.hh-vitals-mood {
  display: flex; flex-direction: column;
  gap: 10px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-glass);
  padding: 14px 16px;
}
.hv-regime {
  display: flex; flex-direction: column; gap: 3px;
  padding: 8px 12px;
  background: var(--glass-bg-2);
  border-radius: var(--r-2);
  border-left: 3px solid var(--gn);
}
.hv-regime--gn { border-left-color: var(--gn); }
.hv-regime-l { font-size: 9.5px; letter-spacing: 0.18em; color: var(--ink-3); text-transform: uppercase; }
.hv-regime-v {
  display: block;
  white-space: nowrap;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: 0.04em;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hv-regime-on, .hv-regime-tape, .hv-regime-dot { white-space: nowrap; display: inline; }
.hv-regime-dot { margin: 0 8px; }
.hv-regime-on   { color: var(--gn); text-shadow: 0 0 14px color-mix(in oklab, var(--gn) 35%, transparent); }
.hv-regime-tape { color: var(--amb); text-shadow: 0 0 12px color-mix(in oklab, var(--amb) 30%, transparent); }
.hv-regime-dot  { color: var(--ink-4); font-weight: 300; }
.hv-regime-s { font-size: 10.5px; }

.hv-mood-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}
@media (max-width: 900px) {
  .hv-mood-grid { grid-template-columns: repeat(3, 1fr); }
}
.hv-mood-tile {
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 1px;
  border-left: 2px solid var(--ink-3);
}
.hv-mood-tile--gn  { border-left-color: var(--gn); }
.hv-mood-tile--amb { border-left-color: var(--amb); }
.hv-mood-tile--rd  { border-left-color: var(--rd); }
.hv-mt-l {
  font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3);
}
.hv-mt-v { font-size: 16px; font-weight: 500; letter-spacing: 0.01em; }
.hv-mt-s { font-size: 9.5px; }

.hh-line { font-size: 11.5px; line-height: 1.5; }
.hh-line b { color: var(--ink-1); }

/* Hide the now-unused lower-right macro grid (replaced by mood section above) */
.hh-stats { display: none !important; }
/* ===== home-cards.css ===== */
/* Home — performance strip + active positions + signal feed + tasks */

.hp-strip {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 14px;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-3);
  padding: 14px 16px;
  backdrop-filter: var(--glass-blur);
}
@media (max-width: 1100px) { .hp-strip { grid-template-columns: 1fr; } }
.hp-curve { display: flex; flex-direction: column; gap: 6px; }
.hp-curve-hdr { display: flex; justify-content: space-between; align-items: baseline; }
.hp-curve-foot { display: flex; gap: 10px; align-items: baseline; font-size: 11.5px; }
.hp-curve-foot .label-cap { font-size: 9px; margin-right: 3px; }

.hp-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.hp-stat {
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 2px;
  border-left: 2px solid var(--ink-3);
}
.hp-stat--gn     { border-left-color: var(--gn); }
.hp-stat--copper { border-left-color: var(--copper); }
.hp-stat--ink    { border-left-color: var(--ink-3); }
.hp-stat-l { font-size: 8.5px; letter-spacing: 0.16em; color: var(--ink-3); text-transform: uppercase; }
.hp-stat-v { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; line-height: 1; margin-top: 1px; }
.hp-stat-s { font-size: 9.5px; }

/* Active Positions */
.ap-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
@media (max-width: 1000px) { .ap-strip { grid-template-columns: 1fr; } }
.ap-card {
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-left: 3px solid var(--ink-3);
  border-radius: var(--r-2);
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 6px;
  cursor: pointer;
  text-align: left;
  color: inherit;
  font: inherit;
  transition: all 0.10s;
}
.ap-card:hover { background: var(--glass-bg-3); }
.ap-card--gn { border-left-color: var(--gn); }
.ap-card--rd { border-left-color: var(--rd); }
.ap-card--amb { border-left-color: var(--amb); }
.ap-hdr { display: flex; align-items: baseline; justify-content: space-between; }
.ap-sym { font-size: 14px; }
.ap-pl { font-size: 14px; font-weight: 500; }
.ap-meta { font-size: 10.5px; }
.ap-bars {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.ap-bar { display: flex; flex-direction: column; gap: 1px; }
.ap-bar-l { font-size: 8.5px; }
.ap-bar-v { font-size: 12px; font-weight: 500; }

/* Signal Feed */
.sf { display: flex; flex-direction: column; gap: 3px; }
.sf-row {
  display: grid;
  grid-template-columns: 50px 70px 60px 1fr;
  gap: 10px;
  align-items: baseline;
  padding: 7px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-left: 2px solid var(--ink-3);
  border-radius: var(--r-2);
  cursor: pointer;
  font-size: 11px;
}
.sf-row:hover { background: var(--glass-bg-3); }
.sf-gn  { border-left-color: var(--gn); }
.sf-rd  { border-left-color: var(--rd); }
.sf-amb { border-left-color: var(--amb); }
.sf-violet { border-left-color: var(--violet); }
.sf-cy   { border-left-color: var(--cy); }
.sf-ink  { border-left-color: var(--ink-3); }
.sf-time { font-size: 10.5px; }
.sf-tag {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 2px 7px; border-radius: var(--r-pill);
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);
  text-align: center;
}
.sf-tag--gn  { color: var(--gn);  border-color: color-mix(in oklab, var(--gn) 35%, transparent); background: color-mix(in oklab, var(--gn) 14%, transparent); }
.sf-tag--rd  { color: var(--rd);  border-color: color-mix(in oklab, var(--rd) 35%, transparent); background: color-mix(in oklab, var(--rd) 14%, transparent); }
.sf-tag--amb { color: var(--amb); border-color: color-mix(in oklab, var(--amb) 35%, transparent); background: color-mix(in oklab, var(--amb) 14%, transparent); }
.sf-tag--violet { color: var(--violet); border-color: color-mix(in oklab, var(--violet) 35%, transparent); background: color-mix(in oklab, var(--violet) 14%, transparent); }
.sf-tag--cy  { color: var(--cy); border-color: color-mix(in oklab, var(--cy) 35%, transparent); background: color-mix(in oklab, var(--cy) 14%, transparent); }
.sf-tag--ink { color: var(--ink-2); }
.sf-sym { font-size: 11px; }
.sf-text { font-size: 11px; color: var(--ink-1); }

/* Today's Tasks */
.tt { display: flex; flex-direction: column; gap: 3px; }
.tt-row {
  display: grid;
  grid-template-columns: 22px 80px 1fr auto;
  gap: 10px;
  align-items: baseline;
  padding: 7px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-left: 2px solid var(--ink-3);
  border-radius: var(--r-2);
  font-size: 11.5px;
}
.tt-row.is-done { opacity: 0.55; }
.tt-row.tt-copper { border-left-color: var(--copper); background: color-mix(in oklab, var(--copper) 7%, var(--glass-bg-2)); }
.tt-check {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px;
  border: 1px solid var(--glass-line-2);
  border-radius: 3px;
  color: var(--gn); font-family: var(--mono); font-size: 11px;
}
.tt-row.is-done .tt-check { background: var(--gn); color: var(--bg); border-color: var(--gn); }
.tt-tag {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3); padding: 2px 7px;
  border-radius: var(--r-pill);
  background: var(--glass-bg-1);
  text-align: center;
}
.tt-text { font-size: 11.5px; }
.tt-time { font-size: 10px; }
.tt-foot {
  margin-top: 6px;
  padding: 6px 10px;
  font-size: 10.5px;
  border-top: 1px solid var(--glass-line);
}
/* ===== home-discovery.css ===== */
/* Home discovery modules — index strip, stories, sentiment, earnings, discovery, movers */

.home-sec-label {
  display: flex; align-items: baseline; gap: 12px;
  padding: 6px 4px 0;
  margin-top: 4px;
}
.home-sec-label .mono:first-child {
  font-size: 10.5px; letter-spacing: 0.20em; text-transform: uppercase;
  color: var(--copper);
}
.home-sec-label .dim2 { font-size: 10.5px; }
.home-sec-label::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--glass-line), transparent);
  align-self: center;
}

/* Top setups */
.tset { display: flex; flex-direction: column; gap: 3px; }
.tset-row {
  display: grid;
  grid-template-columns: 22px 50px 32px 1fr auto;
  gap: 10px; align-items: center;
  padding: 8px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  cursor: pointer; text-align: left; color: inherit; font: inherit;
}
.tset-row:hover { background: var(--glass-bg-3); }
.tset-rank { font-size: 9.5px; }
.tset-sym { font-size: 12px; }
.tset-score {
  font-size: 12px; font-weight: 600; text-align: center;
  padding: 2px 0; border-radius: var(--r-2);
}
.tset-score[data-tone="gn"]  { color: var(--bg); background: var(--gn); }
.tset-score[data-tone="amb"] { color: var(--bg); background: var(--amb); }
.tset-score[data-tone="rd"]  { color: var(--bg); background: var(--rd); }
.tset-mid { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tset-name { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tset-stats { font-size: 9.5px; }
.tset-v { font-size: 10.5px; font-weight: 500; }

.home-grid-3 {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1.1fr;
  gap: 12px;
}
@media (max-width: 1100px) { .home-grid-3 { grid-template-columns: 1fr; } }

/* Index strip */
.ix-strip {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 1px;
  background: var(--glass-line);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-3);
  overflow: hidden;
}
@media (max-width: 1100px) { .ix-strip { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 600px)  { .ix-strip { grid-template-columns: repeat(2, 1fr); } }
.ix {
  background: var(--glass-bg-1);
  padding: 9px 11px;
  display: flex; flex-direction: column; gap: 2px;
  border-bottom: 2px solid var(--ink-4);
}
.ix--gn  { border-bottom-color: var(--gn); }
.ix--rd  { border-bottom-color: var(--rd); }
.ix--ink { border-bottom-color: var(--ink-3); }
.ix-s { font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.ix-v { font-size: 14px; font-weight: 500; color: var(--ink); }
.ix-c { font-size: 10.5px; }
.ix svg { margin-top: 2px; }

/* Top stories */
.ts { display: flex; flex-direction: column; gap: 4px; }
.ts-row {
  padding: 8px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-left: 2px solid var(--ink-3);
  border-radius: var(--r-2);
  cursor: pointer;
}
.ts-row:hover { background: var(--glass-bg-3); }
.ts-gn { border-left-color: var(--gn); }
.ts-rd { border-left-color: var(--rd); }
.ts-amb { border-left-color: var(--amb); }
.ts-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
.ts-time { font-size: 9.5px; }
.ts-src { font-size: 9.5px; }
.ts-sym { font-size: 10.5px; color: var(--copper); font-weight: 600; }
.ts-sent { font-size: 10.5px; margin-left: auto; }
.ts-head { font-size: 11.5px; line-height: 1.4; color: var(--ink-1); }

/* Market sentiment */
.ms { display: flex; flex-direction: column; gap: 12px; }
.ms-gauge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ms-label { font-size: 12px; letter-spacing: 0.16em; }
.ms-rows { display: flex; flex-direction: column; gap: 5px; }
.ms-row { display: grid; grid-template-columns: 100px 1fr 48px; gap: 10px; align-items: center; font-size: 10.5px; }
.ms-row-l { font-size: 10.5px; }
.ms-bar { height: 6px; background: var(--bg-3); border-radius: var(--r-pill); overflow: hidden; }
.ms-fill { height: 100%; border-radius: var(--r-pill); }
.ms-fill--gn  { background: var(--gn); box-shadow: 0 0 6px color-mix(in oklab, var(--gn) 30%, transparent); }
.ms-fill--amb { background: var(--amb); }
.ms-fill--rd  { background: var(--rd); }
.ms-row-v { text-align: right; font-size: 11px; font-weight: 500; }

/* Earnings today */
.et { display: flex; flex-direction: column; gap: 4px; }
.et-hdr { font-size: 10px; padding: 2px 2px 4px; }
.et-row {
  display: grid;
  grid-template-columns: 52px 38px 44px 1fr auto auto;
  gap: 8px; align-items: baseline;
  padding: 8px 10px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-left: 2px solid var(--ink-3);
  border-radius: var(--r-2);
  cursor: pointer;
  font-size: 11px;
}
.et-row:hover { background: var(--glass-bg-3); }
.et-row.is-held { border-left-color: var(--gn); background: color-mix(in oklab, var(--gn) 7%, var(--glass-bg-2)); }
.et-sym { font-size: 12px; }
.et-when { font-size: 9.5px; letter-spacing: 0.08em; }
.et-time { font-size: 10px; }
.et-move { font-size: 11px; }
.et-esp { font-size: 10.5px; }
.et-expo { font-size: 9.5px; letter-spacing: 0.08em; }

/* Discovery */
.disc { display: flex; flex-direction: column; gap: 7px; }
.disc-grp { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: center; }
.disc-tag {
  font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 8px; border-radius: var(--r-pill); text-align: center;
  border: 1px solid;
}
.disc-tag--gn     { color: var(--gn); border-color: color-mix(in oklab, var(--gn) 40%, transparent); background: color-mix(in oklab, var(--gn) 12%, transparent); }
.disc-tag--amb    { color: var(--amb); border-color: color-mix(in oklab, var(--amb) 40%, transparent); background: color-mix(in oklab, var(--amb) 12%, transparent); }
.disc-tag--cy     { color: var(--cy); border-color: color-mix(in oklab, var(--cy) 40%, transparent); background: color-mix(in oklab, var(--cy) 12%, transparent); }
.disc-tag--violet { color: var(--violet); border-color: color-mix(in oklab, var(--violet) 40%, transparent); background: color-mix(in oklab, var(--violet) 12%, transparent); }
.disc-tag--copper { color: var(--copper); border-color: color-mix(in oklab, var(--copper) 40%, transparent); background: color-mix(in oklab, var(--copper) 12%, transparent); }
.disc-items { display: flex; gap: 5px; flex-wrap: wrap; }
.disc-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-pill);
  cursor: pointer;
  font-size: 10.5px;
}
.disc-chip:hover { background: var(--glass-bg-3); border-color: var(--glass-line-2); }
.disc-val { font-size: 9.5px; }
.disc-val--gn { color: var(--gn); } .disc-val--amb { color: var(--amb); } .disc-val--cy { color: var(--cy); }
.disc-val--violet { color: var(--violet); } .disc-val--copper { color: var(--copper); }

/* Top movers */
.tm { display: flex; flex-direction: column; gap: 8px; }
.tm-head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 10px; letter-spacing: 0.12em; padding: 0 4px; }
.tm-head span:last-child { text-align: left; }
.tm-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tm-col { display: flex; flex-direction: column; gap: 3px; }
.tm-row {
  display: grid;
  grid-template-columns: 46px 1fr auto;
  grid-template-rows: auto auto;
  gap: 1px 8px;
  align-items: baseline;
  padding: 6px 9px;
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-2);
  cursor: pointer;
}
.tm-row:hover { background: var(--glass-bg-3); }
.tm-sym { font-size: 11px; }
.tm-sector { font-size: 9px; }
.tm-chg { font-size: 11px; text-align: right; grid-column: 3; grid-row: 1; }
.tm-bar { grid-column: 1 / -1; grid-row: 2; height: 4px; background: var(--bg-3); border-radius: var(--r-pill); overflow: hidden; margin-top: 2px; }
.tm-bar i { display: block; height: 100%; border-radius: var(--r-pill); }
.tm-bar i.up { background: var(--gn); }
.tm-bar i.dn { background: var(--rd); }

  --amb:#d99a2b; --amb-dim:#8a6418; --amb-bg:rgba(217,154,43,0.14);
  --cy:#4cc5c5; --violet:#9a86c4; --blue:#5b8def;
  --glass-bg-1:#171c28; --glass-bg-2:#1e2433; --glass-bg-3:#252d3e;
  --glass-line:#283040; --glass-line-2:#3a4560; --glass-blur:none;
  color-scheme:dark;
}
[data-theme="paper-flat"] {
  --bg:#eeeae2; --bg-0:#eeeae2; --bg-1:#f6f3ec; --bg-2:#eae6dd; --bg-3:#e0dbd0; --bg-4:#d4cec1;
  --line:#d6d0c4; --line-2:#bcb5a6;
  --ink:#1f1c16; --ink-1:#3d392f; --ink-2:#5f5a4c; --ink-3:#837d6c; --ink-4:#a8a08c;
  --copper:#9a5a2c; --copper-dim:#6e3f1d; --copper-bg:rgba(154,90,44,0.12);
  --gn:#1e8a4a; --gn-dim:#0f5a30; --gn-bg:rgba(30,138,74,0.14);
  --rd:#bb3b2e; --rd-dim:#7a221a; --rd-bg:rgba(187,59,46,0.14);
  --amb:#9a6a14; --amb-dim:#6a480c; --amb-bg:rgba(154,106,20,0.14);
  --cy:#1f8a8a; --violet:#6a4ad9; --blue:#2563c8;
  --glass-bg-1:#f6f3ec; --glass-bg-2:#eae6dd; --glass-bg-3:#e0dbd0;
  --glass-line:#d6d0c4; --glass-line-2:#bcb5a6; --glass-blur:none;
  color-scheme:light;
}

/* Flat themes: kill the aurora bloom + glow shadows + text-shadows */
[data-theme^="matte-"] body,
[data-theme="paper-flat"] body {
  background: var(--bg) !important;
}
[data-theme^="matte-"] .app::before,
[data-theme="paper-flat"] .app::before { display: none; }

/* Neutralize luminous text-shadows + heavy glows on flat themes */
[data-theme^="matte-"] .hv-stat-v,
[data-theme^="matte-"] .vhr-score,
[data-theme^="matte-"] .vhr-tag,
[data-theme^="matte-"] .regime-tag,
[data-theme^="matte-"] .cs-er-num,
[data-theme^="matte-"] .dr-side--buy,
[data-theme^="matte-"] .hv-regime-on,
[data-theme^="matte-"] .hv-regime-tape,
[data-theme="paper-flat"] .hv-stat-v,
[data-theme="paper-flat"] .vhr-score,
[data-theme="paper-flat"] .vhr-tag,
[data-theme="paper-flat"] .dr-side--buy {
  text-shadow: none !important;
}
[data-theme^="matte-"] .dr::before,
[data-theme^="matte-"] .dr-side--buy,
[data-theme^="matte-"] .hv-stat::before,
[data-theme^="matte-"] .ix,
[data-theme^="matte-"] .ss-stat::before,
[data-theme="paper-flat"] .dr::before,
[data-theme="paper-flat"] .hv-stat::before {
  box-shadow: none !important;
}

/* ===== tier.css ===== */
/* Tier picker + lock badges + upgrade gate */

.tp { position: relative; }
.tp-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px;

}

.tp-badge {
  font-size: 8.5px; letter-spacing: 0.12em;
  padding: 2px 6px; border-radius: var(--r-pill);

}

}

[data-theme="ivory-editorial"] .tp-menu,

.tp-menu-hdr { padding: 4px 8px 6px; }
.tp-opt {
  display: grid; grid-template-columns: 32px 1fr auto; gap: 10px;
  align-items: center;

.tp-opt.is-on { border-color: var(--copper); background: color-mix(in oklab, var(--copper) 14%, transparent); }
.tp-opt-badge {
  font-size: 11px; font-weight: 600; text-align: center;

}
.tp-opt-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tp-opt-name { font-size: 12px; font-weight: 500; color: var(--ink); }
.tp-opt-tag { font-size: 9.5px; }
.tp-opt-price { font-size: 11px; color: var(--ink-1); font-weight: 500; }
.tp-menu-foot { padding: 8px 8px 2px; font-size: 9.5px; border-top: 1px solid var(--glass-line); margin-top: 4px; line-height: 1.5; }

/* Icon-rail lock */
.ir-item.is-locked { opacity: 0.5; }
.ir-item.is-locked:hover { opacity: 0.8; }
.ir-lock {
  position: absolute; top: 2px; right: 2px;
  font-size: 9px; line-height: 1;

}

/* Lens tab lock */

.dp-tab.is-locked:hover { opacity: 0.85; }
.dp-tab-tier {
  font-size: 8px; letter-spacing: 0.06em;
  padding: 1px 5px; border-radius: var(--r-pill);
  background: color-mix(in oklab, var(--copper) 16%, transparent);
  color: var(--copper);
}

/* Upgrade gate */
.upgate {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 60px 24px; min-height: 360px;
}
.upgate-card {
  max-width: 440px; text-align: center;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);

  padding: 36px 32px;
  backdrop-filter: var(--glass-blur);

}
.upgate-lock { font-size: 34px; filter: grayscale(0.3); }
.upgate-tier {

  background: color-mix(in oklab, var(--copper) 16%, transparent);

.upgate-title { font-size: 22px; font-weight: 600; letter-spacing: 0.01em; margin-top: 4px; }
.upgate-sub { font-size: 12px; color: var(--ink-2); line-height: 1.55; max-width: 42ch; }
.upgate-sub b { color: var(--ink); }
.upgate-btn {
  margin-top: 8px;
  padding: 10px 20px;
  font-size: 11px; letter-spacing: 0.12em;
  background: linear-gradient(180deg, var(--copper), color-mix(in oklab, var(--copper) 72%, var(--rd)));
  color: var(--bg); border: none; border-radius: var(--r-pill);
  cursor: pointer; font-weight: 600;
  box-shadow: 0 0 20px color-mix(in oklab, var(--copper) 35%, transparent);

.upgate-note { font-size: 10px; margin-top: 4px; }

/* ============================================================ */
/* RICH VERDICT HERO (vh-rich)                                   */
/* ============================================================ */
.vh-rich {
  display: flex; flex-direction: column;
  gap: 16px;
  padding: 20px 24px 18px;
  background: transparent;
  border-bottom: 1px solid var(--glass-line);
}
.vhr-top {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  align-items: center;
}
.dpanel--S .vhr-top, .dpanel--M .vhr-top { grid-template-columns: 1fr; }
.vhr-vis {
  display: flex; align-items: center; justify-content: center;
  background: var(--glass-bg-1);

}
.vhr-body {

}

  padding: 8px 22px;
  background: color-mix(in oklab, var(--gn) 16%, transparent);
  border: 2px solid var(--gn);
  border-radius: var(--r-pill);

  font-family: var(--mono);

  font-weight: 500;

}

.vhr-setup {
  font-size: 13px;
  padding: 10px 14px;

}
.vhr-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.vhr-act {
  padding: 8px 16px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: var(--glass-bg-1);
  border: 1px solid var(--glass-line);

  border-color: color-mix(in oklab, var(--rd) 35%, transparent);
}
.vhr-act--ghost { border-style: dashed; }

/* Pillars row */
.vhr-pillars {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.dpanel--S .vhr-pillars, .dpanel--M .vhr-pillars { grid-template-columns: repeat(2, 1fr); }
.vhr-pill {

  height: 8px;
  background: var(--bg-3);
  border-radius: var(--r-pill);
  overflow: hidden;
}
.vhr-pill-fill {
  height: 100%;
  border-radius: var(--r-pill);
  transition: width 0.4s cubic-bezier(0.2, 0, 0, 1);
}
.vhr-pill-v { font-size: 16px; font-weight: 500; min-width: 28px; text-align: right; }

/* Ticket strip */
.vhr-ticket {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--glass-line);
  border: 1px solid var(--glass-line);

}
.dpanel--S .vhr-ticket, .dpanel--M .vhr-ticket { grid-template-columns: repeat(2, 1fr); }

  padding: 12px 14px;

  display: flex; flex-direction: column; gap: 3px;
}
.vhr-tk-l { font-size: 9.5px; }
.vhr-tk-v { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
.vhr-tk-sub { font-size: 10.5px; }

.wsx { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }

/* ════════════════════════════════════════════════════════════════
   ATOMS — Pill, Sparkline, Scaffold, Empty  (design grammar)
   ════════════════════════════════════════════════════════════════ */
function Pill({ tone="ink", children, small, dot, outline }) {
  const cls = ["pill", `pill--${tone}`, small && "pill--sm", outline && "pill--outline"].filter(Boolean).join(" ");
  return <span className={cls}>{dot && <span className="pill-dot" />}{children}</span>;
}
function Sparkline({ data, color="currentColor", h=18, w=56, fill=true }) {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
  const step = w / (data.length - 1);
  const pts = data.map((v, i) => [i * step, h - ((v - min) / range) * h]);
  const d = "M " + pts.map(p => p.join(" ")).join(" L ");
  const area = d + ` L ${w} ${h} L 0 ${h} Z`;
  const gid = "sp-" + Math.abs(data[0] * 1e6 | 0).toString(36);
  const last = pts[pts.length - 1];
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display:"block", overflow:"visible" }}>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor={color} stopOpacity="0.30" /><stop offset="100%" stopColor={color} stopOpacity="0.02" />
      </linearGradient></defs>
      {fill && <path d={area} fill={`url(#${gid})`} />}
      <path d={d} stroke={color} fill="none" strokeWidth="1.4" strokeLinecap="round" style={{ filter:`drop-shadow(0 0 4px ${color})` }} />
      <circle cx={last[0]} cy={last[1]} r="2.2" fill={color} style={{ filter:`drop-shadow(0 0 5px ${color})` }} />
    </svg>
  );
}
function Scaffold({ children }) {
  return <div className="ss-scaffold"><span>⚠</span><span>{children}</span></div>;
}
function EmptyState({ children }) { return <div className="ss-empty">{children}</div>; }
function FreshnessPill({ state="live", age }) {
  if (state === "stale")    return <Pill tone="rd" small>STALE {age||""}</Pill>;
  if (state === "loading")  return <Pill tone="ink" small>· · ·</Pill>;
  if (state === "empty")    return <Pill tone="ink" small>NO DATA</Pill>;
  return <Pill tone="gn" small dot>LIVE {age ? `· ${age}` : ""}</Pill>;
}

// helpers
const num = (v, d=2) => (v==null || isNaN(v)) ? null : Number(v);
const fmt = (v, d=2) => v==null || isNaN(v) ? "—" : Number(v).toLocaleString("en-US", { minimumFractionDigits:d, maximumFractionDigits:d });
const pct = (v, d=2) => v==null || isNaN(v) ? "—" : (v>=0?"+":"") + Number(v).toFixed(d) + "%";
const sparkSeed = (sym, up) => { const code=(sym.charCodeAt(0)||65)+(sym.charCodeAt(2)||65); const a=[]; let v=0; for(let i=0;i<18;i++){ v+=(Math.sin(i*0.6+code)+(up?0.18:-0.14))*0.5; a.push(v);} return a; };

  const idx = (d.sector_etf && d.sector_etf._indices) || {};
  const se = d.sector_etf || {}, ext = se._ext_macro || {}, ms = d.macro_signals || {}, vix = (d.regime || {}).vix || {};
  const cells = [
    { s:"S&P 500", v: se.SPY && se.SPY.price,   c: se.SPY && se.SPY.perf_pct,        h:"perf vs benchmark" },
    { s:"NASDAQ",  v: idx.QQQ && idx.QQQ.price, c: idx.QQQ && idx.QQQ.perf_pct,      h:"perf" },
    { s:"DOW",     v: idx.DIA && idx.DIA.price, c: idx.DIA && idx.DIA.perf_pct,      h:"perf" },
    { s:"RUSSELL", v: idx.IWM && idx.IWM.price, c: idx.IWM && idx.IWM.perf_pct,      h:"perf" },
    { s:"VIX",     v: vix.vix_current,          c: vix.vix_ma20 ? (vix.vix_current/vix.vix_ma20-1)*100 : null, h:"vs 20d MA", inv:true },
    { s:"20Y BONDS", v: idx.TLT && idx.TLT.price, c: idx.TLT && idx.TLT.perf_pct,   h:"TLT perf" },
    { s:"GOLD",    v: ms.gld && ms.gld.price,   c: ms.gld && ms.gld.chg20d,          h:"GLD · 20d" },
    { s:"OIL",     v: ext.uso && ext.uso.price, c: ext.uso && ext.uso.chg20d,        h:"USO · 20d" },
    { s:"SEMIS",   v: ext.smh && ext.smh.price, c: ext.smh && ext.smh.chg20d,        h:"SMH · 20d" },
    { s:"DOLLAR",  v: ms.dxy && ms.dxy.price,   c: ms.dxy && ms.dxy.chg20d,          h:"UUP · 20d" },
  ];
  return (
    <div className="ix-strip">
      {cells.map((i, k) => {
        const c = num(i.c);
        const up = c==null ? null : (i.inv ? c <= 0 : c >= 0);
        const cls = c==null ? "ink" : up ? "gn" : "rd";
        return (
          <div key={k} className={`ix ix--${cls}`} title={i.h}>
            <div className="ix-s mono">{i.s}</div>
            <div className="ix-v mono">{i.v!=null?fmt(i.v, i.v>=1000?0:2):"—"}</div>

            {c!=null && <Spark sym={i.s} up={up} />}
          </div>
        );
      })}

  );
}

  const ep = d.elite_picks || {}, sw = ep.Swing || {};
  const rows = [...(sw.BUY||[]), ...(sw.WATCH||[])].slice(0, 5).map(p => {
    const sn = p.snapshot || {};
    const edge = (sn.p_target!=null && sn.p_stop!=null) ? (sn.p_target - sn.p_stop)/100 : null;
    return {
      sym: p.ticker,
      name: (p.name && p.name !== p.ticker) ? p.name : (p.sector || ""),
      score: Math.round(p.score_raw ?? p.elite_score ?? 0),
      rr: sn.rr, pt: sn.p_target, edge, v: p.stage,

  if (!rows.length) return <EmptyState>No elite picks in this bundle. Source: data.critical.json · elite_picks.Swing.</EmptyState>;

    <div className="tset">

        <button key={r.sym} className="tset-row" onClick={() => onTicker(r.sym)}>

function Discovery({ d, screener, onTicker }) {
  // All five groups bound to REAL scan output (data_screener.json) + options_flow_top30.
  if (screener === null) return <div className="ss-empty">Fetching from data_screener.json…</div>;
  const sc = screener || [];
  const near52 = sc.filter(r => r.price && r.week52_high && r.price >= 0.97 * r.week52_high)
    .sort((a, b) => (b.price / b.week52_high) - (a.price / a.week52_high)).slice(0, 3)
    .map(r => [r.ticker, pct((r.price / r.week52_high - 1) * 100, 1)]);
  const squeeze = sc.filter(r => r.squeeze_on).sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 3)
    .map(r => [r.ticker, "ON"]);
  const insider = sc.filter(r => (r.insider_buys || 0) > 0 && (r.insider_sells || 0) === 0)
    .sort((a, b) => (b.insider_buys || 0) - (a.insider_buys || 0)).slice(0, 3)
    .map(r => [r.ticker, `+${r.insider_buys}`]);
  const uoa = (d.options_flow_top30 || []).filter(x => x.status === "STRONG" || x.uoa_calls > 0).slice(0, 3)
    .map(x => [x.ticker, x.put_call_ratio != null ? `pcr ${Number(x.put_call_ratio).toFixed(2)}` : "UOA"]);
  const emerging = sc.filter(r => ["Small", "Mid"].includes(r.cap_bucket) && ["BUY", "WATCH"].includes(r.stage))
    .sort((a, b) => (b.rs_rank || 0) - (a.rs_rank || 0)).slice(0, 3)
    .map(r => [r.ticker, `RS ${r.rs_rank ?? "—"}`]);
  const groups = [
    { tag:"52W HIGH", tone:"gn",     items: near52,   src:"screener · week52_high" },
    { tag:"SQUEEZE",  tone:"amb",    items: squeeze,  src:"screener · squeeze_on" },
    { tag:"INSIDER",  tone:"cy",     items: insider,  src:"screener · insider_buys" },
    { tag:"UOA",      tone:"violet", items: uoa,      src:"options_flow_top30" },
    { tag:"EMERGING", tone:"copper", items: emerging, src:"screener · small/mid-cap × RS rank" },
  ];
  return (
    <div className="disc">
      {groups.map((g, i) => (
        <div key={i} className="disc-grp">
          <div className={`disc-tag mono disc-tag--${g.tone}`}>{g.tag}</div>
          <div className="disc-items">
            {g.items.length
              ? g.items.map(([sym, val], j) => (
                  <button key={j} className="disc-chip" onClick={() => onTicker(sym)} title={g.src}>
                    <span className="mono"><b>{sym}</b></span><span className={`mono disc-val disc-val--${g.tone}`}>{val}</span>
                  </button>
                ))
              : <span className="ss-empty" style={{ padding:"2px 4px" }}>none in today's scan</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

  const col = (items) => (

    <div className="tm">

      <div className="tm-2col">{col(gainers)}{col(losers)}</div>
    </div>
  );
}

function EarningsToday({ d, earnings, onTicker }) {
  if (earnings === null) return <div className="ss-empty">Fetching from data_earnings.json…</div>;
  const wl = (earnings && earnings.earnings_watchlist) || [];
  const beats = (earnings && earnings.earnings_beat_predictions) || {};
  const held = new Set(((d.portfolio && d.portfolio.positions) || []).map(p => (p.ticker||p.symbol||"").toUpperCase()));
  const today = wl.filter(r => r.days_to_earnings === 0);
  const rows = (today.length ? today : wl.slice(0, 0)).slice(0, 6).map(r => {
    const bp = beats[r.ticker];
    return {
      sym: r.ticker,
      when: /before/i.test(r.before_after_market||"") ? "BMO" : "AMC",
      est: r.estimate,
      beat: bp && (bp.tier || bp.prediction),
      expo: held.has((r.ticker||"").toUpperCase()) ? "HELD" : "—",
      date: (r.report_date||"").slice(5),
    };
  });
  if (!rows.length) return <EmptyState>No tickers reporting today (days_to_earnings = 0). Source: data_earnings.json · earnings_watchlist.</EmptyState>;
  return (
    <div className="et">
      <div className="et-hdr mono dim2"><span>{rows.length} reporting today · </span><span className="warn">{rows.filter(r=>r.expo==="HELD").length} held</span><span> · est EPS shown</span></div>
      {rows.map((r, i) => (
        <div key={i} className={`et-row ${r.expo==="HELD"?"is-held":""}`} onClick={() => onTicker(r.sym)}>
          <span className="et-sym mono"><b>{r.sym}</b></span>
          <span className={`et-when mono ${r.when==="BMO"?"cy":"amb"}`}>{r.when}</span>
          <span className="et-time mono dim2">{r.date}</span>
          <span className="et-move mono dim2">est {r.est!=null?Number(r.est).toFixed(2):"—"}</span>
          <span className={`et-esp mono ${r.beat?"up":"dim"}`}>{r.beat ? String(r.beat).toUpperCase() : "—"}</span>
          {r.expo!=="—" ? <span className="et-expo mono gn">{r.expo}</span> : <span className="et-expo mono dim">—</span>}
        </div>
      ))}
    </div>
  );
}

function TopStories({ d, screener, onTicker }) {
  // Live headlines from /api/news (EODHD) for the most-covered names in today's scan.
  const [news, setNews] = useState(null);
  // Build a sentiment lookup from the screener (sent_score 1-3) to color rows.
  const sentBy = useMemo(() => {
    const m = {}; (screener || []).forEach(r => { if (r.sent_score != null) m[r.ticker] = r.sent_score; });
    return m;
  }, [screener]);
  const tickers = useMemo(() => {
    const top = (d._news_top_tickers || []).slice(0, 4);
    return top.length ? top : ((screener || []).slice(0, 4).map(r => r.ticker));
  }, [d, screener]);
  useEffect(() => {
    let dead = false;
    if (!tickers.length) { setNews([]); return; }
    Promise.all(tickers.map(t => fetch(`/api/news?t=${encodeURIComponent(t)}&limit=3`, { cache:"no-store" })
      .then(r => r.ok ? r.json() : null).catch(() => null)))
      .then(res => {
        if (dead) return;
        const rows = [];
        res.forEach(r => { if (r && r.articles) r.articles.slice(0, 2).forEach(a => rows.push({ sym: r.ticker, ...a })); });
        rows.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
        setNews(rows.slice(0, 6));
      }).catch(() => { if (!dead) setNews([]); });
    return () => { dead = true; };
  }, [tickers.join(",")]);
  if (news === null) return <div className="ss-empty">Fetching live headlines from /api/news (EODHD)…</div>;
  if (!news.length) return <EmptyState>No headlines returned for today's most-covered names. Source: /api/news (EODHD) · requires the server running.</EmptyState>;
  return (
    <div className="ts">
      {news.map((s, i) => {
        const ss = sentBy[s.sym];
        const tone = ss == null ? "ink" : ss >= 3 ? "gn" : ss <= 1 ? "rd" : "amb";
        const time = String(s.date || "").slice(11, 16) || String(s.date || "").slice(5, 10);
        return (
          <div key={i} className={`ts-row ts-${tone}`} onClick={() => s.sym && onTicker(s.sym)}>
            <div className="ts-top">
              <span className="ts-time mono dim2">{time}</span>
              <span className="ts-src mono dim2">{s.source || "EODHD"}</span>
              {s.sym && <span className="ts-sym mono">{s.sym}</span>}
              {ss != null && <span className={`ts-sent mono ${ss >= 2 ? "up" : "dn"}`}>sent {ss}</span>}
            </div>
            <div className="ts-head">{s.title}</div>
          </div>
        );
      })}
    </div>
  );
}

function SignalFeed({ d, screener, onTicker }) {
  if (screener === null) return <div className="ss-empty">Fetching from data_screener.json…</div>;
  const sc = screener || [];
  const events = [];
  // Today's BUY signals — real, from the scan.
  sc.filter(r => r.stage === "BUY").sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 5).forEach(r => {
    const tier = r.conviction_tier ? ` · ${r.conviction_tier}` : "";
    events.push({ tone:"gn", tag:"BUY", sym:r.ticker, text:`${r.decision_label || r.setup || "BUY signal"} · score ${r.score}${tier}` });
  });
  // Insider-cluster names — real.
  sc.filter(r => (r.insider_buys || 0) >= 3 && (r.insider_sells || 0) === 0)
    .sort((a, b) => (b.insider_buys || 0) - (a.insider_buys || 0)).slice(0, 2).forEach(r => {
      events.push({ tone:"cy", tag:"INSIDER", sym:r.ticker, text:`Insider cluster · ${r.insider_buys} buys, 0 sells${r.insider_days ? ` · ${r.insider_days}d` : ""}` });
    });
  // Setup drift alerts — real.
  (d.setup_drift_alerts || []).forEach(a => {
    const txt = typeof a === "string" ? a : (a.message || a.text || `${a.setup || ""} drift ${a.metric || ""}`.trim());
    events.push({ tone:"amb", tag:"DRIFT", text: txt });
  });
  // Bundle event — real.
  if (d.run_timestamp) events.push({ tone:"ink", tag:"BUNDLE", t:(d.run_timestamp||"").slice(0,5),
    text:`Daily bundle · ${d.scan_count!=null?d.scan_count.toLocaleString():"—"} ranked · ${d.buy_count??"—"} BUY · ${d.watch_count??"—"} WATCH · ${d.killed_count??"—"} AVOID` });
  if (!events.length) return <EmptyState>No new BUY signals, insider clusters or drift alerts in today's scan. Source: data_screener.json + setup_drift_alerts.</EmptyState>;
  return (
    <div className="sf">
      {events.map((e, i) => (
        <div key={i} className={`sf-row sf-${e.tone}`} onClick={() => e.sym && onTicker(e.sym)} style={{ cursor: e.sym ? "pointer" : "default" }}>
          <span className="sf-time mono dim2">{e.t || ""}</span>
          <span className={`sf-tag mono sf-tag--${e.tone}`}>{e.tag}</span>
          {e.sym && <span className="sf-sym mono"><b>{e.sym}</b></span>}
          <span className="sf-text mono" style={{ gridColumn: e.sym ? "4" : "3 / -1" }}>{e.text}</span>
        </div>
      ))}
    </div>
  );
}

  const [fTier, setFTier] = useState("all");
  const [editing, setEditing] = useState(null);
  const tiers = TIER_LIST;

  // role.id -> commercial tier (admin forced to 5; ladder roles carry .tier)
  const roleTier = useMemo(() => {
    const m = {}; roles.forEach(r => { m[r.id] = (r.id === "admin") ? 5 : (r.tier ?? null); });
    return m;
  }, [roles]);

  const load = () => {
    setUsers(null); setErr(null);
    Promise.all([
      api("/api/users").then(r => r.ok ? r.json() : Promise.reject(r.status)),
      api("/api/roles").then(r => r.ok ? r.json() : Promise.reject(r.status)),
    ]).then(([u, r]) => { setRoles(r.roles || []); setUsers(u.users || []); })
      .catch(e => setErr(e));
  };
  useEffect(load, []);

  const rows = useMemo(() => {
    let r = (users || []).map(u => ({
      ...u,
      _name: u.display_name || u.username,
      _tier: roleTier[u.role] ?? null,
      _status: u.disabled ? "suspended" : "active",
    }));
    if (q.trim()) { const s = q.toLowerCase(); r = r.filter(u => (u._name + u.email + u.username).toLowerCase().includes(s)); }
    if (fTier !== "all") r = r.filter(u => u._tier === +fTier);
    return r;
  }, [users, roleTier, q, fTier]);

  const counts = useMemo(() => tiers.map(t => ({ ...t, n: (users || []).filter(u => (roleTier[u.role] ?? null) === t.id).length })), [users, roleTier, tiers]);

  const tierToRole = { 0:"free", 1:"starter", 2:"core", 3:"pro", 4:"elite", 5:"admin" };
  const assignTier = (username, tierId) => {
    const role = tierToRole[tierId]; if (!role) return;
    api(`/api/users/${username}`, { method:"PATCH", body: JSON.stringify({ role }) }).then(() => load());
  };
  // Modal mirrors the prototype (Full name · Email · Tier · Status · MFA). The
  // backend POST needs username+password the prototype doesn't collect, so on
  // create we derive a username from the email and mint a temp password.
  const genPw = () => Math.random().toString(36).slice(2, 9) + "Aa9!";
  const deriveUsername = (email) => {
    let base = (String(email).split("@")[0] || "user").toLowerCase().replace(/[^a-z0-9_-]/g, "");
    if (!/^[a-z]/.test(base)) base = "u" + base;
    base = base.slice(0, 24) || "user";
    const taken = new Set((users || []).map(x => x.username));
    let name = base, i = 1; while (taken.has(name)) name = base + (i++);
    return name;
  };
  const saveUser = (u) => {
    const role = tierToRole[u.tier] || "starter";
    const disabled = u.status === "suspended";
    if (u._isNew) {
      const username = deriveUsername(u.email), password = genPw();
      api("/api/users", { method:"POST", body: JSON.stringify({ username, password, display_name: u.name, email: u.email, role, disabled, mfa: !!u.mfa }) })
        .then(r => { if (!r.ok) return r.text().then(t => alert("Create failed: " + t));
          setEditing(null); load();
          alert(`User created.\n\nUsername: ${username}\nTemp password: ${password}\n\nShare these — they sign in and reset the password.`); });
    } else {
      api(`/api/users/${u.username}`, { method:"PATCH", body: JSON.stringify({ display_name: u.name, email: u.email, role, disabled, mfa: !!u.mfa }) })
        .then(r => { if (!r.ok) return r.text().then(t => alert("Save failed: " + t)); setEditing(null); load(); });
    }
  };
  const deleteUser = (username) => {
    if (!confirm(`Delete user "${username}"? This revokes their access.`)) return;
    api(`/api/users/${username}`, { method:"DELETE" }).then(r => { if (!r.ok) return r.text().then(t => alert("Delete failed: " + t)); setEditing(null); load(); });
  };

  const openNew = () => setEditing({ _isNew:true, name:"", email:"", tier:1, status:"active", mfa:false });
  const openEdit = (u) => setEditing({ _isNew:false, username:u.username, name:u._name, email:u.email, tier:u._tier ?? 1, status:u._status, mfa:!!u.mfa, is_owner:u.is_owner });

  return (
    <div className="surface wsx wsx--amb um">
      <div className="wsx-hdr">
        <div className="wsx-hdr-l">
          <div className="wsx-eyebrow mono">ADMIN · USER MANAGEMENT · RBAC</div>
          <h1 className="wsx-title mono">User Management</h1>
          <div className="wsx-sub mono dim2">add &amp; edit users · assign tiers · configure tier access · <span className="dim">live · /api/users</span></div>
        </div>
        <div className="wsx-hdr-r">
          {view === "users" && <button className="btn btn--primary btn--sm" onClick={openNew}>＋ Add user</button>}
          <FreshnessPill state={err ? "empty" : users === null ? "loading" : "live"} age={users ? `${users.length} users` : ""} />
        </div>
      </div>

      <div className="um-viewtabs">
        <button className={`um-vt ${view==="users"?"is-on":""}`} onClick={()=>setView("users")}>Users &amp; Tiers</button>
        <button className={`um-vt ${view==="access"?"is-on":""}`} onClick={()=>setView("access")}>Tier Access · Configure</button>
      </div>

      {view === "users" ? (
        err ? (
          <div className="ss-err">⚠ Couldn't load users (HTTP {String(err)}). <code>/api/users</code> requires an <b>admin</b> login — sign in as an admin user (e.g. gari). Server enforces this regardless of UI tier.</div>
        ) : users === null ? (
          <div className="ss-empty">Fetching from /api/users + /api/roles…</div>
        ) : (
        <>
          <div className="um-tiers">
            {counts.map(t => (
              <button key={t.id} className={`um-tier ${fTier===String(t.id)?"is-on":""} um-tier--${t.id}`} onClick={()=>setFTier(fTier===String(t.id)?"all":String(t.id))}>
                <div className="um-tier-n mono">{t.n}</div>
                <div className="um-tier-l mono">T{t.id} · {t.name}</div>
                <div className="um-tier-p mono dim2">{t.price}</div>
              </button>
            ))}
          </div>

          <div className="lab-tabs">
            <button className={`lab-tab ${fTier==="all"?"is-on":""}`} onClick={()=>setFTier("all")}>All users · {users.length}</button>
            <input className="nw-search mono" placeholder="⌕ name or email…" value={q} onChange={e=>setQ(e.target.value)} style={{marginLeft:"auto"}} />
          </div>

          <div className="wsx-body">
            <table className="dtable wsx-tbl um-tbl">
              <thead><tr>
                <th>User</th><th>Email</th><th>Status</th><th>MFA</th><th className="r">Trades</th><th>Last active</th><th>Tier · assign</th><th></th>
              </tr></thead>
              <tbody>{rows.map(u=>(
                <tr key={u.username}>
                  <td><div className="um-user"><span className="um-avatar">{(u._name||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}</span><b>{u._name}</b>{u.is_owner && <span className="mono dim2" style={{marginLeft:6,fontSize:9}}>OWNER</span>}</div></td>
                  <td className="dim2">{u.email || "—"}</td>
                  <td><span className={`um-status um-status--${u._status}`}>{u._status}</span></td>
                  <td title={u.mfa==null ? "MFA not stored in auth yet — gap to fill" : ""}>{u.mfa ? <span className="up">✓ on</span> : <span className="dim">— off</span>}</td>
                  <td className="r tabular" title={u.trades==null ? "per-user trade count not tracked yet — gap to fill" : ""}>{u.trades ?? "—"}</td>
                  <td className="dim2">{(u.last_login||"").slice(0,10) || "never"}</td>
                  <td>
                    <select className="um-sel" value={tierToRole[u._tier]===u.role ? u._tier : (u._tier ?? "")} onChange={e=>assignTier(u.username, +e.target.value)} data-tier={u._tier ?? ""}
                            title={u._tier==null ? `role: ${u.role} (not on the tier ladder)` : ""}>
                      {u._tier==null && <option value="">{u.role}</option>}
                      {tiers.map(t => <option key={t.id} value={t.id}>T{t.id} · {t.name} · {t.price}</option>)}
                    </select>
                  </td>
                  <td><button className="um-edit" onClick={()=>openEdit(u)} title="Edit user">✎</button></td>
                </tr>
              ))}</tbody>
            </table>
          </div>

          <div className="pm-note mono dim2">
            Tier = backend <b>role</b> (free→elite + admin). Changes call <code>PATCH /api/users</code> and gate every surface/lens via the RBAC matrix.
            MFA + per-user trade count aren't in <code>data/users.json</code> yet — shown as "—" (gap to fill). Audit-logged to Change History.
          </div>
        </>
        )
      ) : (
        <TierAccessConfig tiers={tiers} />
      )}

      {editing && <UserEditModal user={editing} tiers={tiers} onSave={saveUser} onDelete={deleteUser} onClose={()=>setEditing(null)} />}
    </div>
  );
}

function UserEditModal({ user, tiers, onSave, onDelete, onClose }) {
  const [u, setU] = useState(user);
  const set = (k, v) => setU(x => ({ ...x, [k]: v }));
  const isNew = !!u._isNew;
  const valid = (u.name || "").trim() && /\S+@\S+\.\S+/.test(u.email || "");
  return ReactDOM.createPortal((
    <div className="um-modal-bg" onMouseDown={onClose}>
      <div className="um-modal" onMouseDown={e=>e.stopPropagation()}>
        <div className="um-modal-h">
          <span className="mono">{isNew ? "ADD USER" : "EDIT USER"}</span>
          <button className="um-modal-x" onClick={onClose}>✕</button>
        </div>
        <div className="um-modal-body">
          <label className="um-field"><span className="mono dim2">Full name</span>
            <input className="um-input" value={u.name} onChange={e=>set("name", e.target.value)} placeholder="Jane Trader" /></label>
          <label className="um-field"><span className="mono dim2">Email</span>
            <input className="um-input" value={u.email} onChange={e=>set("email", e.target.value)} placeholder="jane@fund.com" /></label>
          <div className="um-field-row">
            <label className="um-field"><span className="mono dim2">Tier</span>
              <select className="um-input" value={u.tier} onChange={e=>set("tier", +e.target.value)}>
                {tiers.map(t => <option key={t.id} value={t.id}>T{t.id} · {t.name} · {t.price}</option>)}
              </select></label>
            <label className="um-field"><span className="mono dim2">Status</span>
              <select className="um-input" value={u.status} onChange={e=>set("status", e.target.value)}>
                <option value="active">active</option><option value="trial">trial</option><option value="suspended">suspended</option>
              </select></label>
          </div>
          <label className="um-toggle"><input type="checkbox" checked={!!u.mfa} onChange={e=>set("mfa", e.target.checked)} /><span className="mono">MFA enabled {u.tier>=3 && <b className="amb">· required for Tier ≥ 3</b>}</span></label>
        </div>
        <div className="um-modal-foot">
          {!isNew && !u.is_owner && <button className="btn btn--sm um-del" onClick={()=>onDelete(u.username)}>🗑 Delete</button>}
          <div style={{marginLeft:"auto", display:"flex", gap:6}}>
            <button className="btn btn--sm" onClick={onClose}>Cancel</button>
            <button className="btn btn--primary btn--sm" disabled={!valid} onClick={()=>valid && onSave(u)}>{isNew ? "Create user" : "Save changes"}</button>
          </div>
        </div>
      </div>
    </div>
  ), document.body);
}

function TierAccessConfig({ tiers }) {
  const [, force] = useState(0);
  const surf = window.SURFACE_TIER || {};
  const lens = window.LENS_TIER || {};
  const setSurf = (k, v) => { window.SURFACE_TIER[k] = v; force(x => x + 1); };
  const setLens = (k, v) => { window.LENS_TIER[k] = v; force(x => x + 1); };
  const Pills = ({ value, onChange }) => (
    <div className="tac-pills">
      {tiers.map(t => <button key={t.id} className={`tac-pill tac-pill--${t.id} ${value===t.id?"is-on":""}`} onClick={()=>onChange(t.id)} title={`${t.name} ${t.price}`}>T{t.id}</button>)}
    </div>
  );
  return (
    <div className="tac">
      <div className="tac-legend mono dim2">
        Set the <b>minimum tier</b> required for each surface and per-ticker lens. Changes apply live — lower-tier users see an upgrade gate.
        <span className="tac-key">{tiers.map(t=> <span key={t.id} className={`tac-k tac-k--${t.id}`}>T{t.id} {t.name}</span>)}</span>
      </div>
      <div className="tac-cols">
        <div className="lab-card">
          <div className="lab-card-h mono">SURFACES · {Object.keys(UM_SURFACE_LABELS).length}</div>
          <div className="tac-rows">
            {Object.entries(UM_SURFACE_LABELS).map(([k, label]) => (
              <div key={k} className="tac-row"><span className="tac-row-l">{label}</span><Pills value={surf[k] ?? 0} onChange={v=>setSurf(k, v)} /></div>
            ))}
          </div>
        </div>
        <div className="lab-card">
          <div className="lab-card-h mono">PER-TICKER LENSES · {Object.keys(UM_LENS_LABELS).length}</div>
          <div className="tac-rows">
            {Object.entries(UM_LENS_LABELS).map(([k, label]) => (
              <div key={k} className="tac-row"><span className="tac-row-l">{label}</span><Pills value={lens[k] ?? 0} onChange={v=>setLens(k, v)} /></div>
            ))}
          </div>
        </div>
      </div>
      <div className="pm-note mono dim2">
        Live preview map — gates the icon-rail, workspace routing and the 14-lens tabs this session. Persisting to the CapStudio RBAC matrix (<code>/api/capability-registry</code>) is the next wire-up.
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   SURFACE PLACEHOLDER (non-home rail clicks — home-only build)
   ════════════════════════════════════════════════════════════════ */
function SurfacePlaceholder({ surface, locked, minTier, onHome, onTier }) {
  if (locked) {
    const tdef = TIER_LIST.find(t => t.id === minTier) || {};
    return (
      <div className="ss-place">
        <div className="ss-place-glyph">🔒</div>
        <div className="mono label-cap" style={{ color:"var(--copper)" }}>TIER {minTier} · {(tdef.name||"").toUpperCase()}</div>
        <h2>{SURFACE_LABEL(surface)}</h2>
        <p>This workspace unlocks at <b>{tdef.name}</b> ({tdef.price}/mo). {tdef.tag||""}</p>
        <button onClick={() => onTier(minTier)}>⚡ Preview as {(tdef.name||"").toUpperCase()}</button>
      </div>
    );
  }
  return (
    <div className="ss-place">
      <div className="ss-place-glyph">🚧</div>
      <h2>{SURFACE_LABEL(surface)}</h2>
      <p>This surface isn't in the Stocksmith build yet — we're starting with the <b>Home</b> page, fully wired to live <code>/v2</code> data. This workspace lands in a later pass.</p>
      <button onClick={onHome}>← Back to Home</button>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   APP
   ════════════════════════════════════════════════════════════════ */
function App() {
  const [theme, setTheme] = useState("midnight-cyan");
  const [tier, setTier] = useState(4);
  const [surface, setSurface] = useState("home");
  const [data, setData] = useState(undefined);   // undefined = loading, null mid-fetch handled separately
  const [earnings, setEarnings] = useState(null); // null = loading
  const [misc, setMisc] = useState(null);
  const [screener, setScreener] = useState(null); // null = loading
  const [err, setErr] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);

  useEffect(() => { document.documentElement.setAttribute("data-theme", theme); }, [theme]);

  // Fetch the same payloads kairos.html consumes.
  useEffect(() => {
    const get = (u) => fetch(u, { cache:"no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status));
    get("/v2/data.critical.json").then(setData).catch(() => get("data.critical.json").then(setData).catch(e => setErr(e)));
    get("/v2/data_earnings.json").then(setEarnings).catch(() => get("data_earnings.json").then(setEarnings).catch(() => setEarnings({})));
    get("/v2/data_misc.json").then(setMisc).catch(() => get("data_misc.json").then(setMisc).catch(() => setMisc({})));
    get("/v2/data_screener.json").then(j => setScreener((j && j.screener) || [])).catch(() => get("data_screener.json").then(j => setScreener((j && j.screener) || [])).catch(() => setScreener([])));
  }, []);

  useEffect(() => {
    const onKey = (e) => { if (["INPUT","TEXTAREA"].includes(e.target.tagName)) return; if (e.key==="Escape") { setSurface("home"); } };
    window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey);
  }, []);

  const toast = (msg) => { setToastMsg(msg); clearTimeout(window.__ssToast); window.__ssToast = setTimeout(() => setToastMsg(null), 2600); };
  const onTicker = (sym) => toast(`${sym} — 14-lens detail panel ships in the next build`);
  const onPick = (id) => { if (id === "signal-scanner") { toast("Signal Scanner ships next — Home is live"); return; } setSurface(id); };
  const goHome = () => setSurface("home");

  const book = useMemo(() => {
    const p = (data && data.portfolio) || {};
    return { equity: p.equity, cash: p.cash, positions: (p.positions||[]).length };
  }, [data]);

  // Only the Home surface depends on the (multi-MB) data bundle. Every other
  // surface renders immediately from its own feed — never gate them on home data.
  let body;
  const minTier = SURFACE_TIER[surface] ?? 0;
  if (minTier > tier) {
    body = <SurfacePlaceholder surface={surface} locked={true} minTier={minTier} onHome={goHome} onTier={setTier} />;
  } else if (surface === "users") {
    body = <div className="main-home"><SurfaceUsers /></div>;
  } else if (surface !== "home") {
    body = <SurfacePlaceholder surface={surface} locked={false} minTier={minTier} onHome={goHome} onTier={setTier} />;
  } else if (err) {
    body = <div className="ss-err">⚠ Couldn't load <b>/v2/data.critical.json</b> (status {String(err)}).<br/><br/>Start the server so the bundle is served:<br/><code>cd SwingTrade &amp;&amp; python3 server.py</code><br/>then open <code>/v2/Stocksmith.html</code>.</div>;
  } else if (data === undefined) {
    body = <div className="ss-boot"><span className="ss-boot-dot" />Loading Stocksmith · fetching /v2/data.critical.json…</div>;
  } else {
    body = <div className="main-home"><HomeView d={data} earnings={earnings} misc={misc} screener={screener} onTicker={onTicker} toast={toast} /></div>;
  }

  return (
    <div className="app">
      <IconRail activeId={surface} onPick={onPick} tier={tier} />
      <main className="main">
        <CommandBar surface={surface} theme={theme} onTheme={setTheme} tier={tier} onTier={setTier} onHome={goHome} book={book} />
        {body}
      </main>
      {toastMsg && <div className="ss-toast">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
