<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SwingTrade — Mobile</title>

<!-- PWA: "Add to Home Screen" makes this open full-screen like a native app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SwingTrade" />
<meta name="theme-color" content="#07090b" />
<link rel="manifest" href="/v2/mobile/manifest.json" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="/v2/mobile/tokens.css" />
<link rel="stylesheet" href="/v2/mobile/companion.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- LIVE data layer (replaces the prototype's mock src/data.jsx) -->
<script type="text/babel" src="/v2/mobile/companion-data.jsx"></script>
<script type="text/babel" src="/v2/mobile/lens-icons.jsx"></script>
<!-- companion modules (order matters: core → views → lenses → surfaces → extra → surfaces2 → app) -->
<script type="text/babel" src="/v2/mobile/companion-core.jsx"></script>
<script type="text/babel" src="/v2/mobile/companion-views.jsx"></script>
<script type="text/babel" src="/v2/mobile/companion-lenses.jsx"></script>
<script type="text/babel" src="/v2/mobile/companion-surfaces.jsx"></script>
<script type="text/babel" src="/v2/mobile/companion-extra.jsx"></script>
<script type="text/babel" src="/v2/mobile/companion-surfaces2.jsx"></script>
<script type="text/babel" src="/v2/mobile/companion-app.jsx"></script>

<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg-0, #07090b); }
  #root { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #7c807c; font-family: "Inter", system-ui; font-size: 13px; }
  #boot b { color: #d97757; }
</style>
</head>
<body>
<div id="root"><div id="boot"><div>Loading <b>SwingTrade</b> · live scan…</div></div></div>

<script type="text/babel">
  // Boot: fetch live data FIRST (populates window.WATCHLIST/TICKER/REGIME_LIVE/…),
  // wire the real per-ticker resolver into the app helpers, THEN mount.
  (async () => {
    try { await window.loadCompanionData(); } catch (e) { console.error(e); }
    if (window.cmpHelpers && window.resolveTickerLive) {
      window.cmpHelpers.resolveTicker = window.resolveTickerLive;   // app uses REAL tickers
    }
    const boot = document.getElementById("boot"); if (boot) boot.remove();
    ReactDOM.createRoot(document.getElementById("root")).render(<window.Companion />);
  })();
</script>
</body>
</html>
