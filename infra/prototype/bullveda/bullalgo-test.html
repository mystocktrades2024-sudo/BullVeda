<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BullAlgo · test bench</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg-0:#070a09; --bg-1:#0c1110; --bg-2:#121a18; --bg-3:#18221f;
    --line:#1e2b27; --line-2:#2a3a35;
    --ink:#e8f1ed; --ink-2:#9fb3ac; --ink-3:#5f726b;
    --bull:#34e3a4; --bull-dim:#1a7a5c; --bear:#ff5d6c; --bear-dim:#7a2530;
    --warn:#ffc24b; --neo:#8b7cff; --gold:#e8c170;
    --grad-bull:linear-gradient(135deg,#34e3a4,#13b07e);
    --grad-bear:linear-gradient(135deg,#ff5d6c,#c33042);
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Inter',Segoe UI,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 700px at 70% -10%,#10201b 0,var(--bg-0) 55%);
    color:var(--ink);font-family:var(--sans);min-height:100vh;
    -webkit-font-smoothing:antialiased;padding:28px 22px 60px}
  .wrap{max-width:1180px;margin:0 auto}

  /* ── topbar ── */
  .top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:24px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:26px;letter-spacing:-.5px;font-weight:800;
    background:var(--grad-bull);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:2px;border:1px solid var(--line-2);
    padding:3px 8px;border-radius:6px}
  .ctrl{margin-left:auto;display:flex;align-items:center;gap:10px}
  input#tk{background:var(--bg-2);border:1px solid var(--line-2);color:var(--ink);
    font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:1px;
    padding:9px 14px;border-radius:9px;width:120px;text-transform:uppercase;outline:none}
  input#tk:focus{border-color:var(--bull-dim);box-shadow:0 0 0 3px rgba(52,227,164,.12)}
  .modes{display:flex;background:var(--bg-2);border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
  .modes button{background:transparent;border:0;color:var(--ink-3);font-family:var(--mono);
    font-size:11px;font-weight:700;letter-spacing:1px;padding:9px 13px;cursor:pointer;transition:.15s}
  .modes button.on{background:var(--bg-3);color:var(--bull)}
  .modes button:hover{color:var(--ink)}

  .disc{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
    border:1px dashed var(--line-2);border-radius:8px;padding:7px 12px;margin-bottom:22px;
    display:flex;gap:8px;align-items:center}
  .disc b{color:var(--gold);font-weight:700}

  /* ── confirmation panel ── */
  .grid-top{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-bottom:18px}
  @media(max-width:820px){.grid-top{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--bg-1),var(--bg-0));
    border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,transparent,var(--line-2),transparent)}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:14px;display:flex;justify-content:space-between}

  .gaugewrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  .verdict{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-top:6px}
  .pill{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid}
  .pill.strong{color:var(--gold);border-color:var(--gold)}
  .pill.normal{color:var(--ink-2);border-color:var(--line-2)}
  .feat{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:2px}

  /* layered breakdown */
  .layers{display:flex;flex-direction:column;gap:11px}
  .layer{background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
  .layer .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .layer .ln{font-size:12.5px;font-weight:700;color:var(--ink)}
  .layer .lnum{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .layer .ld{font-family:var(--mono);font-size:12px;color:var(--ink-2);line-height:1.55}
  .bar{height:7px;border-radius:5px;background:var(--bg-3);overflow:hidden;margin-top:9px;position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;display:block}
  .chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
    font-weight:700;padding:2px 8px;border-radius:6px}
  .chip.bull{color:var(--bull);background:rgba(52,227,164,.1)}
  .chip.bear{color:var(--bear);background:rgba(255,93,108,.1)}
  .chip.neu{color:var(--ink-2);background:rgba(159,179,172,.08)}

  .markers{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
  .mk{font-family:var(--mono);font-size:10.5px;padding:4px 8px;border-radius:7px;border:1px solid var(--line-2)}
  .mk.b{color:var(--bull)} .mk.s{color:var(--bear)}

  /* ── screener grid ── */
  .screen{margin-top:6px;overflow-x:auto}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
  th{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;
    color:var(--ink-3);font-weight:700;text-align:center;padding:11px 8px;
    border-bottom:1px solid var(--line-2);white-space:nowrap;position:sticky;top:0;background:var(--bg-1)}
  th.tf,td.tf{text-align:left;padding-left:4px}
  td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:hover td{background:rgba(255,255,255,.014)}
  .tfbadge{font-family:var(--mono);font-weight:800;font-size:14px;letter-spacing:1px}
  .tfsub{font-family:var(--mono);font-size:9px;color:var(--ink-3);display:block}
  .cell{font-family:var(--mono);font-weight:700;font-size:11.5px}
  .cell.bull{color:var(--bull)} .cell.bear{color:var(--bear)}
  .cell.neu{color:var(--ink-3)} .cell.warn{color:var(--warn)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .dot.bull{background:var(--bull);box-shadow:0 0 8px rgba(52,227,164,.6)}
  .dot.bear{background:var(--bear);box-shadow:0 0 8px rgba(255,93,108,.5)}
  .minibar{width:56px;height:6px;border-radius:4px;background:var(--bg-3);display:inline-block;
    position:relative;vertical-align:middle;overflow:hidden}
  .minibar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
  .na{color:var(--ink-3);font-family:var(--mono);font-size:11px;font-style:italic}
  .conf-big{font-family:var(--mono);font-weight:800;font-size:13px}
  .muted{opacity:.4}
  .loading{text-align:center;color:var(--ink-3);font-family:var(--mono);padding:40px;font-size:13px}
  .tier{font-family:var(--mono);font-size:8.5px;color:var(--ink-3);display:block;margin-top:2px;text-transform:uppercase;letter-spacing:1px}

  /* ── chart ── */
  .chartcard{margin-bottom:18px;padding:0;overflow:hidden}
  .charthead{display:flex;align-items:center;gap:14px;padding:14px 18px 10px;flex-wrap:wrap}
  .charthead .t{font-family:var(--mono);font-size:13px;font-weight:800;letter-spacing:1px}
  .tftoggle{display:flex;background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
  .tftoggle button{background:transparent;border:0;color:var(--ink-3);font-family:var(--mono);
    font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;transition:.15s}
  .tftoggle button.on{background:var(--bg-3);color:var(--bull)}
  .legend{display:flex;gap:13px;flex-wrap:wrap;margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-2)}
  .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .ovks{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .ovk{display:flex;align-items:center;gap:6px;background:var(--bg-2);border:1px solid var(--line-2);
    border-radius:8px;padding:6px 10px;cursor:pointer;font-family:var(--mono);font-size:10.5px;
    color:var(--ink-2);user-select:none;transition:.15s}
  .ovk:hover{border-color:var(--line-2);color:var(--ink)}
  .ovk.on{color:var(--ink)}
  .ovk .sw{width:13px;height:13px;border-radius:4px;border:1.5px solid var(--c);display:inline-flex;
    align-items:center;justify-content:center;flex:0 0 auto}
  .ovk.on .sw{background:var(--c)}
  .ovk .sw::after{content:"✓";font-size:9px;color:#07100c;font-weight:900;opacity:0}
  .ovk.on .sw::after{opacity:1}
  .chartbox{position:relative;height:430px;width:100%}
  #lwchart{position:absolute;inset:0}
  .statspanel{position:absolute;left:14px;bottom:14px;z-index:5;background:rgba(8,12,11,.82);
    backdrop-filter:blur(6px);border:1px solid var(--line-2);border-radius:11px;padding:11px 14px;
    font-family:var(--mono);font-size:11px;min-width:215px}
  .statspanel .sr{display:flex;justify-content:space-between;gap:18px;padding:3px 0}
  .statspanel .sr span:first-child{color:var(--ink-3)}
  .statspanel .sr b{font-weight:700}
  .mcdxbox{position:relative;height:150px;width:100%}
  #mcdxchart{position:absolute;inset:0}
  .mcdxlegend{display:flex;gap:14px;margin-left:auto;font-family:var(--mono);font-size:10.5px}
  .mcdxlegend span{display:flex;align-items:center;gap:5px;color:var(--ink-2)}
  .mcdxlegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .mcdxnote{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);padding:6px 18px 12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>BullAlgo</h1>
      <span class="tag">test bench</span>
    </div>
    <div class="ctrl">
      <input id="tk" value="NVDA" maxlength="6" spellcheck="false"/>
      <div class="modes" id="modes">
        <button data-m="SWING" class="on">SWING</button>
        <button data-m="POSITION">POSITION</button>
        <button data-m="INVEST">INVEST</button>
      </div>
    </div>
  </div>

  <div class="disc">⚗️ <span><b>Transparent</b> reproduction of the LuxAlgo Signals &amp; Overlays read — every layer is a standard, auditable indicator. <b>Display-only</b> · not a trade trigger · shadow feature pending out-of-sample validation.</span></div>

  <div id="app"><div class="loading">loading…</div></div>
</div>

<script>
const AUTH = ''; // same-origin; browser carries basic-auth
let MODE = 'SWING';

const sigClass = (s)=>{ const t=(s||'').toLowerCase();
  if(t.includes('bull')) return 'bull'; if(t.includes('bear')) return 'bear'; return 'neu'; };
const bullbear = (s)=> (s==='Bullish'||s==='Strong Bullish') ? 'bull' : (s==='Bearish'||s==='Strong Bearish') ? 'bear' : 'neu';

function gauge(v){ // SVG arc 0..1
  const r=52, cx=64, cy=64, c=Math.PI*r; // semicircle
  const frac=Math.max(0,Math.min(1,v));
  const col = frac>=.6?'var(--bull)':frac<=.4?'var(--bear)':'var(--warn)';
  const dash = c*frac;
  return `<svg width="128" height="84" viewBox="0 0 128 84">
    <path d="M12 70 A52 52 0 0 1 116 70" fill="none" stroke="#18221f" stroke-width="11" stroke-linecap="round"/>
    <path d="M12 70 A52 52 0 0 1 116 70" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"
       stroke-dasharray="${dash} 999" style="transition:stroke-dasharray .6s ease"/>
    <text x="64" y="60" text-anchor="middle" fill="${col}" font-family="var(--mono)" font-size="22" font-weight="800">${frac.toFixed(2)}</text>
    <text x="64" y="76" text-anchor="middle" fill="var(--ink-3)" font-family="var(--mono)" font-size="9" letter-spacing="1">CONF</text>
  </svg>`;
}

function confirmationCard(c, meta){
  if(!c) return `<div class="card"><div class="lbl"><span>Confirmation</span></div>
     <div class="na">— ${meta&&meta.error?('unavailable: '+meta.error):'no data'} —</div></div>`;
  const sc = sigClass(c.signal_label);
  const vcol = sc==='bull'?'var(--bull)':sc==='bear'?'var(--bear)':'var(--ink-2)';
  const strengthPill = c.strength ? `<span class="pill ${c.strength}">${c.strength}</span>` : '';
  return `<div class="card">
    <div class="lbl"><span>Confirmation · ${meta.tf||''}</span><span>${(meta.tier||'').toUpperCase()}</span></div>
    <div class="gaugewrap">
      ${gauge(c.conf_feature)}
      <div class="verdict" style="color:${vcol}">${c.signal_label}</div>
      ${strengthPill}
      <div class="feat">trend: ${c.trend} · RSI ${c.rsi}</div>
    </div>
  </div>`;
}

function layersCard(c){
  if(!c) return '';
  const emaUp = c.ema_fast>c.ema_slow, slopeUp=c.slope>0;
  const trendChip = (emaUp&&slopeUp)?'<span class="chip bull">▲ UP</span>':(!emaUp&&!slopeUp)?'<span class="chip bear">▼ DOWN</span>':'<span class="chip neu">— FLAT</span>';
  const rsiPos = Math.max(0,Math.min(100,c.rsi));
  const trigFired = c.signal!==0;
  const trigChip = c.signal>0?'<span class="chip bull">LONG TRIGGER</span>':c.signal<0?'<span class="chip bear">SHORT TRIGGER</span>':'<span class="chip neu">no trigger</span>';
  const aligned = c.close>c.ema_slow;
  const exitTxt = c.exit_long?'<span class="chip bear">↘ momentum fading (exit-long hint)</span>':c.exit_short?'<span class="chip bull">↗ momentum turning (exit-short hint)</span>':'<span class="chip neu">no exit signal</span>';
  return `<div class="card">
    <div class="lbl"><span>Layered breakdown</span><span>non-repainting</span></div>
    <div class="layers">
      <div class="layer">
        <div class="lh"><span class="ln">Layer 1 · Trend Filter</span><span class="lnum">EMA20 / EMA50 + slope</span></div>
        <div class="ld">EMA20 <b>${c.ema_fast}</b> ${emaUp?'&gt;':'&lt;'} EMA50 <b>${c.ema_slow}</b> · slope ${c.slope>=0?'+':''}${c.slope} &nbsp; ${trendChip}</div>
      </div>
      <div class="layer">
        <div class="lh"><span class="ln">Layer 2 · Adaptive Trigger</span><span class="lnum">vol-adaptive RSI</span></div>
        <div class="ld">RSI <b>${c.rsi}</b> vs long-thr <b>${c.rsi_thr_long}</b> / short-thr <b>${c.rsi_thr_short}</b> &nbsp; ${trigChip}</div>
        <div class="bar"><i style="width:${rsiPos}%;background:${rsiPos>55?'var(--bull)':rsiPos<45?'var(--bear)':'var(--warn)'}"></i></div>
      </div>
      <div class="layer">
        <div class="lh"><span class="ln">Layer 3 · Alignment</span><span class="lnum">price vs EMA50</span></div>
        <div class="ld">close <b>${c.close}</b> ${aligned?'above':'below'} EMA50 → ${aligned?'<span class="chip bull">strong zone</span>':'<span class="chip neu">pullback zone</span>'}</div>
      </div>
      <div class="layer">
        <div class="lh"><span class="ln">Exit Monitor</span><span class="lnum">RSI ↔ 50 midline</span></div>
        <div class="ld">${exitTxt}</div>
      </div>
      ${c.recent&&c.recent.length?`<div class="layer">
        <div class="lh"><span class="ln">Recent fired signals</span><span class="lnum">last ${c.recent.length}</span></div>
        <div class="markers">${c.recent.map(m=>`<span class="mk ${m.signal>0?'b':'s'}">${m.signal>0?'▲':'▼'} ${m.date} @ ${m.price}${m.strength==='strong'?' ★':''}</span>`).join('')}</div>
      </div>`:''}
    </div>
  </div>`;
}

function gridCell(label, score){ // directional verdict cell
  const bb = bullbear(label);
  if(label==='—'||label==null) return '<span class="na">—</span>';
  const dot = (bb==='bull'||bb==='bear')?`<span class="dot ${bb}"></span>`:'';
  return `<span class="cell ${bb}">${dot}${label}</span>`;
}
function miniBar(v, col){ const p=Math.round(Math.max(0,Math.min(1,v))*100);
  return `<span class="minibar"><i style="width:${p}%;background:${col}"></i></span>`; }

function screenerCard(rows){
  const head = ['TF','Signal','Smart Trail','Reversal Zone','Catcher','Tracer','NeoCloud','Trend Str','Volatility','Squeeze','Vol Sent','Confluence'];
  const body = rows.map(r=>{
    if(!r.available) return `<tr class="muted"><td class="tf"><span class="tfbadge">${r.timeframe}</span></td>
      <td colspan="11"><span class="na">— ${r.tier?('no '+r.tier+' bars'):'unavailable'} —</span></td></tr>`;
    const volCol = r.volatility==='High'?'cell bear':r.volatility==='Low'?'cell bull':'cell warn';
    const cf = r.confluence;
    const cfCol = cf>=.6?'var(--bull)':cf<=.4?'var(--bear)':'var(--warn)';
    return `<tr>
      <td class="tf"><span class="tfbadge">${r.timeframe}</span><span class="tfsub">${(r.tier||'').toUpperCase()}</span></td>
      <td>${gridCell(r.signal)}${r.strength==='strong'?' <span style="color:var(--gold)">★</span>':''}</td>
      <td>${gridCell(r.smart_trail)}</td>
      <td><span class="cell ${r.reversal_zone==='Near support'?'bull':r.reversal_zone==='Near resistance'?'bear':'neu'}">${r.reversal_zone}</span></td>
      <td>${gridCell(r.catcher)}</td>
      <td>${gridCell(r.tracer)}</td>
      <td>${gridCell(r.neo_cloud)}</td>
      <td><span class="cell">${r.trend_strength}</span><br>${miniBar(r.trend_strength/100,'var(--neo)')}</td>
      <td><span class="${volCol}">${r.volatility}</span></td>
      <td><span class="cell warn">${r.squeeze}%</span><br>${miniBar(r.squeeze/100,'var(--gold)')}</td>
      <td><span class="cell ${r.volume_sentiment>=0?'bull':'bear'}">${r.volume_sentiment>0?'+':''}${r.volume_sentiment}</span></td>
      <td><span class="conf-big" style="color:${cfCol}">${cf.toFixed(2)}</span><br>${miniBar(cf,cfCol)}</td>
    </tr>`;
  }).join('');
  return `<div class="card screen">
    <div class="lbl"><span>Signals &amp; Overlays · multi-timeframe screener</span><span>4H → 1M</span></div>
    <table><thead><tr>${head.map((h,i)=>`<th class="${i===0?'tf':''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table>
  </div>`;
}

function pacCard(rows){
  const head = ['TF','Structure','Order Block','Buy OB Vol','Sell OB Vol','FVG','Premium/Discount','Liquidity Grab','Equal H/L','SMC Confluence'];
  const body = rows.map(r=>{
    if(!r.available) return `<tr class="muted"><td class="tf"><span class="tfbadge">${r.timeframe}</span></td>
      <td colspan="9"><span class="na">— ${r.tier?('no '+r.tier+' bars'):'unavailable'} —</span></td></tr>`;
    const ss=r.structure_score!=null?r.structure_score:0.5;
    const structCol = ss>0.55?'cell bull':ss<0.45?'cell bear':'cell neu';
    const pdCol = r.pd_zone==='Discount'?'cell bull':r.pd_zone==='Premium'?'cell bear':'cell neu';
    const obCol = r.order_block==='Within'?'cell warn':'cell neu';
    const fvgCol = r.fvg==='Within'?'cell warn':'cell neu';
    const eqCol = r.eqhl==='—'?'cell neu':'cell warn';
    const cf=r.smc_confluence, cfCol=cf>=.6?'var(--bull)':cf<=.4?'var(--bear)':'var(--warn)';
    return `<tr>
      <td class="tf"><span class="tfbadge">${r.timeframe}</span><span class="tfsub">${(r.tier||'').toUpperCase()}</span></td>
      <td><span class="${structCol}">${r.structure}</span></td>
      <td><span class="${obCol}">${r.order_block}</span><br>${miniBar(r.ob_buy_score,r.ob_buy_score>=.5?'var(--bull)':'var(--bear)')}</td>
      <td><span class="cell bull">${r.buy_ob_vol}</span></td>
      <td><span class="cell bear">${r.sell_ob_vol}</span></td>
      <td><span class="${fvgCol}">${r.fvg}</span></td>
      <td><span class="${pdCol}">${r.pd_zone}</span></td>
      <td>${gridCell(r.liquidity_grab)}</td>
      <td><span class="${eqCol}">${r.eqhl}</span></td>
      <td><span class="conf-big" style="color:${cfCol}">${cf.toFixed(2)}</span><br>${miniBar(cf,cfCol)}</td>
    </tr>`;
  }).join('');
  return `<div class="card screen" style="margin-top:18px">
    <div class="lbl"><span>Price Action Concepts (SMC) · multi-timeframe screener</span><span>swings → structure → OB → FVG → P/D → liquidity</span></div>
    <table><thead><tr>${head.map((h,i)=>`<th class="${i===0?'tf':''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table>
  </div>`;
}

// ── chart ──
let CHART_TF = 'SWING_4H';
let _chart=null, _series={}, _bands={};

// custom primitive: fill the polygon between each band's top & bot edges (true cloud)
function bandPrimitive(points, fill){
  let _series=null, _chart=null, _req=null, _visible=true;
  const renderer = {
    draw(target){
      if(!_visible || !points || !points.length) return;
      target.useBitmapCoordinateSpace(scope=>{
        const ctx=scope.context, ts=_chart.timeScale();
        const pr=scope.horizontalPixelRatio, vr=scope.verticalPixelRatio;
        ctx.fillStyle=fill; ctx.beginPath();
        let started=false;
        for(const p of points){ const x=ts.timeToCoordinate(p.time), y=_series.priceToCoordinate(p.top);
          if(x==null||y==null) continue; if(!started){ctx.moveTo(x*pr,y*vr);started=true;} else ctx.lineTo(x*pr,y*vr); }
        for(let i=points.length-1;i>=0;i--){ const p=points[i], x=ts.timeToCoordinate(p.time), y=_series.priceToCoordinate(p.bot);
          if(x==null||y==null) continue; ctx.lineTo(x*pr,y*vr); }
        ctx.closePath(); ctx.fill();
      });
    }
  };
  const view = { renderer(){ return renderer; } };
  return {
    attached(p){ _series=p.series; _chart=p.chart; _req=p.requestUpdate; },
    updateAllViews(){}, paneViews(){ return [view]; },
    setVisible(v){ _visible=v; if(_req) _req(); },
  };
}

// ONE continuous line that changes color at the flip (per-segment stroke)
function dirLinePrimitive(points, upColor, dnColor, width){
  let _series=null, _chart=null, _req=null, _visible=true; width=width||2;
  const renderer = {
    draw(target){
      if(!_visible || !points || points.length<2) return;
      target.useBitmapCoordinateSpace(scope=>{
        const ctx=scope.context, ts=_chart.timeScale();
        const pr=scope.horizontalPixelRatio, vr=scope.verticalPixelRatio;
        ctx.lineJoin='round'; ctx.lineCap='round'; ctx.lineWidth=width*vr;
        for(let i=1;i<points.length;i++){
          const a=points[i-1], b=points[i];
          if(a.value==null||b.value==null) continue;
          const x1=ts.timeToCoordinate(a.time), y1=_series.priceToCoordinate(a.value);
          const x2=ts.timeToCoordinate(b.time), y2=_series.priceToCoordinate(b.value);
          if(x1==null||x2==null||y1==null||y2==null) continue;
          ctx.strokeStyle=b.up?upColor:dnColor;
          ctx.beginPath(); ctx.moveTo(x1*pr,y1*vr); ctx.lineTo(x2*pr,y2*vr); ctx.stroke();
        }
      });
    }
  };
  const view = { renderer(){ return renderer; } };
  return {
    attached(p){ _series=p.series; _chart=p.chart; _req=p.requestUpdate; },
    updateAllViews(){}, paneViews(){ return [view]; },
    setVisible(v){ _visible=v; if(_req) _req(); },
  };
}

// direction-colored filled ribbon: fills each contiguous same-`up` run with up/dn color
function dirBandPrimitive(points, upColor, dnColor){
  let _series=null, _chart=null, _req=null, _visible=true;
  const renderer = {
    draw(target){
      if(!_visible || !points || !points.length) return;
      target.useBitmapCoordinateSpace(scope=>{
        const ctx=scope.context, ts=_chart.timeScale();
        const pr=scope.horizontalPixelRatio, vr=scope.verticalPixelRatio;
        let i=0;
        while(i<points.length){
          const up=points[i].up; let j=i; const run=[];
          while(j<points.length && points[j].up===up){ run.push(points[j]); j++; }
          if(run.length>=2){
            ctx.fillStyle=up?upColor:dnColor; ctx.beginPath(); let started=false;
            for(const p of run){ const x=ts.timeToCoordinate(p.time), y=_series.priceToCoordinate(p.top);
              if(x==null||y==null) continue; if(!started){ctx.moveTo(x*pr,y*vr);started=true;} else ctx.lineTo(x*pr,y*vr); }
            for(let k=run.length-1;k>=0;k--){ const p=run[k], x=ts.timeToCoordinate(p.time), y=_series.priceToCoordinate(p.bot);
              if(x==null||y==null) continue; ctx.lineTo(x*pr,y*vr); }
            ctx.closePath(); ctx.fill();
          }
          i=j;
        }
      });
    }
  };
  const view = { renderer(){ return renderer; } };
  return {
    attached(p){ _series=p.series; _chart=p.chart; _req=p.requestUpdate; },
    updateAllViews(){}, paneViews(){ return [view]; },
    setVisible(v){ _visible=v; if(_req) _req(); },
  };
}
const TF_LABELS = {'SWING_1H':'1H','SWING_4H':'4H','SWING':'1D','POSITION':'1W','INVESTMENT':'1M'};
// overlay toggle state — defaults match the LuxAlgo Inputs panel
const OVERLAYS = [
  {key:'trail',   label:'Smart Trail',   color:'#3b82f6'},
  {key:'catcher', label:'Trend Catcher', color:'#34e3a4'},
  {key:'tracer',  label:'Trend Tracer',  color:'#e8a04b'},
  {key:'neo',     label:'Neo Cloud',     color:'#2dd4bf'},
  {key:'rz',      label:'Reversal Zones', color:'#ff5d6c'},
];
const OVERLAY_ON = {trail:false, catcher:true, tracer:true, neo:false, rz:true};

let CHART_VIEW = 'signals';   // 'signals' | 'pac'

function chartCard(){
  return `<div class="card chartcard">
    <div class="charthead">
      <div class="tftoggle" id="viewtog">
        <button data-v="signals" class="${CHART_VIEW==='signals'?'on':''}">Signals &amp; Overlays</button>
        <button data-v="pac" class="${CHART_VIEW==='pac'?'on':''}">Price Action</button>
      </div>
      <div class="tftoggle" id="tftog">
        ${Object.entries(TF_LABELS).map(([m,l])=>`<button data-tf="${m}" class="${m===CHART_TF?'on':''}">${l}</button>`).join('')}
      </div>
      <div class="ovks" id="ovks" style="${CHART_VIEW==='pac'?'display:none':''}">
        ${OVERLAYS.map(o=>`<div class="ovk ${OVERLAY_ON[o.key]?'on':''}" data-k="${o.key}" style="--c:${o.color}"><span class="sw"></span>${o.label}</div>`).join('')}
      </div>
    </div>
    <div class="chartbox"><div id="lwchart"></div><div class="statspanel" id="stats"></div></div>
  </div>`;
}

// filled rectangle order-block zones (extend right) + volume label
function boxPrimitive(boxes){
  let _s=null,_c=null,_req=null,_vis=true;
  const renderer={ draw(target){
    if(!_vis||!boxes||!boxes.length) return;
    target.useBitmapCoordinateSpace(scope=>{
      const ctx=scope.context, ts=_c.timeScale(), pr=scope.horizontalPixelRatio, vr=scope.verticalPixelRatio;
      for(const b of boxes){
        const x1=ts.timeToCoordinate(b.time), x2=ts.timeToCoordinate(b.time_right);
        const y1=_s.priceToCoordinate(b.top), y2=_s.priceToCoordinate(b.bot);
        if(x1==null||x2==null||y1==null||y2==null) continue;
        const bull=b.kind==='bull';
        const X=x1*pr, Y=Math.min(y1,y2)*vr, W=(x2-x1)*pr, H=Math.abs(y2-y1)*vr;
        ctx.fillStyle=bull?'rgba(52,227,164,0.15)':'rgba(255,93,108,0.15)';
        ctx.fillRect(X,Y,W,H);
        ctx.strokeStyle=bull?'rgba(52,227,164,0.55)':'rgba(255,93,108,0.55)';
        ctx.lineWidth=1*vr; ctx.strokeRect(X,Y,W,H);
        ctx.fillStyle=bull?'rgba(140,240,200,0.95)':'rgba(255,160,170,0.95)';
        ctx.font=`${9.5*vr}px monospace`; ctx.textBaseline='middle'; ctx.textAlign='left';
        ctx.fillText(b.vol_label, X+5*pr, Y+H/2);   // label at box's left edge → spreads across time
      }
    });
  }};
  const view={renderer(){return renderer;}};
  return {attached(p){_s=p.series;_c=p.chart;_req=p.requestUpdate;}, updateAllViews(){}, paneViews(){return [view];}, setVisible(v){_vis=v;if(_req)_req();}};
}

function applyOverlayVis(){
  const sv=(p,on)=>{ if(p) p.setVisible(on); };
  sv(_bands.catcher, OVERLAY_ON.catcher);
  sv(_bands.tracer, OVERLAY_ON.tracer);
  sv(_bands.trail, OVERLAY_ON.trail);
  sv(_bands.neo, OVERLAY_ON.neo);
  sv(_bands.res, OVERLAY_ON.rz);
  sv(_bands.sup, OVERLAY_ON.rz);
}

function syncCharts(){
  if(!_chart||!_mcdxChart) return;
  const a=_chart.timeScale(), b=_mcdxChart.timeScale();
  let lock=false;
  a.subscribeVisibleLogicalRangeChange(r=>{ if(lock||!r) return; lock=true; try{ b.setVisibleLogicalRange(r); }catch(e){} lock=false; });
  b.subscribeVisibleLogicalRangeChange(r=>{ if(lock||!r) return; lock=true; try{ a.setVisibleLogicalRange(r); }catch(e){} lock=false; });
}

function _newChart(){
  const box=document.getElementById('lwchart');
  if(!box||!window.LightweightCharts) return null;
  if(_chart){ try{ _chart.remove(); }catch(e){} _chart=null; }
  box.innerHTML=''; _series={}; _bands={};
  _chart=LightweightCharts.createChart(box,{
    layout:{background:{type:'solid',color:'transparent'},textColor:'#9fb3ac',fontFamily:"'SF Mono',monospace"},
    grid:{vertLines:{color:'rgba(30,43,39,.5)'},horzLines:{color:'rgba(30,43,39,.5)'}},
    rightPriceScale:{borderColor:'#1e2b27',minimumWidth:64},timeScale:{borderColor:'#1e2b27',timeVisible:CHART_TF==='SWING_4H'},
    crosshair:{mode:0},
  });
  return box;
}

async function renderChart(){
  if(!_newChart()) return;
  if(CHART_VIEW==='pac') return renderPac();
  return renderSignals();
}

async function renderSignals(){
  const tk = document.getElementById('tk').value.trim().toUpperCase()||'NVDA';
  const stats=document.getElementById('stats'); stats.innerHTML='<div class="sr"><span>loading…</span></div>';
  try{
    const r = await (await fetch(`/api/bullalgo/${tk}/chart?tf=${CHART_TF}`,{credentials:'same-origin'})).json();
    if(!r.available){ stats.innerHTML=`<div class="sr"><span>— ${r.message||('no '+(r.tier||'')+' bars')} —</span></div>`; return; }
    const candle=_chart.addCandlestickSeries({upColor:'#26a37a',downColor:'#d9485a',
      borderUpColor:'#34e3a4',borderDownColor:'#ff5d6c',wickUpColor:'#34e3a4',wickDownColor:'#ff5d6c'});
    candle.setData(r.bars);
    // Trend Catcher = fast supertrend, ONE line green↔red on flip
    _bands.catcher = dirLinePrimitive(r.catcher,'#34e3a4','#ff5d6c',2); candle.attachPrimitive(_bands.catcher);
    // Trend Tracer = slower supertrend, ONE line green↔orange on flip
    _bands.tracer = dirLinePrimitive(r.tracer,'#34e3a4','#e8a04b',2); candle.attachPrimitive(_bands.tracer);
    // Smart Trail = filled ribbon, blue(bull)/red(bear)
    _bands.trail = dirBandPrimitive(r.smart_trail, 'rgba(59,130,246,0.30)', 'rgba(255,93,108,0.26)'); candle.attachPrimitive(_bands.trail);
    // Neo Cloud = slower filled band, teal(bull)/maroon(bear)
    _bands.neo = dirBandPrimitive(r.neo_band, 'rgba(45,212,191,0.20)', 'rgba(150,40,60,0.34)'); candle.attachPrimitive(_bands.neo);
    // Reversal Zones = static resistance(red)/support(green) clouds
    _bands.res = bandPrimitive(r.rz_res, 'rgba(255,93,108,0.16)'); candle.attachPrimitive(_bands.res);
    _bands.sup = bandPrimitive(r.rz_sup, 'rgba(52,227,164,0.16)'); candle.attachPrimitive(_bands.sup);
    _series.candle = candle;
    applyOverlayVis();
    if(r.markers&&r.markers.length) candle.setMarkers(r.markers);
    _chart.timeScale().fitContent();
    // stats panel
    const st=r.stats||{};
    const tsCol=st.trend_label==='Trending'?'var(--bull)':'var(--warn)';
    const vCol=st.volatility==='High'?'var(--bear)':st.volatility==='Low'?'var(--bull)':'var(--warn)';
    stats.innerHTML=`
      <div class="sr"><span>⚙ Trend Strength</span><b style="color:${tsCol}">${st.trend_label} (${st.trend_strength}%)</b></div>
      <div class="sr"><span>⚠ Volatility</span><b style="color:${vCol}">${st.volatility}</b></div>
      <div class="sr"><span>◇ Squeeze</span><b style="color:var(--gold)">${st.squeeze}%</b></div>
      <div class="sr"><span>≈ Volume Sentiment</span><b style="color:${st.volume_sentiment>=0?'var(--bull)':'var(--bear)'}">${st.volume_sentiment>0?'+':''}${st.volume_sentiment}%</b></div>
      <div class="sr"><span>· Timeframe</span><b style="color:var(--ink-2)">${r.tf} · ${(r.tier||'').toUpperCase()}</b></div>`;
  }catch(e){ stats.innerHTML=`<div class="sr"><span>⚠️ ${e}</span></div>`; }
}

async function renderPac(){
  const tk = document.getElementById('tk').value.trim().toUpperCase()||'NVDA';
  const stats=document.getElementById('stats'); stats.innerHTML='<div class="sr"><span>loading…</span></div>';
  try{
    const r = await (await fetch(`/api/bullalgo/${tk}/pac-chart?tf=${CHART_TF}`,{credentials:'same-origin'})).json();
    if(!r.available){ stats.innerHTML=`<div class="sr"><span>— ${r.message||('no '+(r.tier||'')+' bars')} —</span></div>`; return; }
    const candle=_chart.addCandlestickSeries({upColor:'#26a37a',downColor:'#d9485a',
      borderUpColor:'#34e3a4',borderDownColor:'#ff5d6c',wickUpColor:'#34e3a4',wickDownColor:'#ff5d6c'});
    candle.setData(r.bars);
    // premium / discount / equilibrium zones (faint horizontal bands)
    const z=r.zones||{};
    if(z.high!=null){
      const span=(top,bot)=>[{time:z.t_left,top,bot},{time:z.t_right,top,bot}];
      _bands.prem=bandPrimitive(span(z.high,z.eq),'rgba(255,93,108,0.07)'); candle.attachPrimitive(_bands.prem);
      _bands.disc=bandPrimitive(span(z.eq,z.low),'rgba(52,227,164,0.07)'); candle.attachPrimitive(_bands.disc);
      candle.createPriceLine({price:z.eq,color:'rgba(159,179,172,.5)',lineWidth:1,lineStyle:2,title:'Equilibrium'});
      candle.createPriceLine({price:z.high,color:'rgba(255,93,108,.4)',lineWidth:1,lineStyle:0,title:'Premium'});
      candle.createPriceLine({price:z.low,color:'rgba(52,227,164,.4)',lineWidth:1,lineStyle:0,title:'Discount'});
    }
    // order-block boxes
    _bands.obs=boxPrimitive(r.order_blocks||[]); candle.attachPrimitive(_bands.obs);
    // structure labels HH/HL/LH/LL
    if(r.markers&&r.markers.length) candle.setMarkers(r.markers);
    _series.candle=candle;
    _chart.timeScale().fitContent();
    const nb=(r.order_blocks||[]).filter(o=>o.kind==='bull').length, ns=(r.order_blocks||[]).length-nb;
    stats.innerHTML=`
      <div class="sr"><span>▦ Order Blocks</span><b style="color:var(--ink)">${(r.order_blocks||[]).length}</b></div>
      <div class="sr"><span>· bullish</span><b style="color:var(--bull)">${nb}</b></div>
      <div class="sr"><span>· bearish</span><b style="color:var(--bear)">${ns}</b></div>
      <div class="sr"><span>⬍ Equilibrium</span><b style="color:var(--ink-2)">${z.eq}</b></div>
      <div class="sr"><span>· Timeframe</span><b style="color:var(--ink-2)">${r.tf} · ${(r.tier||'').toUpperCase()}</b></div>`;
  }catch(e){ stats.innerHTML=`<div class="sr"><span>⚠️ ${e}</span></div>`; }
}

let _mcdxChart=null;
function mcdxCard(){
  return `<div class="card chartcard">
    <div class="charthead">
      <span class="t">🏦 MCDX · Money Flow</span>
      <div class="mcdxlegend">
        <span><i style="background:#16c784"></i>Accumulation</span>
        <span><i style="background:#e8c170"></i>Neutral</span>
        <span><i style="background:#ff5d6c"></i>Distribution</span>
        <span><i style="background:#5b9bd5"></i>Banker line</span>
      </div>
    </div>
    <div class="mcdxbox"><div id="mcdxchart"></div></div>
    <div class="mcdxnote">⚠️ Interpretive only — MCDX "banker/smart money" labels are momentum math (stochastic RSV smoothed at 3 speeds), NOT real order flow.</div>
  </div>`;
}
async function renderMcdx(){
  const tk=document.getElementById('tk').value.trim().toUpperCase()||'NVDA';
  const box=document.getElementById('mcdxchart'); if(!box||!window.LightweightCharts) return;
  if(_mcdxChart){ try{ _mcdxChart.remove(); }catch(e){} _mcdxChart=null; }
  box.innerHTML='';
  _mcdxChart=LightweightCharts.createChart(box,{
    layout:{background:{type:'solid',color:'transparent'},textColor:'#9fb3ac',fontFamily:"'SF Mono',monospace"},
    grid:{vertLines:{color:'rgba(30,43,39,.35)'},horzLines:{color:'rgba(30,43,39,.35)'}},
    rightPriceScale:{borderColor:'#1e2b27',minimumWidth:64},timeScale:{borderColor:'#1e2b27',timeVisible:CHART_TF==='SWING_4H'||CHART_TF==='SWING_1H'},
    crosshair:{mode:0},
  });
  try{
    const r=await(await fetch(`/api/bullalgo/${tk}/mcdx?tf=${CHART_TF}`,{credentials:'same-origin'})).json();
    if(!r.available) return;
    // per-bar colored money-flow histogram (green accum / yellow neutral / red distribution)
    const hist=_mcdxChart.addHistogramSeries({priceLineVisible:false,lastValueVisible:false});
    hist.setData(r.hist);   // each point carries its own color
    // blue banker line
    const bl=_mcdxChart.addLineSeries({color:'#5b9bd5',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    bl.setData(r.banker_line);
    _mcdxChart.timeScale().fitContent();
    syncCharts();   // link pan/zoom to the main chart above
  }catch(e){}
}

async function load(){
  const tk = document.getElementById('tk').value.trim().toUpperCase()||'NVDA';
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">computing '+tk+' · '+MODE+' …</div>';
  try{
    const res = await fetch(`/api/bullalgo/${tk}?mode=${MODE}`, {credentials:'same-origin'});
    const d = await res.json();
    if(d.message){ app.innerHTML = `<div class="loading">⚠️ ${d.message}</div>`; return; }
    app.innerHTML = `
      ${chartCard()}
      ${mcdxCard()}
      <div class="grid-top">
        ${confirmationCard(d.confirmation, d.confirmation_meta||{})}
        ${layersCard(d.confirmation)}
      </div>
      ${screenerCard(d.screener||[])}
      ${pacCard(d.pac||[])}`;
    document.getElementById('viewtog').addEventListener('click',e=>{
      if(e.target.tagName!=='BUTTON') return;
      [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
      e.target.classList.add('on'); CHART_VIEW=e.target.dataset.v;
      document.getElementById('ovks').style.display = CHART_VIEW==='pac'?'none':'flex';
      renderChart().then(renderMcdx);   // re-render both so time-scale sync re-binds
    });
    document.getElementById('tftog').addEventListener('click',e=>{
      if(e.target.tagName!=='BUTTON') return;
      [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
      e.target.classList.add('on'); CHART_TF=e.target.dataset.tf; renderChart(); renderMcdx();
    });
    document.getElementById('ovks').addEventListener('click',e=>{
      const k=e.target.closest('.ovk'); if(!k) return;
      const key=k.dataset.k; OVERLAY_ON[key]=!OVERLAY_ON[key];
      k.classList.toggle('on',OVERLAY_ON[key]); applyOverlayVis();
    });
    renderChart();
    renderMcdx();
  }catch(e){ app.innerHTML = `<div class="loading">⚠️ ${e}</div>`; }
}

document.getElementById('tk').addEventListener('keydown',e=>{ if(e.key==='Enter') load(); });
document.getElementById('modes').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on'); MODE=e.target.dataset.m; load();
});
load();
</script>
