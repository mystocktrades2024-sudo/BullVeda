/* ─── REUSABLE ATOMS ─── */
const Mono = ({children, size=11, color=C.muted, weight="400", style={}}) => (
  <span style={{fontFamily:"'Space Mono',monospace",fontSize:size,color,fontWeight:weight,letterSpacing:"0.5px",...style}}>{children}</span>
);
const Tag = ({children, color=C.gold}) => (
  <span style={{
    fontFamily:"'Space Mono',monospace",fontSize:8,fontWeight:700,letterSpacing:"1.5px",
    padding:"2px 7px",borderRadius:3,background:color+"18",border:`1px solid ${color}40`,color,

);

  <div style={{
    display:"inline-flex",alignItems:"center",gap:5,
    background:color+"12",border:`1px solid ${color}30`,
    borderRadius:20,padding:"3px 10px",

    <div style={{width:5,height:5,borderRadius:"50%",background:color,animation:"pulse 2s infinite"}}/>
    <Mono size={8} color={color} weight="700" style={{letterSpacing:2}}>{label}</Mono>

);
const Panel = ({children,style={}}) => (
  <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,...style}}>{children}</div>
);
const PanelHead = ({label, right, accent=C.gold}) => (
  <div style={{padding:"12px 16px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
    <Mono size={9} color={accent} weight="700" style={{letterSpacing:2}}>{label}</Mono>

  <div style={{
    position:"absolute",inset:0,borderRadius:12,zIndex:10,
    background:"rgba(8,10,16,0.82)",backdropFilter:"blur(3px)",
    display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,

    {Array.from({length:max}).map((_,i)=>(
      <div key={i} style={{width:6,height:6,borderRadius:"50%",background:i<val?color:C.dim}}/>

/* ═══════════════════════════════════════════════

function Tier1() {
  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 280px",gap:14,padding:20}}>

                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <Mono size={8} color={C.muted}>CONF</Mono>
                  <ConfDots val={s.conf} color={C.green}/>
                </div>
              </div>
            </div>
          ))}
        </div>
      </Panel>

      {/* Sector heatmap */}
      <Panel>
        <PanelHead label="SECTOR ROTATION" accent={C.green}/>
        <div style={{padding:12,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4}}>
          {sectors.map((s,i)=>{
            const v = parseFloat(s.val);
            const bg = v > 1.2 ? C.green+"25" : v > 0 ? C.green+"10" : v > -0.5 ? C.red+"10" : C.red+"20";
            const cl = v > 0 ? C.green : C.red;
            return (
              <div key={i} style={{background:bg,borderRadius:6,padding:"8px 6px",textAlign:"center",border:`1px solid ${cl}20`}}>
                <div style={{fontSize:9,fontFamily:"'Space Mono',monospace",color:cl,fontWeight:700,marginBottom:2}}>{s.val}%</div>
                <div style={{fontSize:8,fontFamily:"'DM Sans',sans-serif",color:C.muted}}>{s.name}</div>
              </div>
            );
          })}
        </div>
      </Panel>

      {/* Basic options flow (limited) */}

        <PanelHead label="OPTIONS FLOW — BASIC" accent={C.green}

              </div>
              <Mono size={10} color={f.bullish?C.green:C.red} weight="700">{f.size}</Mono>

          ))}
          <div style={{position:"relative",borderRadius:8,overflow:"hidden"}}>
            <div style={{opacity:0.2,padding:"8px 10px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`}}>

            </div>
            <Lock tier={2}/>
          </div>
        </div>
      </Panel>

      {/* Right col */}
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Panel>
          <PanelHead label="WATCHLIST" accent={C.green}
            right={<Mono size={9} color={C.muted}>8/10 used</Mono>}/>

              {t:"AAPL",p:"$213",c:"+1.7%"},
              {t:"AMD", p:"$162",c:"+1.1%"},

                <Mono size={11} color={C.text} weight="700">{w.t}</Mono>
                <div style={{display:"flex",gap:10}}>
                  <Mono size={10} color={C.muted}>{w.p}</Mono>
                  <Mono size={10} color={C.green} weight="700">{w.c}</Mono>
                </div>
              </div>
            ))}
          </div>
        </Panel>
        <Panel style={{position:"relative",overflow:"hidden",minHeight:80}}>
          <PanelHead label="COMPOSITE SCORE" accent={C.dim}/>
          <div style={{padding:12,opacity:0.15,display:"flex",gap:4}}>
            {pillars.map((p,i)=><div key={i} style={{flex:1,height:30,background:C.gold,borderRadius:2}}/>)}

          <Lock tier={2}/>

      </div>
