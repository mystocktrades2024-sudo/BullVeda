                  fontFamily: "'Space Mono', monospace",
                  letterSpacing: "2px",
                  color: "#3d4455",
                }}>
                  {section.category.toUpperCase()}
                </span>
              </div>
              {section.rows.map((row, ri) => (
                <div key={ri} style={{
                  display: "grid",
                  gridTemplateColumns: "240px repeat(5, 1fr)",
                  borderTop: "1px solid #11141d",
                  padding: "0 28px",
                }}>
                  <div style={{
                    padding: "11px 0",
                    fontSize: "12px",
                    color: "#6b7280",
                    fontFamily: "'DM Sans', sans-serif",
                  }}>
                    {row.feature}
                  </div>
                  {row.tiers.map((val, ti) => {
                    const accent = tiers[ti].accent;
                    return (
                      <div key={ti} style={{
                        display: "flex",
                        justifyContent: "center",
                        alignItems: "center",
                        padding: "11px 0",
                        background: ti === 2 ? "rgba(214,158,46,0.03)" : "transparent",
                      }}>
                        {typeof val === "string" ? (
                          <span style={{
                            fontSize: "10px",
                            fontFamily: "'Space Mono', monospace",
                            color: accent,
                            fontWeight: "700",
                          }}>{val}</span>
                        ) : val ? (
                          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                            <circle cx="7" cy="7" r="7" fill={accent} fillOpacity="0.15"/>
                            <path d="M4 7l2 2 4-4" stroke={accent} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                          </svg>
                        ) : (
                          <div style={{ width: "14px", height: "1px", background: "#1a1f2e" }} />
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          ))}
        </div>

        {/* Trust bar */}
        <div style={{
          display: "flex",
          justifyContent: "center",
          gap: "40px",
          flexWrap: "wrap",
          padding: "32px 0",
          borderTop: "1px solid #12161f",
          animation: "fadeSlideUp 0.5s ease both",
          animationDelay: "500ms",
        }}>
          {[
            { label: "VERIFIED TRADERS", value: "14,200+" },
            { label: "AVG CALIBRATION SCORE", value: "0.71" },
            { label: "SIGNALS PROCESSED TODAY", value: "2.4M" },
            { label: "LEADERBOARD COUNTRIES", value: "38" },
          ].map((stat, i) => (
            <div key={i} style={{ textAlign: "center" }}>
              <div style={{
                fontSize: "22px",
                fontWeight: "800",
                fontFamily: "'Space Mono', monospace",
                color: "#d69e2e",
                letterSpacing: "-1px",
              }}>
                {stat.value}
              </div>
              <div style={{
                fontSize: "9px",
                fontFamily: "'Space Mono', monospace",
                letterSpacing: "2px",
                color: "#3d4455",
                marginTop: "4px",
              }}>
                {stat.label}
              </div>
            </div>
          ))}
        </div>

        {/* Bottom CTA */}
        <div style={{
          textAlign: "center",
          padding: "48px 24px",
          background: "linear-gradient(160deg, #0f1117 0%, #0c0e14 100%)",
          border: "1px solid #1a1f2e",
          borderRadius: "20px",
          marginTop: "32px",
          animation: "fadeSlideUp 0.5s ease both",
          animationDelay: "600ms",
        }}>
          <div style={{
            fontSize: "11px",
            fontFamily: "'Space Mono', monospace",
            color: "#d69e2e",
            letterSpacing: "3px",
            marginBottom: "12px",
          }}>
            START WITHOUT A CARD
          </div>
          <h2 style={{
            fontSize: "clamp(24px, 3vw, 38px)",
            fontWeight: "800",
            color: "#f7fafc",
            letterSpacing: "-1px",
            marginBottom: "12px",
          }}>
            Your track record starts at zero.
          </h2>
          <p style={{
            color: "#4a5568",
            fontSize: "14px",
            maxWidth: "380px",
            margin: "0 auto 28px",
            lineHeight: 1.6,
          }}>
            Every verified elite on this platform started on the free tier.
            The leaderboard doesn't lie.
          </p>
          <button style={{
            background: "linear-gradient(135deg, #d69e2e, #ed8936)",
            border: "none",
            color: "#0a0a0f",
            padding: "14px 40px",
            borderRadius: "10px",
            fontSize: "12px",
            fontWeight: "800",
            fontFamily: "'Space Mono', monospace",
            letterSpacing: "1.5px",
            cursor: "pointer",
            boxShadow: "0 4px 30px rgba(214,158,46,0.35)",
          }}>
            JOIN FREE →
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(KairosPricing));
} catch(e) {
  document.getElementById('err').style.display='block';
  document.getElementById('err').textContent='Render error:\n'+(e&&e.stack||e);
  console.error(e);
}
</script>
</body></html>
