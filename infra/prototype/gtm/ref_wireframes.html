<script type="text/babel" data-presets="react">
try {
const {useState, useEffect, useRef, useMemo, useCallback} = React;

/* ─── TOKENS ─── */
const W = {
  canvas:"#E8EBF0", frame:"#FFFFFF", border:"#D1D6E0", borderDk:"#B0B8CC",
  fill:"#F3F5F8", fillMd:"#E8EBF0", text:"#9BA8BB", textDk:"#6B7A94",
  label:"#4A5568", blue:"#4F6AF0", blueLt:"#EEF1FE", red:"#EF4444",
  redLt:"#FEF2F2", green:"#22C55E", greenLt:"#F0FDF4", amber:"#F59E0B",
  amberLt:"#FFFBEB", platinum:"#94A3B8",
};

const FONTS = `
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:${W.canvas}}
  ::-webkit-scrollbar-thumb{background:${W.border};border-radius:3px}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
`;

/* ─── ATOMS ─── */
const Mono = ({ c, s=9, w="600", children, style={} }) => (
  <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:s,color:c||W.textDk,fontWeight:w,letterSpacing:"0.6px",textTransform:"uppercase",...style}}>{children}</span>
);
const Sans = ({ c, s=10, w="400", children, style={} }) => (
  <span style={{fontFamily:"'IBM Plex Sans',sans-serif",fontSize:s,color:c||W.textDk,fontWeight:w,...style}}>{children}</span>
);
const ANum = ({ n, color=W.blue }) => (
  <div style={{width:18,height:18,borderRadius:"50%",background:color,color:"#fff",fontFamily:"'IBM Plex Mono',monospace",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{n}</div>
);
const TLine = ({ w="100%", h=8, bg, style={} }) => (
  <div style={{height:h,background:bg||W.fillMd,borderRadius:2,width:w,...style}}/>
);
const Pill = ({ w=50, color }) => (
  <div style={{height:14,width:w,borderRadius:7,background:color||W.fillMd,border:`1px solid ${W.border}`}}/>
);
const ChartBox = ({ height=80, label="CHART", dashed=false, style={} }) => (
  <div style={{height,background:W.fill,border:`1px ${dashed?"dashed":"solid"} ${W.border}`,borderRadius:6,position:"relative",overflow:"hidden",...style}}>
    <svg width="100%" height="100%" style={{position:"absolute",inset:0}}>
      <line x1="0" y1="0" x2="100%" y2="100%" stroke={W.border} strokeWidth="1"/>
      <line x1="100%" y1="0" x2="0" y2="100%" stroke={W.border} strokeWidth="1"/>
    </svg>
    <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <Mono c={W.text} s={8}>{label}</Mono>
    </div>
  </div>
);
const Frame = ({ children, label, accent, annotationNum, locked, style={} }) => (
  <div style={{background:locked?W.redLt:W.frame,border:`1px ${locked?"dashed":"solid"} ${locked?W.red+"60":W.border}`,borderRadius:8,position:"relative",...style}}>
    {label && (
      <div style={{padding:"8px 12px",borderBottom:`1px solid ${locked?W.red+"30":W.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:locked?W.redLt:W.fill,borderRadius:"7px 7px 0 0"}}>
        <Mono c={locked?W.red:accent||W.textDk} s={8}>{label}</Mono>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {locked && <Mono c={W.red} s={8}>🔒 LOCKED</Mono>}
          {annotationNum && <ANum n={annotationNum} color={accent||W.blue}/>}
        </div>
      </div>
    )}
    {children}
  </div>
);
const WBtn = ({ label, variant="outline", full=false, accent, style={} }) => (
  <div style={{width:full?"100%":"auto",padding:"8px 14px",borderRadius:6,textAlign:"center",background:variant==="filled"?(accent||W.blue)+"18":"transparent",border:`1px ${variant==="dashed"?"dashed":"solid"} ${variant==="filled"?(accent||W.blue):W.borderDk}`,...style}}>
    <Mono c={variant==="filled"?(accent||W.blue):W.textDk} s={8}>{label}</Mono>
  </div>
);
const WToggle = ({ active }) => (
  <div style={{width:34,height:18,borderRadius:9,border:`1px solid ${W.borderDk}`,background:active?W.blue+"30":W.fill,position:"relative",flexShrink:0}}>
    <div style={{position:"absolute",top:2,left:active?16:2,width:12,height:12,borderRadius:"50%",background:active?W.blue:W.borderDk,transition:"left .2s"}}/>
  </div>
);
const Row = ({ children, highlighted=false, style={} }) => (
  <div style={{padding:"7px 10px",background:highlighted?W.blueLt:W.fill,border:`1px solid ${highlighted?W.blue+"40":W.border}`,borderRadius:5,display:"flex",alignItems:"center",gap:8,...style}}>{children}</div>
);
const GaugeCircle = ({ size=90, pct=77, accent=W.blue }) => {
  const r = size/2-6, cx=size/2, cy=size/2;
  const circ = 2*Math.PI*r;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={W.fillMd} strokeWidth="5"/>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={accent} strokeWidth="5"
        strokeDasharray={`${circ*pct/100} ${circ}`} strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`}/>
      <text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle" fontFamily="IBM Plex Mono" fontSize={size>80?18:12} fontWeight="700" fill={W.label}>{pct}</text>
    </svg>
  );
};
const RadarPlaceholder = ({ size=130 }) => {
  const cx=size/2, cy=size/2, r=size/2-10;
  const pts5 = (rr) => Array.from({length:5}).map((_,i)=>{
    const a=(i*72-90)*Math.PI/180;
    return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)];
  });
  const poly = pts5(r*0.7).map(p=>p.join(",")).join(" ");
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {[0.3,0.6,0.9].map((rr,i)=>(
        <polygon key={i} points={pts5(r*rr).map(p=>p.join(",")).join(" ")} fill="none" stroke={W.border} strokeWidth="0.5"/>
      ))}
      {pts5(r).map((p,i)=>(
        <line key={i} x1={cx} y1={cy} x2={p[0]} y2={p[1]} stroke={W.border} strokeWidth="0.8"/>
      ))}
      <polygon points={poly} fill={W.blue+"20"} stroke={W.blue} strokeWidth="1.5"/>
      {pts5(r).map((p,i)=>(
        <text key={i} x={p[0]} y={p[1]} textAnchor="middle" dominantBaseline="middle"
          fontFamily="IBM Plex Mono" fontSize="7" fill={W.textDk} transform={`translate(${(p[0]-cx)*0.22},${(p[1]-cy)*0.22})`}>
          {["MMTM","VOL","OPT","MACRO","SNTMT"][i]}
        </text>
      ))}
    </svg>
  );
};

/* ─── PHONE SHELL ─── */
const PhoneShell = ({ children, accent=W.blue }) => (
  <div style={{width:200,flexShrink:0,background:W.label,borderRadius:28,padding:"12px 6px",boxShadow:"0 8px 32px rgba(0,0,0,0.15)"}}>
    <div style={{background:W.frame,borderRadius:22,overflow:"hidden",minHeight:380}}>
      <div style={{background:W.label,height:28,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
        <div style={{width:40,height:5,borderRadius:3,background:W.border}}/>
        <div style={{width:8,height:8,borderRadius:"50%",background:W.border}}/>
      </div>
      <div style={{padding:"0 0 8px"}}>{children}</div>
    </div>
  </div>
);

/* ═══════════ GATE PIPELINE DETAILED ═══════════ */
const GATES = [
  {n:1,name:"Trend Align",cleared:true},{n:2,name:"Vol Confirm",cleared:true},
  {n:3,name:"Rel Strength",cleared:true},{n:4,name:"Sector Mom.",cleared:true},
  {n:5,name:"GEX Position",cleared:true},{n:6,name:"Options Flow",cleared:true},
  {n:7,name:"Dark Pool",cleared:true},{n:8,name:"Macro Regime",cleared:true},
  {n:9,name:"Sentiment",cleared:true},{n:10,name:"Price Struct.",cleared:true},
  {n:11,name:"Vol Check",cleared:true},{n:12,name:"Time of Day",cleared:false},
  {n:13,name:"Corr. Filter",cleared:false},{n:14,name:"Final Score",cleared:false},
];

/* ═══════════════════════════════════════════════
   TIER 0 — FREE (with empty-state toggle)
═══════════════════════════════════════════════ */
function WireTier0({ view }) {
  const empty = view === "mobile";

  if (view === "mobile") {
    return (
      <PhoneShell accent="#9BA8BB">
        {/* Mobile nav */}
        <div style={{background:W.fill,borderBottom:`1px solid ${W.border}`,padding:"8px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <Mono c={W.label} s={9}>KAIROS FREE</Mono>
          <div style={{width:22,height:22,borderRadius:"50%",background:W.fillMd,border:`1px solid ${W.border}`}}/>
        </div>
        {/* Empty state */}
        <div style={{padding:10,display:"flex",flexDirection:"column",gap:8,alignItems:"center",paddingTop:24}}>
          <div style={{width:48,height:48,borderRadius:"50%",background:W.fill,border:`2px dashed ${W.border}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Mono c={W.text} s={16}>?</Mono>
          </div>
          <Mono c={W.label} s={9} style={{textAlign:"center",display:"block",lineHeight:1.5}}>YOUR RANK IS UNCLAIMED</Mono>
          <Sans c={W.textDk} s={9} style={{textAlign:"center",lineHeight:1.5}}>Start a paper trade to appear on the leaderboard</Sans>
          <WBtn label="START FIRST TRADE →" full variant="filled" accent={W.label}/>
          <div style={{width:"100%",height:1,background:W.border,margin:"4px 0"}}/>
          <Mono c={W.text} s={8} style={{display:"block",marginBottom:4}}>LEADERBOARD PREVIEW</Mono>
          {[{r:1,n:"axl_capital"},{r:2,n:"theta_trader"},{r:3,n:"iron_condor"}].map((l,i)=>(
            <Row key={i} style={{width:"100%",padding:"6px 8px"}}>
              <TLine w={14} h={8}/>
              <TLine w={70} h={8} style={{flex:1}}/>
              <TLine w={30} h={8} bg={W.greenLt}/>
            </Row>
          ))}
          <Row style={{width:"100%",padding:"6px 8px",background:W.fillMd,border:`1px dashed ${W.borderDk}`}}>
            <Mono c={W.text} s={8}>— </Mono>
            <Mono c={W.text} s={8} style={{flex:1}}>You · unranked</Mono>
          </Row>
        </div>
      </PhoneShell>
    );
  }

  // Desktop — empty state
  return (
    <div style={{animation:"fadeIn .3s ease both"}}>
      {/* Empty state hero */}
      <Frame label="Dashboard — Empty State (First Visit)" accent="#9BA8BB" annotationNum={1} style={{marginBottom:10}}>
        <div style={{padding:24,display:"flex",flexDirection:"column",alignItems:"center",gap:12,textAlign:"center"}}>
          <div style={{width:64,height:64,borderRadius:"50%",background:W.fill,border:`2px dashed ${W.borderDk}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Mono c={W.text} s={24}>?</Mono>
          </div>
          <div>
            <Mono c={W.label} s={12} style={{display:"block",marginBottom:6}}>Your leaderboard rank is unclaimed.</Mono>
            <Sans c={W.textDk} s={11} style={{lineHeight:1.6,maxWidth:360,display:"block",margin:"0 auto"}}>
              Every verified trader on Kairos+ started here. Place your first paper trade to appear on the public leaderboard and start building a track record.
            </Sans>
          </div>
          <WBtn label="Start Your First Paper Trade →" variant="filled" accent="#9BA8BB" style={{padding:"10px 24px"}}/>
        </div>
      </Frame>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 260px",gap:10}}>
        {/* Signal Feed */}
        <Frame label="Signal Feed — Basic Alerts Only" accent="#9BA8BB" annotationNum={2}>
          <div style={{padding:10,display:"flex",flexDirection:"column",gap:6}}>
            <div style={{padding:"6px 8px",background:W.fill,borderRadius:4,border:`1px solid ${W.border}`}}>
              <Mono c={W.textDk} s={8}>TICKER · TYPE · DIRECTION · NO ML SCORE</Mono>
            </div>
            {[0,1,2,3].map(i=>(
              <div key={i} style={{padding:"8px 10px",background:W.fill,border:`1px solid ${W.border}`,borderRadius:5}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                  <div style={{display:"flex",gap:6}}><TLine w={30} h={10} bg={W.label}/><Pill w={50}/><Pill w={36} color={W.greenLt}/></div>
                  <TLine w={24} h={7}/>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",gap:10}}><TLine w={30}/><TLine w={24}/></div>
                  <Mono c={W.text} s={7}>ML SCORE: UPGRADE</Mono>
                </div>
              </div>
            ))}
            {/* Upgrade nudge — what they're missing */}
            <div style={{padding:10,background:W.blueLt,border:`1px solid ${W.blue}30`,borderRadius:5}}>
              <Mono c={W.blue} s={8} style={{display:"block",marginBottom:4}}>⚡ WHAT YOU'RE MISSING</Mono>
              <Sans c={W.textDk} s={9} style={{lineHeight:1.5}}>The last NVDA signal scored 5/5. Subscribers who acted on it saw +2.3%. You saw the ticker but not the score.</Sans>
            </div>
          </div>
        </Frame>

        {/* Paper trading — empty */}
        <Frame label="Paper Trading" accent="#9BA8BB" annotationNum={3}>
          <div style={{padding:12}}>
            <div style={{height:100,background:W.fill,border:`2px dashed ${W.border}`,borderRadius:8,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,marginBottom:10}}>
              <Mono c={W.text} s={9}>NO PAPER TRADES YET</Mono>
              <WBtn label="Open first position" variant="dashed"/>
            </div>
            <ChartBox height={70} label="P&L CHART — AWAITING FIRST TRADE" dashed/>
          </div>
        </Frame>

        {/* Right */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Frame label="Leaderboard" accent="#9BA8BB" annotationNum={4}>
            <div style={{padding:10,display:"flex",flexDirection:"column",gap:4}}>
              {[1,2,3].map(i=>(
                <Row key={i}><TLine w={16} h={8}/><TLine w={60} style={{flex:1}}/><TLine w={30} bg={W.greenLt}/><div style={{width:8,height:8,borderRadius:"50%",background:W.amber}}/></Row>
              ))}

                <Sans c={W.textDk} s={9}>Unlocks after your first paper trade</Sans>
              </div>
              <WBtn label="Share to X →" full variant="dashed"/>
            </div>
          </Frame>
          <Frame label="ML Scoring" accent="#9BA8BB" locked annotationNum={6}>
            <div style={{padding:10,opacity:0.25}}>
              <div style={{display:"flex",gap:3}}>{[0,0,0,0,0].map((_,i)=><div key={i} style={{width:10,height:10,borderRadius:"50%",background:W.borderDk}}/>)}</div>
            </div>
