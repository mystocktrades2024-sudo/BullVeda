<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kairos · Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* defaults overridden by theme engine */
  --bg:#040404; --panel:rgba(22,19,12,.66); --panel2:rgba(30,26,16,.6);
  --line:rgba(201,162,74,.13); --line2:rgba(201,162,74,.24); --line3:rgba(201,162,74,.38);
  --ink:#f7f2e7; --ink2:#bcb097; --ink3:#7d745e; --ink4:#4d4636;
  --acc:#d4a04a; --acc-br:#f5d589; --acc-deep:#9a7528;
  --accg:linear-gradient(135deg,#f5d589,#d4a04a 55%,#b8862f);
  --up:#34e07e; --up-deep:#0f7a40; --dn:#ff5d6c; --dn-deep:#8a2530; --warn:#ffcb52; --info:#6ea8ff; --uncert:#5a5340;
  --bgfx:radial-gradient(1200px 700px at 85% -10%,rgba(201,162,74,.15),transparent 56%),radial-gradient(900px 700px at 0% 110%,rgba(201,162,74,.07),transparent 52%);
  --blur:20px; --radius:18px;
  --mono:'JetBrains Mono',monospace; --sans:'Sora',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);min-height:100vh;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;background-image:var(--bgfx);transition:background .3s,color .3s}
.app{max-width:1340px;margin:0 auto;padding:14px 20px 50px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--acc) 30%,transparent);border-radius:9px}
.glow{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.4;background:var(--acc)}
a{color:inherit}

/* NAV */
.nav{display:flex;align-items:center;padding:11px 18px;border-radius:16px;margin-bottom:14px;gap:6px;
  background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line2);
  box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);position:sticky;top:10px;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding-right:14px;border-right:1px solid var(--line)}
.brand .o{width:28px;height:28px;border-radius:9px;background:var(--accg);position:relative;box-shadow:0 0 22px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 1px 2px rgba(255,255,255,.4)}
.brand .o::after{content:'';position:absolute;inset:8px;border-radius:3px;background:var(--bg)}
.brand b{font:800 19px var(--sans);background:var(--accg);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:3px;flex:1;overflow-x:auto;margin-left:8px}
.tabs::-webkit-scrollbar{height:0}
.tabs button{white-space:nowrap;padding:8px 13px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font:600 13px var(--sans);cursor:pointer;transition:.14s}
.tabs button:hover{color:var(--ink);background:var(--panel2)}
.tabs button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc) 6%,transparent));color:var(--acc-br);box-shadow:inset 0 0 0 1px var(--line3)}
.nav .right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.live{display:flex;align-items:center;gap:7px;font:700 11px var(--mono);color:var(--up)}
.live .d{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 11px var(--up);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
/* theme switcher */
.themebtn{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);font:600 12px var(--sans);color:var(--ink2);position:relative}
.themebtn:hover{color:var(--ink);border-color:var(--line2)}
.themebtn .sw{display:flex;gap:3px}.themebtn .sw i{width:11px;height:11px;border-radius:3px;display:block}
.thememenu{position:absolute;top:46px;right:0;width:230px;background:var(--panel);backdrop-filter:blur(var(--blur));
  border:1px solid var(--line2);border-radius:14px;padding:7px;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:60;display:none}
.thememenu.open{display:block}
.themeopt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font:600 12px var(--sans);color:var(--ink2)}
.themeopt:hover{background:var(--panel2);color:var(--ink)}
.themeopt.on{color:var(--acc-br)}
.themeopt .sw{display:flex;gap:3px}.themeopt .sw i{width:13px;height:13px;border-radius:3px;display:block}

/* REGIME STRIP */
.regbar{display:flex;align-items:center;gap:0;padding:0;border-radius:14px;margin-bottom:14px;overflow:hidden;
  background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.regbar .seg{padding:11px 18px;border-right:1px solid var(--line)}
.regbar .l{font:700 8px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.regbar .v{font:700 13px var(--mono);margin-top:2px}.regbar .v.up{color:var(--up)}.regbar .v.warn{color:var(--warn)}.regbar .v.acc{color:var(--acc-br)}
.regbar .note{margin-left:auto;padding:0 18px;font:500 12px var(--sans);font-style:italic;color:var(--ink3)}
.regbar .note b{color:var(--ink);font-style:normal}

/* shared cards */
.card{position:relative;background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;box-shadow:0 16px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:9px;padding:14px 18px 11px;font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.card-h .n{margin-left:auto;color:var(--ink3);font-weight:500;text-transform:none;letter-spacing:.04em}
.card-b{padding:0 18px 18px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.secti{display:flex;align-items:center;gap:12px;margin:4px 4px 12px}
.secti h2{font:700 16px var(--sans)}.secti .rule{flex:1;height:1px;background:var(--line)}.secti .more{font:600 12px var(--mono);color:var(--acc);cursor:pointer}

/* badges / pills */
.vpill{font:800 9px var(--mono);letter-spacing:.05em;padding:4px 9px;border-radius:7px;display:inline-block}
.vpill.buy{background:linear-gradient(135deg,color-mix(in srgb,var(--up) 22%,transparent),color-mix(in srgb,var(--up) 7%,transparent));color:var(--up);border:1px solid color-mix(in srgb,var(--up) 40%,transparent)}
.vpill.watch{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent)}
.vpill.avoid{background:color-mix(in srgb,var(--dn) 10%,transparent);color:var(--dn);border:1px solid color-mix(in srgb,var(--dn) 26%,transparent)}
.tierb{font:800 9px var(--mono);padding:3px 8px;border-radius:7px;color:var(--acc-br);border:1px solid var(--line3);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.chip{font:600 10px var(--mono);padding:4px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}.chip b{color:var(--ink)}

/* score ring helper styling */
.ringn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 12px var(--mono)}

/* generic table */
table.tbl{width:100%;border-collapse:collapse}
table.tbl thead th{position:sticky;top:0;z-index:3;background:var(--panel2);backdrop-filter:blur(10px);color:var(--ink3);
  font:700 8.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:right;padding:11px 11px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer}
table.tbl thead th.l{text-align:left}table.tbl thead th.on{color:var(--acc-br)}
table.tbl tbody td{padding:0 11px;height:50px;border-bottom:1px solid color-mix(in srgb,var(--acc) 7%,transparent);text-align:right;white-space:nowrap}
table.tbl tbody td.l{text-align:left}
table.tbl tbody tr{cursor:pointer;transition:background .12s}
table.tbl tbody tr:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 7%,transparent),transparent 60%)}
table.tbl tbody tr.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 13%,transparent),transparent 70%);box-shadow:inset 3px 0 0 var(--acc)}
table.tbl tbody tr.dim{opacity:.42}
.sym{font:800 14px var(--sans)}.sym2{font:700 13px var(--mono);color:var(--ink)}
.kv{width:100%;border-collapse:collapse}.kv td{padding:8px 0;border-bottom:1px solid var(--line);font:600 12px var(--mono)}
.kv td.k{color:var(--ink3);font-weight:500}.kv td.v{text-align:right;color:var(--ink)}
.kv .up{color:var(--up)}.kv .dn{color:var(--dn)}.kv .gold{color:var(--acc-br)}

/* views */
.view{display:none}.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* DECK hero */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.chartcard{padding:20px 22px 6px}
.chc-top{display:flex;align-items:flex-start;justify-content:space-between}
.chc-id .sym{font:800 28px var(--sans)} .chc-id .name{font:500 12px var(--sans);color:var(--ink3);margin-top:3px}
.chc-id .badge{font:800 10px var(--mono);padding:4px 10px;border-radius:8px;margin-left:8px;background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up);border:1px solid color-mix(in srgb,var(--up) 40%,transparent)}
.chc-px{text-align:right}.chc-px .p{font:800 32px var(--mono)}.chc-px .c{font:700 14px var(--mono);color:var(--up);margin-top:2px}
.tf{display:flex;gap:6px;margin:8px 0 2px}.tf span{padding:5px 12px;border-radius:9px;font:700 11px var(--mono);color:var(--ink3);cursor:pointer;border:1px solid transparent}.tf span.on{background:var(--panel2);border-color:var(--line2);color:var(--acc-br)}
.chartbox{height:250px;margin:2px -4px 0}.chartbox svg{width:100%;height:100%}
.deccard{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.dec-top{display:flex;align-items:center;gap:16px}
.dec-v .v{font:800 24px var(--sans);color:var(--up)}.dec-v .conf{font:600 11px var(--mono);color:var(--ink2);margin-top:2px}.dec-v .g{font:600 11px var(--mono);color:var(--ink3);margin-top:5px}.dec-v .g b{color:var(--up)}
.riskg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rc.danger{background:color-mix(in srgb,var(--dn) 7%,transparent);border-color:color-mix(in srgb,var(--dn) 20%,transparent)}
.rc .l{font:700 8.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.rc .v{font:800 19px var(--mono);margin-top:4px}.rc .v.dn{color:var(--dn)}.rc .v.up{color:var(--up)}.rc .v.gold{color:var(--acc-br)}
.rc .d{font:500 9.5px var(--mono);color:var(--ink3);margin-top:2px}
.btnrow{display:flex;gap:9px}
.btn{flex:1;padding:13px;border-radius:12px;font:800 13px var(--sans);cursor:pointer;border:0}
.btn.buy{background:linear-gradient(135deg,var(--up),var(--up-deep));color:#04140a;box-shadow:0 8px 24px color-mix(in srgb,var(--up) 30%,transparent)}
.btn.gh{flex:0 0 auto;padding:13px 18px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink2)}
.stat{background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.stat .v{font:800 28px var(--sans);line-height:1}.stat .v.up{color:var(--up)}.stat .v.gold{background:var(--accg);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font:700 9px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-top:7px}.stat .d{font:600 11px var(--mono);margin-top:3px;color:var(--ink3)}
.stat .spk{position:absolute;right:0;bottom:0;width:84px;height:38px;opacity:.45}
.pcard{background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:0 12px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.pcard:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 22px 48px rgba(0,0,0,.5),0 0 28px color-mix(in srgb,var(--acc) 12%,transparent)}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 15px 7px}
.pc-l .sym{font:800 17px var(--sans)}.pc-l .meta{font:500 10px var(--mono);color:var(--ink3);margin-top:2px}
.pc-chart{height:56px}.pc-bot{display:flex;align-items:center;justify-content:space-between;padding:9px 15px 14px}
.pc-px{font:700 14px var(--mono)}.pc-chg{font:700 12px var(--mono)}.pc-chg.up{color:var(--up)}.pc-chg.dn{color:var(--dn)}
.pc-rr{font:700 11px var(--mono);color:var(--up);background:color-mix(in srgb,var(--up) 10%,transparent);padding:3px 8px;border-radius:7px;border:1px solid color-mix(in srgb,var(--up) 28%,transparent)}

/* SCANNER */
.fbar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:13px;margin-bottom:14px;background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line);flex-wrap:wrap}
.funnel{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);color:var(--ink3)}.funnel b{color:var(--ink)}.funnel .arr{color:var(--ink4)}.funnel .fin b{color:var(--up)}
.vchip{padding:6px 12px;border-radius:9px;font:700 10px var(--mono);cursor:pointer;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}
.vchip.on{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 20%,transparent),color-mix(in srgb,var(--acc) 7%,transparent));border-color:var(--line3);color:var(--acc-br)}
.vchip.on.buy{color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,transparent);background:color-mix(in srgb,var(--up) 12%,transparent)}
.qf{padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font:600 10px var(--mono);color:var(--ink3);cursor:pointer}.qf.on{border-color:var(--line3);color:var(--acc-br)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px}.search input{background:transparent;border:0;color:var(--ink);font:500 12px var(--mono);outline:none;width:110px}.search span{color:var(--acc)}
.scanwrap{display:grid;grid-template-columns:1fr 310px;gap:14px}
.rsb{display:inline-flex;align-items:center;gap:5px;justify-content:flex-end}.rsb .b{width:34px;height:4px;background:color-mix(in srgb,var(--acc) 10%,transparent);border-radius:3px;overflow:hidden}.rsb .b i{display:block;height:100%;background:var(--accg)}.rsb .n{font:700 11px var(--mono);width:24px;text-align:right}
.eq{font:700 8.5px var(--mono);padding:3px 7px;border-radius:6px}.eq.fresh{background:color-mix(in srgb,var(--up) 12%,transparent);color:var(--up);border:1px solid color-mix(in srgb,var(--up) 30%,transparent)}.eq.pull{background:color-mix(in srgb,var(--info) 12%,transparent);color:var(--info)}.eq.valid{background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}.eq.ext{background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--warn)}.eq.miss{background:var(--panel2);color:var(--ink3)}
.wrc{font:700 10px var(--mono)}.wrc .lb{color:var(--ink3);font-weight:500}.wrc.thin{color:var(--uncert)}
.rcard{background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.rcard-h{font:700 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);padding:13px 16px 9px}.rcard-h .n{float:right;color:var(--ink3);font-weight:500}
.histo{padding:6px 16px 4px;display:flex;align-items:flex-end;gap:4px;height:96px}.histo .hb{flex:1;border-radius:4px 4px 0 0;min-height:4px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 50%,transparent),color-mix(in srgb,var(--acc) 14%,transparent))}.histo .hb.buy{background:linear-gradient(180deg,var(--up),var(--up-deep))}.histo .hb.th{background:linear-gradient(180deg,var(--acc-br),var(--acc-deep))}
.histo-x{display:flex;justify-content:space-between;padding:4px 16px 12px;font:600 8px var(--mono);color:var(--ink4)}
.fstep{display:flex;align-items:center;gap:10px;margin-bottom:7px;padding:0 16px}.fstep .fl{font:600 10px var(--mono);color:var(--ink2);width:84px}.fstep .fbar2{flex:1;height:16px;background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:5px;overflow:hidden}.fstep .fbar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--acc-deep),var(--acc))}.fstep.final .fbar2 i{background:linear-gradient(90deg,var(--up-deep),var(--up))}.fstep .fn{font:800 12px var(--mono);width:42px;text-align:right}.fstep.final .fn{color:var(--up)}

/* CONVICTION 9-cell */
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cvcell{background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.cvcell:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 26px color-mix(in srgb,var(--acc) 12%,transparent)}
.cvcell .top{display:flex;justify-content:space-between;align-items:flex-start}
.cvcell .sym{font:800 20px var(--sans)}.cvcell .sub{font:500 10px var(--mono);color:var(--ink3);margin-top:2px}
.cvcell .arc{margin-top:10px}
.cvcell .factors{display:flex;gap:4px;margin-top:12px}.cvcell .factors b{flex:1;height:5px;border-radius:3px}
.cvcell .narr{font:500 11px var(--sans);color:var(--ink2);margin-top:11px;line-height:1.5}

/* PERFORMANCE */
.verdict-banner{padding:20px 24px;border-radius:var(--radius);margin-bottom:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--up) 14%,transparent),transparent 70%);border:1px solid color-mix(in srgb,var(--up) 30%,transparent);display:flex;align-items:center;gap:18px}
.verdict-banner .big{font:800 30px var(--sans);color:var(--up)}.verdict-banner .txt{font:500 14px var(--sans);color:var(--ink2)}.verdict-banner .txt b{color:var(--ink)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pod{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:15px;text-align:center}
.pod .medal{font-size:22px}.pod .nm{font:700 13px var(--sans);margin-top:6px}.pod .wr{font:800 22px var(--mono);color:var(--up);margin-top:6px}.pod .ci{font:600 9px var(--mono);color:var(--ink3);margin-top:2px}
.calib{padding:0 4px}.calib-row{display:grid;grid-template-columns:80px 1fr 60px;gap:10px;align-items:center;padding:7px 0}
.calib-row .cl{font:600 11px var(--mono);color:var(--ink2)}.calib-row .ct{height:18px;background:var(--panel2);border-radius:4px;overflow:hidden;position:relative}
.calib-row .pred{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 30%,transparent)}.calib-row .act{position:absolute;top:3px;bottom:3px;width:2px;background:var(--up);box-shadow:0 0 6px var(--up)}

/* PORTFOLIO */
.pf-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.pf-tile{background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.pf-tile .l{font:700 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}.pf-tile .v{font:800 26px var(--sans);margin-top:6px}.pf-tile .v.up{color:var(--up)}.pf-tile .v.dn{color:var(--dn)}.pf-tile .d{font:600 11px var(--mono);color:var(--ink3);margin-top:3px}

/* DETAIL */
.subnav{display:flex;gap:4px;padding:6px;border-radius:14px;margin-bottom:14px;background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--line);overflow-x:auto}
.subnav button{white-space:nowrap;padding:9px 13px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font:600 12px var(--sans);cursor:pointer}
.subnav button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc) 7%,transparent));color:var(--acc-br);box-shadow:inset 0 0 0 1px var(--line3)}
.dpane{display:none}.dpane.on{display:block;animation:fade .2s ease}
.thesis{font:400 15px/1.7 var(--sans);color:var(--ink2)}.thesis b{color:var(--ink);font-weight:600}.thesis em{color:var(--acc-br);font-style:normal;font-weight:600}
.sw-chip{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:600 11px var(--mono);display:inline-block;margin:0 6px 6px 0}.sw-chip b{color:var(--ink);margin-right:6px}.sw-chip .r{color:var(--ink2);font-weight:500}.sw-chip.pos{border-left:2px solid var(--up)}.sw-chip.neg{border-left:2px solid var(--dn)}.sw-chip.neu{border-left:2px solid var(--ink4)}
.pillar{padding:9px 0;border-bottom:1px solid var(--line)}.pillar:last-child{border:0}
.pillar .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.pillar .pn{font:600 12px var(--sans)}.pillar .pn small{color:var(--ink3);font:500 10px var(--mono);margin-left:5px}.pillar .pv{font:800 13px var(--mono)}.pillar .pv .mx{color:var(--ink3);font-weight:500}
.pillar .track{height:8px;background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:5px;overflow:hidden;position:relative}.pillar .track i{display:block;height:100%;background:var(--accg)}.pillar .track .band{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.06);border-left:1px dashed var(--ink4);border-right:1px dashed var(--ink4)}
.ci-row{display:grid;grid-template-columns:130px 1fr 84px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.ci-row:last-child{border:0}.ci-name{font:600 11px var(--mono)}
.ci{position:relative;height:20px}.ci .ax{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--line2)}.ci .be{position:absolute;top:4px;bottom:4px;width:1px;background:var(--ink4)}.ci .band{position:absolute;top:50%;transform:translateY(-50%);height:8px;border-radius:99px;background:color-mix(in srgb,var(--up) 18%,transparent);border:1px solid color-mix(in srgb,var(--up) 42%,transparent)}.ci .pt{position:absolute;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:var(--up)}.ci.thin .band{background:color-mix(in srgb,var(--uncert) 30%,transparent);border-color:var(--uncert)}.ci.thin .pt{background:var(--uncert)}
.ci-v{text-align:right;font:700 11px var(--mono)}.ci-v.thin{color:var(--uncert)}.ci-v .n{color:var(--ink3);font-weight:500}
.note{font:500 11px var(--sans);color:var(--ink3);font-style:italic;line-height:1.5}.note b{color:var(--acc-br);font-style:normal}
.falsify li{list-style:none;display:flex;gap:9px;font:500 12px var(--sans);color:var(--ink2);line-height:1.5;margin-bottom:7px}.falsify li::before{content:'✕';color:var(--dn);font:700 11px var(--mono);margin-top:1px}.falsify li b{color:var(--ink)}
.gate{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font:600 10px var(--mono);color:var(--up);margin:0 5px 5px 0}.gate::before{content:'✓'}

.foot{text-align:center;padding:18px;font:500 10.5px var(--mono);color:var(--ink3);letter-spacing:.04em}
</style></head>
<body><div class="app">

  <!-- NAV -->
  <div class="nav">
    <div class="brand"><span class="o"></span><b>Kairos</b></div>
    <div class="tabs" id="tabs"></div>
    <div class="right">
      <div class="themebtn" id="themebtn"><span class="sw" id="themesw"></span><span id="themename">Obsidian Gold</span> ▾
        <div class="thememenu" id="thememenu"></div>
      </div>
      <span class="live"><span class="d"></span>LIVE</span>
    </div>
  </div>

  <!-- REGIME -->
  <div class="regbar">
    <div class="seg"><div class="l">Regime</div><div class="v warn">Risk-On · Choppy</div></div>
    <div class="seg"><div class="l">VIX</div><div class="v up">16.9</div></div>
    <div class="seg"><div class="l">Breadth</div><div class="v">55.9%</div></div>
    <div class="seg"><div class="l">BUY Floor</div><div class="v acc">72</div></div>
    <div class="seg"><div class="l">Temp</div><div class="v up">61 · Warm</div></div>
    <div class="note">Numbers read <b>in this regime</b> — a 58% WR in choppy ≠ 58% in trending.</div>
  </div>

  <div id="views"></div>
  <div class="foot">KAIROS · rules-based swing intelligence · paper mode · sample data · process &gt; outcome</div>

</div>
<script src="kairos_gtm.js"></script>
</body></html>
