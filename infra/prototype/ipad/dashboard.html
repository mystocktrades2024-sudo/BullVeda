<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- PWA bits — "Add to Home Screen" makes this look/behave like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SwingTrade">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/v2/ipad/manifest.json">
<link rel="apple-touch-icon" href="/v2/ipad/icon-180.png">

<title>SwingTrade · iPad</title>
<link rel="stylesheet" href="/v2/ipad/ipad.css?v=20260510a">
</head>
<body>

<!-- ─── TOP BAR (compact: 44pt iOS HIG) ─────────────────────────────── -->
<header class="ip-top">
  <div class="ip-brand">SwingTrade</div>
  <div class="ip-regime" id="ipRegimeBadge">—</div>
  <div class="ip-spacer"></div>
  <div class="ip-mini" id="ipScanTime">—</div>
  <button class="ip-icon-btn" id="ipRefreshBtn" aria-label="Refresh">↻</button>
</header>

<!-- ─── MAIN ─── (split-view in landscape · stacked in portrait) ─────── -->
<main class="ip-main" id="ipMain">

  <!-- LEFT PANE — list view (or full-width on portrait) -->
  <section class="ip-list-pane" id="ipListPane">
    <div class="ip-list-h">
      <div class="ip-list-title" id="ipListTitle">Scanner</div>
      <div class="ip-list-count" id="ipListCount">0</div>
    </div>
    <div class="ip-list-body" id="ipListBody">
      <!-- ticker rows render here -->
      <div class="ip-empty">Loading…</div>
    </div>
  </section>

  <!-- RIGHT PANE — detail view (iframe of elite-detail.html in landscape;
       becomes a full-screen push in portrait) -->
  <section class="ip-detail-pane" id="ipDetailPane">
    <div class="ip-detail-h" id="ipDetailHead">
      <button class="ip-back-btn" id="ipBackBtn" aria-label="Back">‹</button>
      <div class="ip-detail-ticker" id="ipDetailTicker">—</div>
      <div class="ip-spacer"></div>
      <button class="ip-icon-btn" id="ipExternBtn" aria-label="Open full">⤢</button>
    </div>
    <div class="ip-detail-body" id="ipDetailBody">
      <div class="ip-empty ip-detail-empty">
        <div class="ip-empty-h">Tap a ticker to view details</div>
        <div class="ip-empty-sub">Score · Plan · Technicals · Fundamentals · Sentiment · Options · News · Insider · Models</div>
      </div>
    </div>
  </section>

</main>

<!-- ─── BOTTOM TAB BAR (5 tabs, iOS HIG max) ────────────────────────── -->
<nav class="ip-tabbar" role="tablist">
  <button class="ip-tab on" data-tab="scanner" role="tab" aria-selected="true">
    <span class="ico">⌕</span><span class="lbl">Scanner</span>
  </button>
  <button class="ip-tab" data-tab="watchlist" role="tab">
    <span class="ico">★</span><span class="lbl">Watchlist</span>
  </button>
  <button class="ip-tab" data-tab="portfolio" role="tab">
    <span class="ico">◉</span><span class="lbl">Portfolio</span>
  </button>
  <button class="ip-tab" data-tab="elite" role="tab">
    <span class="ico">⌬</span><span class="lbl">Elite</span>
  </button>
  <button class="ip-tab" data-tab="settings" role="tab">
    <span class="ico">⚙</span><span class="lbl">Settings</span>
  </button>
</nav>

<script type="module" src="/v2/ipad/ipad.js?v=20260510a"></script>
</body>
</html>
