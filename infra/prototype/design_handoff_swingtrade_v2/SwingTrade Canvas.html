// ─── Theme-scoped wrapper ─────────────────────────────────────────
function ThemeScope({ theme = "obsidian-gold", style, children }) {
  // Apply theme tokens locally by setting data-theme on a wrapper
  // (works because our tokens.css cascades by [data-theme="…"])
  React.useEffect(() => {
    // ensure the root html element has *some* theme so vars resolve outside
    if (!document.documentElement.getAttribute("data-theme")) {
      document.documentElement.setAttribute("data-theme", "obsidian-gold");
    }
  }, []);
  return (
    <div data-theme={theme} data-canvas-theme={theme} style={{
      background: "var(--bg)",
      color: "var(--ink)",
      padding: 12,
      height: "100%",
      boxSizing: "border-box",
      overflow: "hidden",
      ...style,
    }}>
      {children}
    </div>
  );
}

        </svg>
      </div>
      {["map", "watch", "buy", "elite", "screener", "themes"].map(id => (
        <div key={id} style={{
          width: 36, height: 32, borderRadius: 4,
          background: active === id ? "var(--copper-bg)" : "transparent",
          border: active === id ? "1px solid var(--copper-dim)" : "1px solid transparent",
          display: "flex", alignItems: "center", justifyContent: "center"
        }}>
          <div style={{ width: 14, height: 14, background: active === id ? "var(--copper)" : "var(--ink-3)", borderRadius: 2, opacity: 0.7 }} />
        </div>
      ))}
    </div>
  );
}

function MiniScanColumn({ surface, widthCat, collapsed }) {
  const items = WATCHLIST.filter(w => w.verdict === "BUY").slice(0, 6);
  return (
    <div style={{ background: "var(--bg-1)", borderRight: "1px solid var(--line)", overflow: "hidden", display: "flex", flexDirection: "column" }}>
      {!collapsed && (
        <div style={{ padding: 10, borderBottom: "1px solid var(--line)", display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ display: "flex", gap: 4 }}>
            {["MAP", "BUY", "WATCH", "ELITE"].map(t => (
              <span key={t} style={{
                flex: 1, padding: "4px 6px", textAlign: "center",
                fontFamily: "var(--mono)", fontSize: 9.5, letterSpacing: "0.10em",
                border: "1px solid var(--line)", borderRadius: 4,
                background: t === "BUY" ? "var(--gn-bg)" : "transparent",
                color: t === "BUY" ? "var(--gn)" : "var(--ink-3)",
              }}>{t}</span>
            ))}
          </div>
        </div>
      )}
      <div style={{ flex: 1, overflow: "hidden" }}>
        {items.map((it, i) => (
          collapsed ? (
            <div key={it.sym} style={{
              padding: "6px 4px", textAlign: "center",
              background: i === 0 ? "var(--copper-bg)" : "transparent",
              borderLeft: i === 0 ? "2px solid var(--copper)" : "2px solid transparent",
              borderBottom: "1px solid var(--bg-2)",
            }}>
              <div style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: i === 0 ? "var(--copper)" : "var(--ink-1)" }}>{it.sym}</div>
              <div style={{ fontFamily: "var(--mono)", fontSize: 9, color: it.chg >= 0 ? "var(--gn)" : "var(--rd)" }}>
                {it.chg >= 0 ? "+" : ""}{it.chg.toFixed(1)}
              </div>
            </div>
          ) : (
            <div key={it.sym} style={{
              padding: "8px 10px",
              background: i === 0 ? "var(--copper-bg)" : "transparent",
              borderLeft: i === 0 ? "2px solid var(--copper)" : "2px solid transparent",
              borderBottom: "1px solid var(--bg-2)",
            }}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
                <span style={{ fontFamily: "var(--mono)", fontSize: 9, color: "var(--ink-3)", minWidth: 18 }}>{String(i+1).padStart(2,"0")}</span>
                <span style={{ fontFamily: "var(--mono)", fontSize: 12, color: i === 0 ? "var(--copper)" : "var(--ink)", fontWeight: 600 }}>{it.sym}</span>
                <span style={{ marginLeft: "auto", fontFamily: "var(--mono)", fontSize: 10, color: it.chg >= 0 ? "var(--gn)" : "var(--rd)" }}>{it.chg >= 0 ? "+" : ""}{it.chg.toFixed(2)}%</span>
                <span style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink-1)" }}>{it.score}</span>
              </div>
              <div style={{ fontSize: 10, color: "var(--ink-3)", marginTop: 2 }}>{it.name}</div>
            </div>
          )
        ))}
      </div>
    </div>
  );
}

function MiniDetailColumn({ focus }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", overflow: "hidden", background: "var(--bg)" }}>
      <div style={{ padding: 10, borderBottom: "1px solid var(--line)", background: "var(--bg-1)", display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
        <div>
          <span style={{ fontFamily: "var(--mono)", fontSize: 14, color: "var(--ink)" }}><b>ARCM</b></span>
          <span style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--ink-3)", marginLeft: 8 }}>Arclight Materials · $4.82B</span>
          <div style={{ fontFamily: "var(--mono)", fontSize: 16, color: "var(--ink)", marginTop: 2 }}>
            $67.42 <span style={{ color: "var(--gn)", fontSize: 12 }}>+1.84%</span>
          </div>
        </div>
        <div style={{ fontFamily: "var(--mono)", fontSize: 10, color: "var(--copper)", padding: "4px 8px", border: "1px solid var(--copper-dim)", borderRadius: 4 }}>
          {focus ? "EXIT FOCUS" : "◉ FOCUS"}
        </div>
      </div>
      <div style={{ display: "flex", gap: 6, padding: 8, borderBottom: "1px solid var(--line)", background: "var(--bg-1)" }}>
        {["OV", "PLAN", "CHRT", "TECH", "PATT", "SMC", "VAL", "RSK"].map((t, i) => (
          <span key={t} style={{
            fontFamily: "var(--mono)", fontSize: 9.5, letterSpacing: "0.08em",
            padding: "3px 6px", borderRadius: 3,
            background: i === 1 ? "var(--copper-bg)" : "transparent",
            color: i === 1 ? "var(--copper)" : "var(--ink-3)",
            border: i === 1 ? "1px solid var(--copper-dim)" : "1px solid transparent",
          }}>{t}</span>
        ))}
      </div>
      <div style={{ flex: 1, overflow: "hidden" }}>
        <PlanHero ticker={TICKER} mode="SWING" />
        <div style={{ padding: 14 }}>
          <SectionHeader n={1} title="ORDER TICKET" sub="STOP LIMIT · OCO" style="copper" />
          <div style={{ padding: "10px 0", display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
            <KpiTile label="ENTRY" value="$66.18" tone="copper" />
            <KpiTile label="STOP" value="$62.40" tone="rd" sub="−5.7%" />
            <KpiTile label="T1" value="$72.80" tone="gn" sub="+8.0%" />
            <KpiTile label="T2" value="$78.20" tone="gn" sub="+16.0%" />
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
